premium or to termination at the end of a policy period. \u003ccite>[MCL 500.3208, 500.3212]\u003c/cite>\n\u003c/li>\u003cli>\nRelated Essential Insurance Act rule (Chapter 21): \u003ccite>[MCL 500.2123]\u003c/cite>\n\u003cul>\n\u003cli>\nA \"termination\" (refusal to continue for reasons other than nonpayment) requires 30 days' written notice stating each specific reason. \u003ccite>[MCL 500.2123]\u003c/cite>\n\u003c/li>\u003cli>\nWithin the first 55 days the notice may be 20 days. \u003ccite>[MCL 500.2123]\u003c/cite>\n\u003c/li>\u003cli>\nTermination must conform to the insurer's underwriting rules. \u003ccite>[MCL 500.2123]\u003c/cite>\n\u003c/li>\u003cli>\nIt does not authorize terminating an auto policy in violation of Chapter 32. \u003ccite>[MCL 500.2123]\u003c/cite>\n\u003c/li>\u003cli>\nSee Flags. \u003ccite>[MCL 500.2123]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe ISO PAP's own termination clause is noted under Personal Auto Policy (Part F); state law controls. \u003ccite>[ISO PP 00 01 09 18, Part F]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Rental vehicle coverage\u003c/h4>\n\u003cul>\n\u003cli>\nNo-fault security is required of an \"owner,\" which includes a person renting or using a vehicle for more than 30 days. A renter for 30 days or less is not an owner. \u003ccite>[MCL 500.3101(3)(l)]\u003c/cite>\n\u003c/li>\u003cli>\nPIP is payable without regard to fault \u003ccite>[MCL 500.3105(2)]\u003c/cite>. A person injured in a rental car claims PIP first from their own or household policy \u003ccite>[MCL 500.3114(1)]\u003c/cite>. DIFS Bulletin 96-02 notes that a person renting more than 30 days is an \"owner\" and an \"eligible person\" who must be offered a full no-fault policy (PIP and PPI). \u003ccite>[DIFS Bulletin 96-02]\u003c/cite>\n\u003c/li>\u003cli>\nLiability policies must meet the 3009(1) limits for vehicles registered or principally garaged in Michigan. \u003ccite>[MCL 500.3009(1)]\u003c/cite>\n\u003c/li>\u003cli>\nA rental company leasing for 30 days or less is liable as owner only when an authorized driver or a listed immediate-family member is driving. Unless the lessor was negligent, its liability is capped at $20,000 per person / $40,000 per accident BI, and the lessee must be notified of this cap. \u003ccite>[MCL 257.401(3),(4)]\u003c/cite>\n\u003c/li>\u003cli>\nA lessor under a lease of more than 30 days has no common-law owner liability. \u003ccite>[MCL 257.401(2)]\u003c/cite>\n\u003c/li>\u003cli>\nPAP: Part A liability and Part D physical damage follow the insured to a non-owned auto (including a rental). Under the PAP (09 18), Part D covers loss of use of a non-owned auto (up to $30/day) when the policy has collision or OTC on any covered auto. \u003ccite>[ISO PP 00 01 09 18, Part A; Part D]\u003c/cite>\n\u003c/li>\u003cli>\nRental-car sellers of incidental auto insurance (rentals of 90 days or less) are exempt from producer licensing. \u003ccite>[MCL 500.1202(2)(h)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Aftermarket Crash Parts Act (1991 PA 158, MCL 257.1361–.1364)\u003c/h4>\n\u003cul>\n\u003cli>\nEffective Feb. 1, 1992. \u003ccite>[MCL 257.1364]\u003c/cite>\n\u003c/li>\u003cli>\nAn \"aftermarket crash part\" is a replacement for a nonmechanical sheet-metal or plastic exterior part (e.g., an inner or outer panel). A \"non-OEM aftermarket crash part\" is one not made by or for the vehicle manufacturer. \u003ccite>[MCL 257.1362(a),(e)]\u003c/cite>\n\u003c/li>\u003cli>\nIf an insurer requests non-OEM crash parts, the repair facility may use them only if the insured receives a written estimate that clearly identifies each non-OEM part. The estimate must carry, in at least 10-point bold type, a notice that the parts come from a source other than the manufacturer and that warranties are provided by the parts' manufacturer, distributor or insurer. \u003ccite>[MCL 257.1363]\u003c/cite>\n\u003c/li>\u003cli>\n\"Motor vehicle\" in this act excludes motorcycles, mopeds, trailers, buses, tractors and similar. \u003ccite>[MCL 257.1362(d)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Michigan collision coverage options\u003c/h4>\n\u003cul>\n\u003cli>\nAt the initial application for a private passenger nonfleet auto, the insurer must offer: \u003ccite>[MCL 500.3037(1),(2),(8)(b)]\u003c/cite>\n\u003cul>\n\u003cli>\nLimited collision: no deductible, but pays only if the operator was NOT substantially at fault. \u003ccite>[MCL 500.3037(1),(2),(8)(b)]\u003c/cite>\n\u003c/li>\u003cli>\nBroad form collision: pays regardless of fault, and the deductible is waived if the operator was not substantially at fault. \u003ccite>[MCL 500.3037(1),(2),(8)(b)]\u003c/cite>\n\u003c/li>\u003cli>\nStandard collision, and limited collision with a deductible, may also be offered (deductibles as approved by the director). \u003ccite>[MCL 500.3037(1),(2),(8)(b)]\u003c/cite>\n\u003c/li>\u003cli>\n\"Substantially at fault\" means more than 50% of the cause. \u003ccite>[MCL 500.3037(1),(2),(8)(b)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nRejection of both offered collision coverages must be in writing. The collision status is explained at least annually at renewal. \u003ccite>[MCL 500.3037(4),(7)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Uninsured / underinsured motorists (Michigan)\u003c/h4>\n\u003cul>\n\u003cli>\nNo Michigan statute requires UM/UIM to be sold, offered or rejected in writing. DIFS lists UM and UIM among \"optional\" coverages, paying if an uninsured or underinsured motorist seriously injures you or a household member. \u003ccite>[DIFS auto FAQ; Rory v Continental Ins Co, 473 Mich 457 (2005)]\u003c/cite>\n\u003c/li>\u003cli>\nThe Michigan Supreme Court treats UM coverage as optional and contractual, not required by the no-fault act. \u003ccite>[Rory v Continental Ins Co, 473 Mich 457 (2005)]\u003c/cite>\n\u003c/li>\u003cli>\nTNC and car-sharing exclusions may expressly exclude UM/UIM coverage. \u003ccite>[MCL 500.3017(1)(c); 500.3018(1)(c)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Personal Auto Policy (ISO PP 00 01 09 18)\u003c/h3>\n\u003ch4>Definitions\u003c/h4>\n\u003cul>\n\u003cli>\n\"You/your\" means the named insured and a spouse who is a resident of the same household. A spouse who moves out remains \"you\" until the earliest of: 90 days after the change of residency, the effective date of another policy naming the spouse, or the end of the policy period. \u003ccite>[PP 00 01 09 18, Definitions A]\u003c/cite>\n\u003c/li>\u003cli>\nA private passenger auto, pickup or van leased under a written agreement for a continuous period of at least 6 months is deemed owned. \u003ccite>[PP 00 01 09 18, Definitions C]\u003c/cite>\n\u003c/li>\u003cli>\n\"Family member\" means a person related to you by blood, marriage or adoption who is a resident of your household, including a ward or foster child. \u003ccite>[PP 00 01 09 18, Definitions F]\u003c/cite>\n\u003c/li>\u003cli>\n\"Occupying\" means in, upon, or getting in, on, out or off. \u003ccite>[PP 00 01 09 18, Definitions G]\u003c/cite>\n\u003c/li>\u003cli>\n\"Your covered auto\" includes: \u003ccite>[PP 00 01 09 18, Definitions J]\u003c/cite>\n\u003cul>\n\u003cli>\nvehicles shown in the Declarations; \u003ccite>[PP 00 01 09 18, Definitions J]\u003c/cite>\n\u003c/li>\u003cli>\nnewly acquired autos; \u003ccite>[PP 00 01 09 18, Definitions J]\u003c/cite>\n\u003c/li>\u003cli>\nany trailer you own; \u003ccite>[PP 00 01 09 18, Definitions J]\u003c/cite>\n\u003c/li>\u003cli>\na non-owned auto or trailer used as a temporary substitute while a covered vehicle is out of normal use because of breakdown, repair, servicing, loss or destruction (J.4 does not apply to Part D). \u003ccite>[PP 00 01 09 18, Definitions J]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\"Newly acquired auto\" = a private passenger auto, or a pickup or van for which no other policy provides coverage that has a GVWR of 10,000 lbs or less and is not used for delivery (except incidental to an installation/maintenance/repair business, or farming/ranching), that you become the owner of during the policy period. \u003ccite>[PP 00 01 09 18, Definitions K.1]\u003c/cite>\n\u003c/li>\u003cli>\nNewly acquired auto timing: \u003ccite>[PP 00 01 09 18, Definitions K.2]\u003c/cite>\n\u003cul>\n\u003cli>\nLiability, med pay and UM: broadest coverage on any declared vehicle if you ask the insurer to insure it within 14 days after you become the owner. \u003ccite>[PP 00 01 09 18, Definitions K.2]\u003c/cite>\n\u003c/li>\u003cli>\nCollision or OTC begins on the date you become the owner. You must ask within 14 days if the Declarations show that coverage on at least one auto. \u003ccite>[PP 00 01 09 18, Definitions K.2]\u003c/cite>\n\u003c/li>\u003cli>\nIf no declared auto has that coverage, you must ask within 4 days, and a $500 deductible applies to a loss occurring before you asked. \u003ccite>[PP 00 01 09 18, Definitions K.2]\u003c/cite>\n\u003c/li>\u003cli>\nIf you ask late, coverage begins when you ask. \u003ccite>[PP 00 01 09 18, Definitions K.2]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\"Transportation network platform\" is an online app or network connecting passengers with drivers for compensation. \u003ccite>[PP 00 01 09 18, Definitions L]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Part A: Liability\u003c/h4>\n\u003cul>\n\u003cli>\nPays BI and PD damages (including prejudgment interest) for which an insured is legally responsible because of an auto accident, plus all defense costs in addition to the limit. The duty to defend ends when the limit is exhausted. \u003ccite>[PP 00 01 09 18, Part A, Insuring Agreement A]\u003c/cite>\n\u003c/li>\u003cli>\nInsureds: \u003ccite>[PP 00 01 09 18, Part A, B]\u003c/cite>\n\u003cul>\n\u003cli>\nyou or any family member for any auto or trailer; \u003ccite>[PP 00 01 09 18, Part A, B]\u003c/cite>\n\u003c/li>\u003cli>\nany person using your covered auto; \u003ccite>[PP 00 01 09 18, Part A, B]\u003c/cite>\n\u003c/li>\u003cli>\norganizations vicariously liable. \u003ccite>[PP 00 01 09 18, Part A, B]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nSupplementary payments (in addition to the limit): \u003ccite>[PP 00 01 09 18, Part A, Supplementary Payments]\u003c/cite>\n\u003cul>\n\u003cli>\nup to $250 for bail bonds; \u003ccite>[PP 00 01 09 18, Part A, Supplementary Payments]\u003c/cite>\n\u003c/li>\u003cli>\npremiums on appeal bonds and bonds to release attachments; \u003ccite>[PP 00 01 09 18, Part A, Supplementary Payments]\u003c/cite>\n\u003c/li>\u003cli>\npost-judgment interest; \u003ccite>[PP 00 01 09 18, Part A, Supplementary Payments]\u003c/cite>\n\u003c/li>\u003cli>\nup to $250 a day for loss of earnings (not other income) for attending hearings or trials at the insurer's request; \u003ccite>[PP 00 01 09 18, Part A, Supplementary Payments]\u003c/cite>\n\u003c/li>\u003cli>\nother reasonable expenses at the insurer's request. \u003ccite>[PP 00 01 09 18, Part A, Supplementary Payments]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nExclusions include: \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003cul>\n\u003cli>\nintentional injury; \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003c/li>\u003cli>\ndamage to property owned or transported by the insured; \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003c/li>\u003cli>\ndamage to property rented to, used by or in the care of the insured (except a residence or private garage); \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003c/li>\u003cli>\nemployee injury (except domestic employees not covered by workers' comp); \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003c/li>\u003cli>\npublic or livery conveyance, including time logged into a TNC platform as a driver (share-the-expense car pools and volunteer/charitable use are excepted); \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003c/li>\u003cli>\nthe auto business (selling, repairing, servicing, storing, parking); \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003c/li>\u003cli>\nother business use of vehicles other than private passenger autos, pickups or vans (or trailers used with them); \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003c/li>\u003cli>\nusing a vehicle without a reasonable belief of entitlement; \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003c/li>\u003cli>\nnuclear; \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003c/li>\u003cli>\npersonal vehicle sharing programs. \u003ccite>[PP 00 01 09 18, Part A, Exclusions A]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nVehicle exclusions: \u003ccite>[PP 00 01 09 18, Part A, Exclusions B]\u003c/cite>\n\u003cul>\n\u003cli>\nvehicles with fewer than 4 wheels or designed mainly for off-road use, except in a medical emergency, trailers, and non-owned golf carts; \u003ccite>[PP 00 01 09 18, Part A, Exclusions B]\u003c/cite>\n\u003c/li>\u003cli>\nowned vehicles that are not \"your covered auto\" and vehicles furnished or available for your regular use; \u003ccite>[PP 00 01 09 18, Part A, Exclusions B]\u003c/cite>\n\u003c/li>\u003cli>\nfamily members' owned or regular-use vehicles (this exclusion does not apply to \"you\"); \u003ccite>[PP 00 01 09 18, Part A, Exclusions B]\u003c/cite>\n\u003c/li>\u003cli>\nracing facilities; \u003ccite>[PP 00 01 09 18, Part A, Exclusions B]\u003c/cite>\n\u003c/li>\u003cli>\nvehicles designed for flight. \u003ccite>[PP 00 01 09 18, Part A, Exclusions B]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nOut of state: limits are increased to the other state's financial responsibility limits, and its compulsory minimums are provided. Coverage for a non-owned vehicle is excess. \u003ccite>[PP 00 01 09 18, Part A, Out of State Coverage; Other Insurance]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Part B: Medical Payments\u003c/h4>\n\u003cul>\n\u003cli>\nReasonable medical and funeral expenses for services rendered within 3 years from the date of the accident. \u003ccite>[PP 00 01 09 18, Part B, Insuring Agreement A]\u003c/cite>\n\u003c/li>\u003cli>\nInsureds: you or family members while occupying a motor vehicle or as a pedestrian struck by one, and any other person occupying your covered auto. \u003ccite>[PP 00 01 09 18, Part B, B]\u003c/cite>\n\u003c/li>\u003cli>\nExcludes: \u003ccite>[PP 00 01 09 18, Part B, Exclusions]\u003c/cite>\n\u003cul>\n\u003cli>\nmotorized vehicles with fewer than 4 wheels; \u003ccite>[PP 00 01 09 18, Part B, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\npublic or livery use (including TNC); \u003ccite>[PP 00 01 09 18, Part B, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\ninjuries where workers' comp is required or available; \u003ccite>[PP 00 01 09 18, Part B, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nowned or regular-use non-covered vehicles. \u003ccite>[PP 00 01 09 18, Part B, Exclusions]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Part C: Uninsured Motorists\u003c/h4>\n\u003cul>\n\u003cli>\nPays compensatory damages an insured is legally entitled to recover from the owner or operator of an uninsured motor vehicle because of BI. A judgment obtained without the insurer's written consent is not binding. \u003ccite>[PP 00 01 09 18, Part C, A]\u003c/cite>\n\u003c/li>\u003cli>\nAn \"uninsured motor vehicle\" is one: \u003ccite>[PP 00 01 09 18, Part C, C]\u003c/cite>\n\u003cul>\n\u003cli>\nwith no BI bond or policy; \u003ccite>[PP 00 01 09 18, Part C, C]\u003c/cite>\n\u003c/li>\u003cli>\nwith BI limits below the financial responsibility minimum of the state where your covered auto is principally garaged; \u003ccite>[PP 00 01 09 18, Part C, C]\u003c/cite>\n\u003c/li>\u003cli>\nan unidentified hit-and-run vehicle that hits you, a family member, a vehicle you occupy, or your covered auto; or \u003ccite>[PP 00 01 09 18, Part C, C]\u003c/cite>\n\u003c/li>\u003cli>\nwhose insurer denies coverage or is insolvent. \u003ccite>[PP 00 01 09 18, Part C, C]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nNot uninsured vehicles: vehicles owned by or available to you or a family member, government-owned vehicles, self-insured vehicles (unless the self-insurer is insolvent), vehicles on rails or crawler treads, off-road vehicles while off public roads, and vehicles used as residences. \u003ccite>[PP 00 01 09 18, Part C, C]\u003c/cite>\n\u003c/li>\u003cli>\nNo punitive damages. \u003ccite>[PP 00 01 09 18, Part C, Exclusion D]\u003c/cite>\n\u003c/li>\u003cli>\nArbitration: \u003ccite>[PP 00 01 09 18, Part C, Arbitration]\u003c/cite>\n\u003cul>\n\u003cli>\nBoth parties must agree, each selects an arbitrator, and the two select a third. If they cannot agree on the third within 30 days, a judge selects. \u003ccite>[PP 00 01 09 18, Part C, Arbitration]\u003c/cite>\n\u003c/li>\u003cli>\nCoverage disputes may not be arbitrated. \u003ccite>[PP 00 01 09 18, Part C, Arbitration]\u003c/cite>\n\u003c/li>\u003cli>\nIf the award exceeds the FR minimum, either party may demand trial within 60 days. \u003ccite>[PP 00 01 09 18, Part C, Arbitration]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Part D: Coverage for Damage to Your Auto\u003c/h4>\n\u003cul>\n\u003cli>\nCollision is the upset of the auto or its impact with another vehicle or object. \u003ccite>[PP 00 01 09 18, Part D, B]\u003c/cite>\n\u003c/li>\u003cli>\nOther Than Collision (OTC) perils: missiles or falling objects, fire, theft, explosion or earthquake, windstorm, hail, water or flood, vandalism, riot, contact with bird or animal, and glass breakage. Glass broken in a collision may be treated as collision at the insured's option. \u003ccite>[PP 00 01 09 18, Part D, B]\u003c/cite>\n\u003c/li>\u003cli>\nA \"non-owned auto\" is a private passenger auto, pickup, van or trailer not owned by or available for the regular use of you or a family member while in your custody, or a temporary substitute. A non-owned auto gets the broadest coverage on any your covered auto. \u003ccite>[PP 00 01 09 18, Part D, A, C]\u003c/cite>\n\u003c/li>\u003cli>\nTransportation expenses (no deductible): \u003ccite>[PP 00 01 09 18, Part D, Transportation Expenses]\u003c/cite>\n\u003cul>\n\u003cli>\nUp to $30 per day, maximum $900, for temporary transportation after a covered loss to your covered auto. \u003ccite>[PP 00 01 09 18, Part D, Transportation Expenses]\u003c/cite>\n\u003c/li>\u003cli>\nLoss-of-use expenses for a non-owned auto are also covered, up to $30 per day. \u003ccite>[PP 00 01 09 18, Part D, Transportation Expenses]\u003c/cite>\n\u003c/li>\u003cli>\nTheft: payable beginning 48 hours after the theft. \u003ccite>[PP 00 01 09 18, Part D, Transportation Expenses]\u003c/cite>\n\u003c/li>\u003cli>\nOther losses: payable once the auto is withdrawn from use for more than 24 hours. \u003ccite>[PP 00 01 09 18, Part D, Transportation Expenses]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nLimits: \u003ccite>[PP 00 01 09 18, Part D, Exclusion 10; Limit of Liability A]\u003c/cite>\n\u003cul>\n\u003cli>\nLesser of ACV or the cost to repair or replace with like kind and quality. \u003ccite>[PP 00 01 09 18, Part D, Exclusion 10; Limit of Liability A]\u003c/cite>\n\u003c/li>\u003cli>\nNon-owned trailer: $1,500. \u003ccite>[PP 00 01 09 18, Part D, Exclusion 10; Limit of Liability A]\u003c/cite>\n\u003c/li>\u003cli>\nPermanently installed electronics in a non-factory location: $1,000. \u003ccite>[PP 00 01 09 18, Part D, Exclusion 10; Limit of Liability A]\u003c/cite>\n\u003c/li>\u003cli>\nCustom equipment: first $1,500 only. \u003ccite>[PP 00 01 09 18, Part D, Exclusion 10; Limit of Liability A]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nExclusions include: \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003cul>\n\u003cli>\npublic or livery or TNC use; \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nwear and tear, freezing, mechanical breakdown, road damage to tires (unless from total theft); \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nwar and nuclear; \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nnon-permanently-installed electronics; \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nmedia (tapes, discs); \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\ngovernment destruction or confiscation (loss payees protected); \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nunscheduled trailers, camper bodies or motor homes; \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nradar or laser detectors; \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nnon-owned autos in the auto business; \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nracing; \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nrental vehicles where the rental company is precluded by agreement or state law from recovering from you; \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\nvehicle sharing; \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003cli>\naircraft. \u003ccite>[PP 00 01 09 18, Part D, Exclusions]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nIf more than one covered auto is damaged in the same collision, only the highest deductible applies. Appraisal is available: each party picks an appraiser, the two pick an umpire, and a decision by any two is binding. \u003ccite>[PP 00 01 09 18, Part D, A; Appraisal]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Part E: Duties After an Accident or Loss\u003c/h4>\n\u003cul>\n\u003cli>\nThe insurer has no duty to provide coverage if failure to comply with these duties is prejudicial to it. \u003ccite>[PP 00 01 09 18, Part E]\u003c/cite>\n\u003c/li>\u003cli>\nDuties: \u003ccite>[PP 00 01 09 18, Part E, A–D]\u003c/cite>\n\u003cul>\n\u003cli>\nprompt notice of how, when and where the accident happened, with injured persons and witnesses; \u003ccite>[PP 00 01 09 18, Part E, A–D]\u003c/cite>\n\u003c/li>\u003cli>\ncooperate; \u003ccite>[PP 00 01 09 18, Part E, A–D]\u003c/cite>\n\u003c/li>\u003cli>\nsend legal papers; \u003ccite>[PP 00 01 09 18, Part E, A–D]\u003c/cite>\n\u003c/li>\u003cli>\nsubmit to physical exams by physicians the insurer selects (the insurer pays), examinations under oath, and recorded statements; \u003ccite>[PP 00 01 09 18, Part E, A–D]\u003c/cite>\n\u003c/li>\u003cli>\nauthorize medical records; \u003ccite>[PP 00 01 09 18, Part E, A–D]\u003c/cite>\n\u003c/li>\u003cli>\nfile proof of loss. \u003ccite>[PP 00 01 09 18, Part E, A–D]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nUM claimants must promptly notify police of a hit-and-run. Part D claimants must protect the auto from further loss (reasonable expenses paid), notify police of theft, and permit inspection. \u003ccite>[PP 00 01 09 18, Part E, C, D]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Part F: General Provisions\u003c/h4>\n\u003cul>\n\u003cli>\nPolicy territory: US, its territories or possessions, Puerto Rico, and Canada, including transport between their ports. \u003ccite>[PP 00 01 09 18, Part F, Policy Period and Territory]\u003c/cite>\n\u003c/li>\u003cli>\nCancellation by the insurer: \u003ccite>[PP 00 01 09 18, Part F, Termination A]\u003c/cite>\n\u003cul>\n\u003cli>\n10 days' notice for nonpayment, or during the first 60 days of a new policy; 20 days otherwise. \u003ccite>[PP 00 01 09 18, Part F, Termination A]\u003c/cite>\n\u003c/li>\u003cli>\nAfter 60 days (or on a renewal), only for nonpayment, suspension or revocation of a household/customary driver's license, or material misrepresentation. \u003ccite>[PP 00 01 09 18, Part F, Termination A]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nNonrenewal: 20 days' notice. If the insured fails to pay a renewal premium, the policy terminates automatically. \u003ccite>[PP 00 01 09 18, Part F, Termination B, C]\u003c/cite>\n\u003c/li>\u003cli>\nMichigan statute (55 days; certified mail, etc.) controls via the state amendatory endorsement. \u003ccite>[PP 00 01 09 18, Part F, Termination; MCL 500.3220, .3224]\u003c/cite>\n\u003c/li>\u003cli>\nIf two or more auto policies issued by the same insurer apply, the maximum is the highest single applicable limit. Fraud voids coverage for the insured who committed it. \u003ccite>[PP 00 01 09 18, Part F]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Selected endorsements\u003c/h4>\n\u003cul>\n\u003cli>\nMiscellaneous Type Vehicle endorsement (PP 03 23): \u003ccite>[FC&amp;S \"Miscellaneous Type Vehicle Endorsement\" (2018); riskeducation.org PP 03 23 summary]\u003c/cite>\n\u003cul>\n\u003cli>\nCovers motor homes, motorcycles and similar vehicles, ATVs, dune buggies and golf carts under the PAP (snowmobiles use a separate endorsement). \u003ccite>[FC&amp;S \"Miscellaneous Type Vehicle Endorsement\" (2018); riskeducation.org PP 03 23 summary]\u003c/cite>\n\u003c/li>\u003cli>\nRemoves the fewer-than-4-wheels/off-road exclusions for scheduled vehicles. \u003ccite>[FC&amp;S \"Miscellaneous Type Vehicle Endorsement\" (2018); riskeducation.org PP 03 23 summary]\u003c/cite>\n\u003c/li>\u003cli>\nOffers an optional passenger hazard exclusion: no liability coverage for BI to anyone occupying the scheduled vehicle. \u003ccite>[FC&amp;S \"Miscellaneous Type Vehicle Endorsement\" (2018); riskeducation.org PP 03 23 summary]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nExtended Non-Owned Coverage, Vehicles Furnished or Available for Regular Use (PP 03 06): \u003ccite>[PP 03 06 01 05]\u003c/cite>\n\u003cul>\n\u003cli>\nRemoves the PAP \"furnished or available for regular use\" exclusion for liability (and med pay if purchased). \u003ccite>[PP 03 06 01 05]\u003c/cite>\n\u003c/li>\u003cli>\nApplies to the named individual, and to family members if indicated. \u003ccite>[PP 03 06 01 05]\u003c/cite>\n\u003c/li>\u003cli>\nDoes not apply to vehicles owned by the individual or family members. \u003ccite>[PP 03 06 01 05]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nMichigan, DIFS Bulletin 96-02 (June 25, 1996): \u003ccite>[DIFS Bulletin 96-02]\u003c/cite>\n\u003cul>\n\u003cli>\nNamed non-owner and extended non-owned endorsements on Michigan no-fault policies provide ONLY residual liability, and only to the named person and spouse. They do not provide PIP, PPI or physical damage, and they exclude other resident relatives. \u003ccite>[DIFS Bulletin 96-02]\u003c/cite>\n\u003c/li>\u003cli>\nIssued to a non-owner, they are not \"automobile insurance\" under Chapter 21. \u003ccite>[DIFS Bulletin 96-02]\u003c/cite>\n\u003c/li>\u003cli>\nA person renting a vehicle for more than 30 days is an owner and eligible person who must be offered a full no-fault policy. \u003ccite>[DIFS Bulletin 96-02]\u003c/cite>\n\u003c/li>\u003cli>\nInsurers should clearly tell the policyholder that such an endorsement does not meet the no-fault requirements. \u003ccite>[DIFS Bulletin 96-02]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nMichigan PIP and PPI endorsements put the statutory benefits above into the PAP: PIP under 3107/3108 with the 3107c level, and PPI under 3121 with a $1M limit, Michigan only. \u003ccite>[MCL 500.3107, .3108, .3121]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Commercial Auto\u003c/h3>\n\u003ch4>Business Auto Coverage Form (ISO CA 00 01 11 20) \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\u003c/h4>\n\u003cul>\n\u003cli>\nFive sections: I Covered Autos; II Covered Autos Liability; III Physical Damage; IV Conditions; V Definitions. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\nCovered auto symbols: \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003cul>\n\u003cli>\n1: Any auto. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\n2: Owned autos only (for liability, also non-owned trailers attached to owned power units). \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\n3: Owned private passenger autos only. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\n4: Owned autos other than private passenger. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\n5: Owned autos subject to no-fault. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\n6: Owned autos subject to a compulsory UM law. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\n7: Specifically described autos. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\n8: Hired autos only. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\n9: Non-owned autos only. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\n19: Mobile equipment subject to a compulsory, financial responsibility or other motor vehicle insurance law. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nSymbol 8 excludes autos leased, hired, rented or borrowed from your employees, partners, LLC members or their household members. Symbol 9 includes employees' (and partners'/members' and household members') autos only while used in your business or personal affairs. \u003ccite>[CA 00 01 11 20, Section I]\u003c/cite>\n\u003c/li>\u003cli>\nAfter-acquired autos: automatic for symbols 1, 2, 3, 4, 5, 6 and 19. Under symbol 7, a newly acquired auto is covered only if you already cover all owned autos for that coverage (or it is a replacement) AND you tell the insurer within 30 days. \u003ccite>[CA 00 01 11 20, Section I.B]\u003c/cite>\n\u003c/li>\u003cli>\nAn auto leased or rented to you without a driver under a written agreement for at least 6 months, where you must provide primary insurance, is treated as an owned covered auto. \u003ccite>[CA 00 01 11 20, Section I.B.3]\u003c/cite>\n\u003c/li>\u003cli>\nLiability also automatically covers: \u003ccite>[CA 00 01 11 20, Section I.C]\u003c/cite>\n\u003cul>\n\u003cli>\ntrailers of 3,000 lbs GVWR or less; \u003ccite>[CA 00 01 11 20, Section I.C]\u003c/cite>\n\u003c/li>\u003cli>\nmobile equipment while carried or towed by a covered auto; \u003ccite>[CA 00 01 11 20, Section I.C]\u003c/cite>\n\u003c/li>\u003cli>\ntemporary substitute autos. \u003ccite>[CA 00 01 11 20, Section I.C]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nLiability supplementary payments: \u003ccite>[CA 00 01 11 20, Section II.A.2.a]\u003c/cite>\n\u003cul>\n\u003cli>\nup to $2,000 for bail bonds; \u003ccite>[CA 00 01 11 20, Section II.A.2.a]\u003c/cite>\n\u003c/li>\u003cli>\nattachment bonds; \u003ccite>[CA 00 01 11 20, Section II.A.2.a]\u003c/cite>\n\u003c/li>\u003cli>\nreasonable expenses, including loss of earnings up to $250 a day; \u003ccite>[CA 00 01 11 20, Section II.A.2.a]\u003c/cite>\n\u003c/li>\u003cli>\ncourt costs (not attorney fees); \u003ccite>[CA 00 01 11 20, Section II.A.2.a]\u003c/cite>\n\u003c/li>\u003cli>\npost-judgment interest. \u003ccite>[CA 00 01 11 20, Section II.A.2.a]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nOut-of-state extension: limits are raised to meet another jurisdiction's compulsory or FR limits, and required coverages such as no-fault are provided (motor carrier limits are not included). \u003ccite>[CA 00 01 11 20, Section II.A.2.b]\u003c/cite>\n\u003c/li>\u003cli>\nPhysical damage: \u003ccite>[CA 00 01 11 20, Section III]\u003c/cite>\n\u003cul>\n\u003cli>\nThree coverages: Comprehensive, Specified Causes of Loss, and Collision. \u003ccite>[CA 00 01 11 20, Section III]\u003c/cite>\n\u003c/li>\u003cli>\nSpecified causes: fire, lightning, explosion; theft; windstorm, hail, earthquake; flood; mischief or vandalism; sinking, burning, collision or derailment of a conveyance transporting the auto. \u003ccite>[CA 00 01 11 20, Section III]\u003c/cite>\n\u003c/li>\u003cli>\nGlass breakage, hitting a bird or animal, and falling objects or missiles are paid under Comprehensive; glass broken in a collision may be treated as Collision. \u003ccite>[CA 00 01 11 20, Section III]\u003c/cite>\n\u003c/li>\u003cli>\nTransportation expense for total theft of a private passenger auto: up to $30/day, max $900, starting 48 hours after the theft (the 10 13 edition was $20/$600). \u003ccite>[CA 00 01 11 20, Section III]\u003c/cite>\n\u003c/li>\u003cli>\nHired auto loss of use: up to $30/day, max $900. \u003ccite>[CA 00 01 11 20, Section III]\u003c/cite>\n\u003c/li>\u003cli>\nElectronic equipment in a non-factory location: $1,000. \u003ccite>[CA 00 01 11 20, Section III]\u003c/cite>\n\u003c/li>\u003cli>\nThe maximum comprehensive or specified-causes deductible in one event is 5 times the highest such deductible. \u003ccite>[CA 00 01 11 20, Section III]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nCoverage territory: \u003ccite>[CA 00 01 11 20, Section IV.B.7]\u003c/cite>\n\u003cul>\n\u003cli>\nUS, its territories and possessions, Puerto Rico and Canada. \u003ccite>[CA 00 01 11 20, Section IV.B.7]\u003c/cite>\n\u003c/li>\u003cli>\nAnywhere in the world for a private passenger auto hired without a driver for 30 days or less, provided suit is brought in the US, its territories or possessions, Puerto Rico or Canada (or in a settlement the insurer agrees to). \u003ccite>[CA 00 01 11 20, Section IV.B.7]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nOther insurance: primary for owned autos, excess for non-owned autos. Hired autos with a driver are not covered autos for hired-auto physical damage. \u003ccite>[CA 00 01 11 20, Section IV.B.5]\u003c/cite>\n\u003c/li>\u003cli>\nAuto vs mobile equipment: \u003ccite>[CA 00 01 11 20, Section V.B, V.K]\u003c/cite>\n\u003cul>\n\u003cli>\nBulldozers, forklifts, farm machinery, crawler-tread vehicles and similar are mobile equipment. \u003ccite>[CA 00 01 11 20, Section V.B, V.K]\u003c/cite>\n\u003c/li>\u003cli>\nSelf-propelled vehicles with permanently attached snow-removal, road-maintenance (not construction) or street-cleaning equipment, cherry pickers on auto or truck chassis, and air compressors, pumps or generators are \"autos.\" \u003ccite>[CA 00 01 11 20, Section V.B, V.K]\u003c/cite>\n\u003c/li>\u003cli>\nAny land vehicle subject to a compulsory or FR law is an auto. \u003ccite>[CA 00 01 11 20, Section V.B, V.K]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Garage, Auto Dealers, Garagekeepers \u003ccite>[CA 00 05 07 97, Section I.A, III; CA 99 37 10 01; FC&amp;S \"Auto Dealers Coverage Form (Garage Policy)\" (2015)]\u003c/cite>\u003c/h4>\n\u003cul>\n\u003cli>\nGarage Coverage Form (CA 00 05): \u003ccite>[CA 00 05 07 97, Section I.A, III; CA 99 37 10 01; FC&amp;S \"Auto Dealers Coverage Form (Garage Policy)\" (2015)]\u003c/cite>\n\u003cul>\n\u003cli>\nCovers liability, garagekeepers and physical damage for garage risks in one form. \u003ccite>[CA 00 05 07 97, Section I.A, III; CA 99 37 10 01; FC&amp;S \"Auto Dealers Coverage Form (Garage Policy)\" (2015)]\u003c/cite>\n\u003c/li>\u003cli>\nUses symbols 21–31. Symbol 30 is customers' autos left with you for service, repair, storage or safekeeping. Symbol 31 is dealers' autos and autos held for sale by non-dealers or trailer dealers (physical damage). \u003ccite>[CA 00 05 07 97, Section I.A, III; CA 99 37 10 01; FC&amp;S \"Auto Dealers Coverage Form (Garage Policy)\" (2015)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nISO introduced the Auto Dealers Coverage Form (CA 00 25) in its 2013 revision for auto dealers; it largely replaces the Garage form for dealers. \u003ccite>[CA 00 05 07 97, Section I.A, III; CA 99 37 10 01; FC&amp;S \"Auto Dealers Coverage Form (Garage Policy)\" (2015)]\u003c/cite>\n\u003c/li>\u003cli>\nGaragekeepers covers \"loss\" to customers' autos left in the insured's care while it is attending, servicing, repairing, parking or storing them in garage operations. It is available as Comprehensive, Specified Causes of Loss and Collision, per location. \u003ccite>[CA 99 37 10 01]\u003c/cite>\n\u003c/li>\u003cli>\nThree bases: \u003ccite>[CA 99 37 10 01]\u003c/cite>\n\u003cul>\n\u003cli>\nLegal liability (default): pays only when the insured is legally liable. \u003ccite>[CA 99 37 10 01]\u003c/cite>\n\u003c/li>\u003cli>\nDirect excess: also pays regardless of liability, but excess over other collectible insurance (e.g., the customer's own). \u003ccite>[CA 99 37 10 01]\u003c/cite>\n\u003c/li>\u003cli>\nDirect primary: pays regardless of liability, as primary. \u003ccite>[CA 99 37 10 01]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nCA 99 37 attaches garagekeepers coverage to the Business Auto, Motor Carrier and Truckers forms. \u003ccite>[CA 99 37 10 01]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Truckers and Motor Carrier forms\u003c/h4>\n\u003cul>\n\u003cli>\nThe Truckers Coverage Form (CA 00 12) is for those in the business of transporting property by auto for hire, and includes trailer interchange coverage. The Motor Carrier Coverage Form (CA 00 20) is a broader alternative written around the \"motor carrier\" concept. See Flags. \u003ccite>[FC&amp;S \"Truckers Coverage Form\"; FC&amp;S \"Motor Carrier Coverage Form\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Selected commercial endorsements\u003c/h4>\n\u003cul>\n\u003cli>\nDrive Other Car Coverage, Broadened Coverage for Named Individuals (CA 99 10): \u003ccite>[IRMI \"drive other car endorsement\"]\u003c/cite>\n\u003cul>\n\u003cli>\nGives non-owned-auto coverage like a PAP to a named individual (e.g., an executive with a company car and no personal auto policy) and resident spouse. \u003ccite>[IRMI \"drive other car endorsement\"]\u003c/cite>\n\u003c/li>\u003cli>\nDoes not cover autos owned by the individual or household, or use while working in an auto sales, service, repair or parking business. \u003ccite>[IRMI \"drive other car endorsement\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nIndividual Named Insured (CA 99 17): \u003ccite>[industry summaries (insurancexdate CA 99 17; FC&amp;S); see Flags]\u003c/cite>\n\u003cul>\n\u003cli>\nUsed when the named insured is an individual (e.g., a sole proprietor). \u003ccite>[industry summaries (insurancexdate CA 99 17; FC&amp;S); see Flags]\u003c/cite>\n\u003c/li>\u003cli>\nAdds PAP-like coverage for the individual and family members, e.g., while driving non-owned private passenger autos. \u003ccite>[industry summaries (insurancexdate CA 99 17; FC&amp;S); see Flags]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nMichigan PIP and PPI endorsements to the BAP carry the statutory benefits (3107/3108; 3121 $1M). Symbol 5 designates owned autos subject to no-fault. \u003ccite>[MCL 500.3107, .3121; CA 00 01 11 20 Section I]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Motor Carrier Act of 1980: federal minimum financial responsibility \u003ccite>[49 CFR 387.9; 387.15]\u003c/cite>\u003c/h4>\n\u003cul>\n\u003cli>\nFor-hire carrier, interstate or foreign commerce, GVWR 10,001 lbs or more, nonhazardous property: $750,000. \u003ccite>[49 CFR 387.9; 387.15]\u003c/cite>\n\u003c/li>\u003cli>\nOil, hazardous waste, or other hazmat not in the higher category (for-hire and private; GVWR 10,001+): $1,000,000. \u003ccite>[49 CFR 387.9; 387.15]\u003c/cite>\n\u003c/li>\u003cli>\nCertain bulk hazardous substances, explosives (Div. 1.1–1.3), Zone A poison gas, highway-route radioactive (GVWR 10,001+; also certain items under 10,001): $5,000,000. \u003ccite>[49 CFR 387.9; 387.15]\u003c/cite>\n\u003c/li>\u003cli>\nProof of coverage is the Form MCS-90 endorsement (or MCS-82 surety bond). Coverage remains continuously in effect until terminated. \u003ccite>[49 CFR 387.9; 387.15]\u003c/cite>\n\u003c/li>\u003cli>\nPassenger carriers: \u003ccite>[49 CFR 387.33]\u003c/cite>\n\u003cul>\n\u003cli>\n16 or more seats including the driver: $5,000,000. \u003ccite>[49 CFR 387.33]\u003c/cite>\n\u003c/li>\u003cli>\n15 or fewer: $1,500,000. \u003ccite>[49 CFR 387.33]\u003c/cite>\n\u003c/li>\u003cli>\nSee Flags. \u003ccite>[49 CFR 387.33]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\nValues that change over time, with effective dates:\n\u003cul>\n\u003cli>\n\u003cstrong>Work loss and survivor's loss maximum\u003c/strong> (per 30-day period, by accident date): $7,455 for Oct. 1, 2026 – Sept. 30, 2027. Prior years: $7,201 (2025–26), $7,014 (2024–25), $6,811 (2023–24). \u003ccite>[DIFS Bulletin 2026-20-INS]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>MCCA retention:\u003c/strong> $675,000 for policies issued or renewed July 1, 2025 – June 30, 2027. The next change is due July 1, 2027. \u003ccite>[michigancatastrophic.com]\u003c/cite> I could not find the retention in a statute or DIFS document. The figure is consistent with $635,000 × 1.06 rounded to the nearest $5,000.\n\u003c/li>\u003cli>\n\u003cstrong>MCCA assessment for July 1, 2026 – June 30, 2027:\u003c/strong> $84 per vehicle for unlimited PIP ($65 + $19), $19 for all other levels. \u003ccite>[MCCA chart and press release]\u003c/cite> It changes every July 1.\n\u003c/li>\u003cli>\n\u003cstrong>QHC deductible cap:\u003c/strong> $6,579 for July 1, 2026 – June 30, 2027. \u003ccite>[DIFS Bulletin 2026-08-INS]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Fee schedule:\u003c/strong> the percentages in 3157 are those for services after July 1, 2023. A 3157 CPI adjustment bulletin exists (2026-09-INS) but was not read in detail.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Old vs new liability limits (conflict).\u003c/strong>\n\u003cul>\n\u003cli>\nThe Vehicle Code FR policy definition (MCL 257.520) and an outdated DIFS FAQ page still show 20/40/10.\n\u003c/li>\u003cli>\nMCL 500.3009 requires 250/500/10 by default after July 1, 2020, with an elected minimum of 50/100.\n\u003c/li>\u003cli>\nOlder exam banks may still use 20/40/10. These materials use the current 3009 values.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>The outline cites \"RL 257.518b\" for required limits.\u003c/strong> The current 257.518b covers only TNC driver and TNC company limits (50/100/25 while logged on; $1M CSL during a ride). The general limits are in MCL 500.3009.\n\u003c/li>\u003cli>\n\u003cstrong>Cancellation notice conflict.\u003c/strong>\n\u003cul>\n\u003cli>\nChapter 32: 20 days, certified mail RRR (3224); nonrenewal 20 days by first-class mail (3204).\n\u003c/li>\u003cli>\nEssential Insurance Act 500.2123: 30 days with specific reasons for a \"termination\" (20 days within the first 55 days).\n\u003c/li>\u003cli>\nISO PAP: 10/20 days and a 60-day window.\n\u003c/li>\u003cli>\nQuestions here test the Chapter 32 rules the outline cites (3204, 3220, 3224) and name the statute in the stem.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>UM/UIM.\u003c/strong> No statute mandating an offer or rejection was found in the Insurance Code sections reviewed. \"Optional\" is based on DIFS consumer material and Rory v Continental (2005). The PSI outline lists \"UM/UIM Rejection / Required Limits,\" which is likely generic national content.\n\u003c/li>\u003cli>\n\u003cstrong>Effective date of the priority changes.\u003c/strong> The changes to 3114(4) and 3115 (MACP instead of the owner's or operator's insurer) came in 2019 PA 21, which took immediate effect June 11, 2019. The act's enacting sections give no separate applicability date for them. I did not verify which accident dates they apply to.\n\u003c/li>\u003cli>\n\u003cstrong>Outline mismatch.\u003c/strong> The outline pairs \"Rental Vehicle Coverage\" with 500.3009 and .3105(2). Neither section mentions rentals expressly. The rental facts above are assembled from 3101(3)(l), 3105, 3114(1), MCL 257.401(3) and PAP Part D.\n\u003c/li>\u003cli>\n\u003cstrong>Form editions.\u003c/strong>\n\u003cul>\n\u003cli>\nThe PAP numbers come from PP 00 01 09 18: bail $250; loss of earnings $250/day; transportation $30/day, max $900. A secondary summary of the older PP 00 01 01 05 gives transportation as $20/day, max $600. I did not verify the other older-edition amounts, so questions name the 09 18 edition.\n\u003c/li>\u003cli>\nThe BAP numbers come from CA 00 01 11 20 (transportation and loss of use $30/$900). The 10 13 edition was $20/$600.\n\u003c/li>\u003cli>\nThe Garage form symbols come from CA 00 05 07 97.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Not verified from primary form text.\u003c/strong>\n\u003cul>\n\u003cli>\nTruckers (CA 00 12) and Motor Carrier (CA 00 20) form details and symbol numbers. The commonly cited ranges, 41–50 and 61–71, were NOT verified and are not used in questions.\n\u003c/li>\u003cli>\nIndividual Named Insured (CA 99 17), Lessor Additional Insured (CA 20 01) and Mobile Equipment endorsement wording. These are kept conceptual.\n\u003c/li>\u003cli>\nMiscellaneous Type Vehicle details come from FC&amp;S and riskeducation.org summaries, not the form itself.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>49 CFR 387.33\u003c/strong> (passenger carrier limits) shows an effective-date note that it was \"suspended\" Jan. 14, 2017 (a temporary 387.33T is in use). The amounts were not used in questions.\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"cpp","title":"Commercial Package Policy","weight":"12% · 18 items","secs":["cpp"],"html":"\u003cp>Editions relied on (form text read directly unless noted): IL 00 17 11 98; CG 00 01 04 13; CG 00 09 04 13; CG 00 33 04 13; CP 00 10 10 12; CP 00 17 10 12; CP 00 18 10 12; CP 00 20 06 95; CP 00 30 10 12; CP 00 40 10 12; CP 00 50 10 12; CP 00 90 07 88; CP 10 10 10 12; CP 10 20 10 12; CP 10 30 09 17; CP 04 05 09 17; CP 04 40 06 07; CP 12 30 06 95; IL 04 15 04 98; CR 00 21 11 15; CM 00 01 09 04; FP 00 10 09 94. CG 00 02 04 13, CR 00 20, EB 00 20 01 13 and FL 00 20 are from reputable form analyses (FC&amp;S/PropertyCasualty360, Rough Notes PF&amp;M, Austin &amp; Stanovich) — see Flags.\u003c/p>\n\u003ch3>Components of a Commercial Policy\u003c/h3>\n\u003cul>\n\u003cli>\nA commercial package policy (CPP) provides both property and liability coverage for a business in one policy (also called commercial multiple peril). \u003ccite>[IRMI glossary \"commercial package policy\"]\u003c/cite>\n\u003c/li>\u003cli>\nBuilding blocks: Common Policy Declarations, Common Policy Conditions (IL 00 17), interline endorsements, and coverage parts; one coverage part = monoline policy, two or more = package. \u003ccite>[IL 00 17 11 98 preamble; IRMI glossary \"commercial package policy\"]\u003c/cite>\n\u003c/li>\u003cli>\nIL 00 17 applies to all coverage parts: \"All Coverage Parts included in this policy are subject to the following conditions.\" \u003ccite>[ISO IL 00 17 11 98]\u003c/cite>\n\u003c/li>\u003cli>\nInterline (\"IL\") endorsements modify more than one coverage part — e.g., IL 04 15 Protective Safeguards modifies both the Commercial Property and Farm coverage parts. \u003ccite>[ISO IL 04 15 04 98]\u003c/cite>\n\u003c/li>\u003cli>\nSome coverage parts use a separate conditions form (CP 00 90 for commercial property, CM 00 01 for inland marine); others, like CGL (CG 00 01 Sec. IV), put their conditions in the coverage form. \u003ccite>[ISO CP 00 90 07 88; CM 00 01 09 04]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Common Policy Conditions (IL 00 17 11 98) — six conditions\u003c/h4>\n\u003cul>\n\u003cli>\nA. Cancellation: first Named Insured may cancel by advance written notice; insurer must give written notice at least 10 days before cancellation for nonpayment, 30 days for any other reason, mailed/delivered to the first Named Insured. \u003ccite>[ISO IL 00 17 11 98, A.]\u003c/cite>\n\u003c/li>\u003cli>\nInsurer cancels → refund is pro rata; first Named Insured cancels → refund may be less than pro rata; cancellation is effective even if refund not yet made; proof of mailing is sufficient proof of notice. \u003ccite>[ISO IL 00 17 11 98, A.5-6]\u003c/cite>\n\u003c/li>\u003cli>\nB. Changes: first Named Insured may make changes with insurer consent; policy amended or waived only by endorsement. \u003ccite>[ISO IL 00 17 11 98, B.]\u003c/cite>\n\u003c/li>\u003cli>\nC. Examination of books and records: during the policy period and up to 3 years afterward. \u003ccite>[ISO IL 00 17 11 98, C.]\u003c/cite>\n\u003c/li>\u003cli>\nD. Inspections and surveys: insurer has the right but no obligation; inspections relate only to insurability and premium; insurer does not make safety inspections or warrant conditions are safe (boiler/pressure vessel/elevator certification inspections are an exception to the disclaimer). \u003ccite>[ISO IL 00 17 11 98, D.]\u003c/cite>\n\u003c/li>\u003cli>\nE. Premiums: the first Named Insured is responsible for payment of all premiums and is payee for return premiums. \u003ccite>[ISO IL 00 17 11 98, E.]\u003c/cite>\n\u003c/li>\u003cli>\nF. Transfer of rights and duties: not without insurer's written consent, except on death of an individual named insured (passes to legal representative; until appointed, to person with proper temporary custody of property). \u003ccite>[ISO IL 00 17 11 98, F.]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Commercial General Liability (CG 00 01 04 13)\u003c/h3>\n\u003ch4>Coverage A — Bodily Injury and Property Damage\u003c/h4>\n\u003cul>\n\u003cli>\nPays damages for BI/PD the insured is legally obligated to pay; insurer has right and duty to defend; duty to defend ends when limit is used up by judgments/settlements (A or B) or medical expenses (C). \u003ccite>[ISO CG 00 01 04 13, Sec. I Cov. A 1.a]\u003c/cite>\n\u003c/li>\u003cli>\nTrigger (occurrence form): BI/PD caused by an \"occurrence\" in the coverage territory and occurring during the policy period (and not known before the policy period). \u003ccite>[ISO CG 00 01 04 13, Sec. I Cov. A 1.b]\u003c/cite>\n\u003c/li>\u003cli>\n\"Occurrence\" = an accident, including continuous or repeated exposure to substantially the same general harmful conditions. \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 13]\u003c/cite>\n\u003c/li>\u003cli>\nKey exclusions: expected/intended (except reasonable force), contractual (except \"insured contract\"), liquor liability (only if insured is in the business of manufacturing, distributing, selling, serving or furnishing alcohol), workers comp, employer's liability, pollution, aircraft/auto/watercraft, mobile equipment transport/racing, war, damage to property, your product, your work, impaired property, recall, P&amp;AI, electronic data, TCPA/CAN-SPAM/FCRA. \u003ccite>[ISO CG 00 01 04 13, Sec. I Cov. A 2.a-q]\u003c/cite>\n\u003c/li>\u003cli>\nWatercraft exclusion does not apply to a non-owned watercraft less than 26 feet long not carrying persons or property for a charge, or watercraft ashore on premises you own or rent. \u003ccite>[ISO CG 00 01 04 13, Excl. g.(1)-(2)]\u003c/cite>\n\u003c/li>\u003cli>\nDamage to Property exclusion paragraphs (1),(3),(4) do not apply to damage (other than fire) to premises rented to you for 7 or fewer consecutive days. \u003ccite>[ISO CG 00 01 04 13, Excl. j]\u003c/cite>\n\u003c/li>\u003cli>\nExclusions c. through n. do not apply to fire damage to premises rented to you or temporarily occupied with owner's permission — separate Damage To Premises Rented To You limit. \u003ccite>[ISO CG 00 01 04 13, Sec. I Cov. A 2 (final para.)]\u003c/cite>\n\u003c/li>\u003cli>\nDamage to Your Work exclusion does not apply if the damaged work, or the work out of which damage arises, was performed by a subcontractor. \u003ccite>[ISO CG 00 01 04 13, Excl. l]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Coverage B — Personal and Advertising Injury\u003c/h4>\n\u003cul>\n\u003cli>\nOffense must arise out of your business and be committed in the coverage territory during the policy period. \u003ccite>[ISO CG 00 01 04 13, Cov. B 1.b]\u003c/cite>\n\u003c/li>\u003cli>\nP&amp;AI offenses: false arrest/detention/imprisonment; malicious prosecution; wrongful eviction/entry/invasion of private occupancy; slander/libel/disparagement; violation of right of privacy; use of another's advertising idea in your advertisement; infringing copyright, trade dress or slogan in your advertisement. \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 14]\u003c/cite>\n\u003c/li>\u003cli>\nExclusions include knowing violation, material published with knowledge of falsity, material first published before the policy period, criminal acts, breach of contract, failure of goods to conform to advertised quality, wrong description of prices, IP infringement (except copyright/trade dress/slogan in your advertisement), insureds in media/internet businesses. \u003ccite>[ISO CG 00 01 04 13, Cov. B 2.a-p]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Coverage C — Medical Payments\u003c/h4>\n\u003cul>\n\u003cli>\nPays medical expenses for BI caused by an accident on premises you own/rent, on ways next to them, or because of your operations — regardless of fault; expenses must be incurred and reported within one year of the accident. \u003ccite>[ISO CG 00 01 04 13, Cov. C 1.a-b]\u003c/cite>\n\u003c/li>\u003cli>\nCovers first aid, necessary medical/surgical/X-ray/dental incl. prosthetics, ambulance, hospital, nursing and funeral services. \u003ccite>[ISO CG 00 01 04 13, Cov. C 1.b]\u003c/cite>\n\u003c/li>\u003cli>\nExcluded: any insured (except volunteer workers), hired person, person injured on part of premises they normally occupy, persons eligible for workers comp, athletics participants, products-completed operations hazard, anything excluded under Coverage A. \u003ccite>[ISO CG 00 01 04 13, Cov. C 2.a-g]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Supplementary Payments — Coverages A and B (in addition to limits)\u003c/h4>\n\u003cul>\n\u003cli>\nAll expenses insurer incurs; up to $250 for bail bonds (accidents/traffic violations from use of a vehicle to which BI coverage applies; insurer need not furnish bonds); cost of bonds to release attachments (within limit); insured's reasonable expenses incl. actual loss of earnings up to $250 a day; court costs taxed against insured (not attorney fees); prejudgment interest on the part of judgment insurer pays; post-judgment interest until insurer pays/offers/deposits its share. \u003ccite>[ISO CG 00 01 04 13, Supp. Payments 1.a-g]\u003c/cite>\n\u003c/li>\u003cli>\n\"These payments will not reduce the limits of insurance.\" Defense of an indemnitee can be paid as a supplementary payment if conditions are met (insured contract, no conflict, etc.). \u003ccite>[ISO CG 00 01 04 13, Supp. Payments 1-2]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Who Is an Insured\u003c/h4>\n\u003cul>\n\u003cli>\nIndividual: you and spouse, only for the business you solely own. Partnership/JV: partners/members and spouses re conduct of the business. LLC: members re conduct of business; managers re duties as managers. Corporation/other: executive officers and directors re duties; stockholders re liability as stockholders. Trust: trustees re duties. \u003ccite>[ISO CG 00 01 04 13, Sec. II 1.a-e]\u003c/cite>\n\u003c/li>\u003cli>\nAlso insureds: employees and volunteer workers (within scope; not for injury to co-employees), real estate manager, person with temporary custody of property if you die, your legal representative. \u003ccite>[ISO CG 00 01 04 13, Sec. II 2.a-d]\u003c/cite>\n\u003c/li>\u003cli>\nNewly acquired or formed organization (not partnership/JV/LLC) is a Named Insured until the 90th day or end of policy period, whichever is earlier. \u003ccite>[ISO CG 00 01 04 13, Sec. II 3.a]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Limits of Insurance\u003c/h4>\n\u003cul>\n\u003cli>\nGeneral Aggregate = most for Coverage C + Coverage A (except products-completed operations) + Coverage B. \u003ccite>[ISO CG 00 01 04 13, Sec. III 2]\u003c/cite>\n\u003c/li>\u003cli>\nProducts-Completed Operations Aggregate = most under Coverage A for BI/PD in the products-completed operations hazard. \u003ccite>[ISO CG 00 01 04 13, Sec. III 3]\u003c/cite>\n\u003c/li>\u003cli>\nPersonal &amp; Advertising Injury Limit = per person or organization (subject to general aggregate). Each Occurrence Limit = Coverage A + Coverage C per occurrence. Damage To Premises Rented To You Limit and Medical Expense Limit (per person) are sublimits of each occurrence. \u003ccite>[ISO CG 00 01 04 13, Sec. III 4-7]\u003c/cite>\n\u003c/li>\u003cli>\nLimits apply to each consecutive annual period (an extension of less than 12 months is added to the last period). \u003ccite>[ISO CG 00 01 04 13, Sec. III]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Conditions (Section IV)\u003c/h4>\n\u003cul>\n\u003cli>\nBankruptcy; Duties in event of occurrence/claim/suit (notify \"as soon as practicable\"; no voluntary payments except first aid); Legal action against us; Other insurance; Premium audit; Representations; Separation of insureds; Transfer of rights of recovery; When we do not renew. \u003ccite>[ISO CG 00 01 04 13, Sec. IV 1-9]\u003c/cite>\n\u003c/li>\u003cli>\nNonrenewal: written notice to first Named Insured at least 30 days before expiration. \u003ccite>[ISO CG 00 01 04 13, Sec. IV 9]\u003c/cite>\n\u003c/li>\u003cli>\nOther insurance: primary unless an excess situation applies; sharing is by equal shares if all other insurance permits it, otherwise by limits (pro rata). \u003ccite>[ISO CG 00 01 04 13, Sec. IV 4.c]\u003c/cite>\n\u003c/li>\u003cli>\nPremium shown as advance premium is a deposit; earned premium computed at audit; first Named Insured keeps records. \u003ccite>[ISO CG 00 01 04 13, Sec. IV 5]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Key Definitions\u003c/h4>\n\u003cul>\n\u003cli>\nCoverage territory: USA (incl. territories/possessions), Puerto Rico, Canada; international waters/airspace in travel between them; worldwide for products made/sold in the territory, persons away for a short time on your business, and internet P&amp;AI — if suit on the merits is in the US/PR/Canada or settled with insurer agreement. \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 4]\u003c/cite>\n\u003c/li>\u003cli>\n\"Employee\" includes a \"leased worker\" but not a \"temporary worker\". \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 5]\u003c/cite>\n\u003c/li>\u003cli>\n\"Mobile equipment\" includes bulldozers, farm machinery, forklifts, vehicles used solely on/next to your premises, crawler-tread vehicles, power cranes/shovels/loaders/diggers/drills, road construction equipment; but land vehicles subject to compulsory/financial responsibility laws are \"autos\". \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 12]\u003c/cite>\n\u003c/li>\u003cli>\n\"Pollutants\" = any solid, liquid, gaseous or thermal irritant or contaminant (smoke, vapor, soot, fumes, acids, alkalis, chemicals, waste). \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 15]\u003c/cite>\n\u003c/li>\u003cli>\n\"Suit\" includes arbitration and other ADR proceedings to which the insured submits with insurer consent. \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 18]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Premises &amp; Operations / Products &amp; Completed Operations\u003c/h3>\n\u003cul>\n\u003cli>\nPremises and operations exposure is covered under Coverage A within the general aggregate; BI/PD in the \"products-completed operations hazard\" falls under the separate Products-Completed Operations Aggregate. \u003ccite>[ISO CG 00 01 04 13, Sec. III 2-3]\u003c/cite>\n\u003c/li>\u003cli>\nProducts-completed operations hazard: BI/PD occurring away from premises you own or rent arising out of \"your product\" or \"your work\", except products still in your physical possession or work not yet completed or abandoned. \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 16.a]\u003c/cite>\n\u003c/li>\u003cli>\nWork is deemed completed at the earliest of: all work under the contract completed; all work at the job site completed (multi-site contract); or that part of the work put to its intended use by anyone other than another contractor/subcontractor on the same project. Work needing only service/repair is treated as completed. \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 16.a(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Insured Contract\u003c/h3>\n\u003cul>\n\u003cli>\n\"Insured contract\" = lease of premises (except the part indemnifying for fire damage to rented premises); sidetrack agreement; easement/license agreement (except construction/demolition within 50 feet of a railroad); obligation required by ordinance to indemnify a municipality (except work for the municipality); elevator maintenance agreement; and that part of any other business contract in which you assume the tort liability of another for BI/PD to a third party. \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 9]\u003c/cite>\n\u003c/li>\u003cli>\nTort liability = liability imposed by law in the absence of any contract. Not insured contracts: indemnifying a railroad for work within 50 feet of railroad property; indemnifying architects/engineers/surveyors for professional services. \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 9.f]\u003c/cite>\n\u003c/li>\u003cli>\nContractual liability exclusion does not apply to liability assumed in an insured contract if the BI/PD occurs after the contract is executed. \u003ccite>[ISO CG 00 01 04 13, Excl. b.(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Occurrence vs Claims-Made (CG 00 02 04 13)\u003c/h3>\n\u003cul>\n\u003cli>\nOccurrence form (CG 00 01) is triggered by BI/PD occurring during the policy period; claims-made form (CG 00 02) is triggered by a claim first made during the policy period (or an extended reporting period) for BI/PD that occurred after the retroactive date and before the end of the policy period. \u003ccite>[FC&amp;S \"Claims-Made CGL Form\" (propertycasualty360.com, 2014, CG 00 02 04 13); RNC PF&amp;M 270.3-1]\u003c/cite>\n\u003c/li>\u003cli>\nA claim is deemed made when notice of the claim is received and recorded by any insured or by the insurer, whichever comes first; notice of an \"occurrence\" is not notice of a claim. \u003ccite>[FC&amp;S \"Claims-Made CGL Form\" (2014)]\u003c/cite>\n\u003c/li>\u003cli>\nRetroactive date: BI/PD before the retro date is not covered even if the claim is made during the policy period; ISO rules allow advancing the retro date only with written consent of the first named insured (and in specified circumstances). \u003ccite>[FC&amp;S \"Claims-Made CGL Form\" (2014)]\u003c/cite>\n\u003c/li>\u003cli>\nBasic Extended Reporting Period (automatic, no charge, when coverage is canceled/nonrenewed, retro date advanced, or replaced by occurrence coverage): 5 years for claims arising from occurrences reported to the insurer not later than 60 days after the policy ends; 60 days for claims from occurrences not previously reported. Basic ERP does not reinstate or increase limits and doesn't apply if later insurance covers the claim. \u003ccite>[FC&amp;S \"Claims-Made CGL Form\" (2014); Austin &amp; Stanovich, \"The Claims-Made CGL Policy\" (2012)]\u003c/cite>\n\u003c/li>\u003cli>\nSupplemental ERP: optional, by endorsement for additional premium; written request within 60 days after the end of the policy period; additional premium will not exceed 200% of the annual premium; unlimited duration; starts when the basic ERP ends; provides reinstated (supplemental) aggregate limits; excess over other valid insurance. \u003ccite>[FC&amp;S \"Claims-Made CGL Form\" (2014); Austin &amp; Stanovich (2012)]\u003c/cite>\n\u003c/li>\u003cli>\nClaim information condition (\"Your Right to Claim and 'Occurrence' Information\"): insurer gives the first Named Insured occurrence/claim and payment/reserve information for claims-made coverage issued during the previous 3 years — no later than 30 days before termination if insurer cancels or nonrenews; otherwise on written request made within 60 days after the end of the policy period, provided within 45 days of the request. \u003ccite>[FC&amp;S \"Claims-Made CGL Form\" (2014)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Owners and Contractors Protective (OCP) — CG 00 09 04 13\u003c/h3>\n\u003cul>\n\u003cli>\nCovers the named insured (owner/GC) for BI/PD arising out of operations performed for it by the designated \"contractor\" at the specified location, or the named insured's acts or omissions in general supervision of those operations. \u003ccite>[ISO CG 00 09 04 13, Sec. I 1.b(1)]\u003c/cite>\n\u003c/li>\u003cli>\nExcludes BI/PD occurring after all work on the project is completed or after the part of the contractor's work causing injury is put to its intended use. \u003ccite>[ISO CG 00 09 04 13, Excl. 2.c]\u003c/cite>\n\u003c/li>\u003cli>\nSingle Aggregate Limit plus Each Occurrence Limit; aggregate applies separately to each designated project. Insurer's cancellation notice goes to the first Named Insured and the \"contractor\"; premium refunds are sent to the \"contractor.\" \u003ccite>[ISO CG 00 09 04 13, Sec. III; Sec. IV 2]\u003c/cite>\n\u003c/li>\u003cli>\nSame $250 bail bond / supplementary payments structure as CGL. \u003ccite>[ISO CG 00 09 04 13, Supp. Payments 1.b]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Pollution\u003c/h3>\n\u003cul>\n\u003cli>\nCGL pollution exclusion f. bars BI/PD from pollutants at owned/occupied premises, waste sites, and job sites where pollutants are brought on; exceptions include BI inside a building from heating/cooling/water-heating equipment smoke/fumes, heat/smoke/fumes from a \"hostile fire,\" and escape of mobile-equipment operating fluids. \u003ccite>[ISO CG 00 01 04 13, Excl. f.(1)]\u003c/cite>\n\u003c/li>\u003cli>\nf.(2) excludes cleanup/testing costs from governmental orders or suits (but not PD damages the insured would owe anyway). \u003ccite>[ISO CG 00 01 04 13, Excl. f.(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\"Hostile fire\" = one that becomes uncontrollable or breaks out from where it was intended to be. \u003ccite>[ISO CG 00 01 04 13, Sec. V def. 7]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Commercial Property\u003c/h3>\n\u003ch4>Commercial Property Conditions (CP 00 90 07 88)\u003c/h4>\n\u003cul>\n\u003cli>\nConcealment, misrepresentation or fraud voids the coverage part; Control of property (acts of others beyond your control don't affect coverage; breach at one location doesn't affect others); Insurance under two or more coverages (no more than actual loss); No benefit to bailee; Other insurance (pro rata for same-plan insurance, otherwise excess); Policy period/coverage territory (US incl. territories/possessions, Puerto Rico, Canada); Transfer of rights of recovery. \u003ccite>[ISO CP 00 90 07 88, A-I]\u003c/cite>\n\u003c/li>\u003cli>\nLegal action: full compliance and within 2 years after the date of direct physical loss. \u003ccite>[ISO CP 00 90 07 88, D.]\u003c/cite>\n\u003c/li>\u003cli>\nLiberalization: broadening revisions adopted without additional premium within 45 days prior to or during the policy period apply automatically. \u003ccite>[ISO CP 00 90 07 88, E.]\u003c/cite>\n\u003c/li>\u003cli>\nWaiver of subrogation allowed in writing before a loss; after a loss only for someone insured, a business firm owned/controlled by or controlling you, or your tenant. \u003ccite>[ISO CP 00 90 07 88, I.]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Building and Personal Property (CP 00 10 10 12)\u003c/h4>\n\u003cul>\n\u003cli>\nCovered property: Building (incl. completed additions, fixtures, permanently installed machinery/equipment, building service property), Your Business Personal Property (in the building or within 100 feet), and Personal Property of Others in your care, custody or control. \u003ccite>[ISO CP 00 10 10 12, A.1]\u003c/cite>\n\u003c/li>\u003cli>\nBPP includes your use interest as tenant in improvements and betterments (fixtures/alterations you made at your expense in a building you don't own and can't legally remove). \u003ccite>[ISO CP 00 10 10 12, A.1.b(6)]\u003c/cite>\n\u003c/li>\u003cli>\nProperty not covered includes money/securities, animals (with exceptions), autos held for sale, paved surfaces, foundations below lowest basement floor, land/water/growing crops, underground pipes, electronic data (except Additional Coverage), vehicles licensed for road use, outdoor fences/antennas/trees/shrubs (except extensions). \u003ccite>[ISO CP 00 10 10 12, A.2]\u003c/cite>\n\u003c/li>\u003cli>\nAdditional Coverages: Debris Removal (25% of paid loss + deductible, plus up to an additional $25,000 per location; reported within 180 days); Preservation of Property (loss within 30 days after property first moved); Fire Department Service Charge (up to $1,000 per premises; no deductible); Pollutant Clean-up and Removal ($10,000 per premises per 12-month period; reported within 180 days); Increased Cost of Construction (lesser of $10,000 or 5% of building limit; only with Replacement Cost; repair within 2 years); Electronic Data ($2,500 per policy year). \u003ccite>[ISO CP 00 10 10 12, A.4.a-f]\u003c/cite>\n\u003c/li>\u003cli>\nCoverage Extensions (only if 80%+ coinsurance or a value reporting symbol is shown; coinsurance doesn't apply to them; generally additional insurance): Newly acquired/constructed property — $250,000 per building and $100,000 BPP per building, ending at policy expiration, 30 days after acquisition/start of construction, or when values are reported; Personal effects &amp; property of others $2,500 per premises (personal effects not covered for theft); Valuable papers &amp; records $2,500; Property off-premises $10,000; Outdoor property $1,000 ($250 per tree, shrub or plant) only for fire, lightning, explosion, riot or civil commotion, aircraft; Non-owned detached trailers $5,000; BPP in portable storage units $10,000 (ends 90 days after placement). \u003ccite>[ISO CP 00 10 10 12, A.5.a-g]\u003c/cite>\n\u003c/li>\u003cli>\nOutdoor signs limited to $2,500 per sign per occurrence. \u003ccite>[ISO CP 00 10 10 12, C.]\u003c/cite>\n\u003c/li>\u003cli>\nLoss conditions: sworn proof of loss within 60 days after insurer's request; insurer gives notice of intentions within 30 days of proof; pays within 30 days after proof if amount agreed or appraisal award. \u003ccite>[ISO CP 00 10 10 12, E.3-4]\u003c/cite>\n\u003c/li>\u003cli>\nVacancy: if the building has been vacant more than 60 consecutive days before the loss — no coverage for vandalism, sprinkler leakage (unless protected against freezing), building glass breakage, water damage, theft or attempted theft; all other covered losses reduced by 15%. \u003ccite>[ISO CP 00 10 10 12, E.6.b]\u003c/cite>\n\u003c/li>\u003cli>\nVacant (owner/general lessee policy) unless at least 31% of total square footage is rented and used by tenants and/or used by the owner for customary operations; for a tenant, vacant when the unit lacks enough BPP to conduct customary operations; buildings under construction/renovation are not vacant. \u003ccite>[ISO CP 00 10 10 12, E.6.a]\u003c/cite>\n\u003c/li>\u003cli>\nValuation: ACV, except building repairs of $2,500 or less paid at replacement cost if coinsurance is met; stock sold but not delivered at selling price; glass with safety glazing if required by law; tenants' improvements at ACV if repaired promptly, a proportion of original cost if not, nothing if others pay. \u003ccite>[ISO CP 00 10 10 12, E.7]\u003c/cite>\n\u003c/li>\u003cli>\nCoinsurance formula: (Limit carried ÷ (value at time of loss × coinsurance %)) × loss, minus deductible, not to exceed the limit. \u003ccite>[ISO CP 00 10 10 12, F.1]\u003c/cite>\n\u003c/li>\u003cli>\nMortgageholders: paid as interests appear even if foreclosure started; get loss payment even if insured's claim is denied if they pay premium, submit proof of loss within 60 days, and notify of change in risk; insurer gives mortgageholder 10 days' notice of cancellation for nonpayment, 30 days otherwise, and 10 days' notice of nonrenewal. \u003ccite>[ISO CP 00 10 10 12, F.2]\u003c/cite>\n\u003c/li>\u003cli>\nOptional coverages: Agreed Value (coinsurance suspended until expiration of the agreed value date); Inflation Guard (automatic annual % increase prorated daily); Replacement Cost (not for property of others, residence contents, works of art/antiques, or stock unless \"including stock\"); Extension of RC to Personal Property of Others. \u003ccite>[ISO CP 00 10 10 12, G.1-4]\u003c/cite>\n\u003c/li>\u003cli>\nReplacement Cost: may claim ACV first and then RC if notice is given within 180 days after the loss; RC not paid until actually repaired/replaced. \u003ccite>[ISO CP 00 10 10 12, G.3.c-d]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Condominium Association (CP 00 17 10 12) and Commercial Unit-Owners (CP 00 18 10 12)\u003c/h4>\n\u003cul>\n\u003cli>\nCP 00 17 covers the association's building (incl. fixtures outside units and, if the condo agreement requires, fixtures/improvements/appliances inside units); unit-owners' personal property is not \"Building.\" \u003ccite>[ISO CP 00 17 10 12, A.1.a]\u003c/cite>\n\u003c/li>\u003cli>\nAssociation policy is intended to be primary and not contribute with a unit-owner's insurance; insurer waives subrogation against unit-owners. \u003ccite>[ISO CP 00 17 10 12, E.6, E.9]\u003c/cite>\n\u003c/li>\u003cli>\nCP 00 18 covers the commercial unit-owner's BPP, incl. fixtures, improvements and alterations owned by the unit-owner; it is intended to be excess over, and not contribute with, the association's insurance. \u003ccite>[ISO CP 00 18 10 12, A.1.a; E.3]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Builders Risk (CP 00 20 06 95)\u003c/h4>\n\u003cul>\n\u003cli>\nCovers building under construction incl. foundations, materials, supplies and fixtures intended to be permanently part of the building (on or within 100 feet), and temporary structures if not otherwise insured. \u003ccite>[ISO CP 00 20 06 95, A.1]\u003c/cite>\n\u003c/li>\u003cli>\nNeed for Adequate Insurance: insurer pays no greater share than limit ÷ value on the date of completion. \u003ccite>[ISO CP 00 20 06 95, Additional Condition 2]\u003c/cite>\n\u003c/li>\u003cli>\nCoverage ceases at the first of: policy expires/canceled; property accepted by purchaser; your interest ceases; construction abandoned; unless otherwise specified, 90 days after construction is complete or 60 days after the building is occupied in whole or part or put to its intended use. \u003ccite>[ISO CP 00 20 06 95, Additional Condition 4]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Business Income (and Extra Expense) (CP 00 30 10 12)\u003c/h4>\n\u003cul>\n\u003cli>\nBusiness Income = net income (profit or loss before taxes) that would have been earned plus continuing normal operating expenses, including payroll. Pays actual loss sustained during the \"period of restoration\" due to necessary suspension caused by direct physical loss at described premises. \u003ccite>[ISO CP 00 30 10 12, A.1]\u003c/cite>\n\u003c/li>\u003cli>\nExtra Expense = necessary expenses during the period of restoration you would not have incurred, to avoid or minimize suspension (incl. relocation). \u003ccite>[ISO CP 00 30 10 12, A.2]\u003c/cite>\n\u003c/li>\u003cli>\nPeriod of restoration begins 72 hours after the direct physical loss for Business Income, immediately for Extra Expense; ends when property should be repaired with reasonable speed or business resumes at a new permanent location; policy expiration does not cut it short. \u003ccite>[ISO CP 00 30 10 12, F.3]\u003c/cite>\n\u003c/li>\u003cli>\nCivil Authority: premises within 1 mile of damaged property; BI begins 72 hours after the civil authority action and lasts up to 4 consecutive weeks; EE begins immediately. \u003ccite>[ISO CP 00 30 10 12, A.5.a]\u003c/cite>\n\u003c/li>\u003cli>\nExtended Business Income: continues after operations resume until restored to normal level or 60 consecutive days, whichever is earlier (Extended Period of Indemnity option replaces 60 with a larger number). \u003ccite>[ISO CP 00 30 10 12, A.5.c; E.4]\u003c/cite>\n\u003c/li>\u003cli>\nInterruption of Computer Operations: $2,500 per policy year. Newly Acquired Locations extension: $100,000 per location, 30 days (needs 50%+ coinsurance). \u003ccite>[ISO CP 00 30 10 12, A.5.d; A.6]\u003c/cite>\n\u003c/li>\u003cli>\nBI coinsurance is based on 12 months of net income + operating expenses following inception/anniversary; it does not apply to Extra Expense. \u003ccite>[ISO CP 00 30 10 12, D.]\u003c/cite>\n\u003c/li>\u003cli>\nOptional coverages (each suspends coinsurance): Maximum Period of Indemnity (pays loss during the first 120 days of the period of restoration, up to limit); Monthly Limit of Indemnity (limit × fraction shown, e.g., 1/4, per 30 consecutive days); Business Income Agreed Value (requires work sheet; coinsurance suspended up to 12 months). \u003ccite>[ISO CP 00 30 10 12, E.1-3]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Legal Liability (CP 00 40 10 12)\u003c/h4>\n\u003cul>\n\u003cli>\nPays sums the insured becomes legally obligated to pay for direct physical loss (incl. loss of use) to tangible property of others in the insured's care, custody or control, caused by accident and arising out of a Covered Cause of Loss; includes defense and supplementary payments (loss of earnings up to $250/day). \u003ccite>[ISO CP 00 40 10 12, A.; A.3]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Extra Expense (CP 00 50 10 12)\u003c/h4>\n\u003cul>\n\u003cli>\nFor businesses that must keep operating (no BI coverage); payment limited to the percentages shown in the Declarations × limit according to length of the period of restoration: ≤30 days first %, 31–60 days second %, &gt;60 days third % (form example: 40%–80%–100%). \u003ccite>[ISO CP 00 50 10 12, C.3]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Causes of Loss Forms\u003c/h4>\n\u003cul>\n\u003cli>\nBasic (CP 10 10): fire, lightning, explosion, windstorm or hail, smoke, aircraft or vehicles, riot or civil commotion, vandalism, sprinkler leakage, sinkhole collapse, volcanic action. \u003ccite>[ISO CP 10 10 10 12, A.1-11]\u003c/cite>\n\u003c/li>\u003cli>\nVandalism peril excludes theft (except building damage by burglars breaking in/out); vehicle peril excludes vehicles you own or operate in your business; sinkhole collapse excludes man-made cavities. \u003ccite>[ISO CP 10 10 10 12, A.6, A.8, A.10]\u003c/cite>\n\u003c/li>\u003cli>\nBroad (CP 10 20) adds falling objects, weight of snow/ice/sleet, water damage (accidental discharge from a system/appliance) and an Additional Coverage for collapse. \u003ccite>[ISO CP 10 20 10 12, A.12-14; C.]\u003c/cite>\n\u003c/li>\u003cli>\nSpecial (CP 10 30): \"direct physical loss unless the loss is excluded or limited\" (open perils). \u003ccite>[ISO CP 10 30 09 17, A.]\u003c/cite>\n\u003c/li>\u003cli>\nSpecial form theft limits: $2,500 furs; $2,500 jewelry/watches/precious metals (not items worth $100 or less); $2,500 patterns/dies/molds/forms; $250 stamps, tickets (incl. lottery tickets) and letters of credit. \u003ccite>[ISO CP 10 30 09 17, C.3]\u003c/cite>\n\u003c/li>\u003cli>\nSpecial form excludes continuous seepage/leakage of water over 14 days or more; limited fungus coverage is $15,000 per 12-month period; Property in Transit extension $5,000. \u003ccite>[ISO CP 10 30 09 17, B.2.f; E.3; F.1]\u003c/cite>\n\u003c/li>\u003cli>\n\"Specified causes of loss\" = fire; lightning; explosion; windstorm or hail; smoke; aircraft or vehicles; riot or civil commotion; vandalism; leakage from fire-extinguishing equipment; sinkhole collapse; volcanic action; falling objects; weight of snow, ice or sleet; water damage. \u003ccite>[ISO CP 10 30 09 17, G.2]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Selected Endorsements\u003c/h4>\n\u003cul>\n\u003cli>\nOrdinance or Law (CP 04 05): Coverage A = loss to the un
