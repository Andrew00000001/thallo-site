03cstrong>HO-5 Comprehensive:\u003c/strong> open perils on \u003cstrong>A, B and C\u003c/strong>. \u003ccite>[HO 00 05 10 00, Sec. I Perils]\u003c/cite>\n\u003cul>\n\u003cli>\nThe jewelry/watches/furs, firearms and silverware special limits apply to loss by \"\u003cstrong>theft, misplacing or losing\u003c/strong>.\" \u003ccite>[HO 00 05 10 00, Coverage C.3.e–g]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>HO-6 Unit-Owners:\u003c/strong> \u003ccite>[HO 00 06 05 11, Coverage A, Sec. I Perils, Cond. D]\u003c/cite>\n\u003cul>\n\u003cli>\nCoverage A covers \u003cstrong>alterations, appliances, fixtures and improvements\u003c/strong> in the unit, real property pertaining only to the unit, property that is the owner's responsibility under the association agreement, and structures owned solely by the insured at the location.\n\u003c/li>\u003cli>\nCoverages A and C are covered for \u003cstrong>named perils\u003c/strong>.\n\u003c/li>\u003cli>\nCoverage A losses are paid at actual cost to repair if repaired within a reasonable time; otherwise ACV.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nIn HO-6, trees are covered up to \u003cstrong>10% of C\u003c/strong>, ordinance or law up to \u003cstrong>10% of A\u003c/strong>, and loss assessment up to \u003cstrong>$1,000\u003c/strong>. \u003ccite>[HO 00 06 05 11, Add'l Cov. 3, 7, 10]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>HO-8 Modified Coverage:\u003c/strong> for owner-occupants whose homes may not meet the standards for other forms. Typical case: an older home whose replacement cost far exceeds its market value. \u003ccite>[The Institutes, AIC 43; HO 00 08 10 00]\u003c/cite>\n\u003cul>\n\u003cli>\nIt covers \u003cstrong>10 named perils\u003c/strong>, the basic perils plus theft and volcanic eruption.\n\u003c/li>\u003cli>\n\u003cstrong>Theft is covered only on the residence premises, up to $1,000 per loss.\u003c/strong> \u003ccite>[HO 00 08 10 00, Peril 9]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Buildings:\u003c/strong> if repaired at the same site \u003cstrong>within 180 days\u003c/strong>, the insurer pays the lesser of the limit or the amount actually spent, but no more than the cost of \u003cstrong>common construction materials and methods\u003c/strong> that are functionally equivalent. Otherwise it pays the least of the limit, the \u003cstrong>market value\u003c/strong>, or ACV. \u003ccite>[HO 00 08 10 00, Sec. I Cond. C.2]\u003c/cite>\n\u003c/li>\u003cli>\nTrees: no more than \u003cstrong>$250 per tree\u003c/strong>. \u003ccite>[HO 00 08 10 00, Add'l Cov. 3]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch3>Definitions (HO 00 03 05 11)\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>\"You\"\u003c/strong> means the named insured and a resident spouse. \u003ccite>[HO 00 03 05 11, Def. A]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>\"Insured\"\u003c/strong> includes: \u003ccite>[HO 00 03 05 11, Def. B.5]\u003c/cite>\n\u003cul>\n\u003cli>\nresident relatives;\n\u003c/li>\u003cli>\nother residents \u003cstrong>under 21\u003c/strong> in the care of an insured;\n\u003c/li>\u003cli>\na full-time \u003cstrong>student\u003c/strong> who lived in the household before leaving for school, if under \u003cstrong>24 and a relative\u003c/strong>, or under \u003cstrong>21 and in an insured's care\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nUnder Section II, \"insured\" also includes a person legally responsible for the insured's animals or watercraft (but not someone using them in a business or without consent), and certain users of covered motor vehicles. \u003ccite>[HO 00 03 05 11, Def. B.5]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>\"Business\"\u003c/strong> is a trade, profession or occupation (full-time, part-time or occasional), or any other activity for money, with these exceptions: \u003ccite>[HO 00 03 05 11, Def. B.3]\u003c/cite>\n\u003cul>\n\u003cli>\nactivities paying \u003cstrong>no more than $2,000 in the 12 months before the policy period\u003c/strong>;\n\u003c/li>\u003cli>\nvolunteer work;\n\u003c/li>\u003cli>\n\u003cstrong>home day care\u003c/strong> done only as a \u003cstrong>mutual exchange\u003c/strong> of services, or for a \u003cstrong>relative\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>\"Insured location\"\u003c/strong> includes: \u003ccite>[HO 00 03 05 11, Def. B.6]\u003c/cite>\n\u003cul>\n\u003cli>\nthe residence premises;\n\u003c/li>\u003cli>\nother premises shown in the Declarations or acquired during the policy period;\n\u003c/li>\u003cli>\npremises where an insured is \u003cstrong>temporarily residing\u003c/strong>;\n\u003c/li>\u003cli>\nvacant land (not farm land);\n\u003c/li>\u003cli>\nland where a 1–4 family residence is being built for an insured;\n\u003c/li>\u003cli>\ncemetery plots;\n\u003c/li>\u003cli>\npremises occasionally rented to an insured for non-business use.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>\"Occurrence\"\u003c/strong> means an accident, including continuous or repeated exposure to substantially the same harmful conditions, that results in BI or PD \u003cstrong>during the policy period\u003c/strong>. \u003ccite>[HO 00 03 05 11, Def. B.8]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>\"Residence premises\"\u003c/strong> means the 1-family dwelling where you reside, the \u003cstrong>2–4 family dwelling\u003c/strong> where you reside in one unit, or the part of another building where you reside, shown in the Declarations. It includes other structures and grounds. \u003ccite>[HO 00 03 05 11, Def. B.11]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>\"Property damage\"\u003c/strong> means physical injury to, destruction of, or loss of use of tangible property. \u003ccite>[HO 00 03 05 11, Def. B.9]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Section I – Property Coverages (HO 00 03 05 11)\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Coverage A – Dwelling\u003c/strong> covers the dwelling, attached structures, and materials and supplies on or next to the premises. Land is not covered. \u003ccite>[Coverage A]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage B – Other Structures:\u003c/strong> up to \u003cstrong>10% of Coverage A\u003c/strong>, and using it \u003cstrong>does not reduce\u003c/strong> A. \u003ccite>[Coverage B]\u003c/cite>\n\u003cul>\n\u003cli>\nExcluded: land; structures rented to non-tenants (unless a private garage); structures from which a \u003cstrong>business is conducted\u003c/strong>; structures storing business property (with exceptions).\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage C – Personal Property\u003c/strong> is covered \u003cstrong>anywhere in the world\u003c/strong>. \u003ccite>[Coverage C.1–2]\u003c/cite>\n\u003cul>\n\u003cli>\nProperty usually kept at another residence of an insured: limited to \u003cstrong>10% of C or $1,000, whichever is greater\u003c/strong>.\n\u003c/li>\u003cli>\nProperty in a \u003cstrong>self-storage facility\u003c/strong>: same limit (new in 2011).\n\u003c/li>\u003cli>\nOther residences: not applied to property moved out during repairs, or to a newly acquired principal residence for 30 days. Self-storage: not applied to property moved out during repairs, or to property usually kept at another residence.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Special limits of liability\u003c/strong> (per loss, per category; they do not increase Coverage C): \u003ccite>[Coverage C.3.a–k]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>$200\u003c/strong>: money, bank notes, bullion, gold, silver and platinum (other than ware), coins, medals, scrip, stored value cards, smart cards.\n\u003c/li>\u003cli>\n\u003cstrong>$1,500\u003c/strong>: securities, accounts, deeds, evidences of debt, letters of credit, manuscripts, personal records, passports, tickets, stamps.\n\u003c/li>\u003cli>\n\u003cstrong>$1,500\u003c/strong>: watercraft, including trailers, furnishings, equipment and outboard motors.\n\u003c/li>\u003cli>\n\u003cstrong>$1,500\u003c/strong>: trailers not used with watercraft.\n\u003c/li>\u003cli>\n\u003cstrong>$1,500\u003c/strong>: \u003cstrong>theft\u003c/strong> of jewelry, watches, furs, and precious and semiprecious stones.\n\u003c/li>\u003cli>\n\u003cstrong>$2,500\u003c/strong>: \u003cstrong>theft\u003c/strong> of firearms and related equipment.\n\u003c/li>\u003cli>\n\u003cstrong>$2,500\u003c/strong>: \u003cstrong>theft\u003c/strong> of silverware, goldware, platinumware and pewterware.\n\u003c/li>\u003cli>\n\u003cstrong>$2,500\u003c/strong>: business property \u003cstrong>on\u003c/strong> the residence premises.\n\u003c/li>\u003cli>\n\u003cstrong>$1,500\u003c/strong>: business property \u003cstrong>away from\u003c/strong> the residence premises.\n\u003c/li>\u003cli>\n\u003cstrong>$1,500\u003c/strong>: portable electronic equipment in or on a motor vehicle.\n\u003c/li>\u003cli>\n\u003cstrong>$250\u003c/strong>: antennas, tapes, wires, records, disks and other media in or on a motor vehicle.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Property not covered:\u003c/strong> \u003ccite>[Coverage C.4]\u003c/cite>\n\u003cul>\n\u003cli>\narticles \u003cstrong>separately described and specifically insured\u003c/strong>;\n\u003c/li>\u003cli>\n\u003cstrong>animals, birds or fish\u003c/strong>;\n\u003c/li>\u003cli>\nmotor vehicles, except non-registered vehicles used to service a residence or to assist the handicapped;\n\u003c/li>\u003cli>\naircraft (model or hobby aircraft are covered) and hovercraft;\n\u003c/li>\u003cli>\nproperty of roomers and boarders who are not related to an insured;\n\u003c/li>\u003cli>\nproperty in an apartment rented to others (except Landlord's Furnishings) or rented to others off premises;\n\u003c/li>\u003cli>\nbusiness data;\n\u003c/li>\u003cli>\ncredit cards (except under the additional coverage);\n\u003c/li>\u003cli>\nwater or steam.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage D – Loss of Use:\u003c/strong> one total limit for three parts. \u003ccite>[Coverage D]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>Additional living expense:\u003c/strong> for the shortest time to repair, or to settle elsewhere.\n\u003c/li>\u003cli>\n\u003cstrong>Fair rental value\u003c/strong> of the rented part.\n\u003c/li>\u003cli>\n\u003cstrong>Civil authority:\u003c/strong> up to \u003cstrong>2 weeks\u003c/strong>.\n\u003c/li>\u003cli>\nThe time periods are \u003cstrong>not limited by policy expiration\u003c/strong>. Lease cancellation is not covered.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Section I Additional Coverages (HO 00 03 05 11, E.1–12)\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Debris removal\u003c/strong> is included in the limit for the damaged property. If damage plus debris removal exceeds the limit, an \u003cstrong>additional 5%\u003c/strong> of that limit is available. \u003ccite>[E.1.a]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Tree removal:\u003c/strong> up to \u003cstrong>$1,000\u003c/strong> per loss, \u003cstrong>$500 per tree\u003c/strong>, for trees felled by windstorm or hail or by weight of ice, snow or sleet. A neighbor's tree felled by a Coverage C peril also qualifies. \u003ccite>[E.1.b]\u003c/cite>\n\u003cul>\n\u003cli>\nThe tree must damage a covered structure, or block a driveway or a handicap ramp.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Reasonable repairs\u003c/strong> to protect covered property from further damage. \u003ccite>[E.2]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Trees, shrubs and plants:\u003c/strong> up to \u003cstrong>5% of Coverage A\u003c/strong>, \u003cstrong>$500 per tree\u003c/strong>. \u003ccite>[E.3]\u003c/cite>\n\u003cul>\n\u003cli>\nCovered perils: fire or lightning, explosion, riot, aircraft, non-resident vehicles, V&amp;MM, \u003cstrong>theft\u003c/strong>.\n\u003c/li>\u003cli>\n\u003cstrong>Not windstorm.\u003c/strong>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Fire department service charge:\u003c/strong> \u003cstrong>$500\u003c/strong>, no deductible, unless the property is within the limits of the jurisdiction providing the fire department. \u003ccite>[E.4]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Property removed:\u003c/strong> covered against any direct loss for up to \u003cstrong>30 days\u003c/strong>. \u003ccite>[E.5]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Credit card, EFT card, forgery and counterfeit money:\u003c/strong> \u003cstrong>$500\u003c/strong>, \u003cstrong>no deductible\u003c/strong>. \u003ccite>[E.6]\u003c/cite>\n\u003cul>\n\u003cli>\nNot covered: use by a household resident, by a person entrusted with the card, or in a business.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Loss assessment:\u003c/strong> \u003cstrong>$1,000\u003c/strong>. \u003ccite>[E.7]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Collapse:\u003c/strong> abrupt collapse only, caused by: \u003ccite>[E.8]\u003c/cite>\n\u003cul>\n\u003cli>\nCoverage C perils;\n\u003c/li>\u003cli>\nhidden decay;\n\u003c/li>\u003cli>\nhidden insect damage;\n\u003c/li>\u003cli>\nweight of contents or people;\n\u003c/li>\u003cli>\nweight of rain on a roof;\n\u003c/li>\u003cli>\ndefective materials or methods during construction.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Glass or safety glazing material:\u003c/strong> no coverage if the dwelling was \u003cstrong>vacant more than 60 consecutive days\u003c/strong>, except breakage caused by earth movement. \u003ccite>[E.9]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Landlord's furnishings:\u003c/strong> \u003cstrong>$2,500\u003c/strong> per rented apartment, Coverage C perils \u003cstrong>other than theft\u003c/strong>. \u003ccite>[E.10]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Ordinance or law:\u003c/strong> up to \u003cstrong>10% of Coverage A\u003c/strong>, additional insurance. \u003ccite>[E.11]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Grave markers:\u003c/strong> \u003cstrong>$5,000\u003c/strong>. \u003ccite>[E.12]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Section II – Liability Coverages (HO 00 03 05 11)\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Coverage E – Personal Liability:\u003c/strong> \u003ccite>[Sec. II A]\u003c/cite>\n\u003cul>\n\u003cli>\npays damages, including prejudgment interest;\n\u003c/li>\u003cli>\nprovides a defense \u003cstrong>even if the suit is groundless, false or fraudulent\u003c/strong>;\n\u003c/li>\u003cli>\nthe duty to settle or defend ends when the limit is exhausted.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage F – Medical Payments to Others:\u003c/strong> pays reasonable medical expenses incurred or medically ascertained within \u003cstrong>3 years\u003c/strong> of the accident. \u003ccite>[Sec. II B]\u003c/cite>\n\u003cul>\n\u003cli>\nIt \u003cstrong>does not apply to you or regular residents of your household, except residence employees\u003c/strong>.\n\u003c/li>\u003cli>\nIt covers people on the insured location with permission.\n\u003c/li>\u003cli>\nOff premises, it covers injury from a condition on the premises, an insured's activities, a residence employee, or an insured's animal.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Basic and minimum limits (manual):\u003c/strong> Coverage E \u003cstrong>$100,000\u003c/strong>; Coverage F \u003cstrong>$1,000\u003c/strong> per person. \u003ccite>[ISO HO Policy Program Manual Table 301 as reproduced in RIJRA HO Manual eff. 11/1/2021]\u003c/cite>\n\u003c/li>\u003cli>\nCoverage E is one limit per occurrence regardless of the number of insureds, claims or persons injured. Coverage F is a limit per person per accident. \u003ccite>[Sec. II Cond. A]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Severability of insurance:\u003c/strong> the coverage applies separately to each insured, but this does not increase the limit. \u003ccite>[Sec. II Cond. B]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Section II additional coverages\u003c/strong> (paid in addition to the limits): \u003ccite>[Sec. II Add'l Cov. A–D]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>Claim expenses\u003c/strong>: defense costs, bond premiums, the insured's \u003cstrong>loss of earnings up to $250/day\u003c/strong>, post-judgment interest.\n\u003c/li>\u003cli>\n\u003cstrong>First aid\u003c/strong> to others.\n\u003c/li>\u003cli>\n\u003cstrong>Damage to property of others\u003c/strong>: up to \u003cstrong>$1,000\u003c/strong> per occurrence at \u003cstrong>replacement cost\u003c/strong>. Not covered: damage caused intentionally by an insured \u003cstrong>13 or older\u003c/strong>, or property owned by an insured.\n\u003c/li>\u003cli>\n\u003cstrong>Loss assessment\u003c/strong>: \u003cstrong>$1,000\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage E and F exclusions:\u003c/strong> \u003ccite>[Sec. II Excl. A–E]\u003c/cite>\n\u003cul>\n\u003cli>\nmotor vehicle liability (with exceptions such as dead storage, service vehicles and some golf carts);\n\u003c/li>\u003cli>\nwatercraft liability (see below);\n\u003c/li>\u003cli>\n\u003cstrong>aircraft\u003c/strong> and \u003cstrong>hovercraft\u003c/strong>;\n\u003c/li>\u003cli>\nexpected or intended injury (reasonable force to protect persons or property is excepted);\n\u003c/li>\u003cli>\nbusiness, with exceptions: occasional rental, part rental, an office, school or studio, and a part-time business of an insured \u003cstrong>under 21\u003c/strong> with no employees;\n\u003c/li>\u003cli>\nprofessional services;\n\u003c/li>\u003cli>\npremises an insured owns or rents that are not an insured location;\n\u003c/li>\u003cli>\nwar;\n\u003c/li>\u003cli>\n\u003cstrong>communicable disease\u003c/strong>;\n\u003c/li>\u003cli>\nsexual molestation and abuse;\n\u003c/li>\u003cli>\ncontrolled substances.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Watercraft:\u003c/strong> Coverages E and F apply to: \u003ccite>[Sec. II Excl. B.2]\u003c/cite>\n\u003cul>\n\u003cli>\nstored watercraft;\n\u003c/li>\u003cli>\nsailing vessels \u003cstrong>under 26 feet\u003c/strong>, or 26 feet and longer if not owned by or rented to an insured;\n\u003c/li>\u003cli>\ninboard or inboard-outdrive boats of \u003cstrong>50 hp or less not owned\u003c/strong> by an insured, or more than 50 hp not owned by or rented to an insured;\n\u003c/li>\u003cli>\n\u003cstrong>outboard motors totaling 25 hp or less\u003c/strong>;\n\u003c/li>\u003cli>\noutboards over 25 hp if not owned by an insured, or acquired during the policy period, or owned before the period but declared at inception or reported \u003cstrong>within 45 days\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage E only excludes:\u003c/strong> \u003ccite>[Sec. II Excl. F]\u003c/cite>\n\u003cul>\n\u003cli>\ncontractual liability, except written contracts relating to the insured location or assumed before the occurrence;\n\u003c/li>\u003cli>\n\u003cstrong>property damage to property owned by an insured\u003c/strong>;\n\u003c/li>\u003cli>\nPD to property rented to or in an insured's care, \u003cstrong>except fire, smoke or explosion\u003c/strong>;\n\u003c/li>\u003cli>\ninjury to persons eligible for \u003cstrong>workers' compensation\u003c/strong> benefits;\n\u003c/li>\u003cli>\nnuclear;\n\u003c/li>\u003cli>\nbodily injury to you or another insured.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch3>Perils Insured Against and Exclusions (HO 00 03 05 11)\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Coverages A and B are not covered for:\u003c/strong> \u003ccite>[Sec. I Perils A.2]\u003c/cite>\n\u003cul>\n\u003cli>\ncollapse (except under the additional coverage);\n\u003c/li>\u003cli>\nfreezing, unless the insured used reasonable care to \u003cstrong>maintain heat or shut off the water and drain\u003c/strong> the system;\n\u003c/li>\u003cli>\nfreezing, thawing or ice damage to fences, pools, foundations and similar items;\n\u003c/li>\u003cli>\ntheft in or to a dwelling \u003cstrong>under construction\u003c/strong>;\n\u003c/li>\u003cli>\n\u003cstrong>V&amp;MM if the dwelling was vacant more than 60 consecutive days\u003c/strong> (a dwelling under construction is not vacant);\n\u003c/li>\u003cli>\nmold, fungus or wet rot, unless hidden and caused by accidental discharge;\n\u003c/li>\u003cli>\n\u003cstrong>wear and tear\u003c/strong>, mechanical breakdown, latent defect, inherent vice;\n\u003c/li>\u003cli>\nrust, smog, dry rot;\n\u003c/li>\u003cli>\npollutants;\n\u003c/li>\u003cli>\nsettling;\n\u003c/li>\u003cli>\nbirds, rodents and insects;\n\u003c/li>\u003cli>\nanimals owned by an insured.\n\u003c/li>\u003cli>\nAccidental discharge from plumbing or appliances is excepted (covered), including tear-out.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Peril notes:\u003c/strong> \u003ccite>[Sec. I Perils B.2, B.9, B.10]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>Windstorm or hail:\u003c/strong> interior rain damage is covered only if wind or hail first opens the roof or a wall. Watercraft are covered only inside a fully enclosed building.\n\u003c/li>\u003cli>\n\u003cstrong>Theft:\u003c/strong> not covered when committed by an insured, or from a dwelling under construction.\n\u003c/li>\u003cli>\n\u003cstrong>Theft off premises:\u003c/strong> trailers, campers and watercraft are not covered off premises. Property at another residence of an insured is not covered unless the insured is temporarily living there; a student's property is covered if the student was there within the past \u003cstrong>90 days\u003c/strong>.\n\u003c/li>\u003cli>\n\u003cstrong>Falling objects:\u003c/strong> property inside is covered only if the roof or an outside wall is damaged first.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Section I exclusions\u003c/strong> apply regardless of any concurrent or sequential cause (anti-concurrent causation): \u003ccite>[Sec. I Excl. A.1–9]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>ordinance or law\u003c/strong> (except the additional coverage);\n\u003c/li>\u003cli>\n\u003cstrong>earth movement\u003c/strong> (ensuing fire, explosion or theft is covered);\n\u003c/li>\u003cli>\n\u003cstrong>water\u003c/strong>: flood, surface water, storm surge, \u003cstrong>sewer or drain backup\u003c/strong>, sump overflow, subsurface water (ensuing fire, explosion or theft is covered);\n\u003c/li>\u003cli>\n\u003cstrong>power failure off premises\u003c/strong>;\n\u003c/li>\u003cli>\n\u003cstrong>neglect\u003c/strong>;\n\u003c/li>\u003cli>\n\u003cstrong>war\u003c/strong> (a nuclear weapon discharge counts as war even if accidental);\n\u003c/li>\u003cli>\n\u003cstrong>nuclear hazard\u003c/strong>;\n\u003c/li>\u003cli>\n\u003cstrong>intentional loss\u003c/strong>, which bars coverage for all insureds, even innocent ones;\n\u003c/li>\u003cli>\n\u003cstrong>governmental action\u003c/strong> (destruction ordered to stop the spread of a fire is excepted).\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nCoverages A and B also exclude the following, but any ensuing loss is covered: weather conditions (excluded only when they combine with a cause excluded under A); acts or decisions of any person, group or governmental body; faulty planning, design, workmanship, materials or maintenance. \u003ccite>[Sec. I Excl. B]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Conditions (HO 00 03 05 11)\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Deductible:\u003c/strong> if two or more deductibles apply, only the highest applies. \u003ccite>[Sec. I Cond. B]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Duties after loss:\u003c/strong> \u003ccite>[Sec. I Cond. C]\u003c/cite>\n\u003cul>\n\u003cli>\nprompt notice;\n\u003c/li>\u003cli>\nnotify the police of theft;\n\u003c/li>\u003cli>\nnotify the card company of a credit card loss;\n\u003c/li>\u003cli>\nprotect the property;\n\u003c/li>\u003cli>\nprepare an inventory;\n\u003c/li>\u003cli>\nsubmit to an \u003cstrong>examination under oath\u003c/strong> (outside the presence of other insureds);\n\u003c/li>\u003cli>\nsend a sworn proof of loss \u003cstrong>within 60 days after the insurer's request\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Loss settlement:\u003c/strong> \u003ccite>[Sec. I Cond. D.1–2]\u003c/cite>\n\u003cul>\n\u003cli>\nPersonal property, awnings, carpeting, appliances, outdoor antennas and equipment, non-building structures and grave markers are paid at \u003cstrong>ACV\u003c/strong>.\n\u003c/li>\u003cli>\n\u003cstrong>Buildings under A and B\u003c/strong> are paid at \u003cstrong>replacement cost\u003c/strong> with no depreciation, if insured to \u003cstrong>at least 80% of full replacement cost\u003c/strong>. The insurer pays the least of: the limit; the cost to replace with like kind and quality; or the amount actually spent.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Under 80%:\u003c/strong> the insurer pays the \u003cstrong>greater\u003c/strong> of ACV, or (insurance carried ÷ 80% of replacement cost) × replacement cost of the loss, up to the limit. \u003ccite>[Sec. I Cond. D.2.b]\u003c/cite>\n\u003c/li>\u003cli>\nIn computing the 80% figure, these are left out: excavations, foundations below the lowest basement floor, and underground flues, pipes, wiring and drains. \u003ccite>[Sec. I Cond. D.2.c]\u003c/cite>\n\u003c/li>\u003cli>\nOnly \u003cstrong>ACV\u003c/strong> is paid until repair is complete, unless the loss is \u003cstrong>under 5% of the insurance AND under $2,500\u003c/strong>. \u003ccite>[Sec. I Cond. D.2.d]\u003c/cite>\n\u003c/li>\u003cli>\nThe insured may take ACV first and then claim replacement cost by giving notice of intent to repair \u003cstrong>within 180 days\u003c/strong> after the loss. \u003ccite>[Sec. I Cond. D.2.e]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Pair or set:\u003c/strong> the insurer may repair or replace part of the set, or pay the difference in ACV before and after the loss. \u003ccite>[Sec. I Cond. E]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Appraisal:\u003c/strong> appraisers named \u003cstrong>within 20 days\u003c/strong>; umpire chosen within \u003cstrong>15 days\u003c/strong> or by a judge; each side pays its own appraiser and splits the umpire's cost. \u003ccite>[Sec. I Cond. F]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Other insurance:\u003c/strong> pro rata by limits. Coverage is \u003cstrong>excess\u003c/strong> over a service agreement or home warranty. \u003ccite>[Sec. I Cond. G]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Suit against us (Section I):\u003c/strong> within \u003cstrong>2 years\u003c/strong> after the loss under the unendorsed ISO form. Michigan law requires at least 1 year, tolled from notice until denial. \u003ccite>[Sec. I Cond. H; MCL 500.2833(1)(q)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Our option:\u003c/strong> the insurer may repair or replace by giving written notice \u003cstrong>within 30 days\u003c/strong> after the sworn proof of loss. \u003ccite>[Sec. I Cond. I]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Loss payment:\u003c/strong> \u003cstrong>60 days\u003c/strong> after proof of loss plus agreement, judgment or appraisal award. Michigan statute requires payment within 30 days after proof of the amount of loss. \u003ccite>[Sec. I Cond. J; MCL 500.2833(1)(p)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Abandonment:\u003c/strong> the insurer need not accept abandoned property. \u003ccite>[Sec. I Cond. K]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Mortgage clause:\u003c/strong> \u003ccite>[Sec. I Cond. L]\u003c/cite>\n\u003cul>\n\u003cli>\nLosses are paid to the mortgagee and you as interests appear.\n\u003c/li>\u003cli>\nThe mortgagee's claim survives a denial of yours if the mortgagee reports changes, pays premium on demand, and files a sworn statement \u003cstrong>within 60 days\u003c/strong> after notice.\n\u003c/li>\u003cli>\nThe mortgagee gets \u003cstrong>10 days'\u003c/strong> notice of cancellation or nonrenewal.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>No benefit to bailee\u003c/strong> (no coverage for anyone holding, storing or moving property for a fee). \u003ccite>[Sec. I Cond. M]\u003c/cite>\n\u003c/li>\u003cli>\nOther Section I conditions: \u003ccite>[Sec. I Cond. O–Q, S]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>Recovered property:\u003c/strong> at the insured's option it is returned, with the loss payment adjusted.\n\u003c/li>\u003cli>\n\u003cstrong>Volcanic eruptions within 72 hours\u003c/strong> count as one.\n\u003c/li>\u003cli>\n\u003cstrong>Policy period:\u003c/strong> loss must occur during the policy period.\n\u003c/li>\u003cli>\n\u003cstrong>Loss payable clause\u003c/strong> for scheduled personal property.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Concealment or fraud\u003c/strong> voids coverage for \u003cstrong>all\u003c/strong> insureds under Section I, but only for the insured involved under Section II. \u003ccite>[Sec. I Cond. R; Sec. II Cond. J]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Section II:\u003c/strong> \u003ccite>[Sec. II Cond. F–H]\u003c/cite>\n\u003cul>\n\u003cli>\nno one may join the insurer in a suit against an insured;\n\u003c/li>\u003cli>\nbankruptcy of an insured does not relieve the insurer;\n\u003c/li>\u003cli>\nSection II coverage is \u003cstrong>excess\u003c/strong> over other valid and collectible insurance.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Sections I and II conditions:\u003c/strong> \u003ccite>[Secs. I &amp; II Cond. A–G]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>Liberalization:\u003c/strong> a no-cost broadening applies automatically if implemented \u003cstrong>within 60 days before or during\u003c/strong> the policy period. It does not apply to general program revisions.\n\u003c/li>\u003cli>\n\u003cstrong>Waiver\u003c/strong> must be in writing.\n\u003c/li>\u003cli>\n\u003cstrong>Cancellation:\u003c/strong>\n\u003cul>\n\u003cli>\n10 days for nonpayment;\n\u003c/li>\u003cli>\n10 days for any reason if in force under 60 days and not a renewal;\n\u003c/li>\u003cli>\n30 days for misrepresentation or substantial change in risk after 60 days;\n\u003c/li>\u003cli>\n30 days at the anniversary of a multi-year policy;\n\u003c/li>\u003cli>\nrefunds are \u003cstrong>pro rata\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Nonrenewal:\u003c/strong> 30 days.\n\u003c/li>\u003cli>\n\u003cstrong>Assignment\u003c/strong> requires the insurer's written consent.\n\u003c/li>\u003cli>\n\u003cstrong>Subrogation:\u003c/strong> an insured may waive recovery rights in writing \u003cstrong>before\u003c/strong> a loss. Subrogation does not apply to Coverage F or damage to property of others.\n\u003c/li>\u003cli>\n\u003cstrong>Death:\u003c/strong> the legal representative is covered.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch3>Coverage Relationships (default limits)\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Coverage B\u003c/strong> = 10% of A (form). \u003ccite>[HO 00 03 05 11, Coverage B.3]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage C\u003c/strong> = \u003cstrong>50% of A\u003c/strong> for HO-2, 3, 5 and 8 (manual). \u003ccite>[RIJRA HO Manual (ISO-based) Example 7; NC Rate Bureau HO Manual; Universal P&amp;C HO Manual]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage D:\u003c/strong> the manuals disagree; see Flags. 30% of A appears in the ISO 2000-program example. \u003ccite>[RIJRA HO Manual Example 7]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>HO-8 Coverage D\u003c/strong> = \u003cstrong>10% of A\u003c/strong>, the same in both manuals checked. \u003ccite>[NC Rate Bureau HO Manual; Universal P&amp;C MA HO Manual]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Selected Endorsements\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Special Provisions – Michigan (HO 01 21):\u003c/strong> Michigan's amendatory endorsement. I could not find or verify the form text (see Flags). Michigan law requires the policy to conform on these points: \u003ccite>[MCL 500.2833(1), 500.2123]\u003c/cite>\n\u003cul>\n\u003cli>\n30-day loss payment after proof of the amount of loss;\n\u003c/li>\u003cli>\nsuit within 1 year (or the policy period if longer), tolled from notice until denial;\n\u003c/li>\u003cli>\nan independent appraiser and a circuit-court umpire;\n\u003c/li>\u003cli>\n30-day termination notice (20 days during the first 55 days) with specific reasons.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Limited Fungi, Wet or Dry Rot, or Bacteria Coverage:\u003c/strong> \u003ccite>[HO 04 27 04 02, Schedule &amp; E.13; PF&amp;M 2014]\u003c/cite>\n\u003cul>\n\u003cli>\nHO 04 27: HO-3 and HO-5. HO 04 26: all other forms. HO 04 28: HO-4 with HO 05 24, or HO-6 with HO 17 31 or 17 32.\n\u003c/li>\u003cli>\nThe schedule shows \u003cstrong>$10,000\u003c/strong> for the Section I additional coverage. That covers loss, removal, tear-out and testing, and applies only when caused by an insured peril during the policy period.\n\u003c/li>\u003cli>\nThe schedule shows a \u003cstrong>$50,000\u003c/strong> Coverage E \u003cstrong>aggregate\u003c/strong> sublimit, which is within Coverage E, not added to it.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Permitted Incidental Occupancies – Residence Premises (HO 04 42):\u003c/strong> \u003ccite>[HO 04 42 10 00]\u003c/cite>\n\u003cul>\n\u003cli>\ncovers a \u003cstrong>described business\u003c/strong> run in the dwelling or in an other structure on the premises;\n\u003c/li>\u003cli>\na described other structure is insured for its own scheduled limit, not under Coverage B;\n\u003c/li>\u003cli>\nthe full \u003cstrong>Coverage C\u003c/strong> limit applies to the business property;\n\u003c/li>\u003cli>\nthe Section II business exclusion does not apply to the described business;\n\u003c/li>\u003cli>\nthere is still \u003cstrong>no coverage for bodily injury to employees\u003c/strong> of the business.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Earthquake (HO 04 54):\u003c/strong> \u003ccite>[HO 04 54 10 00]\u003c/cite>\n\u003cul>\n\u003cli>\ncovers earthquake, including land shock waves before, during or after a volcanic eruption;\n\u003c/li>\u003cli>\nshocks \u003cstrong>within 72 hours\u003c/strong> count as one earthquake;\n\u003c/li>\u003cli>\nthe deductible is a \u003cstrong>percentage of the greater of the Coverage A or C limit\u003c/strong>, with a $250 minimum in the 10 00 edition;\n\u003c/li>\u003cli>\nnot covered: \u003cstrong>exterior masonry veneer\u003c/strong> (unless the exclusion is removed; stucco is not veneer), flood caused by the earthquake, and the cost of filling land.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Scheduled Personal Property (HO 04 61):\u003c/strong> covers scheduled classes on an \u003cstrong>open-perils\u003c/strong> basis, worldwide, with \u003cstrong>no deductible\u003c/strong>. \u003ccite>[PF&amp;M HO 04 61 (July 2017); Texas HO 23 03 05 11 parallels]\u003c/cite>\n\u003cul>\n\u003cli>\nThe classes: jewelry; furs; cameras; musical instruments (not professional use); silverware; golfer's equipment; fine arts; stamps; coins.\n\u003c/li>\u003cli>\n\u003cstrong>Newly acquired jewelry, furs, cameras or musical instruments\u003c/strong> in a class already scheduled are covered for the lesser of \u003cstrong>25% of that class's limit or $10,000\u003c/strong>, if reported \u003cstrong>within 30 days\u003c/strong>.\n\u003c/li>\u003cli>\n\u003cstrong>Newly acquired fine arts\u003c/strong> are covered at ACV up to \u003cstrong>25%\u003c/strong> of the fine arts limit, if reported \u003cstrong>within 90 days\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Personal Property Replacement Cost (HO 04 90):\u003c/strong> \u003ccite>[HO 04 90 05 11]\u003c/cite>\n\u003cul>\n\u003cli>\nCoverage C, awnings, carpeting, appliances and outdoor equipment are paid at \u003cstrong>replacement cost\u003c/strong>.\n\u003c/li>\u003cli>\n\u003cstrong>Not eligible\u003c/strong>: antiques, fine arts and other irreplaceable rarities; memorabilia and collectors' items; articles not in good or workable condition; obsolete stored items.\n\u003c/li>\u003cli>\nThe insurer pays the least of replacement cost, cost of repair, the Coverage C limit, or any special limit.\n\u003c/li>\u003cli>\nIf the cost is \u003cstrong>over $500\u003c/strong>, only ACV is paid until the item is repaired or replaced.\n\u003c/li>\u003cli>\nThe insured may claim ACV first and give notice within \u003cstrong>180 days\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Home Day Care:\u003c/strong> \u003ccite>[HO 00 03 05 11, Def. B.3; PF&amp;M 2014 (HO 04 96, HO 04 97)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe base policy treats paid home day care as a \"business,\" so it is excluded under Section II, unless it is a mutual exchange or care for a relative.\n\u003c/li>\u003cli>\n\u003cstrong>HO 04 97 Home Day Care Coverage\u003c/strong> adds limited property coverage and day-care liability coverage.\n\u003c/li>\u003cli>\nHO 04 96 confirms there is no Section II coverage for day care, and limits day-care business property to $2,500 on premises and $500 off premises.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Business Pursuits (HO 24 71):\u003c/strong> covers an insured's liability from business activities where the insured is \u003cstrong>not the owner or a partner\u003c/strong>, such as clerical workers, salespersons, collectors, messengers and \u003cstrong>teachers\u003c/strong>. Teachers may add corporal punishment coverage. \u003ccite>[PF&amp;M 2014]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Watercraft (HO 24 75):\u003c/strong> adds liability coverage for described watercraft the base form excludes, such as owned outboards over 25 total hp and larger sailing vessels. \u003ccite>[PF&amp;M 2014; HO 00 03 05 11, Sec. II Excl. B]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Personal Injury (HO 24 82):\u003c/strong> adds coverage for injury arising out of: \u003ccite>[PF&amp;M 2014]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>false arrest, detention or imprisonment\u003c/strong>, or \u003cstrong>malicious prosecution\u003c/strong>;\n\u003c/li>\u003cli>\n\u003cstrong>libel, slander or defamation\u003c/strong>;\n\u003c/li>\u003cli>\n\u003cstrong>invasion of privacy\u003c/strong>;\n\u003c/li>\u003cli>\n\u003cstrong>wrongful eviction or entry\u003c/strong>.\n\u003c/li>\u003cli>\nHO 24 10 is the same but with an aggregate limit.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Home Business Insurance Coverage (HO 07 01):\u003c/strong> a self-contained, extensive endorsement providing \u003cstrong>property and liability\u003c/strong> coverage for a described business operated in the residence or in an other structure on the residence premises. \u003ccite>[PF&amp;M 2014]\u003c/cite>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\n\u003cstrong>HO-2, HO-5 and HO-8:\u003c/strong> verified only from the \u003cstrong>10 00\u003c/strong> edition texts.\n\u003cul>\n\u003cli>\nThe 05 11 editions may differ in some sub-limits. For example, HO-8 10 00 shows business property away from the premises at $500, while HO-3 05 11 shows $1,500.\n\u003c/li>\u003cli>\nCore features (perils, the HO-8 $1,000 on-premises theft limit, the 180-day repair rule) are consistent with PF&amp;M (2014) for the 2011 program.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage D percentages:\u003c/strong> the manuals conflict.\n\u003cul>\n\u003cli>\nThe ISO 2000 program example (RIJRA) shows HO-3 Coverage D at \u003cstrong>30% of A\u003c/strong>.\n\u003c/li>\u003cli>\nThe Universal P&amp;C (MA/HI) and NC Rate Bureau manuals show \u003cstrong>20% of A\u003c/strong> for HO-3, \u003cstrong>20% of C\u003c/strong> for HO-4, and \u003cstrong>40% of C\u003c/strong> for HO-6.\n\u003c/li>\u003cli>\nStudy guides commonly say HO-4 is 30% of C and HO-6 is 50% of C (2000+ program), but I could not verify that from an ISO manual.\n\u003c/li>\u003cli>\nTest-writers may use either. I did not write any question that depends on it.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Earthquake HO 04 54:\u003c/strong> the $250 minimum deductible is from the 10 00 edition. Later editions may use a different minimum.\n\u003c/li>\u003cli>\n\u003cstrong>HO 04 90:\u003c/strong> a 03 22 edition reportedly raised the $500 ACV-until-repaired threshold to $1,000 (secondary source). The 05 11 edition says $500.\n\u003c/li>\u003cli>\n\u003cstrong>ISO's current homeowners forms are the 03 22 editions (2022 program).\u003c/strong> This guide uses the 05 11 (2011 program) amounts, so every HO dollar figure should be labeled \"05 11 edition\".\n\u003c/li>\u003cli>\n\u003cstrong>Special Provisions – Michigan (HO 01 21 05 11):\u003c/strong> form text NOT FOUND or verified. A study deck suggests it covers suit limitation with tolling, duties after loss and spousal definition changes. Only the Michigan statutory requirements are stated as fact here.\n\u003c/li>\u003cli>\n\u003cstrong>Endorsements described from PF&amp;M (Rough Notes) summaries, not the form text:\u003c/strong> HO 04 61, HO 04 97, HO 24 71, HO 24 75, HO 24 82, HO 07 01. Specific dollar sub-limits inside these endorsements (beyond those listed) were not verified.\n\u003c/li>\u003cli>\n\u003cstrong>Michigan statute versus the unendorsed ISO form:\u003c/strong> On suit limitation, the policy's 2-year period applies because it is longer than the statutory 1-year minimum. Michigan adds tolling from notice of loss until formal denial, and HO 01 21 05 11 provides 2 years with tolling.\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"auto","title":"Automobile Insurance","weight":"15% · 22 items","secs":["auto"],"html":"\u003cp>Outline weight: 15% (22 items). Statute text read from legislature.mi.gov (\"MCL complete through PA 103 of 2026\") on 2026-10-12. Form editions relied on: ISO PP 00 01 09 18 (Personal Auto Policy, VA SCC specimen), ISO CA 00 01 11 20 (Business Auto, carrier specimen; CA 00 01 10 13 compared), ISO CA 00 05 07 97 (Garage), ISO CA 99 37 10 01 (Garagekeepers), ISO PP 03 06 01 05 (Extended Non-Owned).\u003c/p>\n\u003ch3>Laws\u003c/h3>\n\u003ch4>Michigan Motor Vehicle Financial Responsibility / required limits\u003c/h4>\n\u003cul>\n\u003cli>\nResidual liability policy limits for policies issued after July 1, 2020: at least $250,000 BI per person / $500,000 BI per accident; $10,000 property damage. Before July 2, 2020 it was $20,000 / $40,000 / $10,000. \u003ccite>[MCL 500.3009(1)]\u003c/cite>\n\u003c/li>\u003cli>\nApplicant or named insured may choose lower BI limits, but not below $50,000 per person / $100,000 per accident, only by completing the DIFS form (\"Michigan Choice of Bodily Injury Liability Coverage Limits\"). If no effective choice is made, the $250,000/$500,000 limits apply. \u003ccite>[MCL 500.3009(5),(8); DIFS FIS-PUB 6310]\u003c/cite>\n\u003c/li>\u003cli>\nOn every new policy and renewal, the insurer must give the liability options, a price for each option, and the form. The form must state the risks of lower limits, and the person must acknowledge it and sign it. \u003ccite>[MCL 500.3009(6),(7)]\u003c/cite>\n\u003c/li>\u003cli>\nThe $10,000 PD liability matters mainly for damage your vehicle does to property in another state, because in Michigan, PPI pays for property damage and PD tort liability is largely abolished. \u003ccite>[DIFS auto FAQ \"info-purchasing-auto-insurance\"; MCL 500.3135(3)]\u003c/cite>\n\u003c/li>\u003cli>\nNamed excluded driver: if the insured authorizes it, liability coverage can be excluded while a named person operates the vehicle. The face/declarations page and the certificate must carry this warning: \"when a named excluded person operates a vehicle all liability coverage is void—no one is insured.\" \u003ccite>[MCL 500.3009(2)]\u003c/cite>\n\u003c/li>\u003cli>\nA named excluded operator who is driving is not entitled to PIP. \u003ccite>[MCL 500.3113(d)]\u003c/cite>\n\u003c/li>\u003cli>\nFinancial-responsibility (SR-type certified) \"motor vehicle liability policy\" under the Vehicle Code still recites $20,000 / $40,000 / $10,000, with US and Canada territory. \u003ccite>[MCL 257.520(b)(2)]\u003c/cite>\n\u003c/li>\u003cli>\nTransportation network company (TNC, e.g., ride-share) drivers and companies: \u003ccite>[MCL 257.518b]\u003c/cite>\n\u003cul>\n\u003cli>\nWhile logged on and available but not on a prearranged ride: liability of at least $50,000 / $100,000 BI and $25,000 PD, plus PIP and PPI. \u003ccite>[MCL 257.518b]\u003c/cite>\n\u003c/li>\u003cli>\nWhile engaged in a prearranged ride: at least $1,000,000 combined single limit, plus PIP and PPI. \u003ccite>[MCL 257.518b]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nPersonal auto insurers may exclude all coverage while a TNC driver is logged on or providing a ride \u003ccite>[MCL 500.3017]\u003c/cite>. They may also exclude all coverage during a peer-to-peer car-sharing period \u003ccite>[MCL 500.3018, added 2024 PA 224, eff. Oct. 17, 2025]\u003c/cite>.\n\u003c/li>\u003c/ul>\n\u003ch4>Proof of insurance (MCL 257.328)\u003c/h4>\n\u003cul>\n\u003cli>\nThe owner or operator must produce evidence of insurance when a police officer asks. Failing to produce it, or having no insurance, is a civil infraction. \u003ccite>[MCL 257.328(1)]\u003c/cite>\n\u003c/li>\u003cli>\nAn electronic copy on a phone is acceptable. The officer may view only the certificate, may not manipulate the device, and showing it is not consent to a search. \u003ccite>[MCL 257.328(1)]\u003c/cite>\n\u003c/li>\u003cli>\nA certificate of insurance (paper or electronic) is prima facie evidence that insurance is in force until the expiration date shown. It must name any excluded operator. \u003ccite>[MCL 257.328(2)]\u003c/cite>\n\u003c/li>\u003cli>\nIf proof of valid insurance is given to the court before the appearance date, there is no fine or costs and no abstract goes to the Secretary of State. The court may charge a fee of up to $25. \u003ccite>[MCL 257.328(3)]\u003c/cite>\n\u003c/li>\u003cli>\nIf found responsible, the court may require the license to be surrendered. The suspension lasts 30 days or until proof of insurance is submitted, whichever is later, with a $25 SOS fee. No points are assessed. \u003ccite>[MCL 257.328(4),(7)]\u003c/cite>\n\u003c/li>\u003cli>\nKnowingly producing false evidence of insurance is a misdemeanor: up to 1 year in jail and/or a fine of up to $1,000. \u003ccite>[MCL 257.328(6)]\u003c/cite>\n\u003c/li>\u003cli>\nInsurers give 1 certificate of insurance per insured vehicle and report policy/VIN data to the Secretary of State. \u003ccite>[MCL 500.3101a(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Who must carry no-fault security\u003c/h4>\n\u003cul>\n\u003cli>\nThe owner or registrant of a motor vehicle required to be registered in Michigan must maintain PIP, PPI and residual liability. Security is required only while the vehicle is driven or moved on a highway. \u003ccite>[MCL 500.3101(1)]\u003c/cite>\n\u003c/li>\u003cli>\nEvery auto policy sold in Michigan must include PIP, PPI and residual liability (except the 3107d PIP-medical opt-out). An insurer may delete coverages and keep comprehensive on a vehicle that is not driven on a highway (storage). \u003ccite>[MCL 500.3101(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\"Owner\" includes a person renting or using a motor vehicle for more than 30 days, the title holder (but not a lessor under a lease longer than 30 days), and an installment buyer. \u003ccite>[MCL 500.3101(3)(l)]\u003c/cite>\n\u003c/li>\u003cli>\n\"Motor vehicle\" means a vehicle operated or designed for operation on a public highway by power other than muscular power, with more than 2 wheels. It does NOT include motorcycles, mopeds, ORVs, golf carts, farm tractors, power-driven mobility devices, commercial quadricycles or e-bikes. \u003ccite>[MCL 500.3101(3)(i)]\u003c/cite>\n\u003c/li>\u003cli>\nNonresident owners may not operate in Michigan for more than an aggregate of 30 days in any calendar year without no-fault security. \u003ccite>[MCL 500.3102(1)]\u003c/cite>\n\u003c/li>\u003cli>\nOperating, or knowingly permitting operation, without required security is a misdemeanor: fine of $200–$500, up to 1 year in jail, or both. \u003ccite>[MCL 500.3102(2)]\u003c/cite>\n\u003c/li>\u003cli>\nMotorcycle owners must carry residual liability that meets 3009(1). Insurers must also offer first-party medical benefits in $5,000 increments. \u003ccite>[MCL 500.3103]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Michigan Automobile Insurance Placement Facility (MAIPF)\u003c/h4>\n\u003cul>\n\u003cli>\nEvery insurer authorized to write auto insurance in Michigan must participate. Its purposes are to guarantee coverage for anyone unable to get it through ordinary methods and to preserve price competition by encouraging maximum use of the normal private market. \u003ccite>[MCL 500.3301]\u003c/cite>\n\u003c/li>\u003cli>\nBoard of governors: 11 governors. 7 are elected; 4 are appointed by the commissioner (2 represent agents, 2 the general public). \u003ccite>[MCL 500.3310(1)]\u003c/cite>\n\u003c/li>\u003cli>\nA qualified applicant is an owner or registrant of a Michigan-registered auto or a licensed driver. The term excludes most persons with a suspended or revoked license (listed Vehicle Code suspensions excepted). It also excludes anyone cancelled for nonpayment in the prior 2 years, unless the installment is paid in full. \u003ccite>[MCL 500.3303(b)]\u003c/cite>\n\u003c/li>\u003cli>\nDuties of the facility: \u003ccite>[MCL 500.3320(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nEquitably distributes applicants to designated participating members (servicing carriers). \u003ccite>[MCL 500.3320(1)]\u003c/cite>\n\u003c/li>\u003cli>\nMay issue policies to some drivers with suspended licenses; those policies may be cancelled after not less than 30 days if proof of reinstatement is not produced. \u003ccite>[MCL 500.3320(1)]\u003c/cite>\n\u003c/li>\u003cli>\nAdministers the assigned claims plan. \u003ccite>[MCL 500.3320(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nDeferred premium payment plan: advance payment of at least 25% of the total premium or $100, whichever is greater. \u003ccite>[MCL 500.3350(a)]\u003c/cite>\n\u003c/li>\u003cli>\nAn insurer may not count facility-placed premiums and losses in an agent's loss ratio, or use that experience to alter the agent relationship. \u003ccite>[MCL 500.3360]\u003c/cite>\n\u003c/li>\u003cli>\nNotice of eligibility: at least once each year, each designated participating member must notify facility insureds, on a commissioner-approved form, of the statutory eligibility standards for buying insurance in the voluntary market. \u003ccite>[MCL 500.3365(3)]\u003c/cite>\n\u003c/li>\u003cli>\nApplicants may request assignment, reject an assignment, or request reassignment to a designated member. Reassignment must be offered on the policy and at renewal. \u003ccite>[MCL 500.3365(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>No-Fault: Personal Injury Protection (PIP) benefits\u003c/h4>\n\u003cul>\n\u003cli>\nPIP pays, without regard to fault, for accidental bodily injury arising out of the ownership, operation, maintenance or use of a motor vehicle as a motor vehicle. Bodily injury includes death and damage to prosthetic devices in connection with the injury. \u003ccite>[MCL 500.3105]\u003c/cite>\n\u003c/li>\u003cli>\nAllowable expenses are reasonable charges for reasonably necessary products, services and accommodations for care, recovery or rehabilitation. \u003ccite>[MCL 500.3107(1)(a)]\u003c/cite>\n\u003cul>\n\u003cli>\nHospital room charges above semiprivate are not covered unless special or intensive care is required. \u003ccite>[MCL 500.3107(1)(a)]\u003c/cite>\n\u003c/li>\u003cli>\nFuneral and burial is limited to the amount set in the policy, which must be at least $1,750 and no more than $5,000. \u003ccite>[MCL 500.3107(1)(a)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nWork loss: \u003ccite>[MCL 500.3107(1)(b)]\u003c/cite>\n\u003cul>\n\u003cli>\nPays loss of income from work the injured person would have performed during the first 3 years after the accident. Nothing is payable after death. \u003ccite>[MCL 500.3107(1)(b)]\u003c/cite>\n\u003c/li>\u003cli>\nBenefits are reduced 15% for tax advantage (the \"85% rule\") unless the claimant proves a lower tax advantage. \u003ccite>[MCL 500.3107(1)(b)]\u003c/cite>\n\u003c/li>\u003cli>\nThe monthly maximum (per 30-day period) is adjusted each October 1 and applies by accident date. \u003ccite>[MCL 500.3107(1)(b)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nWork loss and survivor's loss maximum per 30-day period: \u003ccite>[DIFS Bulletin 2026-20-INS; MCL 500.3107(1)(b), 500.3108]\u003c/cite>\n\u003cul>\n\u003cli>\n$7,455 for accidents Oct. 1, 2026 – Sept. 30, 2027. \u003ccite>[DIFS Bulletin 2026-20-INS; MCL 500.3107(1)(b), 500.3108]\u003c/cite>\n\u003c/li>\u003cli>\n$7,201 for accidents Oct. 1, 2025 – Sept. 30, 2026. \u003ccite>[DIFS Bulletin 2026-20-INS; MCL 500.3107(1)(b), 500.3108]\u003c/cite>\n\u003c/li>\u003cli>\n$7,014 for accidents Oct. 1, 2024 – Sept. 30, 2025. \u003ccite>[DIFS Bulletin 2026-20-INS; MCL 500.3107(1)(b), 500.3108]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nA temporarily unemployed person's work loss is based on earned income for the last month employed full time before the accident. \u003ccite>[MCL 500.3107a]\u003c/cite>\n\u003c/li>\u003cli>\nReplacement services: up to $20 per day for ordinary and necessary services (housework, yard work, etc.) the injured person would have done, for the first 3 years after the accident. \u003ccite>[MCL 500.3107(1)(c)]\u003c/cite>\n\u003c/li>\u003cli>\nA person aged 60 or older who would not be eligible for work loss benefits may waive work-loss coverage in writing at a reduced premium. The waiver applies only to those who sign it. \u003ccite>[MCL 500.3107(2)(a)]\u003c/cite>\n\u003c/li>\u003cli>\nPIP need not cover medical marihuana. \u003ccite>[MCL 500.3107(2)(b)]\u003c/cite>\n\u003c/li>\u003cli>\nSurvivor's loss: paid to dependents after death \u003ccite>[MCL 500.3108]\u003c/cite>\n\u003cul>\n\u003cli>\nCovers lost contributions of tangible things of economic value (not services), plus up to $20/day in replacement-services expenses. \u003ccite>[MCL 500.3108]\u003c/cite>\n\u003c/li>\u003cli>\nSubject to the same adjusted 30-day maximum, which is the aggregate for all survivors. \u003ccite>[MCL 500.3108]\u003c/cite>\n\u003c/li>\u003cli>\nNot payable beyond the first 3 years after the accident. \u003ccite>[MCL 500.3108]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nConclusively presumed dependents: a spouse living with the deceased, and a child under 18 (or incapacitated) living with or regularly supported by the parent. A surviving spouse's dependency ends on death or remarriage. \u003ccite>[MCL 500.3110(1),(3)]\u003c/cite>\n\u003c/li>\u003cli>\nPIP benefits accrue as the expense or loss is incurred, not when the injury occurs. \u003ccite>[MCL 500.3110(4)]\u003c/cite>\n\u003c/li>\u003cli>\nGovernment-mandated benefits (federal or state law) are subtracted from PIP. Insurers may offer deductibles and coordination with other health and accident coverage at reduced premiums. These apply only to the named insured, spouse and resident relatives. \u003ccite>[MCL 500.3109(1),(3); 500.3109a(1)]\u003c/cite>\n\u003c/li>\u003cli>\nNot entitled to PIP: \u003ccite>[MCL 500.3113]\u003c/cite>\n\u003cul>\n\u003cli>\nA willing user of an unlawfully taken vehicle who knew or should have known it was taken. \u003ccite>[MCL 500.3113]\u003c/cite>\n\u003c/li>\u003cli>\nAn owner or registrant of an uninsured involved vehicle. \u003ccite>[MCL 500.3113]\u003c/cite>\n\u003c/li>\u003cli>\nA nonresident, unless they own a Michigan-registered and insured vehicle. \u003ccite>[MCL 500.3113]\u003c/cite>\n\u003c/li>\u003cli>\nA named excluded operator. \u003ccite>[MCL 500.3113]\u003c/cite>\n\u003c/li>\u003cli>\nA person excluded under the TNC or car-sharing exclusions. \u003ccite>[MCL 500.3113]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nOut-of-state accidents: PIP is payable for accidents in the US, its territories and possessions, or Canada if the injured person is a named insured, spouse or resident relative (or a qualifying occupant). \u003ccite>[MCL 500.3111]\u003c/cite>\n\u003c/li>\u003cli>\nPIP is payable as loss accrues and is overdue if not paid within 30 days after reasonable proof is received. Overdue benefits bear 12% simple interest per year. \u003ccite>[MCL 500.3142]\u003c/cite>\n\u003c/li>\u003cli>\nStatute of limitations: 1 year after the accident unless written notice is given or benefits were paid within 1 year. After that, suit must be brought within 1 year after the most recent loss is incurred, and recovery reaches back only 1 year. \u003ccite>[MCL 500.3145(1),(2)]\u003c/cite>\n\u003c/li>\u003cli>\nPPI actions must be brought within 1 year after the accident. \u003ccite>[MCL 500.3145(5)]\u003c/cite>\n\u003c/li>\u003cli>\nParked vehicles: injury involves a parked vehicle only if: \u003ccite>[MCL 500.3106]\u003c/cite>\n\u003cul>\n\u003cli>\nit was parked so as to cause unreasonable risk; \u003ccite>[MCL 500.3106]\u003c/cite>\n\u003c/li>\u003cli>\nthe injury came from contact with permanently mounted equipment in use, or from loading/unloading; or \u003ccite>[MCL 500.3106]\u003c/cite>\n\u003c/li>\u003cli>\nthe person was occupying, entering or alighting from the vehicle. \u003ccite>[MCL 500.3106]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>PIP coverage-level choices (policies issued or renewed after July 1, 2020)\u003c/h4>\n\u003cul>\n\u003cli>\nThe named insured selects one PIP allowable-expense (medical) level on a DIFS-approved form, per individual per loss occurrence: \u003ccite>[MCL 500.3107c(1)]\u003c/cite>\n\u003cul>\n\u003cli>\n$50,000: only if the named insured is enrolled in Medicaid AND the spouse and resident relatives have qualified health coverage (QHC), Medicaid, or PIP from another auto policy. \u003ccite>[MCL 500.3107c(1)]\u003c/cite>\n\u003c/li>\u003cli>\n$250,000 \u003ccite>[MCL 500.3107c(1)]\u003c/cite>\n\u003c/li>\u003cli>\n$500,000 \u003ccite>[MCL 500.3107c(1)]\u003c/cite>\n\u003c/li>\u003cli>\nNo limit (unlimited) \u003ccite>[MCL 500.3107c(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n$250,000 with exclusions: an insurer must offer anyone choosing the $250,000 level an exclusion for persons with QHC (non-Medicare). \u003ccite>[MCL 500.3109a(2)]\u003c/cite>\n\u003cul>\n\u003cli>\nIf the named insured, spouse and all resident relatives have QHC that covers auto injuries, the PIP medical premium is reduced 100%. \u003ccite>[MCL 500.3109a(2)]\u003c/cite>\n\u003c/li>\u003cli>\nExcluded persons are not eligible for PIP medical under the policy. \u003ccite>[MCL 500.3109a(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nOpt-out: the named insured may elect no PIP medical coverage only if: \u003ccite>[MCL 500.3107d(1),(7)]\u003c/cite>\n\u003cul>\n\u003cli>\nthe named insured is a \"qualified person\" (enrolled in Medicare Parts A and B); and \u003ccite>[MCL 500.3107d(1),(7)]\u003c/cite>\n\u003c/li>\u003cli>\nthe spouse and resident relatives have QHC or PIP from another policy. \u003ccite>[MCL 500.3107d(1),(7)]\u003c/cite>\n\u003c/li>\u003cli>\nA document from the QHC provider listing covered persons is required. \u003ccite>[MCL 500.3107d(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nQualified health coverage (QHC) is either: \u003ccite>[MCL 500.3107d(7)(b)]\u003c/cite>\n\u003cul>\n\u003cli>\nhealth or accident coverage that does not exclude or limit auto-accident injuries, with an annual deductible at or under the adjusted cap ($6,000 originally); or \u003ccite>[MCL 500.3107d(7)(b)]\u003c/cite>\n\u003c/li>\u003cli>\nMedicare Parts A and B. \u003ccite>[MCL 500.3107d(7)(b)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nQHC deductible cap: $6,579 for July 1, 2026 – June 30, 2027 (unchanged because the $500 threshold was not met). \u003ccite>[DIFS Bulletin 2026-08-INS]\u003c/cite>\n\u003c/li>\u003cli>\nIf QHC ends during the policy term: \u003ccite>[MCL 500.3107d(6); 500.3109a(2)(d),(e)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe named insured has 30 days to obtain PIP medical coverage. \u003ccite>[MCL 500.3107d(6); 500.3109a(2)(d),(e)]\u003c/cite>\n\u003c/li>\u003cli>\nSomeone injured during the 30 days may claim through the assigned claims plan. \u003ccite>[MCL 500.3107d(6); 500.3109a(2)(d),(e)]\u003c/cite>\n\u003c/li>\u003cli>\nAfter 30 days without coverage, the person gets no PIP medical (unless another policy applies). \u003ccite>[MCL 500.3107d(6); 500.3109a(2)(d),(e)]\u003c/cite>\n\u003c/li>\u003cli>\nInsurers may not penalize an eligible person for failing to obtain coverage in time. \u003ccite>[MCL 500.3107d(6); 500.3109a(2)(d),(e)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nDefault rules: \u003ccite>[MCL 500.3107c(3),(4); 500.3107d(4)]\u003c/cite>\n\u003cul>\n\u003cli>\nWith no effective selection but a premium paid, the premium paid is a rebuttable presumption of the level chosen. \u003ccite>[MCL 500.3107c(3),(4); 500.3107d(4)]\u003c/cite>\n\u003c/li>\u003cli>\nWith no selection and no presumption, unlimited PIP applies. \u003ccite>[MCL 500.3107c(3),(4); 500.3107d(4)]\u003c/cite>\n\u003c/li>\u003cli>\nA failed opt-out also defaults to unlimited. \u003ccite>[MCL 500.3107c(3),(4); 500.3107d(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe selected level applies to the named insured, spouse, resident relatives, and anyone else claiming PIP under the policy. \u003ccite>[MCL 500.3107c(5)]\u003c/cite>\n\u003c/li>\u003cli>\nIf two or more policies pay PIP medical, the aggregate is capped at the highest single-policy limit (no stacking). \u003ccite>[MCL 500.3107c(6)]\u003c/cite>\n\u003c/li>\u003cli>\nTNC companies may choose only $250,000, $500,000 or unlimited. \u003ccite>[MCL 500.3107c(7)]\u003c/cite>\n\u003c/li>\u003cli>\nInsurers must offer, for $50,000/$250,000/$500,000 policies, a rider covering attendant care in excess of the limit. \u003ccite>[MCL 500.3107c(8)]\u003c/cite>\n\u003c/li>\u003cli>\nForms under 3009, 3107c and 3107d (delivery and how a selection is made): \u003ccite>[MCL 500.3107e]\u003c/cite>\n\u003cul>\n\u003cli>\nDelivery: personal delivery, first-class mail, or electronic means. \u003ccite>[MCL 500.3107e]\u003c/cite>\n\u003c/li>\u003cli>\nA selection may be made by marking and signing a paper form, by recorded verbal instructions (in person or by phone), or electronically. \u003ccite>[MCL 500.3107e]\u003c/cite>\n\u003c/li>\u003cli>\nIf a verbal selection is disputed, it is presumed NOT effective, and the insurer must rebut that with the recording. \u003ccite>[MCL 500.3107e]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nTort recovery: a person may sue in tort for allowable expenses above the selected PIP limit, or without limit if they opted out or were excluded. \u003ccite>[MCL 500.3135(3)(c)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Chapter 31A: Managed Care (the \"subject to chapter 31A\" in MCL 500.3107)\u003c/h4>\n\u003cul>\n\u003cli>\nChapter 31A (MCL 500.3181–.3189), added by 2019 PA 21, lets an auto insurer offer an optional \"managed care option\" for PIP allowable expenses. Examples include monitoring and adjudication of care, a preferred-provider or network program, or a similar option. \u003ccite>[MCL 500.3181, 500.3183]\u003c/cite>\n\u003c/li>\u003cli>\nConditions: \u003ccite>[MCL 500.3183, .3184, .3186]\u003c/cite>\n\u003cul>\n\u003cli>\nIt must be uniformly offered where available. \u003ccite>[MCL 500.3183, .3184, .3186]\u003c/cite>\n\u003c/li>\u003cli>\nIt must provide a discount reflecting anticipated savings. \u003ccite>[MCL 500.3183, .3184, .3186]\u003c/cite>\n\u003c/li>\u003cli>\nIt may not apply to emergency care. \u003ccite>[MCL 500.3183, .3184, .3186]\u003c/cite>\n\u003c/li>\u003cli>\nAn insurer offering it must also offer PIP not subject to managed care. \u003ccite>[MCL 500.3183, .3184, .3186]\u003c/cite>\n\u003c/li>\u003cli>\nDeductibles and co-pays are allowed. \u003ccite>[MCL 500.3183, .3184, .3186]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nUnder a managed care option, PIP is primary and not coordinated with health coverage, and must be exhausted before other health coverage. \u003ccite>[MCL 500.3187]\u003c/cite>\n\u003c/li>\u003cli>\nThe insurer must obtain a signed acknowledgment that the insured received a disclosure statement. The statement includes the discount range and the consequences of violating the plan. \u003ccite>[MCL 500.3188, .3189]\u003c/cite>\n\u003c/li>\u003cli>\nExam impact: the managed care option is optional, so core PIP benefit facts are unchanged; recognize it only as an optional discounted PIP-medical delivery arrangement. \u003ccite>[MCL 500.3181–.3189]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>PIP order of priority (MCL 500.3114, 500.3115)\u003c/h4>\n\u003cul>\n\u003cli>\nGeneral rule: a person claims first under their own policy, or under the policy of a spouse or a resident relative (domiciled in the same household). If the person has their own policy, their own insurer pays everything up to its 3107c level, with no recoupment from a relative's insurer. \u003ccite>[MCL 500.3114(1)]\u003c/cite>\n\u003c/li>\u003cli>\nOperators and passengers of a vehicle operated in the business of transporting passengers claim from that vehicle's insurer. \u003ccite>[MCL 500.3114(2)]\u003c/cite>\n\u003cul>\n\u003cli>\nThis does not apply to passengers in school buses, common-carrier buses, government-program buses, nonprofit buses, taxicabs, livery buses, TNC vehicles, or vehicles on an opt-out or exclusion policy, unless the passenger has no other PIP. \u003ccite>[MCL 500.3114(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nAn employee (or the employee's spouse or resident relative) injured while occupying an employer-owned or employer-registered vehicle claims from the insurer of the furnished vehicle. \u003ccite>[MCL 500.3114(3)]\u003c/cite>\n\u003c/li>\u003cli>\nAn occupant with no own or household PIP policy claims through the Michigan Assigned Claims Plan (MACP). \u003ccite>[MCL 500.3114(4), as amended 2019 PA 21]\u003c/cite>\n\u003c/li>\u003cli>\nA non-occupant (e.g., pedestrian or bicyclist) with no own or household PIP policy claims through the MACP. \u003ccite>[MCL 500.3115, as amended 2019 PA 21]\u003c/cite>\n\u003c/li>\u003cli>\nMotorcycle operator or passenger injured in an accident involving a motor vehicle, in order: \u003ccite>[MCL 500.3114(5)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe insurer of the owner or registrant of the motor vehicle. \u003ccite>[MCL 500.3114(5)]\u003c/cite>\n\u003c/li>\u003cli>\nThe insurer of the operator of the motor vehicle. \u003ccite>[MCL 500.3114(5)]\u003c/cite>\n\u003c/li>\u003cli>\nThe motor vehicle insurer of the motorcycle operator. \u003ccite>[MCL 500.3114(5)]\u003c/cite>\n\u003c/li>\u003cli>\nThe motor vehicle insurer of the motorcycle owner or registrant. \u003ccite>[MCL 500.3114(5)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nOpt-out or excluded policies are skipped in the motorcycle priority. If two or more policies are at the same level, PIP is capped at the highest single limit and insurers share by partial recoupment. \u003ccite>[MCL 500.3114(6)–(8)]\u003c/cite>\n\u003c/li>\u003cli>\nA motorcycle is not a \"motor vehicle\" under the no-fault act. A motorcycle accident that does not involve a motor vehicle is not covered by 3114(5). \u003ccite>[MCL 500.3101(3)(g),(h),(i)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Property Protection Insurance (PPI) (MCL 500.3121–.3127)\u003c/h4>\n\u003cul>\n\u003cli>\nPPI pays, without regard to fault, for accidental damage to tangible property arising out of the ownership, operation, maintenance or use of a motor vehicle as a motor vehicle. Damage includes physical injury, destruction, and loss of use. \u003ccite>[MCL 500.3121(1)–(3)]\u003c/cite>\n\u003c/li>\u003cli>\nBenefits are the lesser of reasonable repair cost or replacement cost less depreciation, plus loss of use. The maximum is $1,000,000 per policy for all property damage from one accident. \u003ccite>[MCL 500.3121(5)]\u003c/cite>\n\u003c/li>\u003cli>\nExcluded: \u003ccite>[MCL 500.3121(1); 500.3123]\u003c/cite>\n\u003cul>\n\u003cli>\nDamage to property other than the insured vehicle occurring in the course of a business of repairing or servicing motor vehicles. \u003ccite>[MCL 500.3121(1); 500.3123]\u003c/cite>\n\u003c/li>\u003cli>\nVehicles and their contents, unless the vehicle was parked so as not to cause unreasonable risk (properly parked cars ARE covered). \u003ccite>[MCL 500.3121(1); 500.3123]\u003c/cite>\n\u003c/li>\u003cli>\nProperty of the named insured, spouse or resident relative, if any of them was the owner, registrant or operator of a vehicle involved. \u003ccite>[MCL 500.3121(1); 500.3123]\u003c/cite>\n\u003c/li>\u003cli>\nAccidents outside Michigan. \u003ccite>[MCL 500.3121(1); 500.3123]\u003c/cite>\n\u003c/li>\u003cli>\nCertain utility-line damage. \u003ccite>[MCL 500.3121(1); 500.3123]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nPriority: insurers of owners or registrants of the vehicles involved, then insurers of their operators. \u003ccite>[MCL 500.3125]\u003c/cite>\n\u003c/li>\u003cli>\nDIFS summary: PPI pays up to $1 million for damage your vehicle does in Michigan to other people's property, such as buildings, fences and properly parked vehicles. It does not pay for your own car. \u003ccite>[DIFS auto FAQ]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Residual liability and the tort threshold (MCL 500.3131, 500.3135)\u003c/h4>\n\u003cul>\n\u003cli>\nResidual liability covers BI and PD occurring in the US, its territories and possessions, or Canada. It provides coverage equivalent to the financial responsibility law where the injury or damage occurs, and in Michigan the liability retained by 3135. \u003ccite>[MCL 500.3131(1)]\u003c/cite>\n\u003c/li>\u003cli>\nNoneconomic loss (pain and suffering): tort liability remains only if the injured person suffered death, serious impairment of body function, or permanent serious disfigurement. \u003ccite>[MCL 500.3135(1)]\u003c/cite>\n\u003c/li>\u003cli>\nSerious impairment of body function: objectively manifested; an impairment of an important body function; and it affects the person's general ability to lead his or her normal life. There is no minimum duration. \u003ccite>[MCL 500.3135(5)]\u003c/cite>\n\u003c/li>\u003cli>\nComparative fault applies; a party more than 50% at fault recovers no noneconomic damages. A person who was operating his or her own vehicle without the required security cannot recover noneconomic (pain and suffering) damages, and an uninsured damaged vehicle cannot recover under the mini-tort. \u003ccite>[MCL 500.3135(2)(b),(c)]\u003c/cite>\n\u003c/li>\u003cli>\nTort liability is otherwise abolished for an insured vehicle, except for: \u003ccite>[MCL 500.3135(3)]\u003c/cite>\n\u003cul>\n\u003cli>\nintentional harm; \u003ccite>[MCL 500.3135(3)]\u003c/cite>\n\u003c/li>\u003cli>\nthreshold noneconomic loss; \u003ccite>[MCL 500.3135(3)]\u003c/cite>\n\u003c/li>\u003cli>\neconomic loss above PIP limits (including the daily, monthly and 3-year limits); \u003ccite>[MCL 500.3135(3)]\u003c/cite>\n\u003c/li>\u003cli>\nnonresidents' economic loss (threshold injury required); \u003ccite>[MCL 500.3135(3)]\u003c/cite>\n\u003c/li>\u003cli>\nthe \"mini-tort.\" \u003ccite>[MCL 500.3135(3)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nMini-tort: up to $3,000 for accidents after July 1, 2020 (previously $1,000) for vehicle damage not covered by insurance \u003ccite>[MCL 500.3135(3)(e),(4)]\u003c/cite>\n\u003cul>\n\u003cli>\nA party more than 50% at fault cannot recover. \u003ccite>[MCL 500.3135(3)(e),(4)]\u003c/cite>\n\u003c/li>\u003cli>\nThe suit is brought in small claims when possible. \u003ccite>[MCL 500.3135(3)(e),(4)]\u003c/cite>\n\u003c/li>\u003cli>\nIt is not part of required residual liability. \u003ccite>[MCL 500.3135(3)(e),(4)]\u003c/cite>\n\u003c/li>\u003cli>\nNo recovery if the damaged vehicle was uninsured. \u003ccite>[MCL 500.3135(3)(e),(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Michigan Catastrophic Claims Association (MCCA) (MCL 500.3104)\u003c/h4>\n\u003cul>\n\u003cli>\nThe MCCA is an unincorporated nonprofit association created in 1978 (no liability for losses before July 1, 1978). Every insurer writing Michigan no-fault security must be a member. \u003ccite>[MCL 500.3104(1),(27)]\u003c/cite>\n\u003c/li>\u003cli>\nIt reimburses member insurers for 100% of PIP ultimate loss above the retention per loss occurrence. \u003ccite>[MCL 500.3104(2),(27)]\u003c/cite>\n\u003cul>\n\u003cli>\nOnly for policies issued or renewed before July 2, 2020, and later policies with UNLIMITED PIP. \u003ccite>[MCL 500.3104(2),(27)]\u003c/cite>\n\u003c/li>\u003cli>\nNot for the $50k/$250k/$500k levels. \u003ccite>[MCL 500.3104(2),(27)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nRetention: $580,000 for July 1, 2019 – June 30, 2021. It then adjusts every 2 years (July 1 of odd years) by the lesser of 6% or CPI, rounded to the nearest $5,000. \u003ccite>[MCL 500.3104(2)(o)]\u003c/cite>\n\u003c/li>\u003cli>\nRetention for policies issued or renewed July 1, 2025 – June 30, 2027: $675,000. \u003ccite>[michigancatastrophic.com/what-is-catastrophic-injury]\u003c/cite>\n\u003c/li>\u003cli>\nPer-vehicle assessment for July 1, 2026 – June 30, 2027: \u003ccite>[MCCA Historical Assessment Chart; MCCA press release Oct. 8, 2025]\u003c/cite>\n\u003cul>\n\u003cli>\nUnlimited PIP: $84 ($65 pure premium + $19 deficit recoupment). \u003ccite>[MCCA Historical Assessment Chart; MCCA press release Oct. 8, 2025]\u003c/cite>\n\u003c/li>\u003cli>\nAll other PIP levels, including opt-out: $19 (deficit recoupment only). \u003ccite>[MCCA Historical Assessment Chart; MCCA press release Oct. 8, 2025]\u003c/cite>\n\u003c/li>\u003cli>\nThe 2025/26 figures were $82 and $23. \u003ccite>[MCCA Historical Assessment Chart; MCCA press release Oct. 8, 2025]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nNo premium is charged for limited-PIP or opt-out cars except the deficit-adjustment portion. A historic vehicle pays 20% of the car premium. The MCCA charges each member insurer per written car-year. A member passing the charge on to an insured must pass on exactly the amount attributable to that car. \u003ccite>[MCL 500.3104(7)(d),(20)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Michigan Assigned Claims Plan (MACP) (MCL 500.3171–.3175)\u003c/h4>\n\u003cul>\n\u003cli>\nThe MAIPF adopts and maintains the assigned claims plan. Insurers and self-insurers participate and share costs. \u003ccite>[MCL 500.3171(2)]\u003c/cite>\n\u003c/li>\u003cli>\nA person may claim PIP through the MACP when: \u003ccite>[MCL 500.3172(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nno PIP applies; \u003ccite>[MCL 500.3172(1)]\u003c/cite>\n\u003c/li>\u003cli>\nno PIP can be identified; \u003ccite>[MCL 500.3172(1)]\u003c/cite>\n\u003c/li>\u003cli>\ninsurers dispute priority; or \u003ccite>[MCL 500.3172(1)]\u003c/cite>\n\u003c/li>\u003cli>\nthe insurer is financially unable to pay. \u003ccite>[MCL 500.3172(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe MACP pays allowable expenses only up to $250,000. The cap is $2,000,000 for persons injured in the 30-day gap after losing QHC under an opt-out or exclusion. \u003ccite>[MCL 500.3172(7)]\u003c/cite>\n\u003c/li>\u003cli>\nBenefits are reduced by other benefit sources (except Medicaid and Medicare) for \"no PIP,\" \"can't identify\" and \"insolvent insurer\" claims. \u003ccite>[MCL 500.3172(5)]\u003c/cite>\n\u003c/li>\u003cli>\nThe claimant must notify the MAIPF within 1 year after the accident. The claim is then assigned to a servicing insurer, and suit timing follows 3145. \u003ccite>[MCL 500.3174]\u003c/cite>\n\u003c/li>\u003cli>\nThe claimant must cooperate (examination under oath with at least 21 days' notice). Fraud makes a claim ineligible. \u003ccite>[MCL 500.3173a]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Fee schedule / utilization (MCL 500.3157): basics only\u003c/h4>\n\u003cul>\n\u003cli>\nFor treatment after July 1, 2023, providers are generally limited to 190% of the Medicare amount. \u003ccite>[MCL 500.3157(2)(c)]\u003c/cite>\n\u003cul>\n\u003cli>\n220% for providers with 20–30% indigent volume and designated freestanding rehab facilities. \u003ccite>[MCL 500.3157(3)(c)]\u003c/cite>\n\u003c/li>\u003cli>\n250% for 30% or more indigent volume. \u003ccite>[MCL 500.3157(5)]\u003c/cite>\n\u003c/li>\u003cli>\n230% for Level I/II trauma centers for emergency care before stabilization. \u003ccite>[MCL 500.3157(6)(c)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nIf there is no Medicare rate, a percentage of the provider's Jan. 1, 2019 charge master applies, adjusted for medical CPI. \u003ccite>[MCL 500.3157(7),(9)]\u003c/cite>\n\u003c/li>\u003cli>\nIn-home attendant care by family, household members or prior acquaintances is payable only up to 56 hours per week (the workers' comp limit), unless the insurer contracts for more. \u003ccite>[MCL 500.3157(10),(11); MCL 418.315(1)]\u003c/cite>\n\u003c/li>\u003cli>\nAmbulance emergency services are exempt from the fee schedule. \u003ccite>[MCL 500.3157(13)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Cancellation and nonrenewal (Chapter 32, MCL 500.3204–.3240)\u003c/h4>\n\u003cul>\n\u003cli>\nInsurers may cancel an auto liability policy only as Chapter 32 allows. \u003ccite>[MCL 500.3204(1)]\u003c/cite>\n\u003c/li>\u003cli>\nOnce a policy has been in effect 55 days (or immediately if it is a renewal), cancellation is allowed only if the named insured or any household/customary operator has had a driver's license suspended or revoked during the policy period, and it has become final. \u003ccite>[MCL 500.3220]\u003c/cite>\n\u003c/li>\u003cli>\nWithin the first 55 days the insurer may cancel because the risk is unacceptable. That cancellation is not subject to appeal. \u003ccite>[MCL 500.3220(a); 500.3224(1)]\u003c/cite>\n\u003c/li>\u003cli>\nCancellation notice: \u003ccite>[MCL 500.3224(2),(3)]\u003c/cite>\n\u003cul>\n\u003cli>\nWritten notice sent by certified mail, return receipt requested (delivery is equivalent), to the last known address. \u003ccite>[MCL 500.3224(2),(3)]\u003c/cite>\n\u003c/li>\u003cli>\nMailed at least 20 days before the effective date. \u003ccite>[MCL 500.3224(2),(3)]\u003c/cite>\n\u003c/li>\u003cli>\nMust state the reasons and say in bold type that the insured may appeal to the department within 7 days from mailing. \u003ccite>[MCL 500.3224(2),(3)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nInsured's appeal and hearing: \u003ccite>[MCL 500.3230, .3234]\u003c/cite>\n\u003cul>\n\u003cli>\nThe insured files a written hearing request with the commissioner within 7 days after the postmark date. \u003ccite>[MCL 500.3230, .3234]\u003c/cite>\n\u003c/li>\u003cli>\nA hearing is held within 10 days after the appeal is received, with notice at least 4 days before the hearing. \u003ccite>[MCL 500.3230, .3234]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nNonrenewal is not a cancellation if the insurer mails notice by first-class mail at least 20 days before the termination date. \u003ccite>[MCL 500.3204(2)]\u003c/cite>\n\u003c/li>\u003cli>\nChapter 32 does not apply to cancellations for nonpayment of
