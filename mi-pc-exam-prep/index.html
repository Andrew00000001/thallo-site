 10 12, E.4.a, c]\u003c/cite>\n\u003c/li>\u003cli>\nHO \"Our Option\": the insurer may repair or replace if it gives written notice within 30 days after the sworn proof of loss. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. I]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Loss payment timing\u003c/strong>:\n\u003cul>\n\u003cli>\nCP: within 30 days after the sworn proof of loss, provided there is agreement on the amount or an appraisal award. \u003ccite>[ISO CP 00 10 10 12, E.4.g]\u003c/cite>\n\u003c/li>\u003cli>\nHO: 60 days after proof of loss, plus agreement, a final judgment, or an appraisal award. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. J]\u003c/cite>\n\u003c/li>\u003cli>\nMichigan statute also applies; see Claims Handling below. \u003ccite>[MCL 500.2006]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Duty to defend\u003c/strong>: the insurer has the right and duty to defend suits seeking covered damages. \u003ccite>[ISO CG 00 01 04 13, Sec. I Cov. A.1.a]\u003c/cite>\n\u003cul>\n\u003cli>\nThe duty is broader than the duty to indemnify: a potential for coverage is enough, and doubts are resolved for the insured. \u003ccite>[IRMI \"duty to defend\"]\u003c/cite>\n\u003c/li>\u003cli>\nThe duty ends when the applicable limit is used up paying judgments or settlements. \u003ccite>[ISO CG 00 01 04 13, Sec. I Cov. A.1.a(2)]\u003c/cite>\n\u003c/li>\u003cli>\nCGL supplementary payments, including defense costs, are paid in addition to the limits. \u003ccite>[ISO CG 00 01 \"Supplementary Payments – Coverages A and B\" (secondary confirmation)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Third-Party Provisions\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Standard mortgage clause (HO)\u003c/strong> \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. L]\u003c/cite>:\n\u003cul>\n\u003cli>\nCoverage A/B losses are paid to the mortgagee and the insured \"as interests appear,\" in order of precedence.\n\u003c/li>\u003cli>\nIf the insured's claim is denied, the mortgagee's valid claim still stands if the mortgagee:\n\u003cul>\n\u003cli>\nnotifies the insurer of any known change in ownership, occupancy, or substantial change in risk,\n\u003c/li>\u003cli>\npays premium due on demand, and\n\u003c/li>\u003cli>\nsubmits a sworn statement of loss within 60 days after notice of the insured's failure to do so.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe mortgagee gets at least 10 days' notice of cancellation or nonrenewal.\n\u003c/li>\u003cli>\nIf the insurer pays the mortgagee and denies the insured, it is subrogated to the mortgagee's rights or may pay off the whole mortgage and take an assignment.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Standard mortgage clause (CP)\u003c/strong> \u003ccite>[ISO CP 00 10 10 12, F.2]\u003c/cite>:\n\u003cul>\n\u003cli>\nSame structure. The mortgageholder keeps its right to payment even after starting foreclosure.\n\u003c/li>\u003cli>\nCancellation notice: 10 days for nonpayment, 30 days for other reasons. Nonrenewal notice: 10 days.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Loss payable clause\u003c/strong>: authorizes payment to a party other than the named insured that has an insurable interest, such as an auto lienholder or equipment lessor, \"as its interest may appear.\" \u003ccite>[IRMI \"loss payable clause\"]\u003c/cite>\n\u003cul>\n\u003cli>\nUnlike the mortgage clause, the insurer usually owes the loss payee nothing if it can deny the insured's claim. \u003ccite>[IRMI \"loss payable clause\"]\u003c/cite>\n\u003c/li>\u003cli>\nIn HO, a loss payee is treated as an \"insured\" for the listed property and is notified in writing of cancellation or nonrenewal. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. S]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>No benefit to bailee\u003c/strong>: no person or organization other than the insured that has custody of covered property benefits from the insurance. \u003ccite>[ISO CP 00 90 07 88, F]\u003c/cite> The HO version: the insurer will not recognize an assignment or grant coverage that benefits a person holding, storing, or moving property for a fee. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. M]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Indemnification Provisions\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Hold-harmless (indemnity) agreement\u003c/strong>: a contract in which one party agrees to take on certain legal liabilities of the other, e.g., a contractor indemnifying an owner. \u003ccite>[IRMI \"hold harmless agreement\"]\u003c/cite> There are three forms:\n\u003cul>\n\u003cli>\nLimited: covers only the indemnitor's sole negligence.\n\u003c/li>\u003cli>\nIntermediate: covers the indemnitor's sole or joint negligence.\n\u003c/li>\u003cli>\nBroad: covers even the indemnitee's sole negligence.\n \u003ccite>[IRMI \"hold harmless agreement\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nUnder the CGL, such assumed liability is covered if it is an \"insured contract.\" \u003ccite>[ISO CG 00 01 (insured contract concept; see CPP file)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Role of Applications and Binders\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Application\u003c/strong>: the applicant's statements, which are representations. Material misrepresentations can void coverage. \u003ccite>[IRMI \"representation\"; \"material misrepresentation\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Binder\u003c/strong>: a legal agreement issued by an agent or insurer that gives temporary evidence of insurance until the policy is issued. \u003ccite>[IRMI \"binder\"]\u003c/cite> A binder should:\n\u003cul>\n\u003cli>\nbe in writing,\n\u003c/li>\u003cli>\nhave a definite time limit,\n\u003c/li>\u003cli>\nname the insurer,\n\u003c/li>\u003cli>\nstate the amount, the type of policy, and (for property) the perils insured.\n \u003ccite>[IRMI \"binder\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nA producer can bind only within actual (express or implied) or apparent authority. A license alone creates no authority to commit an insurer. \u003ccite>[MCL 500.1201(h); IRMI \"express authority\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Insurance Claims Handling\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Adjuster types\u003c/strong> \u003ccite>[IRMI \"adjuster\"; \"independent adjuster\"; \"public adjuster\"]\u003c/cite>:\n\u003cul>\n\u003cli>\n\u003cem>Staff adjuster\u003c/em>: an employee of the insurer.\n\u003c/li>\u003cli>\n\u003cem>Independent adjuster\u003c/em>: works on contract for insurers or self-insureds, often in catastrophe or overflow situations.\n\u003c/li>\u003cli>\n\u003cem>Public adjuster\u003c/em>: represents the insured, not the insurer, and is usually paid a percentage of the settlement (about 2–15%).\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Typical process\u003c/strong>:\n\u003cul>\n\u003cli>\nNotice of loss.\n\u003c/li>\u003cli>\nInvestigation: inspection, records, examination under oath.\n\u003c/li>\u003cli>\nSworn proof of loss.\n\u003c/li>\u003cli>\nCoverage determination.\n\u003c/li>\u003cli>\nValuation, with appraisal if the amount is disputed.\n\u003c/li>\u003cli>\nPayment or denial.\n\u003c/li>\u003cli>\nSubrogation or salvage.\n \u003ccite>[ISO HO 00 03 05 11, Sec. I Conds. C, F, I, J; ISO CP 00 10 10 12, E.2–E.4]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Appraisal (ISO base wording)\u003c/strong> \u003ccite>[ISO CP 00 10 10 12, E.2; HO 00 03 05 11, Sec. I Cond. F]\u003c/cite>:\n\u003cul>\n\u003cli>\nEach party picks an appraiser, and the two choose an umpire. Agreement by any two is binding.\n\u003c/li>\u003cli>\nEach side pays its own appraiser and splits the umpire and other expenses.\n\u003c/li>\u003cli>\nUnder CP, the insurer keeps the right to deny the claim.\n\u003c/li>\u003cli>\nMichigan's statutory appraisal rule is in MCL 500.2833 (other file).\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Michigan timely claim payment\u003c/strong> \u003ccite>[MCL 500.2006]\u003c/cite>:\n\u003cul>\n\u003cli>\nThe insurer must pay claims on a timely basis or pay 12% interest. Failure to do either is an unfair trade practice unless the claim is reasonably in dispute. \u003ccite>[MCL 500.2006(1)]\u003c/cite>\n\u003c/li>\u003cli>\nThe insurer must specify in writing what makes up a satisfactory proof of loss within 30 days after receiving the claim, unless the claim is settled within those 30 days. \u003ccite>[MCL 500.2006(3)]\u003c/cite>\n\u003c/li>\u003cli>\nA claim is timely if paid within 60 days after the insurer receives proof of loss. Partial proof starts a separate 60-day clock for each supported part. \u003ccite>[MCL 500.2006(3)]\u003c/cite>\n\u003c/li>\u003cli>\nLate benefits to the insured, or to a person directly entitled under the policy, bear simple interest at 12% per year from 60 days after satisfactory proof of loss. \u003ccite>[MCL 500.2006(4)]\u003c/cite>\n\u003c/li>\u003cli>\nFor a third-party tort claimant, 12% interest applies only if liability is not reasonably in dispute, the insurer refused payment in bad faith, and a court determined the bad faith. \u003ccite>[MCL 500.2006(4)]\u003c/cite>\n\u003c/li>\u003cli>\nInterest is paid on top of, and at the same time as, the loss payment. If the loss exceeds the limits, interest is based on the limits. \u003ccite>[MCL 500.2006(4)]\u003c/cite>\n\u003c/li>\u003cli>\nIf the claimant rejected an offer and later recovers no more than that offer, no interest is due. \u003ccite>[MCL 500.2006(4)]\u003c/cite>\n\u003c/li>\u003cli>\nWhere 500.2006 is specifically inconsistent with the No-Fault Act (ch. 31) or the WDCA, it does not apply. \u003ccite>[MCL 500.2006(6)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\n\u003cstrong>ISO editions used\u003c/strong>:\n\u003cul>\n\u003cli>\nCP 00 10 10 12 (copy at propertyinsurancecoveragelaw.com)\n\u003c/li>\u003cli>\nCP 00 90 07 88 and CP 03 21 10 12 (Conifer Michigan hospitality forms)\n\u003c/li>\u003cli>\nHO 00 03 05 11 (copy downloaded by the homeowners research agent)\n\u003c/li>\u003cli>\nCG 00 01 04 13 limits and duty-to-defend text (Argo annotated copy)\n\u003c/li>\u003cli>\nCG \"Method Of Sharing\" wording from a Law Insider reproduction of the standard ISO text. I did not view the full ISO PDF.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>IL 00 17 11 98 Common Policy Conditions\u003c/strong>: I could not get an ISO copy. The 10/30-day commercial cancellation notice is from a carrier form reproducing ISO language (Accelerant N CP 0169), confirmed by secondary summaries. Michigan statutes and amendatory endorsements govern actual notice periods (see the Michigan sub-block file).\n\u003c/li>\u003cli>\n\u003cstrong>Stated amount\u003c/strong>: the \"least of stated amount / ACV / repair cost\" rule comes from secondary summaries of ISO CA 99 28. The Virginia SCC form PDF would not download.\n\u003c/li>\u003cli>\n\u003cstrong>Absolute vs. strict liability\u003c/strong>: legal sources often use these terms interchangeably. Exam-prep convention uses \"absolute\" for ultrahazardous activities and \"strict\" for defective products. Michigan has not adopted Restatement §402A strict products liability as such; design-defect claims use a negligence risk-utility test \u003ccite>[Prentis v Yale Mfg Co, 421 Mich 670 (1984)]\u003c/cite>. This is generic exam content; avoid Michigan-specific products questions.\n\u003c/li>\u003cli>\n\u003cstrong>Restoration of limits\u003c/strong>: no single primary source covers the \"property limits restored, liability aggregates eroded\" convention. Use it as general guidance only.\n\u003c/li>\u003cli>\n\u003cstrong>Punitive damages\u003c/strong>: Michigan citations are from the IADC Michigan Damages Compendium (2026), which quotes Gilbert (2004) and Casey (2006). I did not read the opinions themselves.\n\u003c/li>\u003cli>\n\u003cstrong>Michigan HO forms\u003c/strong>: Michigan uses a \"Special Provisions – Michigan\" endorsement that can modify the HO loss payment, appraisal, suit, and cancellation terms quoted here.\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"mi","title":"Michigan Laws & Required Provisions","weight":"part of P&C Basics","secs":["basics"],"html":"\u003cp>Statute text read from legislature.mi.gov via the helper (\"MCL complete through PA 103 of 2026\"). \"Director\" = DIFS Director (statutes still say \"commissioner\" in places).\u003c/p>\n\u003ch3>Michigan Property and Casualty Guaranty Association (MCL 500.7901–.7949)\u003c/h3>\n\u003ch4>Membership and structure\u003c/h4>\n\u003cul>\n\u003cli>\nChapter 79 is the \"property and casualty guaranty association act.\" \u003ccite>[MCL 500.7901]\u003c/cite>\n\u003c/li>\u003cli>\nEvery insurer authorized to write insurance other than life or disability in Michigan must belong, as a condition of keeping its authority to do business. The Michigan Basic Property Insurance Association (the FAIR plan pool) is exempt. \u003ccite>[MCL 500.7911(1)]\u003c/cite>\n\u003c/li>\u003cli>\nA surplus lines insurer (coverage procured \"solely by virtue of chapter 19\") is not an authorized insurer for this chapter, so it is not a member and its insureds are not protected. \u003ccite>[MCL 500.7911(2)]\u003c/cite>\n\u003c/li>\u003cli>\nLife and disability insurers may not be members. \u003ccite>[MCL 500.7911a]\u003c/cite>\n\u003c/li>\u003cli>\n\"Insolvent insurer\" means a member insurer against which a final order of liquidation, with a finding of insolvency, has been entered by a court in its state of domicile. \u003ccite>[MCL 500.7921(a)]\u003c/cite>\n\u003c/li>\u003cli>\nThe board of governors has 5 member insurers (3 domestic and 2 foreign; at least 2 stock and 2 nonstock) plus 2 public members. The commissioner appoints all of them to 3-year terms. \u003ccite>[MCL 500.7912(1)]\u003c/cite>\n\u003c/li>\u003cli>\nThe plan of operation requires the commissioner's prior written approval. \u003ccite>[MCL 500.7914(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Covered claims\u003c/h4>\n\u003cul>\n\u003cli>\nA covered claim is an unpaid obligation of an insolvent insurer that meets all of these conditions: \u003ccite>[MCL 500.7925(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nit arises from a policy issued to, or payable to, a Michigan resident;\n\u003c/li>\u003cli>\nit is presented by the claims-filing deadline;\n\u003c/li>\u003cli>\nit was incurred before, at, or \u003cstrong>within 30 days after\u003c/strong> the receiver was appointed;\n\u003c/li>\u003cli>\nit arises from any kind of insurance \u003cstrong>except life and disability\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Unearned premium:\u003c/strong> covered claims exclude unearned-premium refunds above the \u003cstrong>first $500\u003c/strong> per person per insolvent insurer. That base is adjusted annually for cost of living. \u003cstrong>No refund under $50\u003c/strong> is made. \u003ccite>[MCL 500.7925(2)(a)]\u003c/cite>\n\u003c/li>\u003cli>\nFor July 1, 2026 through June 30, 2027 the maximum unearned premium refund is \u003cstrong>$2,063\u003c/strong>. It was $1,998 for 7/1/2025–6/30/2026. \u003ccite>[DIFS Bulletin 2026-13-INS]\u003c/cite>\n\u003c/li>\u003cli>\nCovered claims exclude these obligations: \u003ccite>[MCL 500.7925(2)(b)]\u003c/cite>\n\u003cul>\n\u003cli>\nthose arising after the policy expires;\n\u003c/li>\u003cli>\nthose arising after the insured replaces the policy;\n\u003c/li>\u003cli>\nthose arising after the association cancels the policy.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Net worth exclusion:\u003c/strong> no first- or third-party claim by or against an insured whose net worth exceeds \u003cstrong>$25,000,000\u003c/strong> on December 31 of the year before the insolvency. Net worth includes affiliates on a consolidated basis. The figure is CPI-adjusted every January 1. \u003ccite>[MCL 500.7925(4)]\u003c/cite>\n\u003c/li>\u003cli>\nThe 2026 net worth limit (1/1/2026–12/31/2026) is \u003cstrong>$39,920,000\u003c/strong>. \u003ccite>[DIFS Bulletin 2026-04-INS]\u003c/cite>\n\u003c/li>\u003cli>\nCovered claims never include the part of a claim above the policy limit. \u003ccite>[MCL 500.7925(5)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Claim cap:\u003c/strong> the portion of a claim over \u003cstrong>$5,000,000\u003c/strong> is not a covered claim. Workers' compensation claims and no-fault PIP claims (MCL 500.3107) are exempt from the cap. The cap is CPI-adjusted every January 1, and the cap in effect when the claim is paid applies. \u003ccite>[MCL 500.7925(6)]\u003c/cite>\n\u003c/li>\u003cli>\nThe 2026 covered claim cap (1/1/2026–12/31/2026) is \u003cstrong>$7,980,000\u003c/strong>. \u003ccite>[DIFS Bulletin 2026-04-INS]\u003c/cite>\n\u003c/li>\u003cli>\nAmounts owed to reinsurers, insurers, pools, HMOs or health care corporations as subrogation or contribution are not covered claims. \u003ccite>[MCL 500.7925(3)]\u003c/cite>\n\u003c/li>\u003cli>\nCovered claims exclude the insolvent insurer's own pre-receivership adjustment fees, attorney fees, court costs, interest and bond premiums. \u003ccite>[MCL 500.7925(7)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Deductible:\u003c/strong> the Michigan statute sets no per-claim deductible for covered claims. The only small-amount rule is the $50 minimum unearned-premium refund. \u003ccite>[MCL 500.7925 (full text reviewed)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Duties and powers\u003c/h4>\n\u003cul>\n\u003cli>\nThe association may pay claims directly, through a servicing facility, or by reinsurance or transfer of liabilities to a member insurer. \u003ccite>[MCL 500.7931(1)]\u003c/cite>\n\u003c/li>\u003cli>\nIt stands in the insolvent insurer's shoes: it may appear, defend, investigate, settle, pay or deny claims. \u003ccite>[MCL 500.7931(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Other insurance first:\u003c/strong> amounts recoverable from other policies, such as a claimant's own coverage or a self-insured program, are credited against the covered claim. The claimant must exhaust that coverage first. A claimant's own life or disability policy is not counted. \u003ccite>[MCL 500.7931(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage continuation:\u003c/strong> in-force policies continue until the earliest of these: \u003ccite>[MCL 500.7931(4)]\u003c/cite>\n\u003cul>\n\u003cli>\nthe policy expires;\n\u003c/li>\u003cli>\nthe insured replaces it;\n\u003c/li>\u003cli>\nthe association cancels it;\n\u003c/li>\u003cli>\n\u003cstrong>30 days after the receiver is appointed\u003c/strong> (the outside limit).\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe association may cancel the insolvent insurer's policies on \u003cstrong>10 days' written notice\u003c/strong>. \u003ccite>[MCL 500.7931(5)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Assessments:\u003c/strong> members are assessed in proportion to their net direct written premium, separately for 5 categories. \u003ccite>[MCL 500.7941(1)–(2)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe categories are: workers' compensation; automobile; title; fire/allied/farmowners/homeowners/inland marine/earthquake/credit; and all other lines except life and disability.\n\u003c/li>\u003cli>\nMembers get at least 30 days' notice before an assessment is due.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nNo member may be assessed more than \u003cstrong>1% of its prior-year net direct written premium\u003c/strong> in a calendar year. Assessments are recognized in ratemaking. \u003ccite>[MCL 500.7941(3)–(4)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Stay of court proceedings:\u003c/strong> court proceedings involving the insolvent insurer are stayed for \u003cstrong>6 months\u003c/strong> after the receiver is appointed. \u003ccite>[MCL 500.7945(1)]\u003c/cite>\n\u003c/li>\u003cli>\nThe association is exempt from state and local taxes and fees except property taxes. \u003ccite>[MCL 500.7947]\u003c/cite>\n\u003c/li>\u003cli>\nMembers, the association, its agents and employees, and the commissioner have no liability for actions taken under the chapter. \u003ccite>[MCL 500.7948]\u003c/cite>\n\u003c/li>\u003cli>\nThe association is subject to the commissioner's regulation. A member may appeal an association action to the commissioner within \u003cstrong>30 days\u003c/strong>. \u003ccite>[MCL 500.7949]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Mandatory Fire Policy Provisions (MCL 500.2833)\u003c/h3>\n\u003cul>\n\u003cli>\nThe prescribed \"standard fire policy\" form (former 500.2832) was repealed effective Jan 1, 1992. \u003ccite>[MCL 500.2832]\u003c/cite>\n\u003c/li>\u003cli>\nEvery fire policy must still contain the provisions in 500.2833(1) and at least the coverage of the former standard fire policy. \u003ccite>[MCL 500.2833(2)]\u003c/cite>\n\u003c/li>\u003cli>\nRequired provisions under MCL 500.2833(1): \u003ccite>[MCL 500.2833(1)(a)–(s)]\u003c/cite>\n\u003cul>\n\u003cli>\n(a) minimum coverage is the \u003cstrong>actual cash value\u003c/strong> of the property at the time of loss;\n\u003c/li>\u003cli>\n(b) minimum coverage is direct loss by \u003cstrong>fire and lightning\u003c/strong>, plus \u003cstrong>pro rata coverage for 5 days\u003c/strong> for property moved to another location to protect it from a covered peril;\n\u003c/li>\u003cli>\n(c) the policy may be void for misrepresentation, fraud or concealment;\n\u003c/li>\u003cli>\n(d) a statement of the property not covered;\n\u003c/li>\u003cli>\n(e) a statement of the perils not covered;\n\u003c/li>\u003cli>\n(f) the conditions that suspend or restrict the insurance;\n\u003c/li>\u003cli>\n(g) how a provision may be waived or changed;\n\u003c/li>\u003cli>\n(h) the \u003cstrong>insured may cancel at any time\u003c/strong>; the minimum earned premium is the \u003cstrong>greater of pro rata or $25\u003c/strong>;\n\u003c/li>\u003cli>\n(i) the \u003cstrong>insurer may cancel\u003c/strong> by mailing at least \u003cstrong>10 days'\u003c/strong> written notice to each named insured; the minimum earned premium is the greater of pro rata or $25, and any untendered excess is refunded on demand;\n\u003c/li>\u003cli>\n(j) mortgagee provisions (see below);\n\u003c/li>\u003cli>\n(k) the insurer pays no more than its \u003cstrong>pro rata share\u003c/strong> with other insurance;\n\u003c/li>\u003cli>\n(l) notice requirements after a loss;\n\u003c/li>\u003cli>\n(m) appraisal (see below);\n\u003c/li>\u003cli>\n(n) the insurer may repair, replace, rebuild or take the property;\n\u003c/li>\u003cli>\n(o) \u003cstrong>no abandonment\u003c/strong> of property to the insurer;\n\u003c/li>\u003cli>\n(p) loss is payable \u003cstrong>within 30 days after the insurer receives proof of the amount of loss\u003c/strong>, except as provided in 500.2845;\n\u003c/li>\u003cli>\n(q) suit is allowed only after complying with the policy; suit must begin \u003cstrong>within 1 year after the loss or within the period stated in the policy, whichever is longer\u003c/strong>; the time is \u003cstrong>tolled\u003c/strong> from when the insured notifies the insurer of the loss until the insurer formally denies liability;\n\u003c/li>\u003cli>\n(r) the insurer is subrogated to the insured's rights of recovery;\n\u003c/li>\u003cli>\n(s) the policy takes effect at \u003cstrong>12:01 a.m. standard time\u003c/strong> at the property's location.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Mortgagee (j):\u003c/strong> \u003ccite>[MCL 500.2833(1)(j)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe insurer may cancel the mortgagee's interest on \u003cstrong>10 days'\u003c/strong> written notice.\n\u003c/li>\u003cli>\nIf the insured fails to file proof of loss, the mortgagee must file it \u003cstrong>within 60 days\u003c/strong> after notice.\n\u003c/li>\u003cli>\nIf the insurer claims no liability to the owner, it is subrogated to the mortgagee's rights to the extent it pays the mortgagee. Alternatively, it may pay off the mortgage and take an assignment.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Payment exception (500.2845):\u003c/strong> on a fire or explosion loss to real property, when the final settlement exceeds 49% of the insurance, the insurer withholds \u003cstrong>25%\u003c/strong> of the ACV or final settlement, whichever is less. \u003ccite>[MCL 500.2845(1),(15)]\u003c/cite>\n\u003cul>\n\u003cli>\nFor residential property the withholding is capped at $12,000, CPI-adjusted from 2015.\n\u003c/li>\u003cli>\nThis applies only in participating cities, villages and townships, which can escrow the money to make sure the site is repaired or cleared.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch3>Appraisal (MCL 500.2833(1)(m))\u003c/h3>\n\u003cul>\n\u003cli>\nIf the insured and insurer disagree on ACV or the amount of loss, either party may make a \u003cstrong>written demand\u003c/strong> for appraisal. \u003ccite>[MCL 500.2833(1)(m)]\u003c/cite>\n\u003c/li>\u003cli>\nEach party picks a competent, \u003cstrong>independent\u003c/strong> appraiser and identifies that appraiser to the other side \u003cstrong>within 20 days\u003c/strong> after receiving the demand. \u003ccite>[MCL 500.2833(1)(m)]\u003c/cite>\n\u003c/li>\u003cli>\nThe two appraisers pick an impartial \u003cstrong>umpire\u003c/strong>. If they cannot agree \u003cstrong>within 15 days\u003c/strong>, either party may ask a \u003cstrong>circuit court judge\u003c/strong> in the county where the loss occurred or the property is located to choose one. \u003ccite>[MCL 500.2833(1)(m)]\u003c/cite>\n\u003c/li>\u003cli>\nHow the amount is set: \u003ccite>[MCL 500.2833(1)(m)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe appraisers set ACV and the amount of loss item by item.\n\u003c/li>\u003cli>\nA written agreement between the two appraisers sets the loss.\n\u003c/li>\u003cli>\nIf they cannot agree, they submit their differences to the umpire, and \u003cstrong>any 2 of the 3\u003c/strong> can set the loss in writing.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Each party pays its own appraiser.\u003c/strong> The umpire and the other appraisal expenses are split \u003cstrong>equally\u003c/strong>. \u003ccite>[MCL 500.2833(1)(m)]\u003c/cite>\n\u003c/li>\u003cli>\nThe ISO HO and DP forms use the same 20-day and 15-day steps. Their umpire is chosen by \"a judge of a court of record in the state where the residence premises is located.\" \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. F; ISO DP 00 03 12 02, Cond. G]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Cancellation and Nonrenewal (MCL 500.2123, 500.3020)\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Home and auto insurance (Essential Insurance Act):\u003c/strong> a \"termination\" is a refusal to continue to insure for any reason other than nonpayment. \u003ccite>[MCL 500.2104(5), 500.2123(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nTermination requires \u003cstrong>at least 30 days'\u003c/strong> written notice, delivered or mailed to the named insured.\n\u003c/li>\u003cli>\nThe notice must state the effective date and \u003cstrong>each specific reason\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nA termination notice mailed or delivered \u003cstrong>within the first 55 days\u003c/strong> after a policy is first issued can take effect \u003cstrong>not less than 20 days\u003c/strong> after it is mailed. \u003ccite>[MCL 500.2123(2)]\u003c/cite>\n\u003c/li>\u003cli>\nA termination for \u003cstrong>nonpayment of premium\u003c/strong> takes effect as provided in the policy. \u003ccite>[MCL 500.2123(3)]\u003c/cite>\n\u003c/li>\u003cli>\nA termination is effective only if its reasons conform to the insurer's underwriting rules. \u003ccite>[MCL 500.2123(4)]\u003c/cite>\n\u003c/li>\u003cli>\nSection 2123 does not authorize terminating auto insurance in violation of chapter 32. \u003ccite>[MCL 500.2123(5)]\u003c/cite>\n\u003c/li>\u003cli>\nWhere other parts of the Code conflict with chapter 21, chapter 21 governs auto and home insurance. \u003ccite>[MCL 500.2106(4)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Casualty policies (all classes except workers' comp and mortgage guaranty), including motor vehicle coverage:\u003c/strong> \u003ccite>[MCL 500.3020(1)(a)–(c)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe insured may cancel at any time and receives a pro rata refund.\n\u003c/li>\u003cli>\nThe insurer may cancel with \u003cstrong>not less than 10 days'\u003c/strong> written notice.\n\u003c/li>\u003cli>\nMinimum earned premium is the greater of pro rata or \u003cstrong>$25\u003c/strong>, except for auto.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nAn insurer may refuse to renew a \u003cstrong>malpractice\u003c/strong> policy only with \u003cstrong>not less than 60 days'\u003c/strong> written notice. \u003ccite>[MCL 500.3020(1)(d)]\u003c/cite>\n\u003c/li>\u003cli>\nCancellation does not affect claims that arose before it. Mailing the notice is prima facie proof of notice, and delivery counts the same as mailing. \u003ccite>[MCL 500.3020(5)]\u003c/cite>\n\u003c/li>\u003cli>\nThe ISO HO and DP forms' own cancellation terms (Michigan law overrides them where it differs): \u003ccite>[ISO HO 00 03 05 11, Secs. I &amp; II Cond. C–D]\u003c/cite>\n\u003cul>\n\u003cli>\n10 days for nonpayment;\n\u003c/li>\u003cli>\n10 days for any reason during the first 60 days of a new policy;\n\u003c/li>\u003cli>\nafter 60 days, only for material misrepresentation or substantial change in risk, with 30 days' notice;\n\u003c/li>\u003cli>\nnonrenewal on 30 days' notice.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch3>Terrorism Risk Insurance Program (15 U.S.C. 6701 note; P.L. 107-297, 109-144, 110-160, 114-1, 116-94)\u003c/h3>\n\u003cul>\n\u003cli>\nThe program was created by TRIA, P.L. 107-297, signed Nov 26, 2002. \u003ccite>[home.treasury.gov TRIP page]\u003c/cite>\n\u003c/li>\u003cli>\nIt has been extended four times: \u003ccite>[home.treasury.gov TRIP page]\u003c/cite>\n\u003cul>\n\u003cli>\nP.L. 109-144 (TRIEA, 2005), through 12/31/2007;\n\u003c/li>\u003cli>\nP.L. 110-160 (TRIPRA, 2007), through 12/31/2014;\n\u003c/li>\u003cli>\nP.L. 114-1 (2015), through 12/31/2020;\n\u003c/li>\u003cli>\nP.L. 116-94 (2019), through \u003cstrong>December 31, 2027\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>The program terminates December 31, 2027\u003c/strong> under current law. \u003ccite>[TRIA §108(a), 15 U.S.C. 6701 note]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Certification:\u003c/strong> the \u003cstrong>Secretary of the Treasury\u003c/strong> certifies an act of terrorism, \u003cstrong>in consultation with the Secretary of Homeland Security and the Attorney General\u003c/strong>. \u003ccite>[TRIA §102(1)(A)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe act must be violent or dangerous to human life, property or infrastructure.\n\u003c/li>\u003cli>\nIt must cause damage in the U.S. (or to a U.S. air carrier, U.S. vessel or U.S. mission abroad).\n\u003c/li>\u003cli>\nIt must be committed to coerce the U.S. civilian population or influence U.S. government policy.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nNo act may be certified if it is part of a \u003cstrong>war declared by Congress\u003c/strong> (workers' comp excepted), or if aggregate P&amp;C losses \u003cstrong>do not exceed $5,000,000\u003c/strong>. Certification decisions are final and not subject to judicial review. \u003ccite>[TRIA §102(1)(B)–(C)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Insurer deductible\u003c/strong> = \u003cstrong>20%\u003c/strong> of the insurer's direct earned premium for the \u003cstrong>preceding calendar year\u003c/strong>. \u003ccite>[TRIA §102(7)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Federal share\u003c/strong> = \u003cstrong>80%\u003c/strong> of insured losses above the insurer deductible. It was 85% before 2016 and dropped 1 point a year until it reached 80% in 2020. \u003ccite>[TRIA §103(e)(1)(A)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Program trigger:\u003c/strong> no federal payment unless aggregate industry insured losses from certified acts exceed \u003cstrong>$200,000,000\u003c/strong> (calendar year 2020 and later). \u003ccite>[TRIA §103(e)(1)(B)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Cap:\u003c/strong> neither the Treasury nor an insurer that has met its deductible pays any part of annual aggregate insured losses above \u003cstrong>$100,000,000,000\u003c/strong>. \u003ccite>[TRIA §103(e)(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Mandatory availability:\u003c/strong> each insurer must make terrorism coverage available in all of its P&amp;C policies, on terms that do not differ materially from its other coverage. \u003ccite>[TRIA §103(c)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Required disclosure:\u003c/strong> the insurer must clearly and conspicuously disclose the terrorism premium (as a separate line item) and the federal share. Since 2007 it must also disclose the $100 billion cap at offer, purchase and renewal. \u003ccite>[TRIA §103(b)(2)–(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Lines covered:\u003c/strong> commercial P&amp;C, including \u003cstrong>workers' compensation\u003c/strong>, excess, and \u003cstrong>D&amp;O\u003c/strong>. \u003ccite>[TRIA §102(11)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Lines excluded:\u003c/strong> \u003ccite>[TRIA §102(11)]\u003c/cite>\n\u003cul>\n\u003cli>\ncommercial auto;\n\u003c/li>\u003cli>\nburglary and theft;\n\u003c/li>\u003cli>\nsurety;\n\u003c/li>\u003cli>\nprofessional liability;\n\u003c/li>\u003cli>\nfarmowners multiple peril;\n\u003c/li>\u003cli>\ncrop;\n\u003c/li>\u003cli>\nmortgage and title;\n\u003c/li>\u003cli>\nfinancial guaranty;\n\u003c/li>\u003cli>\nmedical malpractice;\n\u003c/li>\u003cli>\nhealth and life;\n\u003c/li>\u003cli>\nNFIP flood;\n\u003c/li>\u003cli>\nreinsurance.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nParticipation is mandatory for every entity that meets the definition of \"insurer.\" \u003ccite>[TRIA §103(a)(3)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Termination of Authority to Represent Insurer (MCL 500.1209)\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Servicing after termination:\u003c/strong> when a producer's authority ends, a producer with property rights in the renewals stays responsible until existing policies are canceled, replaced or expire. \u003ccite>[MCL 500.1209(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe written agency agreement governs what the producer may do after notice of termination.\n\u003c/li>\u003cli>\nIf the agreement is silent, the producer may \u003cstrong>service existing policies\u003c/strong> but may \u003cstrong>not bind new risks, renew policies, or increase the insurer's obligation\u003c/strong> without the insurer's approval.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nAn insurer \u003cstrong>may not cancel or nonrenew a policy because the producer's contract was terminated\u003c/strong>. \u003ccite>[MCL 500.1209(1)]\u003c/cite>\n\u003c/li>\u003cli>\nSubsection (1) does not apply in these cases: \u003ccite>[MCL 500.1209(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nlife insurers and their producers;\n\u003c/li>\u003cli>\nemployee producers;\n\u003c/li>\u003cli>\ncaptive (single-insurer or single-group) producers, if the insurer owns the renewals and the change does not cancel or nonrenew any policy.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Auto and home producers may be terminated only for these reasons:\u003c/strong> \u003ccite>[MCL 500.1209(2)]\u003c/cite>\n\u003cul>\n\u003cli>\n(a) malfeasance;\n\u003c/li>\u003cli>\n(b) breach of fiduciary duty or trust;\n\u003c/li>\u003cli>\n(c) violation of the Insurance Code;\n\u003c/li>\u003cli>\n(d) failure to perform under the contract;\n\u003c/li>\u003cli>\n(e) \u003cstrong>fewer than 25 home and auto applications in the preceding 12 months\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nA termination may not be based \u003cstrong>primarily\u003c/strong> on any of these: \u003ccite>[MCL 500.1209(3)]\u003c/cite>\n\u003cul>\n\u003cli>\nthe \u003cstrong>geographic location\u003c/strong> of the producer's business;\n\u003c/li>\u003cli>\nloss experience tied to that location;\n\u003c/li>\u003cli>\nthe producer's performance of Essential Insurance Act (chapter 21) duties.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe insurer must notify the Director within 30 days after a termination takes effect. It must mail a copy to the producer within 15 days of notifying the Director (certified mail if the termination is for cause). The producer may file comments within 30 days. \u003ccite>[MCL 500.1208b(1),(2),(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Essential Insurance Act (MCL 500.2101–.2131)\u003c/h3>\n\u003ch4>Scope and purpose\u003c/h4>\n\u003cul>\n\u003cli>\nChapter 21 was added by 1979 PA 145. Sections 2101–2105, 2107 and 2131 took effect Jan 1, 1980; the rest of the chapter took effect Jan 1, 1981. \u003ccite>[MCL 500.2131]\u003c/cite>\n\u003c/li>\u003cli>\nAn auto or home policy may not be offered, bound, issued, delivered or renewed in Michigan unless it conforms to chapter 21. \u003ccite>[MCL 500.2105(1)]\u003c/cite>\n\u003c/li>\u003cli>\nHow the chapter works: insurers may refuse, nonrenew or limit coverage for an \u003cstrong>eligible person\u003c/strong> only under written underwriting rules limited to the criteria the statute allows. This is what makes home and auto coverage available to eligible persons. \u003ccite>[MCL 500.2117(1), 500.2118(1), 500.2119]\u003c/cite>\n\u003c/li>\u003cli>\nStatute does not have a separate \"purpose\" section. The availability purpose is inferred from 2117 and 2118. \u003ccite>[MCL 500.2101–.2131 (all sections reviewed)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Definitions\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>\"Home insurance\"\u003c/strong> means fire insurance on the insured's eligible dwelling, plus other nonbusiness insurance included in or endorsed to it. It does not include commercial, industrial, professional or business property or liability. \u003ccite>[MCL 500.2103(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>\"Eligible person,\" home insurance:\u003c/strong> an owner-occupant or tenant of a house, condominium unit, cooperative unit, room or apartment, or the \u003cstrong>owner-occupant of a multiple-unit dwelling of not more than 4 units\u003c/strong>. \u003ccite>[MCL 500.2103(2)]\u003c/cite>\n\u003c/li>\u003cli>\nA person is \u003cstrong>not\u003c/strong> an eligible person for home insurance if any of the following applies: \u003ccite>[MCL 500.2103(2)(a)–(k)]\u003c/cite>\n\u003cul>\n\u003cli>\nconvicted of arson, conspiracy to commit arson, or certain related crimes within the preceding \u003cstrong>5 years\u003c/strong>;\n\u003c/li>\u003cli>\nhad a home insurance claim \u003cstrong>successfully denied within 5 years\u003c/strong> for arson or fraud;\n\u003c/li>\u003cli>\nthe dwelling is used for an \u003cstrong>illegal or demonstrably hazardous\u003c/strong> purpose;\n\u003c/li>\u003cli>\nrefuses to buy at least \u003cstrong>80% of replacement cost\u003c/strong> under a replacement cost policy;\n\u003c/li>\u003cli>\nrefuses to buy \u003cstrong>100% of market value\u003c/strong> under a repair cost policy;\n\u003c/li>\u003cli>\nrefuses to buy \u003cstrong>100% of ACV\u003c/strong> under a tenant policy;\n\u003c/li>\u003cli>\nhad a policy \u003cstrong>canceled for nonpayment within 2 years\u003c/strong>, unless the premium is paid in full;\n\u003c/li>\u003cli>\nthe insured value is \u003cstrong>below $15,000\u003c/strong> (repair cost policy) or \u003cstrong>below $35,000\u003c/strong> (replacement cost policy; the director may change the latter by rule);\n\u003c/li>\u003cli>\nthe dwelling has physical conditions that clearly present an \u003cstrong>extreme likelihood of a significant loss\u003c/strong>;\n\u003c/li>\u003cli>\n\u003cstrong>property taxes are delinquent 2 or more years\u003c/strong>;\n\u003c/li>\u003cli>\nfails to keep a uniformly required club or group membership.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>\"Eligible person,\" auto insurance:\u003c/strong> an owner or registrant of a Michigan-registered vehicle, or a Michigan licensed driver. \u003ccite>[MCL 500.2103(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nExcluded, for example: suspended or revoked license; more than \u003cstrong>6 insurance eligibility points\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>\"Declination\"\u003c/strong> means any of these: \u003ccite>[MCL 500.2102(4)]\u003c/cite>\n\u003cul>\n\u003cli>\nan agent refuses to submit an application;\n\u003c/li>\u003cli>\nan insurer refuses to issue a policy;\n\u003c/li>\u003cli>\nthe applicant is offered insurance at higher rates through a different insurer than the one requested;\n\u003c/li>\u003cli>\nthe applicant is offered less favorable terms than requested.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>\"Repair cost policy\":\u003c/strong> home coverage based substantially on \u003cstrong>market value\u003c/strong>, paying to repair with like kind and quality or with conventional materials and methods. \u003ccite>[MCL 500.2104(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>\"Replacement cost policy\":\u003c/strong> coverage based substantially on replacement cost. \u003ccite>[MCL 500.2104(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>\"Termination\"\u003c/strong> includes moving an insured to an affiliate at higher rates or with less coverage unless the insured asked for it. It also includes offering less favorable terms than before. \u003ccite>[MCL 500.2104(5)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>\"Underwriting rules\"\u003c/strong> are the insurer's written standards for issuing, refusing, renewing or limiting coverage. They must be phrased so a person of ordinary intelligence can understand them. \u003ccite>[MCL 500.2104(6)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Home insurance underwriting (MCL 500.2117)\u003c/h4>\n\u003cul>\n\u003cli>\nAs a condition of keeping its certificate of authority, an insurer may not refuse, nonrenew, or limit home insurance for an eligible person except under underwriting rules allowed by 2117 and 2119. \u003ccite>[MCL 500.2117(1)]\u003c/cite>\n\u003c/li>\u003cli>\nHome underwriting rules may be based \u003cstrong>only\u003c/strong> on the following: \u003ccite>[MCL 500.2117(2)]\u003c/cite>\n\u003cul>\n\u003cli>\n(a) criteria identical to the 2103(2) eligibility standards;\n\u003c/li>\u003cli>\n(b) \u003cstrong>physical condition\u003c/strong> of the property, using objective rules tied to the insured perils and based on specific codes or standards, \u003cstrong>without regard to the age of the structure\u003c/strong>; a certificate of compliance from a government agency creates a rebuttable presumption that the dwelling meets the insurer's physical-condition rules;\n\u003c/li>\u003cli>\n(c) \u003cstrong>for renewal\u003c/strong>, the claim history in the preceding \u003cstrong>3 years\u003c/strong>, but only claims arising from the insured's negligence, or the insured's failure to correct a physical condition after written notice;\n\u003c/li>\u003cli>\n(d) the relationship between market value and replacement cost, but only if the insurer offers a repair cost policy;\n\u003c/li>\u003cli>\n(e) \u003cstrong>for nonrenewal\u003c/strong>, paid-claim history excluding liability claims: \u003cstrong>3 paid claims in 3 years\u003c/strong> totaling at least \u003cstrong>$3,000\u003c/strong> excluding weather claims, or at least \u003cstrong>$4,000\u003c/strong> including weather claims;\n\u003cul>\n\u003cli>\nThe dollar figures are base amounts, CPI-adjusted on Jan 1, 2006 and every 6th year after.\n\u003c/li>\u003cli>\nAn insurer may also use a 3-claim rule for insureds who have been with it continuously for a period it sets between 5 and 10 years.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n(f) a number of residences that is inconsistent with the insurer's approved forms;\n\u003c/li>\u003cli>\n(g) a dwelling \u003cstrong>unoccupied more than 60 days\u003c/strong> with evidence of intent to vacate;\n\u003c/li>\u003cli>\n(h) an \u003cstrong>adjacent physical hazard\u003c/strong> that causes a significant risk of loss; neighboring residential property and traffic patterns do not count;\n\u003c/li>\u003cli>\n(i) failure to buy more than 80% of replacement cost, if that is a condition of sale and the insurer also offers an 80% replacement cost form;\n\u003c/li>\u003cli>\n(j) threats, harassment or physical assault on insurer or agency staff, if reported to law enforcement.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Repair cost policy rules:\u003c/strong> \u003ccite>[MCL 500.2117(3)–(4)]\u003c/cite>\n\u003cul>\n\u003cli>\nIt must be substantially equivalent to the insurer's replacement cost policy, and at least equivalent to the HO-2 replacement cost policy of the principal rating organization as of Oct 1, 1979.\n\u003c/li>\u003cli>\nIts premium may not exceed \u003cstrong>105%\u003c/strong> of the premium for 80% of replacement cost under the equivalent replacement cost policy.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Other underwriting and notice rules\u003c/h4>\n\u003cul>\n\u003cli>\nAll underwriting rules must be \u003cstrong>in writing\u003c/strong> and applied \u003cstrong>uniformly\u003c/strong> throughout the state. \u003ccite>[MCL 500.2119(1)–(2)]\u003c/cite>\n\u003cul>\n\u003cli>\nThey are filed with the commissioner for information before use and are open to public inspection.\n\u003c/li>\u003cli>\nRules for new applicants may differ from renewal rules only for persons who are not eligible persons.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nEvery rate filing must state that the insurer will not refuse, nonrenew, or limit coverage because of \u003cstrong>the location of the risk\u003c/strong>. That practice is \u003cstrong>redlining\u003c/strong>, and it is prohibited. \u003ccite>[MCL 500.2108(8)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Inspections:\u003c/strong> the criteria for choosing which dwellings to inspect may not be based on these factors: \u003ccite>[MCL 500.2121(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nrace, color, creed or national origin;\n\u003c/li>\u003cli>\nmarital status or sex;\n\u003c/li>\u003cli>\nresidence or age;\n\u003c/li>\u003cli>\ndisability or lawful occupation.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nAdd: \"An insurer may use additional factors if consistent with the act's purposes and reflecting anticipated loss or expense differences \u003ccite>[MCL 500.2111(9)]\u003c/cite>.\" \u003ccite>[MCL 500.2111(7)–(8)]\u003c/cite>\n\u003cul>\n\u003cli>\namount and type of coverage;\n\u003c/li>\u003cli>\nsecurity and safety devices;\n\u003c/li>\u003cli>\nrepairable structural defects;\n\u003c/li>\u003cli>\nfire protection class;\n\u003c/li>\u003cli>\nconstruction;\n\u003c/li>\u003cli>\nloss experience the insured controls;\n\u003c/li>\u003cli>\nsmoking materials;\n\u003c/li>\u003cli>\ndistance from a hydrant;\n\u003c/li>\u003cli>\navailability of law enforcement or crime prevention services.\n\u003c/li>\u003cli>\nHome risks may also be grouped by territory.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nInsurers may offer a home insurance discount to seniors \u003cstrong>55 or older\u003c/strong>, applied uniformly. \u003ccite>[MCL 500.2111d]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Declination:\u003c/strong> the insurer or agent must give the applicant \u003cstrong>each specific reason\u003c/strong>. \u003ccite>[MCL 500.2122(1)–(2)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe explanation must be in writing if the application was in writing.\n\u003c/li>\u003cli>\nIf the application was oral, the reasons may be given orally, with a written explanation offered if the applicant requests it \u003cstrong>within 90 days\u003c/strong>.\n\u003c/li>\u003cli>\nRefusing to provide an application form counts as a declination.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Dispute process:\u003c/strong> a person who believes coverage was improperly denied or the premium is wrong is entitled to a private, informal, \u003cstrong>managerial-level conference\u003c/strong> with the insurer. \u003ccite>[MCL 500.2113]\u003c/cite>\n\u003cul>\n\u003cli>\nIf the insurer does not provide the conference and a proposed resolution \u003cstrong>within 30 days\u003c/strong>, or the person disagrees with the result, the person may get a determination from the commissioner.\n\u003c/li>\u003cli>\nEither side may then request a contested-case hearing.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Agent duties (a condition of licensure):\u003c/strong> for each eligible person, the agent must: \u003ccite>[MCL 500.2116(1)]\u003c/cite>\n\u003cul>\n\u003cli>\ngive a premium quotation for the coverages the agent's insurers offer;\n\u003c/li>\u003cli>\ndisclose how many insurers the agent represents;\n\u003c/li>\u003cli>\nnot channel the person away from a coverage or insurer;\n\u003c/li>\u003cli>\nsubmit an application on request.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nInsurers may not pay an agent less because of the agent's loss experience or geographic location. \u003ccite>[MCL 500.2116(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Annual notice:\u003c/strong> at least once a year, with a renewal notice or bill, the insurer must tell the policyholder that rating classification information and appeal rights are available on request. \u003ccite>[MCL 500.2112(1)]\u003c/cite>\n\u003c/li>\u003cli>\nPeople who give reasons for a cancellation, nonrenewal or declination are immune from civil liability unless they act with gross negligence or bad faith with malice. \u003ccite>[MCL 500.2124]\u003c/cite>\n\u003c/li>\u003cli>\nAn insurer may suspend acceptance of \u003cstrong>all\u003c/strong> new home or auto applications by filing a notice with the commissioner. The commissioner may disapprove it after a hearing. \u003ccite>[MCL 500.2126]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Michigan Basic Property Insurance Association (FAIR plan) (MCL 500.2901–.2954)\u003c/h3>\n\u003cul>\n\u003cli>\nEvery insurer writing property lines in Michigan must be a member of the pool, as a condition of its authority. \u003ccite>[MCL 500.2920(1)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Governance:\u003c/strong> the board has 13 governors serving 1-year terms. \u003ccite>[MCL 500.2921(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe commissioner appoints 4: 2 agent representatives and 2 public representatives.\n\u003c/li>\u003cli>\nParticipating members elect the other 9.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\"Basic property insurance\" means: \u003ccite>[MCL 500.2901(a)]\u003c/cite>\n\u003cul>\n\u003cli>\nfire with extended coverage and vandalism and malicious mischief;\n\u003c/li>\u003cli>\ncertain burglary and robbery coverages.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe pool also writes \u003cstrong>home insurance\u003c/strong>. \u003ccite>[MCL 500.2901(e)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Qualified property\u003c/strong> (basic property insurance): \u003ccite>[MCL 500.2901(c)]\u003c/cite>\n\u003cul>\n\u003cli>\nnot used for farm purposes;\n\u003c/li>\u003cli>\nmeets building codes;\n\u003c/li>\u003cli>\nnot used for an illegal purpose;\n\u003c/li>\u003cli>\nother conditions in the statute.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Qualified applicant\u003c/strong> (home insurance): excludes anyone who within 5 years was: \u003ccite>[MCL 500.2901(g)]\u003c/cite>\n\u003cul>\n\u003cli>\nconvicted of arson or related crimes; or\n\u003c/li>\u003cli>\nsuccessfully denied a pool claim of more than $2,000 for fraud.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Agents:\u003c/strong> an agent licensed to write these lines for any participating member may write for the pool \u003cstrong>without an additional license\u003c/strong>. The pool sets the commissions. \u003ccite>[MCL 500.2923(1)–(2)]\u003c/cite>\n\u003c/li>\u003cli>\nPool losses on an agent's policies may not be counted in that agent's loss ratio with an insurer. \u003ccite>[MCL 500.2923(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Home insurance underwriting program:\u003c/strong> \u003ccite>[MCL 500.2924(2)]\u003c/cite>\n\u003cul>\n\u003cli>\na replacement cost policy must cover at least \u003cstrong>80% of replacement cost\u003c/strong>, determined by inspection;\n\u003c/li>\u003cli>\na repair cost policy must cover at least \u003cstrong>100% of market value\u003c/strong>, and may cover up to 120%.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Basic property applications:\u003c/strong> \u003ccite>[MCL 500.2925]\u003c/cite>\n\u003cul>\n\u003cli>\nThe property must have been inspected within the preceding \u003cstrong>6 months\u003c/strong>.\n\u003c/li>\u003cli>\nThe applicant must have made a good-faith effort to buy coverage in the regular market.\n\u003c/li>\u003cli>\nThere must be no unpaid prior premium.\n\u003c/li>\u003cli>\nPolicies have a \u003cstrong>1-year term\u003c/strong>.\n\u003c/li>\u003cli>\nBinders may run up to \u003cstrong>60 days\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\n\u003cstrong>Amounts that change over time:\u003c/strong>\n\u003cul>\n\u003cli>\nMPCGA claim cap: $7,980,000 and net worth limit: $39,920,000, both for 1/1/2026–12/31/2026 (Bulletin 2026-04-INS).\n\u003c/li>\u003cli>\nMPCGA maximum unearned premium refund: $2,063 for 7/1/2026–6/30/2027 (Bulletin 2026-13-INS).\n\u003c/li>\u003cli>\nStatutory base amounts are $5,000,000, $25,000,000 and $500. Exam items may use either the base amounts or a current figure.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>TRIA:\u003c/strong>\n\u003cul>\n\u003cli>\nUnder current law the program ends 12/31/2027.\n\u003c/li>\u003cli>\nH.R. 7128 (passed the House June 2026) and S. 4395 (passed the Senate by unanimous consent Sept 28, 2026, per trade press) would extend it to 2034. The House bill would also raise the $5M certification threshold to $10M starting in 2029.\n\u003c/li>\u003cli>\nAs of 10/12/2026 neither bill had been confirmed as enacted. Recheck before the exam.\n\u003c/li>\u003cli>\nThe PSI outline cites only P.L. 107-297, 109-144 and 110-160, so it is outdated.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>500.2117(2)(e) nonrenewal claim thresholds:\u003c/strong> $3,000 and $4,000 are statutory base figures, CPI-adjusted every 6 years since 2006. I could not find the current adjusted amounts.\n\u003c/li>\u003cli>\n\u003cstrong>500.2845 residential withholding cap:\u003c/strong> $12,000 base, CPI-adjusted since 2015. I did not verify the current figure.\n\u003c/li>\u003cli>\n\u003cstrong>Essential Insurance Act purpose:\u003c/strong> there is no express purpose section. The \"availability for eligible persons\" purpose is inferred from 2117 and 2118.\n\u003c/li>\u003cli>\n\u003cstrong>Fire cancellation notice conflict:\u003c/strong> 500.2833(1)(i) allows a 10-day notice for fire policies generally. For home insurance, 500.2123 requires 30 days (20 days during the first 55 days), and chapter 21 controls under 500.2106(4).\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"dwelling","title":"Dwelling Policy","weight":"2.5% · 4 items","secs":["dwelling"],"html":"\u003cp>Editions used:\u003c/p>\n\u003cul>\n\u003cli>\nISO \u003cstrong>DP 00 03 12 02\u003c/strong> (Special Form), checked against DP 00 03 07 14: the numeric provisions are unchanged.\n\u003c/li>\u003cli>\nISO \u003cstrong>DP 00 01 07 88\u003c/strong> (Basic) and \u003cstrong>DP 00 02 07 88\u003c/strong> (Broad).\n\u003c/li>\u003cli>\n\u003cstrong>DL 24 01 12 02\u003c/strong> (Personal Liability Supplement).\n\u003c/li>\u003cli>\n\u003cstrong>DP 04 11 12 02\u003c/strong> (Automatic Increase in Insurance).\n\u003c/li>\u003cli>\n\u003cstrong>DP 11 43 12 02\u003c/strong> (Dwelling Under Construction).\n\u003c/li>\u003cli>\nThe ISO Dwelling Policy Program Manual (© ISO 2003) Rule 510 for theft endorsements.\n\u003c/li>\u003c/ul>\n\u003ch3>Characteristics and Purpose\u003c/h3>\n\u003cul>\n\u003cli>\nThe dwelling forms cover a \u003cstrong>1- to 4-family dwelling\u003c/strong> used principally for dwelling purposes, at the \"Described Location.\" \u003ccite>[ISO DP 00 03 12 02, Coverage A; DP 00 01 07 88, Coverage A]\u003c/cite>\n\u003c/li>\u003cli>\nCoverage applies only to coverages with a limit and perils with a premium shown in the Declarations. \u003ccite>[DP 00 03 12 02, Coverages]\u003c/cite>\n\u003c/li>\u003cli>\nThe forms contain \u003cstrong>no liability or medical payments coverage\u003c/strong>. Those are added with the \u003cstrong>Personal Liability Supplement (DL 24 01)\u003c/strong>. \u003ccite>[DL 24 01 12 02]\u003c/cite>\n\u003c/li>\u003cli>\nThe DP forms define only \"you\" (named insured and resident spouse) and have no HO-style \"insured\" definition. Coverage C still covers personal property of family members residing with you, on the Described Location. \u003ccite>[DP 00 03 12 02, Definitions]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Perils by form:\u003c/strong> \u003ccite>[ISO DP 00 01 07 88; DP 00 02 07 88; DP 00 03 12 02]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>DP-1 Basic\u003c/strong> covers \u003cstrong>fire or lightning\u003c/strong> and \u003cstrong>internal explosion\u003c/strong>. \u003ccite>[DP 00 01 07 88, Perils 1A–1B]\u003c/cite>\n\u003c/li>\u003cli>\nPaying the \u003cstrong>Extended Coverage\u003c/strong> premium adds windstorm or hail, explosion (replacing internal explosion), riot or civil commotion, aircraft, vehicles, smoke, and volcanic eruption. \u003ccite>[DP 00 01 07 88, Perils 2–8]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Vandalism and malicious mischief\u003c/strong> is a separate optional premium. \u003ccite>[DP 00 01 07 88, Peril 9]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>DP-2 Broad\u003c/strong> covers 16 named perils for Coverages A, B and C. \u003ccite>[DP 00 02 07 88, Perils 1–16]\u003c/cite>\n\u003cul>\n\u003cli>\nThe 16 perils: fire or lightning; windstorm or hail; explosion; riot or civil commotion; aircraft; vehicles; smoke; vandalism or malicious mischief; damage by burglars; falling objects; weight of ice, snow or sleet; accidental discharge of water or steam; sudden and accidental tearing apart, cracking, burning or bulging; freezing; artificially generated electrical current; volcanic eruption.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>DP-3 Special\u003c/strong> covers Coverages A and B against \u003cstrong>risk of direct physical loss\u003c/strong> (open perils) unless excluded. Coverage C is covered for the \u003cstrong>named broad perils\u003c/strong>. \u003ccite>[DP 00 03 12 02, Perils Insured Against A–B]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Theft:\u003c/strong> dwelling Coverage C perils include \"\u003cstrong>Damage by Burglars\u003c/strong>\" but \u003cstrong>not theft\u003c/strong>. V&amp;MM excludes pilferage, theft, burglary and larceny. \u003ccite>[DP 00 03 12 02, Coverage C Perils 8–9]\u003c/cite>\n\u003c/li>\u003cli>\nTheft coverage is added by endorsement. \u003ccite>[ISO Dwelling Manual Rule 510]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Property Coverages\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Coverage A – Dwelling\u003c/strong> includes: \u003ccite>[DP 00 03 12 02, Coverage A]\u003c/cite>\n\u003cul>\n\u003cli>\nthe dwelling and attached structures;\n\u003c/li>\u003cli>\nmaterials and supplies for construction or repair;\n\u003c/li>\u003cli>\nbuilding and outdoor equipment used to service the location.\n\u003c/li>\u003cli>\nLand is not covered.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage B – Other Structures:\u003c/strong> separated by clear space. \u003ccite>[DP 00 03 12 02, Coverage B]\u003c/cite>\n\u003cul>\n\u003cli>\nNot covered: structures rented to non-tenants (other than private garages); structures used for commercial, manufacturing or farming purposes; grave markers.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage C – Personal Property:\u003c/strong> property usual to a dwelling, owned or used by you or resident family members, \u003cstrong>while on the Described Location\u003c/strong>. \u003ccite>[DP 00 03 12 02, Coverage C]\u003c/cite>\n\u003c/li>\u003cli>\nWhen property is moved to a newly acquired principal residence, Coverage C applies at each location for \u003cstrong>30 days\u003c/strong>. \u003ccite>[DP 00 03 12 02, Coverage C.3]\u003c/cite>\n\u003c/li>\u003cli>\nCoverage C does not cover: \u003ccite>[DP 00 03 12 02, Coverage C.2]\u003c/cite>\n\u003cul>\n\u003cli>\nmoney and securities;\n\u003c/li>\u003cli>\nanimals;\n\u003c/li>\u003cli>\naircraft and hovercraft;\n\u003c/li>\u003cli>\nmotor vehicles;\n\u003c/li>\u003cli>\nwatercraft other than rowboats and canoes;\n\u003c/li>\u003cli>\ndata;\n\u003c/li>\u003cli>\ncredit cards;\n\u003c/li>\u003cli>\nwater;\n\u003c/li>\u003cli>\ngrave markers.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage D – Fair Rental Value:\u003c/strong> the rental value of the part rented or held for rental, less expenses that do not continue. \u003ccite>[DP 00 03 12 02, Coverage D]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Coverage E – Additional Living Expense:\u003c/strong> the necessary increase in living expenses. Coverage E is in DP-2 and DP-3; DP-1 has no Coverage E. \u003ccite>[DP 00 03 12 02, Coverage E; DP 00 02 07 88; DP 00 01 07 88]\u003c/cite>\n\u003c/li>\u003cli>\nFor both Coverages D and E: \u003ccite>[DP 00 03 12 02, Coverages D–E]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>civil authority\u003c/strong> prohibition of use is covered for up to \u003cstrong>2 weeks\u003c/strong>;\n\u003c/li>\u003cli>\npayment periods are \u003cstrong>not limited by policy expiration\u003c/strong>;\n\u003c/li>\u003cli>\nlease cancellation is not covered.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Other Coverages (DP-3, 12 02 edition unless noted)\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Other Structures:\u003c/strong> up to \u003cstrong>10% of Coverage A\u003c/strong>, as additional insurance. \u003ccite>[DP 00 03 12 02, Other Cov. 1]\u003c/cite>\n\u003cul>\n\u003cli>\nIn DP-1 07 88, this 10% \u003cstrong>reduces\u003c/strong> the Coverage A limit. In DP-2 07 88 it does not. \u003ccite>[DP 00 01 07 88, Other Cov. 1; DP 00 02 07 88, Other Cov. 1]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Debris removal\u003c/strong> is included in the limit for the damaged property. \u003ccite>[DP 00 03 12 02, Other Cov. 2]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Improvements, alterations and additions\u003c/strong> (tenant): up to \u003cstrong>10% of Coverage C\u003c/strong>, additional. \u003ccite>[DP 00 03 12 02, Other Cov. 3]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>World-wide coverage:\u003c/strong> up to \u003cstrong>10% of Coverage C\u003c/strong>. It \u003cstrong>reduces\u003c/strong> Coverage C and does not apply to rowboats and canoes. \u003ccite>[DP 00 03 12 02, Other Cov. 4]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Rental value and ALE:\u003c/strong> up to \u003cstrong>20% of Coverage A\u003c/strong>, additional insurance (12 02 edition). \u003ccite>[DP 00 03 12 02, Other Cov. 5]\u003c/cite>\n\u003cul>\n\u003cli>\nDP-2 07 88: \u003cstrong>10%\u003c/strong> of A, does not reduce A. \u003ccite>[DP 00 02 07 88, Other Cov. 5]\u003c/cite>\n\u003c/li>\u003cli>\nDP-1 07 88: \u003cstrong>10%\u003c/strong> of A for fair rental value only, paid at 1/12 per month; it \u003cstrong>reduces\u003c/strong> A. \u003ccite>[DP 00 01 07 88, Other Cov. 5]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Reasonable repairs\u003c/strong> to protect property; does not increase the limit. \u003ccite>[DP 00 03 12 02, Other Cov. 6]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Property removed:\u003c/strong> covered against direct loss from any cause for \u003cstrong>30 days\u003c/strong> (DP-2 and DP-3). \u003ccite>[DP 00 03 12 02, Other Cov. 7; DP 00 02 07 88, Other Cov. 7]\u003c/cite>\n\u003cul>\n\u003cli>\nDP-1 07 88: \u003cstrong>5 days\u003c/strong>. \u003ccite>[DP 00 01 07 88, Other Cov. 7]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Trees, shrubs and plants\u003c/strong> (DP-2 and DP-3): \u003ccite>[DP 00 03 12 02, Other Cov. 8]\u003c/cite>\n\u003cul>\n\u003cli>\ncovered perils: fire or lightning, explosion, riot or civil commotion, aircraft, non-resident vehicles, and V&amp;MM (not theft);\n\u003c/li>\u003cli>\nlimit \u003cstrong>5% of Coverage A\u003c/strong>, maximum \u003cstrong>$500 per tree\u003c/strong>, additional insurance.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Fire department service charge:\u003c/strong> \u003cstrong>$500\u003c/strong>, additional, \u003cstrong>no deductible\u003c/strong>. \u003ccite>[DP 00 03 12 02, Other Cov. 9]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Collapse\u003c/strong> and \u003cstrong>glass\u003c/strong>: glass breakage is not covered if the dwelling was \u003cstrong>vacant more than 60 consecutive days\u003c/strong> before the loss. \u003ccite>[DP 00 03 12 02, Other Cov. 10–11]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Ordinance or law:\u003c/strong> up to \u003cstrong>10% of Coverage A\u003c/strong>, additional (tenant: 10% of improvements coverage). \u003ccite>[DP 00 03 12 02, Other Cov. 12]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>General Exclusions\u003c/h3>\n\u003cul>\n\u003cli>\nThe DP-3 12 02 excludes, regardless of any concurrent cause: \u003ccite>[DP 00 03 12 02, General Exclusions A.1–9]\u003c/cite>\n\u003cul>\n\u003cli>\nordinance or law;\n\u003c/li>\u003cli>\n\u003cstrong>earth movement\u003c/strong> (ensuing fire or explosion is covered);\n\u003c/li>\u003cli>\n\u003cstrong>water damage\u003c/strong> (flood, sewer backup, subsurface water; ensuing fire or explosion is covered);\n\u003c/li>\u003cli>\npower failure off the location;\n\u003c/li>\u003cli>\nneglect;\n\u003c/li>\u003cli>\nwar;\n\u003c/li>\u003cli>\nnuclear hazard;\n\u003c/li>\u003cli>\n\u003cstrong>intentional loss\u003c/strong>;\n\u003c/li>\u003cli>\ngovernmental action.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe DP-3 also excludes weather conditions that combine with an excluded cause, acts or decisions, and faulty planning, workmanship or maintenance. Any ensuing loss is covered. \u003ccite>[DP 00 03 12 02, General Exclusions B]\u003c/cite>\n\u003c/li>\u003cli>\nUnder DP-3 Coverages A and B, there is \u003cstrong>no coverage\u003c/strong> for these losses: \u003ccite>[DP 00 03 12 02, Perils A.2.c]\u003c/cite>\n\u003cul>\n\u003cli>\ntheft of property not part of a covered building;\n\u003c/li>\u003cli>\nV&amp;MM, theft or attempted theft if the dwelling was \u003cstrong>vacant more than 60 consecutive days\u003c/strong>;\n\u003c/li>\u003cli>\nwind or hail damage to antennas or trees;\n\u003c/li>\u003cli>\n\u003cstrong>constant or repeated seepage\u003c/strong> over weeks, months or years;\n\u003c/li>\u003cli>\nwear and tear;\n\u003c/li>\u003cli>\nmold;\n\u003c/li>\u003cli>\nbirds, vermin and domestic animals.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nDP-1 and DP-2 07 88 used a \u003cstrong>30-day\u003c/strong> vacancy limit for V&amp;MM. \u003ccite>[DP 00 01 07 88, Peril 9; DP 00 02 07 88, Peril 8]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Conditions\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Loss settlement, DP-1:\u003c/strong> \u003cstrong>ACV\u003c/strong>, but not more than the cost to repair or replace. \u003ccite>[DP 00 01 07 88, Cond. 5]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Loss settlement, DP-2 and DP-3:\u003c/strong> \u003ccite>[DP 00 03 12 02, Cond. E]\u003c/cite>\n\u003cul>\n\u003cli>\nPersonal property, awnings, carpeting, appliances and non-building structures are paid at ACV.\n\u003c/li>\u003cli>\n\u003cstrong>Buildings\u003c/strong> are paid at \u003cstrong>replacement cost\u003c/strong> if insured to at least \u003cstrong>80%\u003c/strong> of replacement cost. Below 80%, the insurer pays the greater of ACV or the proportional amount.\n\u003c/li>\u003cli>\nOnly ACV is paid until repairs are complete, unless the loss is under 5% of the insurance and under $2,500.\n\u003c/li>\u003cli>\nThe insured may take ACV first and give notice within \u003cstrong>180 days\u003c/strong> to claim replacement cost.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Duties after loss:\u003c/strong> proof of loss \u003cstrong>within 60 days\u003c/strong> after the insurer's request. \u003ccite>[DP 00 03 12 02, Cond. D.6]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Appraisal:\u003c/strong> 20 days to name appraisers, 15 days for the umpire. \u003ccite>[DP 00 03 12 02, Cond. G]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Other insurance:\u003c/strong> pro rata with other fire insurance. Coverage is excess over a service agreement. \u003ccite>[DP 00 03 12 02, Cond. H]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Suit against us:\u003c/strong> within \u003cstrong>2 years\u003c/strong> after the loss (12 02); within \u003cstrong>1 year\u003c/strong> (07 88). Michigan law requires at least 1 year with tolling. \u003ccite>[DP 00 03 12 02, Cond. J; DP 00 01 07 88, Cond. 11; MCL 500.2833(1)(q)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Loss payment:\u003c/strong> 60 days after proof of loss and agreement, judgment or appraisal award. The \u003cstrong>insurer's option\u003c/strong> to repair or replace requires written notice within \u003cstrong>30 days\u003c/strong> after proof of loss. \u003ccite>[DP 00 03 12 02, Cond. K–L]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Mortgage clause:\u003c/strong> the mortgagee gets \u003cstrong>10 days'\u003c/strong> notice of cancellation or nonrenewal and must file a sworn statement of loss within 60 days after notice. \u003ccite>[DP 00 03 12 02, Cond. N]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Cancellation and nonrenewal:\u003c/strong> same as the HO forms: 10 days (nonpayment, or the first 60 days), 30 days otherwise, nonrenewal 30 days. \u003ccite>[DP 00 03 12 02, Cond. P–Q]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Liberalization:\u003c/strong> a broadening applies if it is implemented within 60 days before or during the policy period. \u003ccite>[DP 00 03 12 02, Cond. R]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>No benefit to bailee.\u003c/strong> \u003ccite>[DP 00 03 12 02, Cond. O]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Volcanic eruptions within 72 hours\u003c/strong> count as one eruption. \u003ccite>[DP 00 03 12 02, Cond. X]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Selected Endorsements\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Special Provisions – Michigan:\u003c/strong> Michigan's state-specific amendatory endorsement for the dwelling program. I could not find or verify the ISO form text (see Flags). It must conform the policy to Michigan law, including these requirements: \u003ccite>[MCL 500.2833(1); MCL 500.2123]\u003c/cite>\n\u003cul>\n\u003cli>\nloss payable within 30 days of proof of the amount of loss;\n\u003c/li>\u003cli>\nsuit within at least 1 year, tolled from notice until denial;\n\u003c/li>\u003cli>\nappraisal umpire chosen by a circuit court judge if the appraisers cannot agree;\n\u003c/li>\u003cli>\nhome insurance termination notice of 30 days (20 days during the first 55 days) with specific reasons.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Automatic Increase in Insurance (DP 04 11):\u003c/strong> Coverage A and B limits increase \u003cstrong>annually\u003c/strong> by the percentage shown, applied \u003cstrong>pro rata\u003c/strong> during the policy period. \u003ccite>[DP 04 11 12 02]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Broad Theft Coverage (DP 04 72):\u003c/strong> for \u003cstrong>owner-occupied\u003c/strong> dwellings, co-op or condo units, and apartments occupied by a tenant who is the named insured. \u003ccite>[ISO Dwelling Manual Rule 510.A.1, 510.A.2]\u003c/cite>\n\u003cul>\n\u003cli>\nCovers theft and V&amp;MM resulting from theft, \u003cstrong>on and off premises\u003c/strong>.\n\u003c/li>\u003cli>\n\u003cstrong>Off-premises coverage is available only if on-premises coverage is bought\u003c/strong>, and its limit may not exceed the on-premises limit.\n\u003c/li>\u003cli>\nThe manual minimum limit is $1,000 each.\n\u003c/li>\u003cli>\n\u003cstrong>Limited Theft Coverage (DP 04 73)\u003c/strong> is for non-owner-occupied risks and covers \u003cstrong>on-premises only\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Dwelling Under Construction (DP 11 43):\u003c/strong> the Coverage A limit is \u003cstrong>provisional\u003c/strong>. \u003ccite>[DP 11 43 12 02]\u003c/cite>\n\u003cul>\n\u003cli>\nOn any date, the amount of insurance equals the provisional limit times the ratio of actual value to completed value.\n\u003c/li>\u003cli>\nThe premium is based on the average amount of insurance during construction.\n\u003c/li>\u003cli>\nThe insured may occupy the dwelling for \u003cstrong>30 days after completion\u003c/strong>, and must advise the insurer at completion.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Personal Liability Supplement (DL 24 01):\u003c/strong> \u003ccite>[DL 24 01 12 02, Coverages L–M, Additional Coverages]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cstrong>Coverage L – Personal Liability\u003c/strong> includes a defense even if the suit is groundless; the duty to defend ends when the limit is exhausted.\n\u003c/li>\u003cli>\n\u003cstrong>Coverage M – Medical Payments to Others\u003c/strong> covers expenses incurred within \u003cstrong>3 years\u003c/strong>; it does not cover you or regular household residents other than residence employees.\n\u003c/li>\u003cli>\nAdditional coverages: claim expenses, including loss of earnings up to \u003cstrong>$250/day\u003c/strong>; first aid; \u003cstrong>damage to property of others up to $1,000\u003c/strong> at replacement cost.\n\u003c/li>\u003cli>\nIts definitions and exclusions mirror HO Section II.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\n\u003cstrong>Editions:\u003c/strong>\n\u003cul>\n\u003cli>\nThe current ISO dwelling forms are the 07 14 editions (DP 00 01/02/03 07 14). I verified DP-3 in both 12 02 and 07 14.\n\u003c/li>\u003cli>\nDP-1 and DP-2 are verified only in the \u003cstrong>07 88\u003c/strong> edition. Some of their values differ in later editions:\n\u003cul>\n\u003cli>\nDP-1 rental value: 10% in 07 88; trade press reports 20% in the newer DP-1.\n\u003c/li>\u003cli>\nVacancy for V&amp;MM: 30 days in 07 88 versus 60 days in DP-3 12 02.\n\u003c/li>\u003cli>\nSuit limit: 1 year versus 2 years.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Special Provisions – Michigan (dwelling):\u003c/strong> NOT FOUND. A study-site cites form \"DP 01 21 04 12\", but I could not verify it or its text. The bullets above describe Michigan statutory requirements, not the endorsement's wording.\n\u003c/li>\u003cli>\n\u003cstrong>Broad Theft (DP 04 72):\u003c/strong> I did not verify the form's internal special sub-limits (money, jewelry and so on). Only the manual rules (eligibility, on/off premises, $1,000 minimum) are verified.\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"ho","title":"Homeowners Policy","weight":"15% · 22 items","secs":["ho"],"html":"\u003cp>Editions used:\u003c/p>\n\u003cul>\n\u003cli>\nISO \u003cstrong>HO 00 03 05 11\u003c/strong>, \u003cstrong>HO 00 04 05 11\u003c/strong> and \u003cstrong>HO 00 06 05 11\u003c/strong> (2011 program, © ISO 2010), read in full.\n\u003c/li>\u003cli>\nHO-2, HO-5 and HO-8 are verified from the \u003cstrong>10 00\u003c/strong> editions (HO 00 02 10 00, HO 00 05 10 00, HO 00 08 10 00) because I could not obtain the 05 11 texts.\n\u003c/li>\u003cli>\nEndorsements:\n\u003cul>\n\u003cli>\nHO 04 90 05 11;\n\u003c/li>\u003cli>\nHO 04 27 04 02;\n\u003c/li>\u003cli>\nHO 04 42 10 00;\n\u003c/li>\u003cli>\nHO 04 54 10 00;\n\u003c/li>\u003cli>\nPF&amp;M (Rough Notes) analyses of HO 04 61, HO 04 97, HO 24 71, HO 24 75, HO 24 82 and HO 07 01.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Edition note:\u003c/strong> all homeowners dollar amounts in this guide and in the practice questions are from the \u003cstrong>05 11 (2011 program)\u003c/strong> forms, and each question names its edition. ISO's 2022 program (HO 00 03 03 22) changed several of these amounts, so a Michigan insurer's current policy may differ. \u003ccite>[ISO HO 00 03 05 11; ISO HO 00 03 03 22]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Coverage Forms\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Eligibility:\u003c/strong> \u003ccite>[The Institutes, AIC 43 excerpt (ISO 2011 HO program)]\u003c/cite>\n\u003cul>\n\u003cli>\nHO-2, HO-3, HO-5 and HO-8 may be issued only to the \u003cstrong>owner-occupant of a 1- to 4-family dwelling\u003c/strong>, and not on farm premises.\n\u003c/li>\u003cli>\n\u003cstrong>HO-4\u003c/strong> is for \u003cstrong>tenants\u003c/strong>, and for owners of buildings that are not 1- or 2-family dwellings.\n\u003c/li>\u003cli>\n\u003cstrong>HO-6\u003c/strong> is for \u003cstrong>condo unit owners and co-op shareholders\u003c/strong>, who need not occupy the unit.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>HO-2 Broad:\u003c/strong> named perils for A, B and C. The 16 perils are the same as the HO-3 Coverage C perils. \u003ccite>[HO 00 02 10 00, Sec. I Perils]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>HO-3 Special:\u003c/strong> \u003ccite>[HO 00 03 05 11, Sec. I Perils A–B]\u003c/cite>\n\u003cul>\n\u003cli>\nCoverages A and B are covered against direct physical loss unless excluded (open perils).\n\u003c/li>\u003cli>\nCoverage C is covered for 16 named perils:\n\u003cul>\n\u003cli>\nfire or lightning;\n\u003c/li>\u003cli>\nwindstorm or hail;\n\u003c/li>\u003cli>\nexplosion;\n\u003c/li>\u003cli>\nriot or civil commotion;\n\u003c/li>\u003cli>\naircraft;\n\u003c/li>\u003cli>\nvehicles;\n\u003c/li>\u003cli>\nsmoke;\n\u003c/li>\u003cli>\nvandalism or malicious mischief;\n\u003c/li>\u003cli>\ntheft;\n\u003c/li>\u003cli>\nfalling objects;\n\u003c/li>\u003cli>\nweight of ice, snow or sleet;\n\u003c/li>\u003cli>\naccidental discharge or overflow of water or steam;\n\u003c/li>\u003cli>\nsudden and accidental tearing apart, cracking, burning or bulging;\n\u003c/li>\u003cli>\nfreezing;\n\u003c/li>\u003cli>\nsudden and accidental damage from artificially generated electrical current;\n\u003c/li>\u003cli>\nvolcanic eruption.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>HO-4 Contents Broad:\u003c/strong> \u003ccite>[HO 00 04 05 11, Sec. I]\u003c/cite>\n\u003cul>\n\u003cli>\nCoverage C (16 named perils) and Coverage D only. There is no Coverage A or B.\n\u003c/li>\u003cli>\nAdditional coverage \u003cstrong>Building Additions and Alterations\u003c/strong>: up to \u003cstrong>10% of C\u003c/strong>.\n\u003c/li>\u003cli>\nTrees: up to \u003cstrong>10% of C\u003c/strong>.\n\u003c/li>\u003cli>\nOrdinance or law: up to \u003cstrong>10% of the Building Additions and Alterations limit\u003c/strong>.\n\u003c/li>\u003cli>\nLoss settlement is \u003cstrong>ACV\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u0
