)"},{"id":"reg-c026","sec":"reg","front":"Twisting","back":"A knowingly misleading representation or incomplete comparison of policies to induce a lapse, surrender or replacement.","source":"MCL 500.2005a(a); 500.2064(2)"},{"id":"reg-c027","sec":"reg","front":"Rebating penalties","back":"License revoked, with no new license for 1 year; misdemeanor fine up to $100 per violation. An insured who accepts a rebate has coverage reduced proportionally plus a fine of up to $100.","source":"MCL 500.2066; 500.2069; 500.2070"},{"id":"reg-c028","sec":"reg","front":"Permitted P&C gift (not a rebate)","back":"Merchandise costing the insurer $50 or less per calendar year.","source":"MCL 500.2024b"},{"id":"reg-c029","sec":"reg","front":"Boycott, coercion, intimidation","back":"Agreeing to or concertedly committing acts that unreasonably restrain the business of insurance is an unfair trade practice.","source":"MCL 500.2012"},{"id":"reg-c030","sec":"reg","front":"Defamation (unfair trade practice)","back":"A false, or maliciously critical or derogatory, statement about the financial condition of a person engaged in the business of insurance (an insurer, agent or agency), calculated to injure that person.","source":"MCL 500.2009"},{"id":"reg-c031","sec":"reg","front":"Premium fiduciary account","back":"Premiums must be segregated, not commingled. Own money only to open the account and pay bank charges. Federally insured institution; may earn interest. Late remittance = prima facie fiduciary violation.","source":"MCL 500.1207(2),(3),(8)"},{"id":"reg-c032","sec":"reg","front":"Fraudulent insurance act penalties","back":"Felony: up to 4 years and/or $50,000, plus restitution. Conspiracy: up to 10 years and/or $50,000.","source":"MCL 500.4511"},{"id":"reg-c033","sec":"reg","front":"Runner, capper, steerer","back":"A person paid by a practitioner to procure clients or patients to obtain insurance benefits or assert claims. Using or acting as one with intent to defraud is a fraudulent insurance act.","source":"MCL 500.4501(h); 500.4503(h)"},{"id":"reg-c034","sec":"reg","front":"Privacy notices (Chapter 5)","back":"Initial notice no later than when the customer relationship is established; annual notice at least once in any 12 consecutive months; a 30-day opt-out window after mailing is reasonable. Never solely oral.","source":"MCL 500.507, .513, .527, .529"},{"id":"reg-c035","sec":"reg","front":"Information security program (data security)","back":"Under the Insurance Data Security chapter (eff. Jan. 20, 2021), a licensee must keep a comprehensive WRITTEN information security program with administrative, technical and physical safeguards. Licensees with fewer than 25 employees, including independent contractors, are exempt from that program requirement. A qualifying cybersecurity event must be reported to the director within 10 business days. Violating chapter 5 (privacy) or its rules is an unfair trade practice.","source":"MCL 500.550, .555(1), .559(1), .565(1); MCL 500.2013; Mich Admin Code R 500.553, .560"}],"numbers":[{"group":"Exam Logistics","item":"Exam fee (PSI)","value":"$41 (nonrefundable; valid 1 year from payment)","source":"PSI CIB eff. 6/10/2025, p.3"},{"group":"Exam Logistics","item":"P&C Producer/Solicitor 16-81 exam","value":"150 items, 2.5 hours, 74% to pass","source":"PSI CIB p.9; DIFS cut score PDF (eff. 5/1/2020)"},{"group":"Exam Logistics","item":"Unscored experimental items","value":"About 10% (generally 1-10), counted against exam time","source":"PSI CIB p.8"},{"group":"Exam Logistics","item":"Cancel or reschedule deadline","value":"2 days before the exam","source":"PSI CIB p.5"},{"group":"Exam Logistics","item":"Arrive early","value":"30 minutes before the scheduled start","source":"PSI CIB p.6"},{"group":"Exam Logistics","item":"Extra-time accommodation fee","value":"$50 per exam (time-and-a-half)","source":"PSI CIB p.5"},{"group":"Exam Logistics","item":"Prelicensing certificate validity","value":"12 months from completion","source":"DIFS PE FAQ; PSI CIB p.2"},{"group":"Exam Logistics","item":"Passing score validity","value":"12 months from pass date","source":"PSI CIB p.2"},{"group":"Exam Logistics","item":"NIPR license application fees","value":"$10 application + $5 transaction","source":"DIFS resident producer page"},{"group":"Exam Logistics","item":"NIPR application validity","value":"180 days from entry into the DIFS database","source":"DIFS resident producer page"},{"group":"Exam Logistics","item":"Remote testing discontinued","value":"New remote registrations ended June 10, 2025","source":"DIFS Remote Examination Discontinuance (6/9/2025)"},{"group":"Licensing & Regulation","item":"Insurer files producer appointment","value":"Within 15 days of contract execution or first application","source":"MCL 500.1208a(3)"},{"group":"Licensing & Regulation","item":"Termination notice to director","value":"Within 30 days after the termination's effective date","source":"MCL 500.1208b(1),(2)"},{"group":"Licensing & Regulation","item":"Auto/home termination for low volume","value":"Fewer than 25 applications in the preceding 12 months","source":"MCL 500.1209(2)(e)"},{"group":"Licensing & Regulation","item":"Controlled business limit","value":"15% of total premium in any 12-month period","source":"MCL 500.1208"},{"group":"Licensing & Regulation","item":"Minimum age for resident producer","value":"18","source":"MCL 500.1205(1)(a)"},{"group":"Licensing & Regulation","item":"Prelicensing hours: combined P&C","value":"40 hours (property, casualty or personal lines alone: 20 each)","source":"MCL 500.1204a(1)(b)"},{"group":"Licensing & Regulation","item":"Exam/PE waiver: prior license","value":"Licensed producer within the preceding 12 months","source":"MCL 500.1204(2)(b)"},{"group":"Licensing & Regulation","item":"Reinstate lapsed license without exam (non-CE lapse)","value":"Within 12 months of the lapse","source":"MCL 500.1206(3)"},{"group":"Licensing & Regulation","item":"Apply as resident after moving to Michigan","value":"Within 90 days of establishing legal residence","source":"MCL 500.1206b(2)"},{"group":"Licensing & Regulation","item":"Temporary producer license","value":"Up to 180 days","source":"MCL 500.1211b(1)"},{"group":"Licensing & Regulation","item":"Change of name or address","value":"Within 30 days","source":"MCL 500.1206(5); 500.1238(1)"},{"group":"Licensing & Regulation","item":"Report administrative action","value":"Within 30 days after final disposition","source":"MCL 500.1247(1)"},{"group":"Licensing & Regulation","item":"Report criminal prosecution","value":"Within 30 days after the initial pretrial hearing date","source":"MCL 500.1247(2)"},{"group":"Licensing & Regulation","item":"CE requirement","value":"24 hours every 2 years, including 3 ethics","source":"MCL 500.1204c(1),(2)"},{"group":"Licensing & Regulation","item":"CE carryover maximum","value":"12 hours (ethics hours not carried as ethics)","source":"MCL 500.1204c(13)"},{"group":"Licensing & Regulation","item":"CE grace period","value":"90 days (service-only; then license canceled)","source":"MCL 500.1204c(11)"},{"group":"Licensing & Regulation","item":"Counselor agreement retention","value":"At least 2 years after services","source":"MCL 500.1236"},{"group":"Licensing & Regulation","item":"Hearing demand after license denial","value":"Within 30 days of written denial","source":"MCL 500.1239(4)"},{"group":"Licensing & Regulation","item":"Felony look-back for mandatory denial","value":"10 years before application (no limit for violent, sexual, or financial/fiduciary felonies)","source":"MCL 500.1239(1)(d),(e)"},{"group":"Licensing & Regulation","item":"Chapter 12 civil fine","value":"$1,000 per violation; $5,000 if knew or should have known; $50,000 max per order","source":"MCL 500.1244(1)(a)"},{"group":"Licensing & Regulation","item":"Violating Chapter 12 cease and desist order","value":"Up to $20,000 per violation; $100,000 max per order","source":"MCL 500.1244(3)"},{"group":"Licensing & Regulation","item":"UTPA civil penalty","value":"$1,000 per violation, $10,000 aggregate; knowing: $5,000 per violation, $50,000 aggregate per 6 months","source":"MCL 500.2038(1)(a)"},{"group":"Licensing & Regulation","item":"Violating UTPA cease and desist order","value":"Up to $20,000 per violation","source":"MCL 500.2040(1)"},{"group":"Licensing & Regulation","item":"Permitted P&C gift","value":"$50 or less (cost to insurer) per calendar year","source":"MCL 500.2024b"},{"group":"Licensing & Regulation","item":"Rebating: license bar after revocation","value":"1 year","source":"MCL 500.2066(2)"},{"group":"Licensing & Regulation","item":"Insured accepting rebate","value":"Coverage reduced proportionally + fine up to $100","source":"MCL 500.2070"},{"group":"Licensing & Regulation","item":"Fraudulent insurance act","value":"Felony: up to 4 years and/or $50,000 + restitution","source":"MCL 500.4511(1)"},{"group":"Licensing & Regulation","item":"Conspiracy to commit insurance fraud","value":"Felony: up to 10 years and/or $50,000","source":"MCL 500.4511(2)"},{"group":"Licensing & Regulation","item":"Privacy annual notice","value":"At least once in any 12 consecutive months","source":"MCL 500.513(1)"},{"group":"Licensing & Regulation","item":"Privacy opt-out window (reasonable)","value":"30 days from mailing","source":"MCL 500.529(2)(a)"},{"group":"Policy Provisions & Claims","item":"Coinsurance formula (ISO BPP)","value":"(Limit carried / (Value at time of loss x Coinsurance %)) x Loss - Deductible; payment capped at the limit","source":"ISO CP 00 10 10 12, F.1"},{"group":"Policy Provisions & Claims","item":"Coinsurance worked example (form Ex. 1)","value":"$250,000 value x 80% = $200,000 required; $100,000 limit -> 0.50 x $40,000 loss = $20,000 - $250 deductible = $19,750","source":"ISO CP 00 10 10 12, F.1 Ex. 1"},{"group":"Policy Provisions & Claims","item":"Contribution by equal shares example","value":"$250,000 claim, limits $100,000 and $300,000: each pays $100,000, then the larger pays the remaining $50,000 (totals $100,000 / $150,000)","source":"ISO CG 00 01 Sec. IV 4.c; IRMI contribution by equal shares"},{"group":"Policy Provisions & Claims","item":"Loss ratio formula","value":"Incurred losses / earned premium (e.g., $50,000 / $100,000 = 50%)","source":"IRMI loss ratio"},{"group":"Policy Provisions & Claims","item":"BPP vacancy period","value":"More than 60 consecutive days","source":"ISO CP 00 10 10 12, E.6.b"},{"group":"Policy Provisions & Claims","item":"BPP vacancy reduction for other covered perils","value":"15% reduction","source":"ISO CP 00 10 10 12, E.6.b(2)"},{"group":"Policy Provisions & Claims","item":"BPP occupancy threshold (owner / general lessee)","value":"At least 31% of total square footage rented and used for customary operations or used by the owner","source":"ISO CP 00 10 10 12, E.6.a(1)(b)"},{"group":"Policy Provisions & Claims","item":"Sworn proof of loss due (HO and BPP)","value":"Within 60 days after the insurer's request","source":"ISO HO 00 03 05 11, Sec. I Cond. C.8; ISO CP 00 10 10 12, E.3.a(7)"},{"group":"Policy Provisions & Claims","item":"BPP loss payment / notice of intentions","value":"Notice of intentions within 30 days after sworn proof of loss; payment within 30 days after sworn proof of loss (with agreement or appraisal award)","source":"ISO CP 00 10 10 12, E.4.c, E.4.g"},{"group":"Policy Provisions & Claims","item":"HO loss payment","value":"60 days after proof of loss and agreement / final judgment / appraisal award; insurer's repair option requires written notice within 30 days","source":"ISO HO 00 03 05 11, Sec. I Conds. I, J"},{"group":"Policy Provisions & Claims","item":"Mortgagee notice of cancellation/nonrenewal (HO base form)","value":"At least 10 days","source":"ISO HO 00 03 05 11, Sec. I Cond. L.3"},{"group":"Policy Provisions & Claims","item":"Liberalization window","value":"CP: revision adopted within 45 days before or during the policy period; HO: implemented within 60 days before or during the policy period","source":"ISO CP 00 90 07 88, E; ISO HO 00 03 05 11, Sections I & II Cond. A"},{"group":"Policy Provisions & Claims","item":"Michigan proof-of-loss specification deadline","value":"Insurer must specify in writing within 30 days after receipt of the claim (unless settled within 30 days)","source":"MCL 500.2006(3)"},{"group":"Policy Provisions & Claims","item":"Michigan timely payment / interest","value":"Paid within 60 days after proof of loss = timely; otherwise 12% per annum simple interest from day 60","source":"MCL 500.2006(3)-(4)"},{"group":"Michigan Property Laws","item":"MPCGA covered-claim cap","value":"$5,000,000 statutory base (CPI-adj.); $7,980,000 for 1/1/2026-12/31/2026; WC and PIP not capped","source":"MCL 500.7925(6); DIFS Bulletin 2026-04-INS"},{"group":"Michigan Property Laws","item":"MPCGA insured net worth limit","value":"$25,000,000 statutory base (CPI-adj.); $39,920,000 for 1/1/2026-12/31/2026","source":"MCL 500.7925(4); DIFS Bulletin 2026-04-INS"},{"group":"Michigan Property Laws","item":"MPCGA max unearned premium","value":"First $500 per person per insolvent insurer, statutory base (CPI-adj.); $2,063 for 7/1/2026-6/30/2027","source":"MCL 500.7925(2)(a); DIFS Bulletin 2026-13-INS"},{"group":"Michigan Property Laws","item":"MPCGA minimum unearned premium refund","value":"No refund under $50","source":"MCL 500.7925(2)(a)"},{"group":"Michigan Property Laws","item":"MPCGA continuation of in-force coverage / claim incurred window","value":"Max 30 days after receiver appointed","source":"MCL 500.7931(4); 500.7925(1)(d)"},{"group":"Michigan Property Laws","item":"MPCGA annual assessment cap","value":"1% of prior-year MI net direct written premium","source":"MCL 500.7941(3)"},{"group":"Michigan Property Laws","item":"Fire policy: removed property coverage","value":"Pro rata for 5 days","source":"MCL 500.2833(1)(b)"},{"group":"Michigan Property Laws","item":"Fire policy: insurer cancellation notice","value":"Not less than 10 days","source":"MCL 500.2833(1)(i)"},{"group":"Michigan Property Laws","item":"Fire policy: minimum earned premium","value":"Greater of pro rata or $25","source":"MCL 500.2833(1)(h)-(i)"},{"group":"Michigan Property Laws","item":"Fire policy: mortgagee proof of loss","value":"Within 60 days after notice","source":"MCL 500.2833(1)(j)"},{"group":"Michigan Property Laws","item":"Appraisal: name appraiser","value":"Within 20 days after written demand","source":"MCL 500.2833(1)(m)"},{"group":"Michigan Property Laws","item":"Appraisal: appraisers agree on umpire","value":"Within 15 days, else circuit court judge","source":"MCL 500.2833(1)(m)"},{"group":"Michigan Property Laws","item":"Fire policy: loss payment","value":"Within 30 days after proof of amount of loss","source":"MCL 500.2833(1)(p)"},{"group":"Michigan Property Laws","item":"Fire policy: suit deadline","value":"1 year after loss or policy period if longer; tolled notice-to-denial","source":"MCL 500.2833(1)(q)"},{"group":"Michigan Property Laws","item":"Fire/explosion withholding (participating municipalities)","value":"25% of ACV or settlement (lesser); residential cap $12,000 base, CPI-adj.; applies when settlement > 49% of insurance","source":"MCL 500.2845(1),(15)"},{"group":"Michigan Property Laws","item":"Home/auto termination notice","value":"At least 30 days","source":"MCL 500.2123(1)"},{"group":"Michigan Property Laws","item":"Termination within first 55 days","value":"Effective not less than 20 days after mailing","source":"MCL 500.2123(2)"},{"group":"Michigan Property Laws","item":"Casualty policy: insurer cancellation / malpractice nonrenewal notice","value":"Not less than 10 days / not less than 60 days","source":"MCL 500.3020(1)(b),(d)"},{"group":"Michigan Property Laws","item":"TRIA program termination (current law)","value":"December 31, 2027","source":"TRIA §108(a)"},{"group":"Michigan Property Laws","item":"TRIA insurer deductible","value":"20% of prior-year direct earned premium","source":"TRIA §102(7)"},{"group":"Michigan Property Laws","item":"TRIA federal share","value":"80% (since 2020)","source":"TRIA §103(e)(1)(A)"},{"group":"Michigan Property Laws","item":"TRIA program trigger","value":"$200,000,000 (2020 and later)","source":"TRIA §103(e)(1)(B)"},{"group":"Michigan Property Laws","item":"TRIA annual cap","value":"$100,000,000,000","source":"TRIA §103(e)(2)"},{"group":"Michigan Property Laws","item":"TRIA certification loss threshold","value":"Must exceed $5,000,000","source":"TRIA §102(1)(B)(ii)"},{"group":"Michigan Property Laws","item":"Producer termination: minimum production","value":"Fewer than 25 home + auto apps in 12 months is a valid reason","source":"MCL 500.1209(2)(e)"},{"group":"Michigan Property Laws","item":"EIA eligible person: max units (owner-occupant)","value":"4 residential units","source":"MCL 500.2103(2)"},{"group":"Michigan Property Laws","item":"EIA home eligibility exclusions (time periods)","value":"Arson conviction 5 yrs; fraud claim denial 5 yrs; nonpayment cancel 2 yrs; taxes delinquent 2+ yrs","source":"MCL 500.2103(2)"},{"group":"Michigan Property Laws","item":"EIA insurance-to-value","value":"80% RC (replacement cost policy); 100% market value (repair cost); 100% ACV (tenant)","source":"MCL 500.2103(2)(d)-(f)"},{"group":"Michigan Property Laws","item":"Nonrenewal claim rule (base amounts)","value":"3 paid claims in 3 yrs totaling $3,000 excl. weather or $4,000 incl. weather (CPI-adj. every 6 yrs)","source":"MCL 500.2117(2)(e)"},{"group":"Dwelling Policy","item":"Other structures (DP-3 12 02)","value":"10% of Coverage A, additional","source":"ISO DP 00 03 12 02, Other Cov. 1"},{"group":"Dwelling Policy","item":"Fair rental value + ALE (DP-3 12 02)","value":"20% of Coverage A, additional","source":"ISO DP 00 03 12 02, Other Cov. 5"},{"group":"Dwelling Policy","item":"World-wide coverage","value":"10% of Coverage C (reduces C)","source":"ISO DP 00 03 12 02, Other Cov. 4"},{"group":"Dwelling Policy","item":"Trees, shrubs, plants (DP-2/DP-3)","value":"5% of A; $500 per tree","source":"ISO DP 00 03 12 02, Other Cov. 8"},{"group":"Dwelling Policy","item":"Fire department service charge","value":"$500, no deductible","source":"ISO DP 00 03 12 02, Other Cov. 9"},{"group":"Dwelling Policy","item":"Property removed","value":"30 days (DP-2/DP-3); 5 days (DP-1 07 88)","source":"ISO DP 00 03 12 02 Other Cov. 7; DP 00 01 07 88 Other Cov. 7"},{"group":"Dwelling Policy","item":"Ordinance or law (DP-2/DP-3, 12 02 and later editions)","value":"10% of Coverage A","source":"ISO DP 00 03 12 02, Other Cov. 12"},{"group":"Dwelling Policy","item":"Vacancy limit for V&MM / glass (DP-3 12 02)","value":"More than 60 consecutive days","source":"ISO DP 00 03 12 02"},{"group":"Dwelling Policy","item":"Replacement cost insurance-to-value","value":"80%","source":"ISO DP 00 03 12 02, Cond. E"},{"group":"Dwelling Policy","item":"Suit against insurer","value":"2 years (12 02); 1 year (07 88)","source":"ISO DP 00 03 12 02 Cond. J; DP 00 01 07 88 Cond. 11"},{"group":"Dwelling Policy","item":"PLS damage to property of others","value":"$1,000 at replacement cost","source":"ISO DL 24 01 12 02"},{"group":"Homeowners Policy","item":"Coverage B","value":"10% of A, additional","source":"ISO HO 00 03 05 11, Coverage B"},{"group":"Homeowners Policy","item":"Coverage C default (manual)","value":"50% of A (HO-2/3/5/8)","source":"RIJRA (ISO) HO Manual; NC Rate Bureau HO Manual"},{"group":"Homeowners Policy","item":"Coverage C at other residence / self-storage (HO 00 03 05 11)","value":"Greater of 10% of C or $1,000","source":"ISO HO 00 03 05 11, Coverage C.2"},{"group":"Homeowners Policy","item":"Special limits (HO 00 03 05 11): money / securities & documents / watercraft / trailers","value":"$200 / $1,500 / $1,500 / $1,500","source":"ISO HO 00 03 05 11, C.3.a-d"},{"group":"Homeowners Policy","item":"Special limits, theft only (HO 00 03 05 11): jewelry-watches-furs / firearms / silverware","value":"$1,500 / $2,500 / $2,500","source":"ISO HO 00 03 05 11, C.3.e-g"},{"group":"Homeowners Policy","item":"Special limits (HO 00 03 05 11): business property on / off premises; electronics in vehicle / vehicle media","value":"$2,500 / $1,500; $1,500 / $250","source":"ISO HO 00 03 05 11, C.3.h-k"},{"group":"Homeowners Policy","item":"Civil authority (Coverage D)","value":"Max 2 weeks","source":"ISO HO 00 03 05 11, Coverage D.3"},{"group":"Homeowners Policy","item":"Tree removal (HO 00 03 05 11)","value":"$1,000 per loss; $500 per tree","source":"ISO HO 00 03 05 11, E.1.b"},{"group":"Homeowners Policy","item":"Trees, shrubs, plants (HO 00 03/04/06 05 11)","value":"5% of A; $500 per tree (HO-4/HO-6: 10% of C)","source":"ISO HO 00 03/04/06 05 11"},{"group":"Homeowners Policy","item":"Fire department service charge","value":"$500, no deductible","source":"ISO HO 00 03 05 11, E.4"},{"group":"Homeowners Policy","item":"Property removed","value":"30 days","source":"ISO HO 00 03 05 11, E.5"},{"group":"Homeowners Policy","item":"Credit card/EFT/forgery/counterfeit (HO 00 03 05 11)","value":"$500, no deductible","source":"ISO HO 00 03 05 11, E.6"},{"group":"Homeowners Policy","item":"Loss assessment (Sec I and Sec II) / landlord's furnishings / grave markers (HO 00 03 05 11)","value":"$1,000 each / $2,500 per apartment (not theft) / $5,000","source":"ISO HO 00 03 05 11, E.7, E.10, E.12; Sec II D"},{"group":"Homeowners Policy","item":"Ordinance or law","value":"10% of A (HO-4: 10% of Building Additions & Alterations)","source":"ISO HO 00 03/04 05 11"},{"group":"Homeowners Policy","item":"HO-8 theft","value":"On premises only; max $1,000 per loss","source":"ISO HO 00 08 10 00, Peril 9"},{"group":"Homeowners Policy","item":"HO-8 repair period for functional loss settlement","value":"180 days","source":"ISO HO 00 08 10 00, Cond. C.2"},{"group":"Homeowners Policy","item":"Vacancy (V&MM, glass)","value":"More than 60 consecutive days","source":"ISO HO 00 03 05 11"},{"group":"Homeowners Policy","item":"Replacement cost insurance-to-value","value":"80% of full replacement cost","source":"ISO HO 00 03 05 11, Cond. D.2"},{"group":"Homeowners Policy","item":"Small-loss RC without repair (HO 00 03 05 11)","value":"\u003c 5% of insurance AND \u003c $2,500","source":"ISO HO 00 03 05 11, Cond. D.2.d"},{"group":"Homeowners Policy","item":"Notice of intent to repair after ACV claim","value":"Within 180 days","source":"ISO HO 00 03 05 11, Cond. D.2.e"},{"group":"Homeowners Policy","item":"Proof of loss","value":"Within 60 days after insurer's request","source":"ISO HO 00 03 05 11, Cond. C.8"},{"group":"Homeowners Policy","item":"Loss payment (unendorsed ISO)","value":"60 days after proof of loss + agreement/judgment/award","source":"ISO HO 00 03 05 11, Cond. J"},{"group":"Homeowners Policy","item":"Suit against insurer (unendorsed ISO, Sec. I)","value":"2 years after date of loss","source":"ISO HO 00 03 05 11, Cond. H"},{"group":"Homeowners Policy","item":"Coverage E / F manual minimums","value":"$100,000 / $1,000 per person","source":"ISO HO Manual Table 301 (RIJRA)"},{"group":"Homeowners Policy","item":"Damage to property of others (HO 00 03 05 11)","value":"$1,000 per occurrence at RC; no coverage if intentional by insured age 13+","source":"ISO HO 00 03 05 11, Sec. II Add'l Cov. C"},{"group":"Homeowners Policy","item":"Watercraft: outboard hp / sailboat length","value":"25 hp total / 26 feet; report newly owned outboard within 45 days","source":"ISO HO 00 03 05 11, Sec. II Excl. B"},{"group":"Homeowners Policy","item":"HO 04 61 newly acquired jewelry etc.","value":"Lesser of 25% of class or $10,000; report within 30 days","source":"PF&M HO 04 61 (2017)"},{"group":"Homeowners Policy","item":"HO 04 61 newly acquired fine arts","value":"25% of fine arts limit (ACV); report within 90 days","source":"PF&M HO 04 61 (2017)"},{"group":"Homeowners Policy","item":"HO 04 90 ACV-until-replaced threshold","value":"Over $500 (05 11 edition)","source":"ISO HO 04 90 05 11"},{ urplus Lines","item":"MI surplus lines semiannual statements","value":"Feb 15 and Aug 15","source":"MCL 500.1905(3)(d)"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"MI surplus lines delivery of written evidence","value":"Within 30 days","source":"MCL 500.1912"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"MI surplus lines personal lines fee cap","value":"Greater of $100 or 10% of premium","source":"MCL 500.1915(1)(b)"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"MI eligible surplus lines insurer capital & surplus","value":"At least $1,500,000 under MI statute (federal NRRA effectively requires the greater of home-state minimum or $15,000,000 for U.S. insurers)","source":"MCL 500.1920(4); 15 U.S.C. 8204"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"MI eligible insurer deposit / trust","value":"$75,000 MI deposit or $1,000,000 US trust; $50,000,000 for unincorporated alien insurers (MI statute; federal NRRA limits state eligibility rules, and alien insurers qualify via the NAIC Quarterly Listing)","source":"MCL 500.1921(1)-(2); 15 U.S.C. 8204"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"MI dram shop proof of financial responsibility","value":"At least $50,000","source":"MCL 436.1803(1)"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"ERISA fidelity bond","value":"10% of funds handled; min $1,000; max $500,000 ($1,000,000 with employer securities)","source":"29 U.S.C. 1112(a)"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"NFIP 1-4 family residential maximums","value":"$250,000 building / $100,000 contents (other residential, 5+ units: $500,000 building)","source":"44 CFR 61.6(a); FEMA brochure (07-2024)"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"NFIP non-residential maximums","value":"$500,000 building / $500,000 contents","source":"FEMA Commercial Summary of Coverage (01-2024)"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"NFIP Increased Cost of Compliance","value":"Up to $30,000","source":"44 CFR Pt. 61 App. A(1) III.D; FEMA (01-2024)"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"NFIP waiting period","value":"30 days (no wait at loan closing; 1 day within 13 months after a map revision; 1 day for post-wildfire flooding on federal land if bought within 60 days of containment)","source":"44 CFR 61.11"},{"group":"Other Coverages / NFIP / Surplus Lines","item":"NFIP residential minimum deductibles (RR2.0)","value":"$1,000 (building ≤ $100k); $1,250 (> $100k); pre-FIRM discounted $1,500/$2,000; contents $1,000","source":"FEMA RR2.0 Simple Guide – Residential Manufactured/Mobile Homes"}],"guide":[{"id":"logistics","title":"Exam Day & Licensing Steps","weight":"Before you test","secs":[],"html":"\u003cp>Sources: PSI Candidate Information Bulletin \"Effective 6/10/2025\". The DIFS Examination Information page links to it as PSI bulletin 3560; the PDF was regenerated July 6, 2026 and its text is identical to the 6/10/2025 version. Also used: DIFS web pages fetched October 12, 2026.\u003c/p>\n\u003cul>\n\u003cli>\n\u003cstrong>Exam provider\u003c/strong>: PSI Services LLC, under contract with DIFS. \u003ccite>[PSI CIB eff. 6/10/2025, p.2]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Registration\u003c/strong>: online at test-takers.psiexams.com/midifs, where the first and last name must match the government ID exactly, or by phone at \u003cstrong>855-579-4639\u003c/strong>. \u003ccite>[PSI CIB p.3-5; DIFS Examination Information page]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Exam fee\u003c/strong>: \u003cstrong>$41\u003c/strong>, not refundable or transferable. The fee is valid for \u003cstrong>one year\u003c/strong> from payment. \u003ccite>[PSI CIB p.3]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Extra time\u003c/strong>: time-and-a-half costs an extra \u003cstrong>$50\u003c/strong>. ADA accommodations carry no extra fee. Both must be scheduled by phone. \u003ccite>[PSI CIB p.5]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Remote testing\u003c/strong>: discontinued. DIFS stopped accepting new remote registrations \u003cstrong>June 10, 2025\u003c/strong>. Exams are now \u003cstrong>in person only\u003c/strong> at PSI test centers. Remote exams already scheduled had to be taken by June 30, 2025, or rescheduled in person at no fee. \u003ccite>[DIFS \"Remote Examination Discontinuance\", June 9, 2025; PSI CIB p.1]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Locations\u003c/strong>: Michigan PSI sites include Dearborn, Holt-Lansing, Southfield (two sites), Grand Rapids, Gaylord and Marquette. PSI centers in other states may also be used. \u003ccite>[PSI CIB p.6]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Rescheduling and no-shows\u003c/strong>: cancel or reschedule at least \u003cstrong>2 days\u003c/strong> before the exam, or the fee is forfeited. Voicemail and email are not acceptable. The fee is also forfeited for:\n\u003cul>\n\u003cli>\nnot appearing\n\u003c/li>\u003cli>\nnot being checked in by the start time\n\u003c/li>\u003cli>\nlacking proper ID\n \u003ccite>[PSI CIB p.5]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Arrival\u003c/strong>: arrive \u003cstrong>30 minutes\u003c/strong> early. \u003ccite>[PSI CIB p.6]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>ID\u003c/strong>: one valid, unexpired, government-issued ID with \u003cstrong>photo and signature\u003c/strong>, matching the registered name. Accepted IDs:\n\u003cul>\n\u003cli>\nstate driver's license or state ID card\n\u003c/li>\u003cli>\nUS passport\n\u003c/li>\u003cli>\nUS military ID\n\u003c/li>\u003cli>\nalien registration card\n\u003c/li>\u003cli>\nCanadian government ID\n \u003ccite>[PSI CIB p.6-7]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>P&amp;C Producer/Solicitor (16-81) format\u003c/strong>: \u003cstrong>150 scored items\u003c/strong>, \u003cstrong>2.5 hours\u003c/strong>, cut score \u003cstrong>74%\u003c/strong>. \u003ccite>[PSI CIB p.9; DIFS Insurance Examination Cut Scores PDF]\u003c/cite>\n\u003cul>\n\u003cli>\nDIFS lists the 74% cut score as effective \u003cstrong>5/1/2020\u003c/strong>. Items were updated effective \u003cstrong>July 2, 2020\u003c/strong> for the 2019-2020 no-fault reforms. \u003ccite>[DIFS Ins_Exam_Cut_Scores.pdf]\u003c/cite>\n\u003c/li>\u003cli>\nUp to about 10% unscored experimental items (generally 1-10) may be added. They count against exam time. \u003ccite>[PSI CIB p.8]\u003c/cite>\n\u003c/li>\u003cli>\nThe tutorial, up to 15 minutes, does not count toward exam time. \u003ccite>[PSI CIB p.8]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Prelicensing education is required\u003c/strong> for 16-81. The program is \u003cstrong>40 hours\u003c/strong> for the combined property and casualty producer/solicitor course; property-only, casualty-only or personal lines programs are 20 hours each. \u003ccite>[MCL 500.1204a(1)(b); DIFS Pre-licensing Education FAQ; PSI CIB p.2]\u003c/cite>\n\u003cul>\n\u003cli>\nCourses may be classroom or self-study. \u003ccite>[DIFS PE FAQ]\u003c/cite>\n\u003c/li>\u003cli>\nEthics instruction must be included, with no specific hour count in statute. \u003ccite>[MCL 500.1204a(1)(c)]\u003c/cite>\n\u003c/li>\u003cli>\nExam results are \u003cstrong>invalidated\u003c/strong> if prelicensing education was not completed beforehand. \u003ccite>[PSI CIB p.2]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Prelicensing certificate\u003c/strong>: valid \u003cstrong>12 months\u003c/strong> from completion. The exam must be passed within that window, or the coursework must be repeated. The provider reports completion electronically; do not bring the certificate to the test site. \u003ccite>[DIFS PE FAQ; DIFS \"How to become licensed as a Resident Producer\"; PSI CIB p.2]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Prelicensing waiver\u003c/strong>: available with designations such as CPCU, CIC, AAI or ARM (for P&amp;C), or an insurance-concentration degree. The waiver must be \u003cstrong>requested in writing and granted before scheduling\u003c/strong> the exam. \u003ccite>[DIFS PE FAQ; MCL 500.1204(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Score validity\u003c/strong>: passing results are valid \u003cstrong>12 months\u003c/strong> from the pass date. \u003ccite>[PSI CIB p.2; NIPR Michigan state page]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>License application\u003c/strong>:\n\u003cul>\n\u003cli>\nIt is filed electronically through \u003cstrong>NIPR\u003c/strong> (Electronic Resident Licensing). \u003ccite>[PSI CIB p.2; DIFS resident producer page]\u003c/cite>\n\u003c/li>\u003cli>\nFees are a \u003cstrong>$10 application fee plus a $5 NIPR transaction fee\u003c/strong>. \u003ccite>[DIFS resident producer page]\u003c/cite>\n\u003c/li>\u003cli>\nAn application is valid \u003cstrong>180 days\u003c/strong> from entry into the DIFS database. If the exam is not passed within 180 days, a new application and fee are required. \u003ccite>[DIFS resident producer page]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Retakes\u003c/strong>: a new appointment cannot be made the same day. A candidate who fails on Wednesday can call Thursday and retest as soon as Friday, if space allows. There is no mandatory waiting period beyond that, but each attempt requires a new registration and fee. \u003ccite>[PSI CIB p.5; MCL 500.1204(6)]\u003c/cite>\n\u003cul>\n\u003cli>\nRetaking an exam already passed within the past year requires DIFS permission. \u003ccite>[PSI CIB p.5]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Background check and fingerprints\u003c/strong>: DIFS states that it \"performs several background checks on each applicant\"; for agencies, the checks cover the designated responsible licensed producer, owners, partners, officers and directors. Neither DIFS's resident-producer licensing page nor the PSI bulletin lists a \u003cstrong>fingerprint\u003c/strong> requirement. See Flags. \u003ccite>[DIFS \"Insurance Producer Application Background Questions\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Content outline\u003c/strong>: the P&amp;C 16-81 outline that PSI links today (\"PropCas Prod 16-81x.pdf\" on proctor2.psionline.com) is \u003cstrong>byte-identical\u003c/strong> to the copy used for this project. The PDF's creation date is \u003cstrong>Sept 2, 2021\u003c/strong>, so \u003cstrong>no revision after Sept 2021\u003c/strong> was found as of October 12, 2026. \u003ccite>[PSI outline PDF metadata; PSI CIB p.9 link]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Contacts\u003c/strong>: DIFS Licensing at 877-999-6442 or difs-licensing@michigan.gov. \u003ccite>[PSI CIB p.2]\u003c/cite>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\n\u003cstrong>Fingerprints\u003c/strong>: not verified either way. Official DIFS pages and the PSI bulletin are silent. Third-party prep sites conflict: Achievable says fingerprints are required; Aceable says they are not. Confirm with DIFS at 877-999-6442 before relying on either.\n\u003c/li>\u003cli>\n\u003cstrong>Time to apply after passing\u003c/strong>: PSI says passing scores are valid 12 months, while DIFS says a NIPR application is valid 180 days, and the exam must be passed within that period. In practice, file the NIPR application, then test within 180 days, and keep the pass within its 12-month validity.\n\u003c/li>\u003cli>\n\u003cstrong>PSI fee and bulletin\u003c/strong>: the $41 fee and the bulletin dated 6/10/2025 are what DIFS linked as of 10/12/2026. PSI states that fees, cut scores and outlines are subject to change.\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"reg","title":"Insurance Regulation","weight":"10% · 15 items","secs":["reg"],"html":"\u003cp>Statute text: Michigan Compiled Laws via legislature.mi.gov (complete through PA 103 of 2026), read October 2026. \"Director\" and \"commissioner\" both mean the DIFS Director.\u003c/p>\n\u003ch3>Company Regulation: Producer Appointment\u003c/h3>\n\u003cul>\n\u003cli>\nA producer may not act as an insurer's agent unless the insurer has appointed the producer. A producer who is not acting as the insurer's agent does not need an appointment. \u003ccite>[MCL 500.1208a(1)]\u003c/cite>\n\u003c/li>\u003cli>\nA producer may not \u003cstrong>bind coverage\u003c/strong> for an insurer unless that insurer has appointed the producer. \u003ccite>[MCL 500.1208a(2)]\u003c/cite>\n\u003c/li>\u003cli>\nThe insurer files a notice of appointment within \u003cstrong>15 days\u003c/strong> of whichever comes first: the date the agency contract is executed, or the date the first insurance application is submitted. One filing can appoint the producer to all or some insurers in the insurer's holding-company group. \u003ccite>[MCL 500.1208a(3)]\u003c/cite>\n\u003c/li>\u003cli>\nThe director verifies eligibility within a reasonable time, \u003cstrong>not more than 30 days\u003c/strong>. If the producer is ineligible, the director notifies the insurer within \u003cstrong>5 days\u003c/strong> of that determination. \u003ccite>[MCL 500.1208a(4)]\u003c/cite>\n\u003c/li>\u003cli>\nThe insurer pays the appointment fee and renewal appointment fee: \u003cstrong>$5 per producer per year\u003c/strong>, resident or nonresident. \u003ccite>[MCL 500.1208a(5); MCL 500.240(1)(c)]\u003c/cite>\n\u003c/li>\u003cli>\nManaging general agents (MGAs): the insurer must give the commissioner written notice within \u003cstrong>30 days\u003c/strong> of entering into or terminating an MGA contract. The insurer must also review the MGA's operations on site at least \u003cstrong>semiannually\u003c/strong> and check its books \u003cstrong>quarterly\u003c/strong> to see whether any agent has become an MGA. \u003ccite>[MCL 500.1411(c),(e),(f)]\u003c/cite>\n\u003c/li>\u003cli>\nAn agent may not, during any 12-month period, place insurance on his or her own risks, or the risks of employees, employer or business associates, totaling more than \u003cstrong>15%\u003c/strong> of the total premium the agent placed in that period. This is the controlled-business limit. \u003ccite>[MCL 500.1208]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Company Regulation: Termination of Appointment\u003c/h3>\n\u003cul>\n\u003cli>\nAn insurer that terminates a producer \u003cstrong>for a 1239 cause\u003c/strong> must notify the commissioner within \u003cstrong>30 days after the termination's effective date\u003c/strong>. The same applies when the insurer knows a court or regulator found that the producer engaged in 1239 conduct. On written request, the insurer must supply more information. \u003ccite>[MCL 500.1208b(1)]\u003c/cite>\n\u003c/li>\u003cli>\nA termination for \u003cstrong>any other reason\u003c/strong> also requires notice to the commissioner within \u003cstrong>30 days after the effective date\u003c/strong>. \u003ccite>[MCL 500.1208b(2)]\u003c/cite>\n\u003c/li>\u003cli>\nIf the insurer later learns of information that would have been reportable, it must notify the commissioner promptly. \u003ccite>[MCL 500.1208b(3)]\u003c/cite>\n\u003c/li>\u003cli>\nWithin \u003cstrong>15 days\u003c/strong> after notifying the commissioner, the insurer mails a copy of the notice to the producer's last known address. For a for-cause termination, the copy goes by \u003cstrong>certified mail, return receipt requested\u003c/strong>, or by nationally recognized \u003cstrong>overnight delivery\u003c/strong>. \u003ccite>[MCL 500.1208b(4)]\u003c/cite>\n\u003c/li>\u003cli>\nThe producer may file written comments with the commissioner within \u003cstrong>30 days\u003c/strong> after receiving the notice. The producer must send a copy to the insurer at the same time. \u003ccite>[MCL 500.1208b(4)]\u003c/cite>\n\u003c/li>\u003cli>\nAnyone who reports a termination is immune from civil liability \u003cstrong>unless they acted with actual malice\u003c/strong>. \u003ccite>[MCL 500.1208b(5)]\u003c/cite>\n\u003c/li>\u003cli>\nAn insurer or producer that fails to report as required may have its license or certificate of authority suspended or revoked and may be fined under 1244. \u003ccite>[MCL 500.1246(6)]\u003c/cite>\n\u003c/li>\u003cli>\nAfter a termination, a producer who has property rights in the renewals stays responsible until the existing policies are canceled, replaced or expire. If the written agreement does not address this period, the producer may \u003cstrong>service existing policies\u003c/strong>. The producer may \u003cstrong>not bind new risks, renew policies, or increase the insurer's obligation\u003c/strong> without the insurer's approval. \u003ccite>[MCL 500.1209(1)]\u003c/cite>\n\u003c/li>\u003cli>\nAn insurer may not cancel or nonrenew an insured's policy \u003cstrong>because the producer's contract was terminated\u003c/strong>. \u003ccite>[MCL 500.1209(1)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Auto and home insurers\u003c/strong> may terminate a producer's authority for auto or home insurance only for:\n\u003cul>\n\u003cli>\nmalfeasance\n\u003c/li>\u003cli>\nbreach of fiduciary duty or trust\n\u003c/li>\u003cli>\nviolation of the Insurance Code\n\u003c/li>\u003cli>\nfailure to perform under the contract\n\u003c/li>\u003cli>\nsubmitting \u003cstrong>fewer than 25 applications\u003c/strong> for home and auto insurance in the preceding 12 months\n \u003ccite>[MCL 500.1209(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nAn auto or home termination may \u003cstrong>not\u003c/strong> be based primarily on the geographic location of the producer's business, its loss experience tied to that location, or the producer's performance of chapter 21 (Essential Insurance Act) obligations. \u003ccite>[MCL 500.1209(3)]\u003c/cite>\n\u003c/li>\u003cli>\nThese protections do not apply to captive or employee producers when the insurer owns the renewal rights. \u003ccite>[MCL 500.1209(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Producer Regulation: Duties and Who Must Be Licensed\u003c/h3>\n\u003cul>\n\u003cli>\nA person may not sell, solicit or negotiate insurance in Michigan for any line without a license for that line. \u003ccite>[MCL 500.1201a(1)]\u003c/cite>\n\u003c/li>\u003cli>\nKey definitions \u003ccite>[MCL 500.1201]\u003c/cite>:\n\u003cul>\n\u003cli>\n\u003cstrong>Insurance producer\u003c/strong>: a person required to be licensed to sell, solicit or negotiate insurance. \"Agent\" means insurance producer.\n\u003c/li>\u003cli>\n\u003cstrong>Sell\u003c/strong>: to exchange a contract of insurance for money or its equivalent on behalf of an insurer.\n\u003c/li>\u003cli>\n\u003cstrong>Solicit\u003c/strong>: to attempt to sell, or to ask or urge a person to apply for a particular kind of insurance from a particular company.\n\u003c/li>\u003cli>\n\u003cstrong>Negotiate\u003c/strong>: to confer directly with, or advise directly, a purchaser or prospective purchaser about a particular contract's substantive benefits, terms or conditions.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nA license does \u003cstrong>not\u003c/strong> by itself give the holder actual, apparent or inherent authority to represent or commit an insurer. \u003ccite>[MCL 500.1201(h)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Agent of the insurer\u003c/strong>: represents the insurer, not the insured. \u003cstrong>Agent of the insured\u003c/strong>: a producer \u003cstrong>not appointed\u003c/strong> by the insurer on the placed policy; treated as representing the insured. \u003ccite>[MCL 500.1201(b),(c)]\u003c/cite>\n\u003c/li>\u003cli>\nNo producer license is needed for:\n\u003cul>\n\u003cli>\ninsurer officers, directors or employees who receive \u003cstrong>no commission\u003c/strong> and do executive, administrative, managerial or clerical work; underwriting, loss control or claims work; or special-agent technical assistance to producers\n\u003c/li>\u003cli>\npersons whose only insurance sales are rental-car insurance incidental to a rental of \u003cstrong>90 days or less\u003c/strong>, or portable electronics, travel, or self-storage property insurance (stored property valued up to \u003cstrong>$10,000\u003c/strong>)\n\u003c/li>\u003cli>\nsalaried full-time employees advising their own employer without commission\n \u003ccite>[MCL 500.1202(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe insurer itself does not need a producer license. \u003ccite>[MCL 500.1202(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Producer Regulation: Commissions\u003c/h3>\n\u003cul>\n\u003cli>\nAn insurer or producer may not pay a commission, service fee or other valuable consideration to a person who must be licensed but is not. \u003ccite>[MCL 500.1240(1)]\u003c/cite>\n\u003c/li>\u003cli>\nAn unlicensed person who must be licensed may not accept such payment. \u003ccite>[MCL 500.1240(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Renewal and deferred commissions\u003c/strong> may be paid if the person was licensed \u003cstrong>at the time of the sale\u003c/strong>. \u003ccite>[MCL 500.1240(3)]\u003c/cite>\n\u003c/li>\u003cli>\nCommissions may be paid or assigned to an \u003cstrong>insurance agency\u003c/strong>, or to persons who do not sell, solicit or negotiate, unless the payment would be an illegal rebate under 2024. \u003ccite>[MCL 500.1240(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003cp>Add: DIFS allows an unlicensed person to be paid a referral fee for leads only if the fee is not contingent on the referral applying for or buying a policy. An unlicensed person may also receive an override if he or she does not sell, solicit or negotiate insurance. \u003ccite>[MCL 500.1240(4); DIFS Compensation &amp; Rebating FAQ: Referral Fees, Override Commissions]\u003c/cite>\u003c/p>\n\u003cul>\n\u003cli>\nSolicitors have the same prohibition. \u003ccite>[MCL 500.1216(3)]\u003c/cite>\n\u003c/li>\u003cli>\nMedicare-eligible disability policies: the first-year commission may not exceed the commission paid in each of the next \u003cstrong>2 renewal years\u003c/strong>. \u003ccite>[MCL 500.2011(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Types of Licensees: Producer (Lines of Authority)\u003c/h3>\n\u003cp>Individual producer lines \u003ccite>[MCL 500.1206(1)]\u003c/cite>:\u003c/p>\n\u003cul>\n\u003cli>\n\u003cstrong>Life\u003c/strong>: life insurance, including endowment and annuity benefits. May include accidental death or dismemberment and disability income.\n\u003c/li>\u003cli>\n\u003cstrong>Accident and health or sickness\u003c/strong>: sickness, bodily injury or accidental death. May include disability income.\n\u003c/li>\u003cli>\n\u003cstrong>Property\u003c/strong>: direct or consequential loss of or damage to property of every kind.\n\u003c/li>\u003cli>\n\u003cstrong>Casualty\u003c/strong>: legal liability, including for death, injury, disability, or damage to real or personal property.\n\u003c/li>\u003cli>\n\u003cstrong>Variable life and variable annuity products\u003c/strong>.\n\u003c/li>\u003cli>\n\u003cstrong>Personal lines\u003c/strong>: property and casualty coverage sold to individuals and families for \u003cstrong>primarily noncommercial\u003c/strong> purposes.\n\u003c/li>\u003cli>\n\u003cstrong>Credit\u003c/strong>: limited line credit insurance.\n\u003c/li>\u003cli>\nAny other line allowed by law or rule.\n\u003c/li>\u003c/ul>\n\u003ch3>Types of Licensees: Licensing Requirements\u003c/h3>\n\u003cul>\n\u003cli>\nA resident applicant files the uniform application and declares under penalty of refusal, suspension or revocation that the statements are true. The director approves only if the applicant:\n\u003cul>\n\u003cli>\nis at least \u003cstrong>18\u003c/strong>\n\u003c/li>\u003cli>\nhas committed no act listed in 1239(1)\n\u003c/li>\u003cli>\nhas completed prelicensing education\n\u003c/li>\u003cli>\nhas paid the fees\n\u003c/li>\u003cli>\nhas passed the exam for each line\n \u003ccite>[MCL 500.1205(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nA resident individual must pass a \u003cstrong>written exam\u003c/strong> unless exempt under 1206b. No exam is given until the applicant completes a registered program of study. The completion certificate must be dated within \u003cstrong>12 months\u003c/strong> before the exam application. \u003ccite>[MCL 500.1204(1),(2)]\u003c/cite>\n\u003c/li>\u003cli>\nThe exam or prelicensing education may be \u003cstrong>waived\u003c/strong> for an applicant who:\n\u003cul>\n\u003cli>\napplies for a limited license\n\u003c/li>\u003cli>\nwas a \u003cstrong>licensed producer within the preceding 12 months\u003c/strong>\n\u003c/li>\u003cli>\nholds a listed designation, such as \u003cstrong>CPCU\u003c/strong>, CLU, CIC, AAI, ChFC, CEBS, CFP, FLMI, LUTCF, RHU, REBC, HIA or \u003cstrong>ARM\u003c/strong>\n\u003c/li>\u003cli>\nholds an insurance-concentration associate, bachelor's or master's degree\n \u003ccite>[MCL 500.1204(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe exam is entry level. It tests the line's subject matter, a producer's duties and responsibilities, and Michigan insurance law. \u003ccite>[MCL 500.1204(3)]\u003c/cite>\n\u003c/li>\u003cli>\nAn applicant who fails, or does not appear, must \u003cstrong>reapply and pay all exam fees again\u003c/strong>. \u003ccite>[MCL 500.1204(6)]\u003c/cite>\n\u003c/li>\u003cli>\nMinimum prelicensing hours \u003ccite>[MCL 500.1204a(1)(b)]\u003c/cite>:\n\u003cul>\n\u003cli>\nproperty: \u003cstrong>20\u003c/strong>\n\u003c/li>\u003cli>\ncasualty: \u003cstrong>20\u003c/strong>\n\u003c/li>\u003cli>\npersonal lines: \u003cstrong>20\u003c/strong>\n\u003c/li>\u003cli>\ncombined property and casualty producers and solicitors: \u003cstrong>40\u003c/strong> (also satisfies personal lines)\n\u003c/li>\u003cli>\nlife: \u003cstrong>20\u003c/strong>\n\u003c/li>\u003cli>\nhealth: \u003cstrong>20\u003c/strong>\n\u003c/li>\u003cli>\ncombined life and health: \u003cstrong>40\u003c/strong>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nClassroom, online and self-study hours may be combined. \u003ccite>[MCL 500.1204a(2)]\u003c/cite>\n\u003c/li>\u003cli>\nEvery program must include instruction in \u003cstrong>ethical practices\u003c/strong> in marketing and selling insurance. The statute sets no hour count for this. \u003ccite>[MCL 500.1204a(1)(c)]\u003c/cite>\n\u003c/li>\u003cli>\nStatutory application fee: \u003cstrong>$10\u003c/strong>, nonrefundable. \u003ccite>[MCL 500.240(1)(d)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Types of Licensees: Business Entity, Nonresident, Temporary\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Business entity\u003c/strong>: a corporation, association, partnership, LLC, LLP or other legal entity. \u003ccite>[MCL 500.1201(d)]\u003c/cite>\n\u003c/li>\u003cli>\nA business entity acting as a producer needs its own producer license. It must designate an \u003cstrong>individual licensed producer responsible for compliance\u003c/strong> with Michigan insurance law. \u003ccite>[MCL 500.1205(2)]\u003c/cite>\n\u003c/li>\u003cli>\nAn entity's license may be suspended, revoked or refused if an individual licensee's violation was known, or should have been known, by a partner, officer or manager, and the violation was neither reported nor corrected. \u003ccite>[MCL 500.1239(5)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Nonresident\u003c/strong> license requirements:\n\u003cul>\n\u003cli>\ncurrently licensed and in good standing as a resident in the home state\n\u003c/li>\u003cli>\napplication and fees submitted\n\u003c/li>\u003cli>\nthe home state grants nonresident licenses to Michigan residents on the same basis (reciprocity)\n \u003ccite>[MCL 500.1206a(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nA producer who changes resident state files a change of address and a certification from the new state within \u003cstrong>30 days\u003c/strong>. No fee is charged. \u003ccite>[MCL 500.1206a(3)]\u003c/cite>\n\u003c/li>\u003cli>\nAn applicant previously licensed for the same lines in another state needs \u003cstrong>no prelicensing education or exam\u003c/strong> if either:\n\u003cul>\n\u003cli>\nstill licensed there, or\n\u003c/li>\u003cli>\napplying within \u003cstrong>90 days\u003c/strong> of that license's cancellation, while in good standing\n \u003ccite>[MCL 500.1206b(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nA producer who \u003cstrong>moves to Michigan\u003c/strong> must apply for a resident license within \u003cstrong>90 days\u003c/strong> after establishing legal residence. No prelicensing education or exam is required for lines previously held. \u003ccite>[MCL 500.1206b(2)]\u003c/cite>\n\u003c/li>\u003cli>\nA nonresident who meets home-state CE requirements satisfies Michigan CE, if the home state reciprocates. \u003ccite>[MCL 500.1204e(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Temporary license\u003c/strong>: up to \u003cstrong>180 days\u003c/strong>, with no exam. Available to:\n\u003cul>\n\u003cli>\nthe surviving spouse or personal representative of a producer who dies or becomes disabled\n\u003c/li>\u003cli>\na member or employee of a business entity after its designated individual dies or becomes disabled\n\u003c/li>\u003cli>\nthe designee of a producer entering active military service\n\u003c/li>\u003cli>\nothers, in the public interest\n The director may require a sponsor. A temporary license ends when the business is disposed of. \u003ccite>[MCL 500.1211b]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch3>Types of Licensees: Solicitor\u003c/h3>\n\u003cul>\n\u003cli>\nA solicitor is a natural person who solicits applications and collects premiums \u003cstrong>on behalf of a licensed resident producer (agent)\u003c/strong>. Three conditions apply:\n\u003cul>\n\u003cli>\nthe solicitor works under a \u003cstrong>written contract\u003c/strong> that specifies the solicitor's authority\n\u003c/li>\u003cli>\nthe solicitor is licensed as a solicitor\n\u003c/li>\u003cli>\nthe agent has notified the director of the contract\n \u003ccite>[MCL 500.1211(1); MCL 500.1212]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe solicitor applies with a notice of appointment from the sponsoring producer. The solicitor may act only after the license is received. \u003ccite>[MCL 500.1214(1),(5)]\u003c/cite>\n\u003c/li>\u003cli>\nA license for casualty solicitation also covers legal expense insurance. \u003ccite>[MCL 500.1214(6)]\u003c/cite>\n\u003c/li>\u003cli>\nA solicitor license continues until suspended, revoked or surrendered. The director demands surrender when the solicitor has no agent authority. \u003ccite>[MCL 500.1214(7)]\u003c/cite>\n\u003c/li>\u003cli>\nAn agent must \u003cstrong>immediately\u003c/strong> notify the commissioner when a solicitor's authority is terminated, with full disclosure of any violations. \u003ccite>[MCL 500.1218]\u003c/cite>\n\u003c/li>\u003cli>\nA solicitor is a \u003cstrong>fiduciary\u003c/strong> for all money received. Failure to turn money over in a timely manner is prima facie evidence of a violation. \u003ccite>[MCL 500.1216(1)]\u003c/cite>\n\u003c/li>\u003cli>\nSolicitor license fee: \u003cstrong>$10\u003c/strong> per year. \u003ccite>[MCL 500.240(1)(e)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Types of Licensees: Counselor\u003c/h3>\n\u003cul>\n\u003cli>\nA \u003cstrong>counselor license\u003c/strong> is required to do any of the following:\n\u003cul>\n\u003cli>\naudit or abstract policies or annuities\n\u003c/li>\u003cli>\ngive advice, counsel or opinion on a policy's benefits, coverage, terms, value or advantages\n\u003c/li>\u003cli>\nadvertise or hold oneself out as an insurance counselor\n \u003ccite>[MCL 500.1232]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nExempt from the counselor license:\n\u003cul>\n\u003cli>\na licensed agent's customary advice\n\u003c/li>\u003cli>\na person admitted to practice law in Michigan\n\u003c/li>\u003cli>\nuse of the conferred designations \"Certified Insurance Counselor\" (initial capitals required), \"accredited advisor in insurance\", or \"fraternal insurance counselor\"\n \u003ccite>[MCL 500.1232]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nAn unlicensed person may not use terms such as \"consultant\" in a way that implies being a licensed counselor. \u003ccite>[MCL 500.1232]\u003c/cite>\n\u003c/li>\u003cli>\nThe counselor applicant takes a written exam. The exam may be waived if the applicant was a licensed counselor within the preceding \u003cstrong>12 months\u003c/strong>. The commissioner decides within \u003cstrong>60 days\u003c/strong> after receiving a complete application. \u003ccite>[MCL 500.1234(2)]\u003c/cite>\n\u003c/li>\u003cli>\nBefore providing services, the counselor and client both \u003cstrong>sign a written agreement\u003c/strong> that:\n\u003cul>\n\u003cli>\ndescribes the work\n\u003c/li>\u003cli>\nstates the fee\n\u003c/li>\u003cli>\nstates that the \u003cstrong>fee may not be waived under any circumstances\u003c/strong>\n\u003c/li>\u003cli>\ndiscloses that the counselor receives a \u003cstrong>commission\u003c/strong> on any insurance placed as an agent\n The counselor keeps a copy for at least \u003cstrong>2 years\u003c/strong> after completing the services. \u003ccite>[MCL 500.1236]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nCounselor license fee: \u003cstrong>$10\u003c/strong> per year. \u003ccite>[MCL 500.240(1)(f)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Maintenance and Duration\u003c/h3>\n\u003cul>\n\u003cli>\nA producer license stays in effect, unless suspended or revoked, \u003cstrong>as long as CE is completed by the due date\u003c/strong>. There is no fixed expiration. \u003ccite>[MCL 500.1206(2)]\u003c/cite>\n\u003c/li>\u003cli>\nIf a license lapses for a reason \u003cstrong>other than CE\u003c/strong>, the producer may reinstate it \u003cstrong>without an exam\u003c/strong> within \u003cstrong>12 months\u003c/strong> after the lapse. \u003ccite>[MCL 500.1206(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Change of legal name or address\u003c/strong>: notify the commissioner within \u003cstrong>30 days\u003c/strong>. \u003ccite>[MCL 500.1206(5)]\u003c/cite>\n\u003c/li>\u003cli>\nAgents, solicitors, counselors and adjusters report a \u003cstrong>mailing and email address\u003c/strong> and must report any change within \u003cstrong>30 days\u003c/strong>. Notices of hearing may be served by first-class mail to the address on file. \u003ccite>[MCL 500.1238(1),(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Assumed name\u003c/strong>: a producer using any name other than the legal name must notify the commissioner \u003cstrong>before\u003c/strong> using it. \u003ccite>[MCL 500.1211a]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Reporting administrative actions\u003c/strong>: a producer reports any administrative action from another jurisdiction, or from another Michigan agency, within \u003cstrong>30 days after final disposition\u003c/strong>, with a copy of the order. \u003ccite>[MCL 500.1247(1)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Reporting criminal prosecutions\u003c/strong>: a producer reports any criminal prosecution in any jurisdiction within \u003cstrong>30 days after the initial pretrial hearing date\u003c/strong>, with the complaint and order. \u003ccite>[MCL 500.1247(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Continuing Education\u003c/h4>\n\u003cul>\n\u003cli>\nCE hours are reviewed \u003cstrong>every 2 years\u003c/strong>. The director may stagger review dates. \u003ccite>[MCL 500.1204c(1)]\u003c/cite>\n\u003c/li>\u003cli>\nDIFS sets each producer's review date by birth month and year. The first review date leaves at least 12 months. \u003ccite>[DIFS Insurance Licensee CE FAQ, updated 05/29/24]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>24 hours\u003c/strong> of approved CE are required each 2-year period. At least \u003cstrong>3 hours must be ethics\u003c/strong>. Classroom, home study and online courses all count. \u003ccite>[MCL 500.1204c(2)]\u003c/cite>\n\u003c/li>\u003cli>\nA CE \u003cstrong>hour\u003c/strong> is at least \u003cstrong>50 minutes\u003c/strong>. \u003ccite>[MCL 500.1204c(18)(a)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Carryover\u003c/strong>: up to \u003cstrong>12\u003c/strong> excess hours may carry to the next period. \u003cstrong>Ethics hours do not count toward the next period's ethics requirement\u003c/strong>; DIFS counts extra ethics hours as general hours. Duplicate courses do not carry over. \u003ccite>[MCL 500.1204c(13); DIFS CE Carryover FAQ]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>90-day grace period\u003c/strong>: if CE is not done by the license's expiration or review date, the producer has 90 days to finish.\n\u003cul>\n\u003cli>\nDuring the grace period the producer may \u003cstrong>not\u003c/strong> sell or solicit new policies, bind coverage or otherwise act as a producer.\n\u003c/li>\u003cli>\nThe producer \u003cstrong>may\u003c/strong> service existing policies and receive commissions on them.\n\u003c/li>\u003cli>\nIf CE is still incomplete after 90 days, the director \u003cstrong>cancels\u003c/strong> the license, and the producer must reapply under 1204.\n \u003ccite>[MCL 500.1204c(11)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nDIFS shows this status as \"Suspended for Education\". \u003ccite>[DIFS CE FAQ]\u003c/cite>\n\u003c/li>\u003cli>\nA producer who has sold the business without meeting CE may service the old book and receive commissions, including partial commissions from the buyer. A producer still in the process of selling may do so for up to \u003cstrong>12 months\u003c/strong> after the review date. \u003ccite>[MCL 500.1204c(12)]\u003c/cite>\n\u003c/li>\u003cli>\nCE \u003cstrong>waivers\u003c/strong>:\n\u003cul>\n\u003cli>\nrequired for military service or severe hardship\n\u003c/li>\u003cli>\nmandatory for producers licensed only for \u003cstrong>travel or baggage\u003c/strong> insurance whose employment is for another purpose\n\u003c/li>\u003cli>\nmandatory for producers licensed only for \u003cstrong>limited line credit\u003c/strong> insurance\n \u003ccite>[MCL 500.1204c(9)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe provider files completion within \u003cstrong>30 days\u003c/strong>, with a \u003cstrong>$1.00-per-hour\u003c/strong> fee. \u003ccite>[MCL 500.1204c(8)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Long-term care\u003c/strong>: a producer selling LTC needs a life or A&amp;H license, a one-time \u003cstrong>8-hour\u003c/strong> LTC course, and \u003cstrong>4 hours\u003c/strong> of LTC training each 2-year CE period. \u003ccite>[MCL 500.1204f(1),(5)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Flood (NFIP)\u003c/strong>: there is no separate Michigan statutory flood CE hour requirement. Producers selling NFIP policies must meet FEMA's minimum training under §207 of the Flood Insurance Reform Act of 2004. A DIFS-approved NFIP course earns \u003cstrong>3 hours\u003c/strong> of Michigan CE credit. \u003ccite>[OFIS Bulletin 2007-07-INS]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>New (2026 PA 78)\u003c/strong>: for review dates after Dec 31, 2025, active participation in an approved professional insurance association may earn up to \u003cstrong>4 hours\u003c/strong> toward the 24. These hours do \u003cstrong>not\u003c/strong> count toward the 3 ethics hours. \u003ccite>[MCL 500.1204c(14), am. 2026 PA 78, imd. eff. July 27, 2026]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Disciplinary Actions\u003c/h3>\n\u003ch4>Grounds (1239)\u003c/h4>\n\u003cp>The director may place a license on probation, suspend or revoke it, or fine under 1244, for any 1239 cause.\u003c/p>\n\u003cul>\n\u003cli>\nUnder \u003cstrong>1239(1)\u003c/strong>, the director \u003cstrong>shall not issue\u003c/strong> a license for any of these causes \u003ccite>[MCL 500.1239(1)]\u003c/cite>:\n\u003cul>\n\u003cli>\nobtaining or attempting to obtain a license by misrepresentation or fraud\n\u003c/li>\u003cli>\nimproperly withholding, misappropriating or converting money or property\n\u003c/li>\u003cli>\nintentionally misrepresenting the terms of an actual or proposed policy or application\n\u003c/li>\u003cli>\na \u003cstrong>felony conviction within 10 years\u003c/strong> before the application\n\u003c/li>\u003cli>\n\u003cstrong>regardless of date\u003c/strong>, a felony involving violence or threat of violence (including domestic violence), criminal sexual conduct, or a fiduciary or financial crime (fraud, embezzlement, bribery, extortion)\n\u003c/li>\u003cli>\nhaving admitted or been found to have committed an unfair trade practice or fraud\n\u003c/li>\u003cli>\nfraudulent, coercive or dishonest practices, or incompetence, untrustworthiness or financial irresponsibility\n\u003c/li>\u003cli>\n\u003cstrong>forging another's name\u003c/strong> to an application or any document related to an insurance transaction\n\u003c/li>\u003cli>\n\u003cstrong>knowingly accepting business from an unlicensed individual\u003c/strong>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nUnder \u003cstrong>1239(2)\u003c/strong>, the director \u003cstrong>may refuse\u003c/strong> to issue a license, and may discipline, for \u003ccite>[MCL 500.1239(2)]\u003c/cite>:\n\u003cul>\n\u003cli>\nincorrect, misleading, incomplete or materially untrue information on the application\n\u003c/li>\u003cli>\nother felonies\n\u003c/li>\u003cli>\na license denied, suspended or revoked in another state\n\u003c/li>\u003cli>\n\u003cstrong>using notes or reference material during the licensing exam\u003c/strong>\n\u003c/li>\u003cli>\nviolating insurance laws or the director's orders or subpoenas\n\u003c/li>\u003cli>\nfailing to comply with a \u003cstrong>child support\u003c/strong> order\n\u003c/li>\u003cli>\nfailing to pay Single Business Tax or Michigan Business Tax\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nAfter a written denial, the applicant may make a written demand for a hearing within \u003cstrong>30 days\u003c/strong>. \u003ccite>[MCL 500.1239(4)]\u003c/cite>\n\u003c/li>\u003cli>\nThe director may still act against a person under investigation even if the license has been surrendered or has lapsed. \u003ccite>[MCL 500.1239(7)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Procedures\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Solicitor, counselor or adjuster\u003c/strong>: an applicant who is refused may request a hearing within \u003cstrong>30 days\u003c/strong> after the refusal notice is mailed. \u003ccite>[MCL 500.1242(1)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Summary suspension\u003c/strong>: the director may suspend a license \u003cstrong>without a prior hearing\u003c/strong> when protecting the public requires emergency action. If requested, a hearing is held within \u003cstrong>20 days\u003c/strong>, and the decision comes within \u003cstrong>30 days\u003c/strong> after the hearing. \u003ccite>[MCL 500.1242(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Fines and Cease and Desist\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Chapter 12 (licensing) violations\u003c/strong>, after a hearing, the director issues a \u003cstrong>cease and desist order\u003c/strong> and may also order \u003ccite>[MCL 500.1244(1)]\u003c/cite>:\n\u003cul>\n\u003cli>\na civil fine of up to \u003cstrong>$1,000 per violation\u003c/strong>, or up to \u003cstrong>$5,000 per violation\u003c/strong> if the person \u003cstrong>knew or reasonably should have known\u003c/strong> of the violation; one order may not exceed \u003cstrong>$50,000\u003c/strong> in fines\n\u003c/li>\u003cli>\na refund of overcharges\n\u003c/li>\u003cli>\nrestitution\n\u003c/li>\u003cli>\nsuspension or revocation\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Knowingly violating a chapter 12 cease and desist order\u003c/strong>: up to \u003cstrong>$20,000 per violation\u003c/strong>, with a \u003cstrong>$100,000\u003c/strong> cap per order, plus suspension or revocation. \u003ccite>[MCL 500.1244(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Unfair Trade Practices Act violations\u003c/strong> (sections 2001-2050), after a hearing, bring a cease and desist order plus \u003ccite>[MCL 500.2038(1)]\u003c/cite>:\n\u003cul>\n\u003cli>\nup to \u003cstrong>$1,000 per violation\u003c/strong>, \u003cstrong>$10,000 aggregate\u003c/strong>; or, if knowing, up to \u003cstrong>$5,000 per violation\u003c/strong>, \u003cstrong>$50,000 aggregate\u003c/strong> for all violations in a \u003cstrong>6-month\u003c/strong> period\n\u003c/li>\u003cli>\nsuspension or revocation if the violations were \u003cstrong>knowing and persistent\u003c/strong>\n\u003c/li>\u003cli>\nrefund of overcharges\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Violating a UTPA cease and desist order\u003c/strong>: up to \u003cstrong>$20,000 per violation\u003c/strong>, and/or suspension or revocation. \u003ccite>[MCL 500.2040(1)]\u003c/cite>\n\u003c/li>\u003cli>\nFor a practice \u003cstrong>not defined\u003c/strong> in sections 2005-2025, the director may charge it as unfair after a hearing held at least \u003cstrong>15 days\u003c/strong> after the notice is served. The person gets \u003cstrong>10 days'\u003c/strong> preliminary notice and may ask for a trade conference. If the practice continues, the attorney general may seek an injunction in Ingham County circuit court. \u003ccite>[MCL 500.2043]\u003c/cite>\n\u003c/li>\u003cli>\nBefore a hearing on a defined unfair practice, the person gets written notice and an opportunity to confer. The matter may be settled summarily by agreement. \u003ccite>[MCL 500.2029]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Insurer\u003c/strong> license: the director may suspend, revoke or refuse to renew it, after notice and hearing, when a chapter 13 violation makes the insurer's continued operation contrary to policyholders' or the public's interest. \u003ccite>[MCL 500.1379]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Unfair and Prohibited Trade Practices\u003c/h3>\n\u003cul>\n\u003cli>\nSections 2001-2050 are the \u003cstrong>Uniform Trade Practices Act\u003c/strong>. Its purpose is to regulate insurance trade practices consistent with the McCarran-Ferguson Act (PL 15, 1945). \u003ccite>[MCL 500.2001, .2002]\u003c/cite>\n\u003c/li>\u003cli>\n\"Person\" includes producers, solicitors, counselors and adjusters. \u003ccite>[MCL 500.2003(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Withholding or falsifying rate information\u003c/strong>: wilfully withholding, or knowingly giving false, information that affects rates carries a fine of up to \u003cstrong>$300 per violation\u003c/strong>, up to \u003cstrong>$1,500 if wilful\u003c/strong>, and \u003cstrong>$10,000\u003c/strong> maximum per order. \u003ccite>[MCL 500.2474, .2478; MCL 500.2666, .2670]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Misrepresentation\u003c/h4>\n\u003cul>\n\u003cli>\nMisrepresentation is any estimate, illustration, circular, statement, sales presentation or comparison that, by omitting or misstating a material fact, does any of the following \u003ccite>[MCL 500.2005]\u003c/cite>:\n\u003cul>\n\u003cli>\nmisrepresents a policy's terms, benefits, advantages or conditions\n\u003c/li>\u003cli>\nmisrepresents dividends\n\u003c/li>\u003cli>\nmisrepresents an insurer's \u003cstrong>financial condition\u003c/strong>\n\u003c/li>\u003cli>\nuses a misleading policy name\n\u003c/li>\u003cli>\n\u003cstrong>misrepresents to induce a lapse, forfeiture, exchange, conversion or surrender\u003c/strong> (2005(f))\n\u003c/li>\u003cli>\nmisrepresents a policy as a security\n\u003c/li>\u003cli>\nmisrepresents guaranty-association coverage\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nA policy name the commissioner has approved is \u003cstrong>conclusively presumed\u003c/strong> not misleading. \u003ccite>[MCL 500.2005(e)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Twisting\u003c/strong>: knowingly making a misleading representation, or an incomplete or fraudulent comparison of policies, to induce someone to lapse, forfeit, surrender, terminate, retain, pledge, assign, borrow on or convert a policy, or to take a policy with another insurer. \u003ccite>[MCL 500.2005a(a)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>High-pressure sales\u003c/strong>: marketing that induces purchase by \u003cstrong>force, fright, threat\u003c/strong> or \u003cstrong>undue pressure\u003c/strong>. \u003ccite>[MCL 500.2005a(b)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Undisclosed solicitation\u003c/strong>: marketing that fails to disclose conspicuously that its purpose is soliciting insurance and that an agent or insurer will make contact. \u003ccite>[MCL 500.2005a(c)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Section 2064\u003c/strong>: no misrepresenting policy terms or benefits, estimating future dividends, or making a misrepresentation or \u003cstrong>incomplete comparison\u003c/strong> to induce a purchase or a lapse and replacement. \u003ccite>[MCL 500.2064(1),(2)]\u003c/cite>\n\u003cul>\n\u003cli>\nThe commissioner \u003cstrong>revokes\u003c/strong> the license, and no new license is issued for \u003cstrong>1 year\u003c/strong>. \u003ccite>[MCL 500.2064(3)]\u003c/cite>\n\u003c/li>\u003cli>\nIt is a misdemeanor with a fine of up to \u003cstrong>$2,000 per violation\u003c/strong>, or county jail. \u003ccite>[MCL 500.2069]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nRevocation under 2064 or 2066 requires written notice and a hearing at least \u003cstrong>15 days\u003c/strong> away. The revocation takes effect \u003cstrong>10 days\u003c/strong> after the order. An appeal to the supreme court must be taken within \u003cstrong>10 days\u003c/strong>. \u003ccite>[MCL 500.2068]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Misrepresentation by applicants\u003c/strong> voids a contract only if it is \u003cstrong>material\u003c/strong>, meaning knowing the facts would have led the insurer to refuse the contract. \u003ccite>[MCL 500.2218(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>False Information and Advertising\u003c/h4>\n\u003cul>\n\u003cli>\nIt is an unfair practice to publish an advertisement, announcement or statement about the business of insurance, or about a person in it, that is \u003cstrong>untrue, deceptive or misleading\u003c/strong>, in any medium. \u003ccite>[MCL 500.2007]\u003c/cite>\n\u003c/li>\u003cli>\nAdvertising may not conceal or misrepresent the \u003cstrong>true identity of the insurer\u003c/strong>. The name of the insurer assuming the risk must appear \u003cstrong>more conspicuously\u003c/strong> than a department's or general agency's name.\n\u003cul>\n\u003cli>\nA fire-insurance representative may still advertise his or her own business.\n\u003c/li>\u003cli>\nViolation is a misdemeanor with a fine of up to \u003cstrong>$500\u003c/strong>.\n \u003ccite>[MCL 500.2057]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Insurer financial condition\u003c/strong>: a director or officer who falsely advertises it commits a misdemeanor, punishable by up to \u003cstrong>$100\u003c/strong> and/or \u003cstrong>3 months\u003c/strong>. An officer or agent who intentionally violates commits a misdemeanor, punishable by up to \u003cstrong>$1,000\u003c/strong> and/or \u003cstrong>6 months\u003c/strong>. \u003ccite>[MCL 500.2055(1),(4)]\u003c/cite>\n\u003c/li>\u003cli>\nNo person may maintain an insurance office, or use an insurer's name, for a business not connected with insurance. \u003ccite>[MCL 500.2059(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>False Statement\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>False financial statement\u003c/strong>: filing or circulating a false material statement of an insurer's financial condition, or making a false entry in (or omitting a true entry from) its books. \u003ccite>[MCL 500.2014]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>False application statements\u003c/strong>: making false or fraudulent statements on or about an \u003cstrong>application\u003c/strong> to obtain a fee, commission, money or other benefit. \u003ccite>[MCL 500.2018]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003cp>An intentional fraudulent report is cause for forfeiture of a domestic insurer's franchise, or for revocation of a foreign insurer's authority after a hearing. An officer or agent commits a misdemeanor punishable by up to $1,000 and/or 6 months. \u003ccite>[MCL 500.2062]\u003c/cite>\u003c/p>\n\u003cul>\n\u003cli>\n\u003cstrong>Auditor duty\u003c/strong>: an independent CPA must report in writing within \u003cstrong>5 business days\u003c/strong> to the board or audit committee if the insurer has materially misstated its financial condition. The insurer gives the commissioner a copy within \u003cstrong>5 business days\u003c/strong> of receipt. \u003ccite>[MCL 500.1015(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Deception\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Defamation of insurers\u003c/strong>: making or circulating a statement that is \u003cstrong>false, or maliciously critical of or derogatory to, the financial condition\u003c/strong> of a person in the business of insurance, and calculated to injure that person. \u003ccite>[MCL 500.2009]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Michigan libel and slander law\u003c/strong>:\n\u003cul>\n\u003cli>\n\"Libel\" includes radio and TV broadcasts.\n\u003c/li>\u003cli>\nExemplary or punitive damages for libel require first giving notice to publish a \u003cstrong>retraction\u003c/strong>.\n\u003c/li>\u003cli>\nPublic officials and public figures must prove by \u003cstrong>clear and convincing\u003c/strong> evidence that the falsehood was published knowingly or with reckless disregard.\n\u003c/li>\u003cli>\nPrivate individuals must show negligence, and recovery is limited to \u003cstrong>economic damages, including attorney fees\u003c/strong>.\n \u003ccite>[MCL 600.2911(2),(6),(7),(8)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Boycott, Coercion and Intimidation\u003c/h4>\n\u003cul>\n\u003cli>\nIt is an unfair practice to agree to commit, or by concerted action commit, any act of \u003cstrong>boycott, coercion or intimidation\u003c/strong> that results or tends to result in \u003cstrong>unreasonable restraint of the business of insurance\u003c/strong>. \u003ccite>[MCL 500.2012]\u003c/cite>\n\u003c/li>\u003cli>\nNo one may sell insurance by intimidation or threats. No one may induce a purchase through a particular agent or insurer by promising to sell goods, lend money or provide services, or by threatening to refuse them. Section 2077(4) allows one exception. \u003ccite>[MCL 500.1207(13)]\u003c/cite>\n\u003c/li>\u003cli>\nA lender may not require, as a condition of credit, that the borrower buy insurance through a particular agent or insurer. The lender may reasonably approve or disapprove the insurer chosen, but may not reject a policy whose coverage exceeds the required minimum. Violation is a misdemeanor with a fine of up to \u003cstrong>$100\u003c/strong>. \u003ccite>[MCL 500.2077(1),(3),(5)]\u003c/cite>\n\u003c/li>\u003cli>\nThe commissioner may refuse or deny a solicitor, adjuster or counselor license if the applicant's main business is likely to lead to coercion or indirect rebating. \u003ccite>[MCL 500.1242(3)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Inducement\u003c/h4>\n\u003cul>\n\u003cli>\nIt is unfair to issue or deliver stock, securities or other contracts \u003cstrong>promising returns and profits as an inducement\u003c/strong> to insurance. \u003ccite>[MCL 500.2017]\u003c/cite>\n\u003c/li>\u003cli>\nThe rebating sections (2024, 2066, 2070) also prohibit inducements not specified in the policy. See Rebating below.\n\u003c/li>\u003c/ul>
