 year after cancellation","It covers only employee theft, not robbery or burglary by outsiders"],"answer":0,"explain":"The discovery form is triggered by discovery, and the occurrence can be at any time. It allows a 60-day period to discover loss after the policy ends. The 1-year tail belongs to the loss sustained form.","source":"Rough Notes PF&M 251.4-2 (ISO crime forms analysis); ISO CR 00 21 11 15, E.1.g"},{"id":"comm-035","topic":"cpp","sub":"Commercial Crime – Coverages","q":"Under the crime insuring agreement 'Inside the Premises – Theft of Money and Securities,' which loss is covered?","choices":["Unexplained disappearance of money from the premises","Theft of merchandise from the sales floor by a burglar","Embezzlement of cash from the register by an employee","Counterfeit bills accepted in good faith in a sale"],"answer":0,"explain":"This agreement covers money and securities inside the premises (or a financial institution's premises) against theft, disappearance or destruction. Merchandise is 'other property', covered only for robbery of a custodian or safe burglary (Insuring Agreement 4); ordinary burglary of merchandise from the sales floor is not covered. Employee embezzlement falls under Employee Theft, and counterfeit bills under Money Orders and Counterfeit Money.","source":"ISO CR 00 21 11 15, A.1, A.3, A.4, A.7"},{"id":"comm-036","topic":"cpp","sub":"Nationwide Marine Definition","q":"Which of the following is NOT one of the classes in the Nationwide Marine Definition?","choices":["Commercial property floater risks","Domestic shipments","Personal property floater risks","Buildings and their fixed contents"],"answer":3,"explain":"The classes are imports; exports; domestic shipments; bridges, tunnels and other instrumentalities of transportation and communication; personal property floaters; and commercial property floaters. Buildings and their contents are not marine risks (MCL 500.614 excludes them).","source":"IMUA 'Nationwide Marine Definition'; MCL 500.614(4)"},{"id":"comm-037","topic":"cpp","sub":"Commercial Inland Marine Conditions","q":"Under the Commercial Inland Marine Conditions form (CM 00 01), which statement is correct?","choices":["The insured may abandon damaged property to the insurer for full payment","Each claim payment reduces the limit of insurance for the remainder of the policy period","Legal action must be brought within 1 year of the loss","Claim payments do not reduce the limit, except for the total loss of a scheduled item"],"answer":3,"explain":"CM 00 01 has a Reinstatement of Limit After Loss condition. It also prohibits abandonment and allows legal action within 2 years after the insured first has knowledge of the loss.","source":"ISO CM 00 01 09 04, Loss Cond. A, I; Gen. Cond. C"},{"id":"comm-038","topic":"cpp","sub":"Inland Marine Coverage Forms","q":"Which inland marine class is an ISO 'filed' class rather than a nonfiled class?","choices":["Contractors equipment","Accounts receivable","Motor truck cargo","Installation floater"],"answer":1,"explain":"Verisk lists accounts receivable among its filed classes, along with valuable papers, commercial articles, equipment dealers, signs and others. Contractors equipment, motor truck cargo and installation are nonfiled.","source":"Verisk 'Commercial Inland Marine' program sheet (2022)"},{"id":"comm-039","topic":"cpp","sub":"Transportation Coverages","q":"A common carrier is generally liable for loss of cargo in its care EXCEPT when the loss is caused by:","choices":["Its driver's negligence","A collision with another vehicle","An act of God","Theft from an unlocked trailer"],"answer":2,"explain":"Common carriers are liable for cargo loss except loss caused by an act of God, the public enemy, an act of the shipper, public authority, or the inherent vice of the goods. The carrier must also prove it was not negligent.","source":"Missouri Pacific R.R. v. Elmore & Stahl, 377 U.S. 134 (1964)"},{"id":"comm-040","topic":"cpp","sub":"Equipment Breakdown","q":"The ISO Equipment Breakdown Protection Coverage Form (EB 00 20) values covered property on a replacement cost basis unless:","choices":["The insured has fewer than 10 employees","The insured fails to meet a coinsurance requirement","The equipment is more than 20 years old","An Actual Cash Value endorsement is attached"],"answer":3,"explain":"Replacement cost is built into the basic equipment breakdown form. Attaching the Actual Cash Value endorsement (often used for older equipment) changes the valuation to actual cash value.","source":"FC&S 'Equipment Breakdown Coverage Form' (propertycasualty360.com, 2016); FC&S 'Equipment Breakdown Endorsements' (2018)"},{"id":"comm-041","topic":"cpp","sub":"Farm Property","q":"In the ISO farm property program, Coverage E applies to:","choices":["Dwellings","Scheduled farm personal property","Barns and other farm structures","Loss of use"],"answer":1,"explain":"A = Dwellings, B = Other Private Structures, C = Household Personal Property, D = Loss of Use, E = Scheduled Farm Personal Property, F = Unscheduled Farm Personal Property, G = Other Farm Structures. Edition note: these letters are from FP 00 10 09 94.","source":"ISO FP 00 10 09 94; Rough Notes PF&M 471.1"},{"id":"comm-042","topic":"cpp","sub":"Farm Liability","q":"Under the ISO Farm Liability Coverage Form (FL 00 20), Coverage J is:","choices":["Bodily Injury and Property Damage Liability","Personal and Advertising Injury Liability","Medical Payments","Employers Liability"],"answer":2,"explain":"Coverage H is BI/PD liability, Coverage I is personal and advertising injury, and Coverage J is medical payments (expenses incurred or ascertained within 3 years of the accident).","source":"FC&S 'Farm Liability Coverage Form' (propertycasualty360.com, 2013)"},{"id":"comm-043","topic":"cpp","sub":"Legal Liability","q":"A tenant wants coverage for its legal liability for damage to the landlord's building it occupies, caused by a covered cause of loss. Which ISO commercial property form is designed for this?","choices":["Legal Liability Coverage Form (CP 00 40)","Condominium Commercial Unit-Owners Coverage Form (CP 00 18)","Builders Risk Coverage Form (CP 00 20)","Extra Expense Coverage Form (CP 00 50)"],"answer":0,"explain":"CP 00 40 pays sums the insured is legally obligated to pay for direct physical loss to tangible property of others in its care, custody or control, caused by accident and arising from a covered cause of loss. It includes defense.","source":"ISO CP 00 40 10 12, A."},{"id":"comm-044","topic":"bop","sub":"Section I – Business Income","q":"Under the ISO Businessowners Coverage Form (BP 00 03 07 13), Business Income pays the actual loss sustained during the period of restoration that occurs within ___ after the direct physical loss, and is ___.","choices":["6 consecutive months; subject to the building limit","12 consecutive months; not subject to the Section I limits","12 consecutive months; limited to 25% of the BPP limit","18 consecutive months; subject to a separate declared limit"],"answer":1,"explain":"BOP Business Income is an Additional Coverage paying actual loss sustained for up to 12 consecutive months, with no dollar limit (it is not subject to the Section I limits). Ordinary payroll is limited to 60 days unless more days are shown.","source":"ISO BP 00 03 07 13, Sec. I A.5.f(1)(b), (4)"},{"id":"comm-045","topic":"bop","sub":"Section I – Business Income","q":"Under BP 00 03 07 13, after operations resume, Extended Business Income continues until income is restored or for up to ___ consecutive days, unless a greater number is shown in the Declarations.","choices":["30","60","90","180"],"answer":1,"explain":"BOP Extended Business Income lasts up to 60 consecutive days after the date property is repaired and operations resume.","source":"ISO BP 00 03 07 13, Sec. I A.5.f(2)"},{"id":"comm-046","topic":"bop","sub":"Section I – Loss Conditions (Valuation)","q":"A building with a full replacement cost of $400,000 is insured under a BOP (BP 00 03 07 13) for $240,000. A $50,000 partial loss occurs; its actual cash value is $30,000. Ignoring the deductible, how much does the insurer pay?","choices":["$50,000","$40,000","$37,500","$30,000"],"answer":2,"explain":"The limit is below 80% of replacement cost ($320,000), so the BOP pays the greater of ACV ($30,000) or ($240,000 ÷ $320,000) × $50,000 = $37,500. The BOP has no coinsurance clause, but this 80% rule applies to replacement cost recovery.","source":"ISO BP 00 03 07 13, Sec. I E.5.d(1)(b)"},{"id":"comm-047","topic":"bop","sub":"Section I – Limits of Insurance","q":"The BOP Business Personal Property limit automatically increases by 25% (unless another percentage is shown) for seasonal variations, but only if:","choices":["The insured reports the values of its business personal property to the insurer by the end of each month","The loss occurs between November 1 and January 31, the period when retail inventories usually peak","The insured is a retail store whose stock rises during a peak season shown in the Declarations","The BPP limit is at least 100% of average monthly values for the prior 12 months (or time in business, if less)"],"answer":3,"explain":"The seasonal increase applies only if the BPP limit is at least 100% of the average monthly values for the lesser of the preceding 12 months or the time in business.","source":"ISO BP 00 03 07 13, Sec. I C.5"},{"id":"comm-048","topic":"bop","sub":"Section I – Additional Coverages","q":"Which BP 00 03 07 13 additional coverage is correctly matched with its standard limit?","choices":["Money Orders and Counterfeit Money – $1,000","Forgery or Alteration – $10,000","Electronic Data – $2,500 per policy year","Fire Extinguisher Systems Recharge Expense – $25,000"],"answer":0,"explain":"The BOP limits are Money Orders and Counterfeit Money $1,000, Forgery or Alteration $2,500, Electronic Data $10,000 per policy year, and Fire Extinguisher Systems Recharge $5,000.","source":"ISO BP 00 03 07 13, Sec. I A.5.j, k, o, p"},{"id":"comm-049","topic":"bop","sub":"Section I – Additional Coverages","q":"Under BP 00 03 07 13, the Fire Department Service Charge additional coverage pays up to what amount per premises (unless a different limit is shown)?","choices":["$500","$1,000","$2,500","$5,000"],"answer":2,"explain":"The BOP pays up to $2,500 per premises with no deductible. The commercial property BPP form (CP 00 10) pays $1,000.","source":"ISO BP 00 03 07 13, Sec. I A.5.c, D.3"},{"id":"comm-050","topic":"bop","sub":"Section I – Coverage Extensions","q":"Under BP 00 03 07 13, the Newly Acquired or Constructed Property extension covers buildings up to ___ per building, and coverage ends ___ after acquisition or start of construction (if not reported sooner).","choices":["$100,000; 60 days","$250,000; 30 days","$500,000; 90 days","$250,000; 90 days"],"answer":1,"explain":"The extension covers buildings up to $250,000 each and business personal property up to $100,000 per building. Coverage ends at policy expiration, 30 days after acquisition or start of construction, or when values are reported.","source":"ISO BP 00 03 07 13, Sec. I A.6.a"},{"id":"comm-051","topic":"bop","sub":"Characteristics and Purpose / Eligibility","q":"Under ISO businessowners program rules, which business is INELIGIBLE for a BOP regardless of its size?","choices":["A small apartment building","A neighborhood bar","A three-story office building","A retail clothing store"],"answer":1,"explain":"Per IRMI's summary of ISO rules, bars and pubs, auto repair and dealers, manufacturers, places of amusement, and banks are ineligible regardless of size. Apartments, offices and mercantile risks are eligible classes.","source":"IRMI white paper 'Businessowners Policy Basics'"},{"id":"comm-052","topic":"bop","sub":"Section II – Limits of Insurance","q":"A BOP shows a Liability and Medical Expenses limit of $1,000,000. Under BP 00 03 07 13, the products-completed operations aggregate limit is:","choices":["$1,000,000","$2,000,000","$3,000,000","Unlimited"],"answer":1,"explain":"Both the products-completed operations aggregate and the general aggregate equal twice the Liability and Medical Expenses limit.","source":"ISO BP 00 03 07 13, Sec. II D.4"},{"id":"comm-053","topic":"bop","sub":"Section II – Exclusions","q":"A BOP-insured accounting firm is sued for an error in a client's tax return. Under BOP Section II – Liability:","choices":["The claim is covered as personal and advertising injury","The claim is covered under Medical Expenses, regardless of fault","The claim is covered only if the error appeared in the firm's advertisement","The claim is not covered because the BOP excludes professional services"],"answer":3,"explain":"BP 00 03 excludes injury caused by rendering or failing to render any professional service, including legal and accounting services (and a client's purely financial loss is not bodily injury or property damage in the first place). This exposure needs E&O/professional liability coverage.","source":"ISO BP 00 03 07 13, Sec. II B.1.j"},{"id":"comm-054","topic":"bop","sub":"Section III – Common Policy Conditions","q":"Under BOP Section III – Common Policy Conditions (BP 00 03 07 13), the insurer may cancel on as little as 5 days' written notice if:","choices":["The building has been vacant or unoccupied 60 or more consecutive days","Premium has not been paid by the due date","The insured has filed two or more claims within the same policy year","The insured changes agents or moves its business to a new location"],"answer":0,"explain":"The 5-day cancellation applies to listed building conditions such as 60+ consecutive days of vacancy or unoccupancy (other than seasonal unoccupancy or construction, renovation or addition), repairs not started within 30 days of loss payment, or a vacate or demolition order. Nonpayment requires 10 days, and other reasons 30 days.","source":"ISO BP 00 03 07 13, Sec. III A.2"},{"id":"comm-055","topic":"bop","sub":"Selected Endorsements – Protective Safeguards","q":"In the Protective Safeguards endorsement schedule, the symbol 'P-1' refers to:","choices":["Automatic fire alarm","Security service with hourly rounds","Automatic sprinkler system","Service contract with a privately owned fire department"],"answer":2,"explain":"P-1 is automatic sprinkler system, P-2 automatic fire alarm, P-3 security service, P-4 service contract with a private fire department, and P-9 a system described in the schedule.","source":"ISO IL 04 15 04 98; FC&S 'Businessowners Program Endorsements Described' (2020, BP 04 30 07 13)"},{"id":"comm-056","topic":"bop","sub":"Selected Endorsements – Protective Safeguards","q":"A BOP insured with a P-2 (central-station fire alarm) protective safeguard knows the alarm has been disconnected for weeks but does not tell the insurer. A fire then damages the building. What is the result?","choices":["Covered in full","Covered, subject to a 15% reduction","Covered for business personal property only","The fire loss is excluded"],"answer":3,"explain":"The endorsement excludes fire loss if, before the fire, the insured knew of a suspension or impairment of a listed safeguard and failed to notify the insurer, or failed to keep it in complete working order.","source":"ISO IL 04 15 04 98, B.; FC&S (2020) re BP 04 30"},{"id":"comm-057","topic":"bop","sub":"Selected Endorsements – Utility Services","q":"A restaurant loses income when an off-premises power substation is damaged by fire and its electricity is interrupted. Which BOP endorsement responds to the lost income?","choices":["Utility Services – Time Element","Utility Services – Direct Damage","Spoilage Coverage","Protective Safeguards"],"answer":0,"explain":"Utility Services – Time Element (BP 04 57) covers Business Income and Extra Expense from interruption of utility service caused by covered damage to scheduled off-premises utility property. Direct Damage (BP 04 56) covers physical damage to covered property.","source":"ISO BP 04 57 01 06, A., C.3; FC&S (2020)"},{"id":"comm-058","topic":"bop","sub":"Selected Endorsements – Utility Services","q":"Under the BOP Utility Services endorsements, loss caused by damage to overhead transmission lines is:","choices":["Always covered as part of power supply property","Never covered","Covered only if indicated in the Schedule","Covered only for water supply property"],"answer":2,"explain":"Communication and power supply property do not include overhead transmission lines unless the Schedule indicates them.","source":"ISO BP 04 57 01 06, C.2-3"},{"id":"comm-059","topic":"bop","sub":"Selected Endorsements – Hired and Non-Owned Auto","q":"An employee runs a business errand in her own car and causes an accident; the employer is sued. Which BOP endorsement covers the employer's liability?","choices":["Hired Auto and Non-Owned Auto Liability","Utility Services – Time Element","Protective Safeguards","Employee Dishonesty optional coverage"],"answer":0,"explain":"BP 04 04 covers BI/PD from use of a non-owned auto in the insured's business by any person, and from use of hired autos. A premium must be shown in the Declarations.","source":"FC&S 'Businessowners Program Endorsements Described' (2020, BP 04 04 01 10)"},{"id":"comm-060","topic":"other","sub":"Umbrella/Excess Liability","q":"When the aggregate limit of an underlying liability policy has been exhausted by claims, an umbrella policy that 'drops down' will:","choices":["Cancel automatically","Respond in place of the exhausted underlying coverage","Pay only defense costs","Require the insured to buy a new underlying limit first"],"answer":1,"explain":"One umbrella function is to drop down and pick up where the underlying policy leaves off when its aggregate is exhausted. Umbrellas also provide excess limits and cover some claims not covered by underlying policies, subject to a self-insured retention.","source":"IRMI glossary 'umbrella liability policy'; 'drop down provision'"},{"id":"comm-061","topic":"other","sub":"Specialty Liability – D&O","q":"Under a directors and officers (D&O) liability policy, which insuring agreement reimburses the corporation for amounts it pays to indemnify its directors and officers?","choices":["Side A","Side B","Side C","Side D"],"answer":1,"explain":"Side A covers directors and officers directly when the company can't or won't indemnify. Side B (corporate reimbursement) reimburses the company. Side C (entity coverage) covers the organization itself, typically for securities claims.","source":"IRMI glossary 'Side A coverage', 'corporate reimbursement coverage', 'entity securities coverage'"},{"id":"comm-062","topic":"other","sub":"Specialty Liability – Fiduciary","q":"A company 401(k) plan trustee makes an imprudent investment choice, and plan participants sue for breach of fiduciary duty under ERISA. Which coverage is designed to respond?","choices":["ERISA fidelity bond","Commercial crime employee theft coverage","Employment practices liability","Fiduciary liability insurance"],"answer":3,"explain":"Fiduciary liability covers errors in administering benefit plans under ERISA. The ERISA fidelity bond protects the plan only against fraud or dishonesty by people handling plan funds.","source":"IRMI glossary 'fiduciary liability'; 29 U.S.C. 1112(a)"},{"id":"comm-063","topic":"other","sub":"Specialty Liability – EPLI","q":"A former employee sues her employer alleging wrongful termination and sexual harassment. Which coverage is designed for this claim?","choices":["Employment practices liability insurance","Workers compensation insurance","CGL Coverage A (bodily injury and property damage)","Fiduciary liability insurance"],"answer":0,"explain":"EPLI covers wrongful acts arising from the employment process (e.g., wrongful termination, harassment, discrimination). Workers compensation covers job-related injury and disease, and CGL Coverage A excludes bodily injury to employees.","source":"IRMI glossary 'employment practices liability insurance'"},{"id":"comm-064","topic":"other","sub":"Specialty Liability – Liquor","q":"Michigan law requires a retail liquor licensee to file proof of financial responsibility for dram shop liability of not less than:","choices":["$20,000","$50,000","$100,000","$300,000"],"answer":1,"explain":"The proof may be liquor liability insurance, a surety bond, cash or securities, or a group self-insurance pool. A licensee may cancel liquor liability insurance only on 30 days' notice to the commission, with replacement proof.","source":"MCL 436.1803(1), (4)"},{"id":"comm-065","topic":"other","sub":"Surety Bonds","q":"In a construction performance bond, the project owner who is protected if the contractor fails to perform is the:","choices":["Principal","Surety","Obligee","Indemnitor"],"answer":2,"explain":"The bond is executed by the principal (the contractor) and the surety to assure the principal's obligations to a third party, the obligee.","source":"FAR 48 CFR 28.001 'Bond'"},{"id":"comm-066","topic":"other","sub":"Surety Bonds – Contract Bonds","q":"Which bond assures that a contractor will pay the persons who supply labor and material for the project?","choices":["Bid bond","Performance bond","License and permit bond","Payment bond"],"answer":3,"explain":"A payment bond assures payment to suppliers of labor and material. A performance bond secures completion of the contract. A bid bond assures the bidder will sign the contract and furnish the required bonds.","source":"FAR 48 CFR 28.001"},{"id":"comm-067","topic":"other","sub":"Surety Bonds","q":"How does a surety bond differ from a typical insurance policy?","choices":["The surety expects losses and prices the bond to pay them","The obligee pays the premium and indemnifies the surety","Only two parties are involved: the surety and the principal","The principal must reimburse the surety for losses it pays"],"answer":3,"explain":"A surety bond is a three-party contract. The surety is secondarily liable and underwrites expecting no losses, and the principal must indemnify the surety for any loss it pays.","source":"surety.org 'What is a Surety Bond?'; SFAA/AGC Surety Claims Guide"},{"id":"comm-068","topic":"other","sub":"Surplus Lines","q":"Under Michigan law, each surplus lines policy delivered to an insured must bear a notice, in red ink and at least 10-point type, stating that:","choices":["The policy is protected by the Michigan Property and Casualty Guaranty Association if the insurer fails","The insurer is not licensed by Michigan, and if it is insolvent, payment of claims may not be guaranteed","The rates and forms were approved by DIFS before the policy was issued","The agent is personally liable for claims if the insurer becomes insolvent"],"answer":1,"explain":"MCL 500.1922 requires the notice: 'This insurance has been placed with an insurer that is not licensed by the state of Michigan. In case of insolvency, payment of claims may not be guaranteed.'","source":"MCL 500.1922"},{"id":"comm-069","topic":"other","sub":"Surplus Lines","q":"A Michigan surplus lines licensee must pay what tax and fee on surplus lines premiums written?","choices":["1% premium tax and 0.5% regulatory fee","3% premium tax and no regulatory fee","2% premium tax and 1% regulatory fee","2% premium tax and 0.5% regulatory fee"],"answer":3,"explain":"The licensee files sworn statements by February 15 and August 15 and pays the 2% premium tax plus a 0.5% regulatory fee.","source":"MCL 500.1905(3)(d)"},{"id":"comm-070","topic":"other","sub":"Surplus Lines – Definitions and Markets","q":"Under MCL 500.1910, there is a rebuttable presumption that coverage is AVAILABLE from authorized insurers, so it may not be placed in surplus lines, for all of the following EXCEPT:","choices":["Private passenger auto physical damage","Any coverage readily available from 3 or more authorized insurers at competitive terms","Michigan no-fault auto insurance for someone who is not a self-insurer","Coverage the licensee could not obtain after a diligent search among authorized insurers"],"answer":3,"explain":"Coverage that cannot be procured after a diligent search among authorized insurers is presumed UNAVAILABLE and may be exported. The other three are presumed available.","source":"MCL 500.1910(2)-(3)"},{"id":"comm-071","topic":"other","sub":"National Flood Insurance Program","q":"Under the NFIP 'Write Your Own' (WYO) program:","choices":["Private insurers write and service policies in their own names; the federal government pays losses","FEMA sells flood policies only through its own employees, never private insurers","WYO companies set their own flood rates and policy forms, subject to state insurance department approval","WYO policies provide broader coverage than the same policy bought from NFIP Direct"],"answer":0,"explain":"WYO companies are private P&C insurers that write and service NFIP policies in their own names, and the federal government pays all losses. Coverage is the same whether the policy comes from a WYO company or NFIP Direct.","source":"FEMA brochure 'Meeting the Flood Insurance Requirement' (07-2024); agents.floodsmart.gov 'Flood Insurance 101'"},{"id":"comm-072","topic":"other","sub":"National Flood Insurance Program","q":"A homeowner buys NFIP flood coverage at the closing of a new mortgage loan. What waiting period applies?","choices":["None","1 day","15 days","30 days"],"answer":0,"explain":"The standard waiting period is 30 days, but there is none when coverage is bought in connection with making, increasing, extending or renewing a loan. Other exceptions apply after map revisions and for post-wildfire flooding.","source":"agents.floodsmart.gov 'Flood Insurance 101' (accessed Oct 2026)"},{"id":"comm-073","topic":"other","sub":"National Flood Insurance Program – Limits","q":"What is the maximum NFIP building coverage available for a non-residential (commercial) building?","choices":["$100,000","$250,000","$500,000","$1,000,000"],"answer":2,"explain":"Non-residential maximums are $500,000 building and $500,000 contents. Single-family and 2-4 family residential buildings max out at $250,000 (residential contents $100,000); other residential buildings with 5 or more units can be insured up to $500,000.","source":"44 CFR 61.6(a); FEMA 'NFIP Summary of Coverage - Commercial Property' (01-2024)"},{"id":"comm-074","topic":"other","sub":"National Flood Insurance Program – Deductibles","q":"Under NFIP Risk Rating 2.0 minimum deductibles, a residential building (not pre-FIRM discounted) insured for more than $100,000 of building coverage has a minimum building deductible of:","choices":["$500","$1,000","$1,250","$2,000"],"answer":2,"explain":"The minimum is $1,000 for building coverage of $100,000 or less and $1,250 for over $100,000. Pre-FIRM statutorily discounted buildings have $1,500/$2,000 minimums. Values as stated in FEMA guidance current in 2024–2025.","source":"FEMA RR2.0 'Simple Guide for Residential Manufactured/Mobile Homes' (citing FIM Sec. 3)"},{"id":"comm-075","topic":"other","sub":"Alternative Funding – Risk Retention Groups","q":"Which statement about a risk retention group under the federal Liability Risk Retention Act is correct?","choices":["It may write property and liability insurance for the general public","It must be licensed as an insurer in every state where it operates, not just one","It must participate in each state's insurance guaranty association","It is owned by its members and writes only liability insurance for them"],"answer":3,"explain":"An RRG is chartered as a liability insurer in one state, owned by members in similar businesses, and limited to liability coverage. States may not require or permit it to join guaranty funds.","source":"15 U.S.C. 3901(a)(4); 3902(a)"},{"id":"comm-076","topic":"other","sub":"Cyber Issues","q":"Which of the following is a THIRD-party cyber coverage?","choices":["Forensic investigation costs","Payments to consumers whose data was exposed","Customer notification and call-center costs","Business income lost during a network outage"],"answer":1,"explain":"Third-party coverage protects the insured from liability claims by others, such as affected consumers. Forensics, notification and business interruption are first-party costs.","source":"NAIC 'Cyber Insurance' consumer guide"},{"id":"core-001","topic":"gen","sub":"Risk Management Key Terms","q":"A condition that increases the probability of a loss, such as poor housekeeping in a factory, is called a(n):","choices":["Hazard","Peril","Exposure","Loss"],"answer":0,"explain":"A hazard is a condition that increases the chance of loss; a peril is the cause of loss itself (fire, windstorm), and exposure is the state of being subject to loss.","source":"IRMI glossary: hazard; peril; exposure"},{"id":"core-002","topic":"gen","sub":"Methods of Handling Risk","q":"A contractor decides to stop accepting asbestos-removal jobs because of the liability involved. Which method of handling risk is this?","choices":["Reduction","Avoidance","Sharing","Retention"],"answer":1,"explain":"Avoidance prevents the risk entirely by not engaging in the activity that creates it. Reduction would lower frequency or severity while still doing the work.","source":"IRMI glossary: avoidance"},{"id":"core-003","topic":"gen","sub":"Methods of Handling Risk","q":"A warehouse owner installs an automatic sprinkler system to limit the size of any fire. This is an example of:","choices":["Risk avoidance","Risk transfer","Risk reduction","Risk retention"],"answer":2,"explain":"Loss reduction focuses on lowering the severity of losses that do occur; sprinklers and firewalls are classic examples.","source":"IRMI glossary: loss control; loss reduction"},{"id":"core-004","topic":"gen","sub":"Elements of Insurable Risks","q":"All of the following are characteristics of an ideally insurable risk EXCEPT:","choices":["There should be a large number of similar exposure units","The loss should be accidental and unintentional","The premium should be economically feasible","The potential loss should be catastrophic"],"answer":3,"explain":"An ideally insurable risk should NOT produce catastrophic loss, because many units suffering loss at once defeats risk pooling. The other three are standard characteristics.","source":"Rejda & McNamara, Principles of Risk Management and Insurance (13th ed.), Characteristics of an Ideally Insurable Risk"},{"id":"core-005","topic":"gen","sub":"Adverse Selection","q":"The tendency of people who believe they have a higher-than-average chance of loss to seek insurance more often than others is called:","choices":["Adverse selection","The law of large numbers","Moral hazard","Utmost good faith"],"answer":0,"explain":"Adverse selection is the imbalance created when high-risk persons buy insurance to a much greater degree than low-risk persons; underwriting tries to counter it.","source":"IRMI glossary: adverse selection"},{"id":"core-006","topic":"gen","sub":"Law of Large Numbers","q":"According to the law of large numbers, as the number of independent exposure units in a group increases:","choices":["The probability that any single unit will suffer a loss decreases","Actual losses become more likely to approximate expected losses","Premiums must increase to pay for catastrophic losses","Adverse selection is eliminated"],"answer":1,"explain":"The law of large numbers says larger pools make actual results more predictable (closer to expected); it does not change any one unit's own chance of loss.","source":"IRMI glossary: law of large numbers"},{"id":"core-007","topic":"gen","sub":"Reinsurance","q":"An insurer separately negotiates reinsurance on one large office tower, and the reinsurer is free to accept or decline that particular risk. This is:","choices":["Treaty reinsurance","Quota share treaty reinsurance","Facultative reinsurance","A reciprocal exchange"],"answer":2,"explain":"Facultative reinsurance is negotiated risk by risk, and the reinsurer may decline any submission. Under a treaty, the reinsurer must accept all business that falls within the treaty.","source":"IRMI glossary: facultative reinsurance; treaty reinsurance"},{"id":"core-008","topic":"gen","sub":"Reinsurance","q":"Under a quota share (pro rata) reinsurance agreement, the reinsurer:","choices":["Pays only the portion of a loss that exceeds the ceding company's retention","Reviews and accepts or rejects each risk individually","Pays losses only after an annual aggregate deductible is met","Receives an agreed percentage of the premium and pays the same percentage of each loss"],"answer":3,"explain":"Pro rata (proportional) reinsurance shares premium and losses in the same fixed percentage; quota share cedes an agreed percentage of every risk in a class. Paying only above a retention describes excess of loss.","source":"IRMI glossary: quota share reinsurance; pro rata reinsurance; excess of loss reinsurance"},{"id":"core-009","topic":"gen","sub":"Types of Insurers","q":"An unincorporated group of subscribers that pool their risks and are managed by an attorney-in-fact is a:","choices":["Reciprocal insurance exchange","Stock insurance company","Lloyd's association","Fraternal benefit society"],"answer":0,"explain":"A reciprocal (interinsurance exchange) is an unincorporated group of subscribers managed by an attorney-in-fact. A stock company is owned by stockholders.","source":"IRMI glossary: reciprocal; stock company"},{"id":"core-010","topic":"gen","sub":"Financial Status (Independent Rating Services)","q":"Under A.M. Best's Financial Strength Rating scale, ratings of A and A- carry which descriptor?","choices":["Superior","Excellent","Good","Fair"],"answer":1,"explain":"A.M. Best: A++/A+ = Superior; A/A- = Excellent; B++/B+ = Good; B/B- = Fair.","source":"A.M. Best, Guide to Best's Financial Strength Ratings"},{"id":"core-011","topic":"gen","sub":"Distribution Systems","q":"Under the independent agency (American agency) system, who owns the policy records and expiration data?","choices":["The insurer","The policyholder","The independent agent","The state insurance regulator"],"answer":2,"explain":"In the independent agency system the agent retains ownership, use, and control of policy records and expirations; this distinguishes it from exclusive-agency and direct-writer systems.","source":"IRMI glossary: independent agency system"},{"id":"core-012","topic":"gen","sub":"Authority and Powers of Producers","q":"An insurer ends an agent's binding authority but leaves the agent with its signage and blank binder forms. A customer who reasonably believes the agent can still bind coverage obtains a binder. The agent's authority to bind in this situation is best described as:","choices":["Express authority","Implied authority","Fiduciary authority","Apparent authority"],"answer":3,"explain":"Apparent authority is the power a reasonable person would believe the agent has based on the principal's conduct; the insurer may be estopped from denying it. Express authority is what the agency contract actually grants, and here it had been withdrawn.","source":"IRMI glossary: apparent agency; express authority"},{"id":"core-013","topic":"gen","sub":"Producer/Insurer Relationship","q":"Under the Michigan Insurance Code, a licensed producer who is NOT appointed by the insurer with which a policy is placed is treated as:","choices":["An agent of the insured","An agent of the insurer","A subagent of the insurer's appointed producer","An insurance counselor"],"answer":0,"explain":"MCL 500.1201(b) defines an 'agent of the insured' as a producer not appointed by the placing insurer and treats that producer as representing the insured, not the insurer.","source":"MCL 500.1201(b), (c)"},{"id":"core-014","topic":"gen","sub":"Responsibilities to the Applicant/Insured","q":"Under Michigan law, premiums an agent receives from customers must be:","choices":["Deposited in the agency's operating account until the end of the month","Treated as fiduciary money and segregated from the agent's own funds","Forwarded to DIFS within 30 days","Held until the policy is issued, with any return premium retained by the agent"],"answer":1,"explain":"An agent is a fiduciary for money received as agent and must segregate premiums and return premiums from the agent's own money. Failing to remit on time is prima facie evidence of a fiduciary violation.","source":"MCL 500.1207(1), (2), (8)"},{"id":"core-015","topic":"gen","sub":"Elements of a Legal Contract","q":"In an insurance contract, the insured's consideration consists of:","choices":["The insurer's promise to pay covered losses under the policy","The producer's signature on the completed application","Payment of the premium and compliance with the policy's provisions","The declarations page and endorsements"],"answer":2,"explain":"The homeowners policy states the insurer provides coverage 'in return for the premium and compliance with all applicable provisions of this policy.' The promise to pay is the insurer's consideration.","source":"ISO HO 00 03 05 11, Agreement; NCCI WC 00 00 00 C preamble"},{"id":"core-016","topic":"gen","sub":"Distinct Characteristics of an Insurance Contract","q":"An insured pays one month's premium and then has a $300,000 covered fire loss. This unequal exchange of value, which depends on an uncertain event, shows that an insurance policy is a(n):","choices":["Unilateral contract","Contract of adhesion","Personal contract","Aleatory contract"],"answer":3,"explain":"An aleatory contract involves an uncertain event and an unequal transfer of value. Adhesion refers to the take-it-or-leave-it drafting, and unilateral means only the insurer makes an enforceable promise.","source":"IRMI glossary: aleatory contract"},{"id":"core-017","topic":"gen","sub":"Legal Interpretations affecting Contracts","q":"Because an insurance policy is a contract of adhesion, courts generally resolve a genuine ambiguity in the policy wording:","choices":["Against the insurer that drafted the policy","In favor of the insurer, since it bears the risk","According to the producer's oral explanation","By striking the ambiguous provision from the policy"],"answer":0,"explain":"Contracts of adhesion are offered on a take-it-or-leave-it basis, so courts construe ambiguities against the drafter. Michigan's Supreme Court reaffirmed this rule in Wilkie (2003).","source":"IRMI glossary: contract of adhesion; Wilkie v Auto-Owners Ins Co, 469 Mich 41 (2003)"},{"id":"core-018","topic":"gen","sub":"Legal Interpretations affecting Contracts","q":"An applicant knows a material fact that would affect the insurer's decision but intentionally says nothing about it because the application did not ask. This is:","choices":["Representation","Concealment","Warranty","Estoppel"],"answer":1,"explain":"Concealment is the willful withholding of pertinent information even though the insured was not asked about it, and it can void the policy. A misrepresentation is an affirmatively false statement.","source":"IRMI glossary: concealment; ISO CP 00 90 07 88, A"},{"id":"core-019","topic":"gen","sub":"Legal Interpretations affecting Contracts","q":"An insurer has accepted an insured's late premium payments for several years and then tries to cancel the policy because a payment was late. The doctrine that may prevent the cancellation is:","choices":["Subrogation","Utmost good faith","Estoppel","Indemnity"],"answer":2,"explain":"Estoppel prevents a party from contradicting its own prior conduct when another party reasonably relied on it; repeatedly accepting late payments is IRMI's own example.","source":"IRMI glossary: estoppel"},{"id":"core-020","topic":"gen","sub":"Legal Interpretations affecting Contracts","q":"Some courts interpret a policy to provide the coverage an insured would reasonably have expected, even if the policy wording does not provide it. This is the:","choices":["Principle of indemnity","Doctrine of utmost good faith","Doctrine of waiver","Reasonable expectations doctrine"],"answer":3,"explain":"This is the reasonable expectations doctrine. Note that Michigan's Supreme Court (Wilkie, 2003) declined to adopt it and enforces unambiguous policies as written.","source":"IRMI glossary: reasonable expectations doctrine; Wilkie v Auto-Owners Ins Co, 469 Mich 41 (2003)"},{"id":"core-021","topic":"basics","sub":"Insurable Interest","q":"For property insurance, when must the insured have an insurable interest in order to collect for a loss?","choices":["At the time of the loss","Only at the time the policy is issued","At policy inception and each renewal, but not necessarily at the time of loss","Within 60 days after the loss"],"answer":0,"explain":"Property policies pay an insured no more than that insured's interest at the time of loss; the ISO BPP likewise limits payment to the insured's financial interest.","source":"ISO HO 00 03 05 11, Sec. I Cond. A; ISO CP 00 10 10 12, E.4.d"},{"id":"core-022","topic":"basics","sub":"Underwriting - Loss Ratio","q":"An insurer's book of business has earned premiums of $2,000,000 and incurred losses of $1,300,000. What is the loss ratio?","choices":["54%","65%","35%","153%"],"answer":1,"explain":"Loss ratio = incurred losses / earned premiums = $1,300,000 / $2,000,000 = 65%.","source":"IRMI glossary: loss ratio"},{"id":"core-023","topic":"basics","sub":"Hazards","q":"A store owner stops locking the back door at night because 'insurance will pay if anything is stolen.' This is an example of a:","choices":["Moral hazard","Physical hazard","Morale hazard","Speculative risk"],"answer":2,"explain":"A morale hazard is indifference to loss because insurance will pay. A moral hazard arises from the insured's character, such as dishonesty.","source":"IRMI glossary: morale hazard; moral hazard"},{"id":"core-024","topic":"basics","sub":"Negligence - Elements of a Negligent Act","q":"All of the following are elements a plaintiff must prove to establish negligence EXCEPT:","choices":["The defendant owed the plaintiff a legal duty","The defendant breached that duty","The breach was the proximate cause of actual injury or damage","The defendant intended to cause harm"],"answer":3,"explain":"Negligence requires a duty, a breach, proximate cause, and actual damage; intent is not an element (intentional harm is a different tort).","source":"IRMI glossary: negligence"},{"id":"core-025","topic":"basics","sub":"Negligence - Defenses against Negligence","q":"Under Michigan's general comparative fault statute, a plaintiff found 60% at fault for her own injuries:","choices":["May recover economic damages reduced by 60%, but no noneconomic damages","Is completely barred from recovering any damages","Recovers all damages, including noneconomic damages, reduced by 60%","Recovers full damages because Michigan abolished contributory negligence"],"answer":0,"explain":"MCL 600.2959 reduces damages by the plaintiff's percentage of fault. If the plaintiff's fault is greater than the combined fault of the others, economic damages are reduced and noneconomic damages are not awarded.","source":"MCL 600.2958; MCL 600.2959"},{"id":"core-026","topic":"basics","sub":"Negligence - Defenses against Negligence","q":"In a Michigan negligence suit, the plaintiff proves $100,000 of economic damages and is found 30% at fault. The plaintiff can recover:","choices":["$0","$70,000","$100,000","$30,000"],"answer":1,"explain":"Contributory fault does not bar recovery in Michigan; damages are reduced by the plaintiff's 30% share ($100,000 - $30,000 = $70,000).","source":"MCL 600.2958; MCL 600.2959"},{"id":"core-027","topic":"basics","sub":"Damages - Punitive","q":"Under Michigan law, punitive damages are generally:","choices":["Available in any negligence case at the jury's discretion","Capped at three times compensatory damages","Not recoverable unless expressly authorized by statute","Available only in breach-of-contract cases"],"answer":2,"explain":"Michigan courts hold punitive damages are available only when expressly authorized by the Legislature. Michigan 'exemplary' damages are compensatory in nature.","source":"Gilbert v DaimlerChrysler Corp, 685 NW2d 391 (Mich 2004); Casey v Auto Owners Ins Co, 729 NW2d 277 (Mich App 2006) (via IADC Michigan Damages Compendium)"},{"id":"core-028","topic":"basics","sub":"Vicarious Liability","q":"A delivery driver negligently injures a pedestrian while making deliveries for his employer, and the employer is held legally responsible. The employer's liability is:","choices":["Absolute liability","Contractual liability","Strict products liability","Vicarious liability"],"answer":3,"explain":"Vicarious liability makes a principal (here, the employer) liable for the acts of its agents or employees, under the doctrine of respondeat superior.","source":"IRMI glossary: vicarious liability; LII Wex: vicarious liability"},{"id":"core-029","topic":"basics","sub":"Absolute Liability","q":"A demolition company using explosives is held liable for damage to nearby buildings even though it used every reasonable precaution. This is an example of:","choices":["Absolute liability","Vicarious liability","Comparative negligence","Contributory negligence"],"answer":0,"explain":"Ultrahazardous activities such as blasting create liability without regard to fault; using due care is not a defense.","source":"Restatement (Second) of Torts §§519-520; LII Wex: strict liability (abnormally dangerous activities)"},{"id":"core-030","topic":"basics","sub":"Named Perils versus Special (Open) Perils","q":"Under a special (open) perils property policy:","choices":["Only the perils specifically listed in the policy are covered","Direct physical loss is covered unless the cause is specifically excluded","The insured must prove a listed peril caused the loss","Only fire and lightning are covered unless the policy is endorsed"],"answer":1,"explain":"Open (special) perils coverage insures against all causes of loss except those specifically excluded. Named perils covers only the listed perils.","source":"IRMI glossary: open perils; special perils; named perils coverage"},{"id":"core-031","topic":"basics","sub":"Consequential or Indirect Loss","q":"Which of the following is a consequential (indirect) loss?","choices":["Smoke damage to the building's interior walls","The cost to replace the burned roof","Loss of rental income while a fire-damaged apartment building is being repaired","Water damage to carpets from the fire department's hoses during the fire"],"answer":2,"explain":"A consequential loss results from direct damage (for example, loss of rent). The other choices are direct physical damage to the property.","source":"IRMI glossary: consequential loss; direct loss"},{"id":"core-032","topic":"basics","sub":"Blanket versus Specific Insurance","q":"A single limit of insurance that applies to both the building and business personal property at two locations is:","choices":["Specific insurance","Excess insurance","Agreed value insurance","Blanket insurance"],"answer":3,"explain":"Blanket insurance covers two or more items under one limit; specific insurance gives each item its own separate limit.","source":"ISO CP 03 21 10 12 (definitions of specific and blanket insurance); IRMI glossary: blanket limit"},{"id":"core-033","topic":"basics","sub":"Basic Types of Construction","q":"Under ISO's six commercial construction classes, which class is the MOST fire-resistive?","choices":["Fire resistive (Construction Code 6)","Modified fire resistive (Construction Code 5)","Masonry noncombustible (Construction Code 4)","Joisted masonry (Construction Code 2)"],"answer":0,"explain":"ISO codes run from 1 (frame, least fire-resistive) to 6 (fire resistive: walls, floors, and roof rated at least 2 hours).","source":"IRMI glossary: fire resistive construction; modified fire resistive construction; joisted masonry construction"},{"id":"core-034","topic":"basics","sub":"Loss Valuation - Actual Cash Value","q":"A 10-year-old roof would cost $20,000 to replace today and has depreciated 40%. If actual cash value is determined as replacement cost minus depreciation, the ACV is:","choices":["$8,000","$12,000","$20,000","$28,000"],"answer":1,"explain":"ACV = replacement cost - depreciation = $20,000 - (40% x $20,000) = $12,000. $8,000 is the depreciation amount, not the ACV.","source":"IRMI glossary: actual cash value"},{"id":"core-035","topic":"basics","sub":"Loss Valuation - Agreed Value","q":"Under the ISO Building and Personal Property Coverage Form, the Agreed Value optional coverage:","choices":["Replaces actual cash value with replacement cost","Automatically increases the limit by a stated annual percentage","Suspends the Coinsurance condition for the property it applies to","Eliminates the deductible"],"answer":2,"explain":"Agreed Value removes the Coinsurance condition until the agreed value expiration date. Replacement Cost and Inflation Guard are separate optional coverages.","source":"ISO CP 00 10 10 12, G.1"},{"id":"core-036","topic":"basics","sub":"Policy Structure","q":"Which part of a policy identifies the named insured, the policy period, the insured location, and the limits?","choices":["Insuring agreement","Conditions","Definitions","Declarations"],"answer":3,"explain":"The declarations page shows the key information that varies from insured to insured. The insuring agreement states the insurer's promise to pay.","source":"IRMI glossary: declarations; insuring agreement"},{"id":"core-037","topic":"basics","sub":"Other Insurance - Pro Rata","q":"A building is insured under Policy A for $300,000 and Policy B for $200,000. Both are written on the same basis with pro rata other-insurance clauses. A $100,000 covered loss occurs. How much does Policy B pay?","choices":["$40,000","$50,000","$60,000","$100,000"],"answer":0,"explain":"Each insurer pays the proportion its limit bears to all limits: $200,000 / $500,000 = 40%, and 40% x $100,000 = $40,000. Policy A pays $60,000.","source":"ISO CP 00 90 07 88, G.1; ISO HO 00 03 05 11, Sec. I Cond. G"},{"id":"core-038","topic":"basics","sub":"Other Insurance - Contribution by Equal Shares","q":"Two CGL policies apply to a $250,000 covered claim, and both permit contribution by equal shares. Policy A has a $100,000 limit and Policy B has a $300,000 limit. How much does Policy B pay?","choices":["$125,000","$150,000","$187,500","$250,000"],"answer":1,"explain":"Under equal shares, each insurer pays equally until its limit is used up: A and B each pay $100,000 (A is exhausted), and B pays the remaining $50,000, for a total of $150,000. $187,500 would be B's share by limits.","source":"ISO CG 00 01, Sec. IV Cond. 4.c Method Of Sharing; IRMI glossary: contribution by equal shares"},{"id":"core-039","topic":"basics","sub":"Coinsurance","q":"A building worth $400,000 at the time of loss is insured for $240,000 under a commercial property policy with an 80% coinsurance clause and a $1,000 deductible. A $50,000 covered loss occurs. Using the ISO coinsurance formula, the insurer pays:","choices":["$37,500","$49,000","$36,500","$29,000"],"answer":2,"explain":"Required insurance = $400,000 x 80% = $320,000. $240,000 / $320,000 = 0.75, so $50,000 x 0.75 = $37,500, less the $1,000 deductible = $36,500. The deductible is subtracted after the coinsurance calculation.","source":"ISO CP 00 10 10 12, F.1 and D"},{"id":"core-040","topic":"basics","sub":"Coinsurance","q":"A building worth $300,000 at the time of loss is insured for $200,000 with an 80% coinsurance clause and no deductible. It is totally destroyed by a covered fire. The insurer pays:","choices":["$250,000","$240,000","$300,000","$200,000"],"answer":3,"explain":"Required = $240,000; $200,000 / $240,000 x $300,000 = $250,000. But the insurer pays that amount or the Limit of Insurance, whichever is less, so it pays $200,000.","source":"ISO CP 00 10 10 12, F.1"},{"id":"core-041","topic":"basics","sub":"Vacancy or Unoccupancy","q":"Under the ISO Building and Personal Property Coverage Form, a building has been vacant for more than 60 consecutive days when a covered windstorm damages it. The insurer will:","choices":["Reduce the amount it would otherwise pay by 15%","Pay nothing for the loss","Pay in full, because vacancy affects only theft losses","Reduce the payment by 50%"],"answer":0,"explain":"After 60 consecutive days of vacancy, vandalism, sprinkler leakage, building glass breakage, water damage, theft, and attempted theft are not covered. All other covered causes, such as windstorm, are reduced by 15%.","source":"ISO CP 00 10 10 12, E.6.b"},{"id":"core-042","topic":"basics","sub":"Named Insured Provisions - Abandonment","q":"After a fire, the insured tells the insurer, 'Take the damaged inventory - it's yours - and pay me its full value.' Under the ISO commercial property form:","choices":["The insurer must accept the property and pay its full value","There can be no abandonment of any property to the insurer","The insurer must accept the property if the insured files a sworn proof of loss within 60 days","Abandonment is allowed only for stock, not for buildings"],"answer":1,"explain":"The BPP Loss Conditions state: 'There can be no abandonment of any property to us.' The insurer may, at its option, take property at an agreed or appraised value, but the insured cannot force it to.","source":"ISO CP 00 10 10 12, E.1 and E.4.a"},{"id":"core-043","topic":"basics","sub":"Insurer Provisions - Liberalization","q":"A liberalization clause provides that:","choices":["The insured may broaden coverage mid-term without paying additional premium","The insurer may restrict coverage mid-term by giving the named insured 30 days' written notice","Coverage broadened by the insurer without additional premium automatically applies to existing policies","The insured may cancel at any time and receive a pro rata refund"],"answer":2,"explain":"Liberalization extends broadened coverage to existing policies. The ISO commercial property version applies to revisions adopted within 45 days before or during the policy period; the ISO homeowners version uses 60 days.","source":"ISO CP 00 90 07 88, E; ISO HO 00 03 05 11, Sections I and II Cond. A"},{"id":"core-044","topic":"basics","sub":"Insurer Provisions - Subrogation","q":"After paying its insured for collision damage caused by a negligent driver, the insurer sues that driver to recover what it paid. This right is called:","choices":["Salvage","Contribution","Indemnification","Subrogation"],"answer":3,"explain":"Subrogation transfers to the insurer, after payment, the insured's right to recover from the party legally liable for the loss.","source":"IRMI glossary: subrogation; ISO CP 00 90 07 88, I"},{"id":"core-045","topic":"basics","sub":"Third-Party Provisions - Standard Mortgage Clause","q":"Under the standard mortgage clause in an ISO homeowners policy, the insurer denies the insured's fire claim because the insured committed arson. The named mortgagee:","choices":["Can still collect on a valid claim if it meets conditions such as paying premium due on demand and filing a sworn loss statement","Loses its rights, because the mortgagee's rights under the policy depend entirely on the insured's conduct","Must first obtain a judgment against the insured for the mortgage debt before the insurer will pay","Is entitled only to a return of the unearned premium"],"answer":0,"explain":"The standard mortgage clause protects the mortgagee from the insured's acts if the mortgagee reports known changes in risk, pays premium due on demand, and submits a sworn statement of loss within 60 days after notice. A loss payable clause generally gives no such independent protection.","source":"ISO HO 00 03 05 11, Sec. I Cond. L; IRMI glossary: loss payable clause"},{"id":"core-046","topic":"basics","sub":"Third-Party Provisions - No Benefit to the Bailee","q":"A dry cleaner holding customers' clothing tries to have its liability for a fire at its plant paid by the customers' own property insurance. The policy provision that prevents this is:","choices":["Loss payable clause","No benefit to bailee","Liberalization","Other insurance"],"answer":1,"explain":"No person or organization, other than the insured, that has custody of covered property benefits from the insurance; the HO version specifically refers to those holding, storing, or moving property for a fee.","source":"ISO CP 00 90 07 88, F; ISO HO 00 03 05 11, Sec. I Cond. M"},{"id":"core-047","topic":"basics","sub":"Insurer Provisions - Duty to Defend","q":"Under the ISO Commercial General Liability coverage form, the insurer's right and duty to defend ends when:","choices":["Defense costs equal the each-occurrence limit","The insured is found more than 50% at fault","The applicable limit is used up in paying judgments or settlements","The policy period expires, even if the suit is still pending"],"answer":2,"explain":"The CGL states the duty to defend ends when the applicable limit is used up paying judgments or settlements under Coverages A or B or medical expenses under C. Defense costs are paid as supplementary payments and do not erode limits.","source":"ISO CG 00 01 04 13, Sec. I Cov. A.1.a(2)"},{"id":"core-048","topic":"basics","sub":"Role of Applications and Binders","q":"In an insurance transaction, a binder is:","choices":["A permanent substitute for the policy","The insurer's approval of the producer's appointment","An endorsement that adds a mortgagee to the policy","Temporary evidence of insurance until the policy can be issued"],"answer":3,"explain":"A binder is a legal agreement issued by an agent or insurer as temporary evidence of coverage. It should be in writing, have a definite time limit, and name the insurer.","source":"IRMI glossary: binder"},{"id":"core-049","topic":"basics","sub":"Insurance Claims Handling","q":"Which type of adjuster represents the insured rather than the insurance company?","choices":["Public adjuster","Staff adjuster","Independent adjuster","Catastrophe adjuster"],"answer":0,"explain":"A public adjuster represents the insured in presenting a claim and is usually paid a percentage of the settlement. Staff adjusters are insurer employees; independent adjusters work for insurers on contract.","source":"IRMI glossary: public adjuster; adjuster; independent adjuster"},{"id":"core-050","topic":"basics","sub":"Insurance Claims Handling","q":"Under Michigan's timely-payment statute, if an insurer does not pay its own insured's claim within 60 days after receiving satisfactory proof of loss, the benefits bear simple interest at:","choices":["6% per year","12% per year","The prime rate plus 2%","18% per year"],"answer":1,"explain":"MCL 500.2006(4): benefits not paid on a timely basis bear simple interest at 12% per annum from 60 days after the insurer receives satisfactory proof of loss. For the insured (or a person directly entitled under the policy) this interest is owed even if the claim was reasonably in dispute; the \"not reasonably in dispute\" and court-found bad-faith conditions apply only to third-party tort claimants.","source":"MCL 500.2006(1), (3), (4); Griswold Props, LLC v Lexington Ins Co, 276 Mich App 551 (2007)"},{"id":"core-051","topic":"basics","sub":"Insurance Claims Handling","q":"Under MCL 500.2006, unless a claim is settled sooner, the insurer must specify in writing what materials constitute a satisfactory proof of loss within how many days after receiving the claim?","choices":["10 days","60 days","30 days","90 days"],"answer":2,"explain":"The insurer must specify the required proof-of-loss materials in writing within 30 days after receiving a claim, unless the claim is settled within those 30 days. The 60-day period is the payment deadline after proof of loss.","source":"MCL 500.2006(3)"},{"id":"core-052","topic":"basics","sub":"Limits of Liability - Aggregate","q":"Under the ISO CGL coverage form, which of the following is NOT paid from the General Aggregate Limit?","choices":["Medical expenses under Coverage C","Personal and advertising injury damages under Coverage B","Bodily injury from a customer's fall on the insured's premises","Bodily injury included in the products-completed operations hazard"],"answer":3,"explain":"The General Aggregate covers Coverage C, Coverage B, and Coverage A except products-completed operations. Products-completed operations BI/PD has its own separate aggregate.","source":"ISO CG 00 01 04 13, Sec. III.2-3"},{"id":"core-053","topic":"basics","sub":"Common Policy Provisions - Insureds","q":"Under a commercial policy with several named insureds, which insured is responsible for paying premium and receives cancellation notices and return premiums?","choices":["The first named insured","Every named insured equally","Any additional insured","The mortgageholder"],"answer":0,"explain":"Under the ISO Common Policy Conditions, the first named insured (listed first in the declarations) is responsible for paying all premiums, is the payee for return premiums, and is the one the insurer sends cancellation notice to. Other named insureds and additional insureds do not have these duties.","source":"ISO IL 00 17 11 98, A and E; IRMI glossary: first named insured; NCCI WC 00 00 00 C, Part Six E"},{"id":"core-054","topic":"wc","sub":"Exclusive Remedy (418.131)","q":"Under the Michigan Workers' Disability Compensation Act, the only exception to workers' compensation being the employee's exclusive remedy against the employer is:","choices":["Gross negligence by the employer","An intentional tort","A violation of an OSHA standard","An injury caused by a co-worker's negligence"],"answer":1,"explain":"MCL 418.131(1): 'The only exception to this exclusive remedy is an intentional tort.' Negligence, including gross negligence, does not qualify.","source":"MCL 418.131(1)"},{"id":"core-055","topic":"wc","sub":"Exclusive Remedy (418.131)","q":"Under MCL 418.131, an employer is deemed to have intended an employee's injury when the employer:","choices":["Failed to provide safety training required by OSHA","Was grossly negligent in maintaining equipment that later injured the employee","Had actual knowledge that an injury was certain to occur and willfully disregarded it","Knew an injury was possible and did not post a warning sign near the hazard"],"answer":2,"explain":"An intentional tort requires a deliberate act with specific intent to injure; intent is deemed if the employer had actual knowledge that injury was certain to occur and willfully disregarded it. Whether an act was an intentional tort is a question of law for the court.","source":"MCL 418.131(1)"},{"id":"core-056","topic":"wc","sub":"Employer Covered (Required) (418.115)","q":"A private, non-agricultural Michigan employer has only 2 employees. It is subject to the WDCA if:","choices":["Its annual payroll exceeds $50,000","Both employees have worked for it at least 20 hours per week for 30 days or longer","It has been in business for at least 1 year","At least 1 has been regularly employed 35+ hours per week for 13+ weeks in the preceding 52 weeks"],"answer":3,"explain":"Private employers with fewer than 3 employees are covered if at least 1 has been regularly employed 35+ hours per week for 13+ weeks in the preceding 52 weeks. Employers that regularly employ 3 or more at one time are always covered.","source":"MCL 418.115(a)-(b)"},{"id":"core-057","topic":"wc","sub":"Benefits Provided (418.311)","q":"A worker is disabled by a work injury for 3 weeks. Under MCL 418.311, weekly compensation is:","choices":["Computed from the date of injury","Paid beginning on the 8th day only","Paid beginning on the 15th day only","Not payable for the first week under any circumstances"],"answer":0,"explain":"No compensation is paid for the first week unless incapacity lasts longer; compensation starts on the 8th day. If incapacity continues for 2 weeks or longer (or death results), compensation is computed from the date of injury.","source":"MCL 418.311"},{"id":"core-058","topic":"wc","sub":"Benefits Provided (418.351)","q":"Michigan weekly wage-loss benefits for total disability equal what percentage of the employee's after-tax average weekly wage, subject to the state maximum?","choices":["66 2/3%","80%","70%","90%"],"answer":1,"explain":"Total disability benefits are 80% of after-tax AWW, capped at the maximum weekly rate. The maximum itself is set at 90% of the state average weekly wage.","source":"MCL 418.351(1); MCL 418.355(2)"},{"id":"core-059","topic":"wc","sub":"Benefits Provided (418.345)","q":"When a work injury causes death, the employer's liability for funeral and burial expenses under MCL 418.345 is limited to:","choices":["$5,000 or the actual cost, whichever is less","$10,000 or the actual cost, whichever is less","$6,000 or the actual cost, whichever is less","The actual cost, with no dollar limit"],"answer":2,"explain":"MCL 418.345 caps the cost of the funeral and burial at $6,000 or the actual cost, whichever is less; the employer also pays the reasonable expense of the last sickness.","source":"MCL 418.345"},{"id":"core-060","topic":"wc","sub":"Benefits Provided (418.361 specific loss)","q":"Under Michigan's specific loss schedule, the loss of a hand is compensated for:","choices":["269 weeks","162 weeks","65 weeks","215 weeks"],"answer":3,"explain":"MCL 418.361(2): hand 215 weeks; arm 269; foot 162; leg 215; eye 162; thumb 65.","source":"MCL 418.361(2)"},{"id":"core-061","topic":"wc","sub":"Second Injury Fund (418.521)","q":"A worker who had previously lost an eye loses a leg in a work accident. Under MCL 418.521, after the payments for the second loss end, the worker:","choices":["Is conclusively presumed totally and permanently disabled, with benefits paid by the Second Injury Fund","Receives only the specific-loss weeks for the leg","Must prove total and permanent disability at a new hearing before any further benefits are paid","Is paid by the Michigan Workers' Compensation Placement Facility"],"answer":0,"explain":"Loss of a second hand, arm, foot, leg, or eye after a prior such loss creates a conclusive presumption of total and permanent disability. The Second Injury Fund pays beginning at the end of payments for the second loss.","source":"MCL 418.521(1)"},{"id":"core-062","topic":"wc","sub":"Michigan Workers' Compensation Placement Facility","q":"The Michigan Workers' Compensation Placement Facility exists primarily to:","choices":["Pay benefits to employees of insolvent workers' compensation insurers","Provide workers' compensation insurance to employers unable to obtain it through ordinary methods","Pay benefits to employees of uninsured employers","Set the rates that all Michigan workers' compensation insurers must use for each class"],"answer":1,"explain":"Every insurer authorized to write workers' compensation in Michigan must participate in the facility, which provides coverage to those who cannot obtain it normally while encouraging maximum use of the private market.","source":"MCL 500.2301"},{"id":"core-063","topic":"wc","sub":"Federal Workers' Compensation Laws","q":"A crew member injured aboard a Great Lakes freighter through the employer's negligence would ordinarily seek recovery under:","choices":["The Longshore and Harbor Workers' Compensation Act","The Michigan WDCA's Second Injury Fund","The Jones Act","The Defense Base Act"],"answer":2,"explain":"The Jones Act (now 46 USC 30104, formerly 46 USC 688) lets an injured seaman sue the employer for negligence with a jury trial. The LHWCA expressly excludes a master or member of the crew of any vessel.","source":"46 USC 30104(a); 33 USC 902(3)(G)"},{"id":"core-064","topic":"wc","sub":"Part Two - Employers Liability Insurance","q":"The standard employers liability (Part Two) limits on the workers' compensation and employers liability policy are:","choices":["$100,000 each accident / $100,000 disease-policy limit / $500,000 disease-each employee","$500,000 each accident / $500,000 disease-policy limit / $500,000 disease-each employee","$1,000,000 each accident / $1,000,000 disease-policy limit / $1,000,000 disease-each employee","$100,000 each accident / $500,000 disease-policy limit / $100,000 disease-each employee"],"answer":3,"explain":"The standard employers liability limits are $100,000 bodily injury by accident (each accident), $500,000 bodily injury by disease (policy limit) and $100,000 bodily injury by disease (each employee). The actual limits are shown in Item 3.B of the Information Page, and higher limits may be bought. (National standard. In Michigan, manual rules and experience mods come from CAOM, not NCCI.)","source":"NCCI WC 00 00 00 C, Part Two G (limits in Item 3.B); national standard EL limits as reproduced in NCRB Basic Manual Rule 5; CAOM Michigan WC Placement Facility Basic Manual, Rule Eight (increased limits $500,000 / $1,000,000)"},{"id":"core-065","topic":"wc","sub":"Part Three - Other States Insurance","q":"An employer's WC policy lists Michigan in Item 3.A and several other states, including Indiana, in Item 3.C. Midway through the policy term, the employer begins a job in Indiana and is not otherwise insured there. Coverage for the Indiana work:","choices":["Applies as if Indiana were listed in Item 3.A, and the employer must tell the insurer at once","Does not apply until Indiana is endorsed onto the policy at renewal","Applies only to employers liability, not to Indiana workers' compensation benefits","Applies only if the insurer is notified within 90 days after the Indiana work begins"],"answer":0,"explain":"Part Three applies to states listed in Item 3.C. If work begins there after the effective date, the policy applies as though the state were in 3.A; the insured must notify the insurer at once. (The 30-day notice rule applies to work already underway on the effective date in a state not listed in 3.A.)","source":"NCCI WC 00 00 00 C (Ed. 1-15), Part Three A.2, A.4, B"},{"id":"core-066","topic":"wc","sub":"Premium Computation","q":"An employer's payroll in one classification is $250,000, the rate is $4.00 per $100 of payroll, and its experience modification is 0.85. What is the premium after the experience modification is applied?","choices":["$10,000","$8,500","$11,500","$850"],"answer":1,"explain":"Manual premium = ($250,000 / 100) x $4.00 = $10,000. Applying a 0.85 mod (a credit) gives $8,500. A mod above 1.00 would be a debit.","source":"CAOM Michigan WC Placement Facility Basic Manual, Part One premium algorithm (Manual Premium = (Payroll/100) x Rate; x Experience Modification); IRMI glossary: manual premium; standard premium"},{"id":"core-067","topic":"wc","sub":"Part One - Workers' Compensation Insurance","q":"An employer knowingly employs a 15-year-old in violation of child labor law. The minor is injured on the job, and Michigan law requires double compensation. Under the standard WC policy, who ultimately bears the extra benefits above the regular statutory amount?","choices":["The insurer, because Part One has no dollar limit","The Second Injury Fund","The employer, who must reimburse the insurer for those payments","The Michigan Workers' Compensation Placement Facility"],"answer":2,"explain":"Part One F makes the employer responsible for payments above regular benefits required because it knowingly employed someone in violation of law; if the insurer pays them, the employer must reimburse it. MCL 418.161(1)(l) provides double compensation for illegally employed minors under 18.","source":"NCCI WC 00 00 00 C, Part One F; MCL 418.161(1)(l)"},{"id":"core-068","topic":"wc","sub":"Selected Endorsement - Voluntary Compensation","q":"The Voluntary Compensation and Employers Liability Coverage Endorsement is used to:","choices":["Extend workers compensation coverage to the other states listed in Item 3.C","Increase the employers liability limits","Cover longshore workers under the USL&HW Act","Pay statutory-equivalent benefits to employees the employer need not cover by law"],"answer":3,"explain":"The endorsement pays benefits equal to those of a designated WC law to scheduled employees not required to be covered (for example, farm or domestic workers). Before payment, the claimant must release the employer and insurer and transfer recovery rights to the insurer.","source":"NCCI WC 00 03 11 A; IRMI glossary: voluntary compensation endorsement"},{"id":"prop-001","topic":"mi","sub":"Michigan Property and Casualty Guaranty Association","q":"All of the following insurers are required to be members of the Michigan Property and Casualty Guaranty Association EXCEPT:","choices":["A surplus lines insurer from which coverage was procured under the surplus lines chapter","An authorized insurer writing workers' compensation insurance in Michigan","An authorized insurer writing homeowners insurance in Michigan","An authorized insurer writing private passenger automobile insurance in Michigan"],"answer":0,"explain":"Membership is required of insurers authorized to write non-life/non-disability insurance in Michigan. An insurer used solely through the surplus lines chapter (chapter 19) is not an authorized insurer for this purpose, so it is not a member and its insureds are not protected.","source":"MCL 500.7911(1)-(2)"},{"id":"prop-002","topic":"mi","sub":"Michigan Property and Casualty Guaranty Association","q":"The Michigan Property and Casualty Guaranty Association's per-claim cap does NOT apply to which of the following covered claims?","choices":["A homeowners dwelling claim","A commercial property claim","A commercial general liability claim","A claim for no-fault PIP benefits"],"answer":3,"explain":"MCL 500.7925(6) caps covered claims at $5,000,000 (CPI-adjusted; $7,980,000 for 2026), but the cap does not apply to worker's compensation claims or PIP benefits under section 3107.","source":"MCL 500.7925(6); DIFS Bulletin 2026-04-INS"},{"id":"prop-003","topic":"mi","sub":"Michigan Property and Casualty Guaranty Association","q":"Under MCL 500.7925(4), a claim by or against an insured is NOT a covered claim of the Guaranty Association if the insured's net worth exceeds a statutory base amount (adjusted annually for CPI) of:","choices":["$5,000,000","$10,000,000","$25,000,000","$50,000,000"],"answer":2,"explain":"The statute sets the net worth limit at $25,000,000, adjusted each January 1 for CPI ($39,920,000 for 2026). $5,000,000 is the base per-claim cap, a different limit.","source":"MCL 500.7925(4); DIFS Bulletin 2026-04-INS"},{"id":"prop-004","topic":"mi","sub":"Michigan Property and Casualty Guaranty Association","q":"When the Michigan Property and Casualty Guaranty Association pays unearned premium claims of an insolvent insurer, a refund will NOT be made if the amount is less than:","choices":["$25","$50","$100","$500"],"answer":1,"explain":"MCL 500.7925(2)(a) provides that a refund of less than $50 shall not be made. $500 is the statutory base maximum unearned premium per person (CPI-adjusted; $2,063 for 7/1/2026-6/30/2027).","source":"MCL 500.7925(2)(a); DIFS Bulletin 2026-13-INS"},{"id":"prop-005","topic":"mi","sub":"Michigan Property and Casualty Guaranty Association","q":"After a receiver is appointed for an insolvent property and casualty insurer, the Guaranty Association continues coverage under the insurer's in-force policies until they expire, are replaced, or are canceled by the association, but in no event for more than:","choices":["10 days after the receiver is appointed","30 days after the receiver is appointed","60 days after the receiver is appointed","6 months after the receiver is appointed"],"answer":1,"explain":"Coverage continues no more than 30 days after the receiver's appointment. The association may also cancel those policies on 10 days' written notice. The 6-month figure is the automatic stay of court proceedings.","source":"MCL 500.7931(4)-(5); MCL 500.7945(1)"},{"id":"prop-006","topic":"mi","sub":"Mandatory Fire Policy Provisions","q":"Under Michigan's mandatory fire policy provisions, a fire policy must provide AT A MINIMUM coverage for:","choices":["Replacement cost of the property, without deduction for depreciation","Market value of the property, excluding land","Agreed value of the property as stated in the declarations","Actual cash value of the property at the time of loss"],"answer":3,"explain":"MCL 500.2833(1)(a) requires, at a minimum, coverage for the actual cash value of the property at the time of loss. Replacement cost may be provided, but it is not the statutory minimum.","source":"MCL 500.2833(1)(a)"},{"id":"prop-007","topic":"mi","sub":"Mandatory Fire Policy Provisions","q":"Which of the following is NOT one of the provisions Michigan law requires in every fire insurance policy?","choices":["Coverage is suspended while the dwelling is vacant for more than 30 days","There can be no abandonment of property to the insurer","The insurer may repair, rebuild, replace, or take the property","The policy takes effect at 12:01 a.m. standard time at the location of the property"],"answer":0,"explain":"MCL 500.2833(1) requires the policy to state the conditions that suspend or restrict coverage, but it does not mandate a 30-day vacancy suspension. The 12:01 a.m. effective time, no abandonment, and the insurer's option to repair or take the property are all required provisions.","source":"MCL 500.2833(1)(f),(n),(o),(s)"},{"id":"prop-008","topic":"mi","sub":"Mandatory Fire Policy Provisions","q":"A Michigan insured submits proof of the amount of a fire loss to his insurer. Under Michigan's mandatory fire policy provisions, the loss is payable within how many days after the insurer receives that proof, assuming the 25% fire-withholding statute (MCL 500.2845) does not apply?","choices":["10 days","30 days","60 days","90 days"],"answer":1,"explain":"MCL 500.2833(1)(p) requires payment within 30 days after receipt of proof of the amount of loss, except as provided in 500.2845. The unendorsed ISO HO form's 60-day loss payment condition yields to the statute.","source":"MCL 500.2833(1)(p); ISO HO 00 03 05 11 Sec. I Cond. J"},{"id":"prop-009","topic":"mi","sub":"Mandatory Fire Policy Provisions","q":"Under Michigan's mandatory fire policy provisions, the insured must commence a lawsuit against the insurer:","choices":["Within 1 year after the loss or any longer period in the policy, tolled from notice of loss until formal denial of liability","Within 1 year after the loss, with no tolling or extension, even if the policy states a longer period","Within 2 years after the insurer receives the sworn proof of loss, tolled while any appraisal is pending","Within 3 years after the loss, as provided in the general statute of limitations for property damage"],"answer":0,"explain":"MCL 500.2833(1)(q) requires suit within 1 year after the loss or the policy's period, whichever is longer. The time is tolled from when the insured notifies the insurer of the loss until the insurer formally denies liability.","source":"MCL 500.2833(1)(q)"},{"id":"prop-010","topic":"mi","sub":"Mandatory Fire Policy Provisions","q":"A Michigan insured cancels her fire insurance policy midterm. Under the mandatory fire policy provisions, the insurer's minimum earned premium may not be less than:","choices":["The short-rate premium for the expired time","10% of the annual premium","The pro rata premium for the expired time or $50, whichever is greater","The pro rata premium for the expired time or $25, whichever is greater"],"answer":3,"explain":"MCL 500.2833(1)(h) allows the insured to cancel at any time, and the minimum earned premium is the greater of the pro rata premium for the expired time or $25. The same minimum applies when the insurer cancels under (1)(i).","source":"MCL 500.2833(1)(h)-(i)"},{"id":"prop-011","topic":"mi","sub":"Appraisal","q":"An insured and insurer disagree on the amount of a fire loss, and the insured makes a written demand for appraisal under Michigan law. The two app
