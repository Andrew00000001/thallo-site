:"reg-048","topic":"reg","sub":"False Statement","q":"An agent enters false information on an application to obtain a commission from the insurer. Under the Uniform Trade Practices Act, this is:","choices":["An unfair method of competition and unfair or deceptive act or practice","Acceptable, if the insured signs the application","Only a matter between the agent and the insurer under their contract","Permitted, if the policy is later canceled"],"answer":0,"explain":"Making false or fraudulent statements on or about an application in order to obtain a fee, commission, money or other benefit is an unfair trade practice. It may also be a fraudulent insurance act under 4503.","source":"MCL 500.2018; MCL 500.4503(a)"},{"id":"reg-049","topic":"reg","sub":"Fiduciary Responsibilities","q":"Which statement about an agent's handling of premiums in Michigan is correct?","choices":["The agent may put personal money into the premium account only to open it and to pay or avoid account fees.","The agent may deposit premiums in a personal checking account if the agent keeps a ledger.","The premium account must be non-interest-bearing.","The agent may use premium funds for agency operating expenses and repay them within 30 days."],"answer":0,"explain":"Premiums and return premiums are fiduciary money that must be segregated and not commingled. The agent may use his or her own money only to open the separate account and to pay or avoid bank fees. The account must be at a federally insured institution and may bear interest.","source":"MCL 500.1207(2),(3)"},{"id":"reg-050","topic":"reg","sub":"Fiduciary Responsibilities","q":"An agent's failure to turn over, in a timely manner, money held in a fiduciary capacity to the persons to whom it is owed is:","choices":["Prima facie evidence of a violation of the agent's fiduciary responsibility","A violation only if the delay exceeds 90 days","A contract matter that the director cannot act on","Permitted, if the money is held in an interest-bearing account"],"answer":0,"explain":"Failure to turn over fiduciary money in a timely manner is prima facie evidence of a violation of fiduciary responsibility. Misappropriating or converting money is also a 1239(1)(b) licensing cause.","source":"MCL 500.1207(8); MCL 500.1239(1)(b)"},{"id":"reg-051","topic":"reg","sub":"Fiduciary Responsibilities","q":"An agent may hold an insured's return premium in the agent's premium account to pay that insured's future premiums only if:","choices":["The amount is less than $50","The insurer approves in writing","The agent notifies the director within 30 days","The insured gives written authorization"],"answer":3,"explain":"An agent may hold returned premiums in the separate account to pay future premiums for an insured only with the insured's written authorization.","source":"MCL 500.1207(4)"},{"id":"reg-052","topic":"reg","sub":"Insurance Fraud Regulation","q":"A person knowingly, and with intent to defraud, submits a claim supported by a falsified repair estimate. Under Michigan's insurance fraud law, the maximum penalty for this fraudulent insurance act is:","choices":["A misdemeanor, punishable by up to 90 days in jail","A felony, punishable by up to 4 years in prison and/or a fine of up to $50,000, plus restitution","A felony, punishable by up to 10 years in prison and/or a fine of up to $100,000","A civil fine of up to $5,000 only"],"answer":1,"explain":"A fraudulent insurance act under 4503 is a felony punishable by up to 4 years and/or $50,000, and the court must order restitution. An agreement or conspiracy to commit one is a felony punishable by up to 10 years and/or $50,000.","source":"MCL 500.4503(c); MCL 500.4511(1),(2)"},{"id":"reg-053","topic":"reg","sub":"Insurance Fraud Regulation","q":"Two people agree to stage an auto accident and file false injury claims. Under MCL 500.4511, entering into such an agreement or conspiracy to commit a fraudulent insurance act is punishable by up to:","choices":["1 year in jail","4 years in prison","10 years in prison","20 years in prison"],"answer":2,"explain":"An agreement or conspiracy to commit a fraudulent insurance act is a felony punishable by up to 10 years and/or a fine of up to $50,000, plus restitution.","source":"MCL 500.4511(2)"},{"id":"reg-054","topic":"reg","sub":"Insurance Fraud Regulation","q":"A person who is paid by a medical practitioner to bring in patients so that the practitioner can obtain insurance benefits or assert claims against insurers is called a:","choices":["Runner, capper, or steerer","Licensed solicitor","Public adjuster or appraiser","Insurance counselor"],"answer":0,"explain":"A runner, capper or steerer receives a benefit from a practitioner for procuring clients or patients in order to obtain insurance benefits or assert claims. Using or acting as one with intent to defraud is a fraudulent insurance act.","source":"MCL 500.4501(h); MCL 500.4503(h)"},{"id":"reg-055","topic":"reg","sub":"Insurance Fraud Regulation","q":"An insurance agent reports suspected claim fraud to the state police in good faith, but the suspicion turns out to be wrong. The insured sues the agent for slander. Under Michigan law:","choices":["The agent is strictly liable for any false report, even one made in good faith","The agent is immune only if the report was made in writing through the insurer's attorney","The agent is liable unless the insured was convicted","The agent is immune from libel, slander or other tort claims, absent malice or knowledge of falsity"],"answer":3,"explain":"A person who, in the absence of malice, files a report or furnishes information about suspected insurance fraud to an authorized agency is not subject to civil liability for libel, slander or other torts, unless the person knows the information is false.","source":"MCL 500.4509(1),(3)"},{"id":"reg-056","topic":"reg","sub":"Consumer Privacy Regulation","q":"Michigan's privacy of financial information law (Chapter 5 of the Insurance Code) applies to nonpublic personal financial information about individuals who obtain insurance primarily for:","choices":["Business purposes of a sole proprietor","Agricultural purposes","Commercial purposes","Personal, family, or household purposes"],"answer":3,"explain":"Chapter 5 covers individuals who obtain products or services primarily for personal, family or household purposes. It does not apply to information about companies, or about individuals who obtain products for business, commercial or agricultural purposes.","source":"MCL 500.501(1)"},{"id":"reg-057","topic":"reg","sub":"Consumer Privacy Regulation","q":"A licensee must provide its privacy notice to customers \"annually\" during the customer relationship. Under Michigan law, \"annually\" means:","choices":["At least once in any period of 12 consecutive months","Every January 1","At each policy renewal, even for multi-year policies","Within 30 days after each policy anniversary"],"answer":0,"explain":"\"Annually\" means at least once in any period of 12 consecutive months during the customer relationship. The licensee may define the 12-month period but must apply it consistently. Exceptions apply to former customers and to licensees that share only under the statutory exceptions and have not changed their policies.","source":"MCL 500.513(1)-(3)"},{"id":"reg-058","topic":"reg","sub":"Consumer Privacy Regulation","q":"A licensee mails its initial privacy notice and opt-out notice to a consumer. The licensee gives the consumer a reasonable opportunity to opt out of disclosure to nonaffiliated third parties if it allows the consumer to opt out by mail or toll-free phone within how many days of mailing?","choices":["10 days","15 days","30 days","60 days"],"answer":2,"explain":"Allowing the consumer to opt out by mailing a form, calling a toll-free number, or other reasonable means within 30 days from the date the notices were mailed is a reasonable opportunity. An opt-out remains effective until the consumer revokes it in writing.","source":"MCL 500.529(2)(a); MCL 500.523(2)"},{"id":"reg-059","topic":"reg","sub":"Consumer Privacy Regulation","q":"Which method of delivering a required privacy notice is NOT acceptable under Michigan law?","choices":["Hand-delivering a printed copy to the consumer","Mailing a printed copy to the consumer's last known address","Posting it on the website for a consumer who transacts online and must acknowledge receipt to obtain the product","Explaining the notice orally over the telephone, with no written or electronic copy"],"answer":3,"explain":"A licensee may not provide any required notice solely by orally explaining it, in person or by phone. Posting a sign in the office or general advertising is also insufficient.","source":"MCL 500.527(1),(2),(4)"},{"id":"reg-060","topic":"reg","sub":"Consumer Privacy Regulation","q":"Under Michigan law and DIFS rules, which statement about privacy compliance is correct?","choices":["Violations of the privacy chapter are handled only under federal law.","A violation of the privacy chapter (Chapter 5) or its rules is an unfair trade practice.","Producers are exempt from all privacy requirements.","Licensees may share customer account numbers with any marketer, as long as they give an annual notice."],"answer":1,"explain":"MCL 500.2013 (and R 500.560(a)) makes a violation of chapter 5 or its rules an unfair trade practice. Producers are licensees under chapter 5, and section 533 bars giving account numbers to nonaffiliated third parties for marketing. Separately, the Insurance Data Security chapter (eff. Jan. 20, 2021) requires a comprehensive written information security program, but licensees with fewer than 25 employees are exempt from that requirement.","source":"MCL 500.2013; Mich Admin Code R 500.560(a); MCL 500.503(l); MCL 500.533; MCL 500.550, 500.555(1), 500.565(1)"}],"cards":[{"id":"auto-c001","sec":"auto","front":"Michigan default BI liability limits (policies issued after July 1, 2020)","back":"$250,000 per person / $500,000 per accident; PD $10,000. Pre-July 2, 2020: 20/40/10.","source":"MCL 500.3009(1)"},{"id":"auto-c002","sec":"auto","front":"Lowest BI limits a Michigan insured may elect, and how","back":"$50,000/$100,000. Requires signing the DIFS 'Michigan Choice of Bodily Injury Liability Coverage Limits' form; with no effective choice, 250/500 applies.","source":"MCL 500.3009(5),(8); DIFS FIS-PUB 6310"},{"id":"auto-c003","sec":"auto","front":"TNC (ride-share) required liability, MCL 257.518b","back":"Logged on, no ride: $50k/$100k BI + $25k PD (+PIP/PPI). During prearranged ride: $1,000,000 CSL (+PIP/PPI).","source":"MCL 257.518b"},{"id":"auto-c004","sec":"auto","front":"Named excluded driver","back":"With the insured's authorization, liability is void when the named person drives ('no one is insured'); the excluded operator also gets no PIP.","source":"MCL 500.3009(2); MCL 500.3113(d)"},{"id":"auto-c005","sec":"auto","front":"Failure to produce proof of insurance","back":"Civil infraction. Electronic proof is OK. Proof shown to court before the appearance date: no fine, fee up to $25. Knowingly false proof: misdemeanor, up to 1 yr / $1,000.","source":"MCL 257.328"},{"id":"auto-c006","sec":"auto","front":"Driving without no-fault security","back":"Misdemeanor: $200–$500 fine, up to 1 year in jail, or both (owner, or a driver who knows the vehicle is uninsured).","source":"MCL 500.3102(2)"},{"id":"auto-c007","sec":"auto","front":"No-fault 'owner'","back":"Includes a person renting or using a vehicle for MORE THAN 30 days; the title holder (not a long-term lessor); an installment buyer.","source":"MCL 500.3101(3)(l)"},{"id":"auto-c008","sec":"auto","front":"Nonresident security rule","back":"A nonresident may not operate a vehicle that is not registered in Michigan in Michigan for an aggregate of more than 30 days in any calendar year unless Michigan no-fault security is maintained.","source":"MCL 500.3102(1)"},{"id":"auto-c009","sec":"auto","front":"MAIPF","back":"Michigan Automobile Insurance Placement Facility: all auto insurers participate; guarantees availability; 11-member board; administers the assigned claims plan.","source":"MCL 500.3301, .3310, .3171(2)"},{"id":"auto-c010","sec":"auto","front":"MAIPF deferred payment plan","back":"Advance payment of at least 25% of premium or $100, whichever is GREATER.","source":"MCL 500.3350(a)"},{"id":"auto-c011","sec":"auto","front":"MAIPF notice of eligibility","back":"At least once a year, notify facility insureds of the eligibility standards for the voluntary market.","source":"MCL 500.3365(3)"},{"id":"auto-c012","sec":"auto","front":"PIP allowable expenses","back":"Reasonable charges for reasonably necessary products, services and accommodations for care, recovery and rehab. Not covered: hospital room charges above the reasonable semiprivate rate (unless special or intensive care is needed). Funeral/burial: policy amount of $1,750–$5,000.","source":"MCL 500.3107(1)(a)"},{"id":"auto-c013","sec":"auto","front":"PIP work loss","back":"85% of lost gross income (15% tax reduction), first 3 years, capped per 30 days. Cap: $7,455 for accidents Oct 1, 2026 – Sep 30, 2027.","source":"MCL 500.3107(1)(b); DIFS Bulletin 2026-20-INS"},{"id":"auto-c014","sec":"auto","front":"PIP replacement services","back":"Up to $20 per day for up to 3 years after the accident.","source":"MCL 500.3107(1)(c)"},{"id":"auto-c015","sec":"auto","front":"PIP survivor's loss","back":"Paid to dependents: lost support plus up to $20/day services; same 30-day cap as work loss; ends 3 years after the accident.","source":"MCL 500.3108"},{"id":"auto-c016","sec":"auto","front":"PIP medical levels (policies after July 1, 2020)","back":"Unlimited; $500,000; $250,000; $250,000 with QHC exclusions; $50,000 (Medicaid); opt-out (Medicare A & B). No selection = unlimited.","source":"MCL 500.3107c; 500.3107d; 500.3109a(2)"},{"id":"auto-c017","sec":"auto","front":"Qualified health coverage (QHC)","back":"Health coverage that doesn't exclude auto injuries, with an individual deductible ≤ $6,579 (Jul 1, 2026 – Jun 30, 2027); or Medicare Parts A & B.","source":"MCL 500.3107d(7)(b); DIFS Bulletin 2026-08-INS"},{"id":"auto-c018","sec":"auto","front":"QHC ends mid-term (opt-out or exclusion)","back":"30 days to get PIP medical; injured within the 30 days → assigned claims plan (up to $2M); after that, no PIP medical.","source":"MCL 500.3107d(6); 500.3109a(2)(d),(e); 500.3172(7)(b)"},{"id":"auto-c019","sec":"auto","front":"Two policies with different PIP medical limits","back":"No stacking: the total is capped at the highest single-policy limit.","source":"MCL 500.3107c(6)"},{"id":"auto-c020","sec":"auto","front":"Chapter 31A","back":"Managed Care (MCL 500.3181–.3189): optional discounted managed-care PIP-medical option; not for emergency care; non-managed PIP must also be offered.","source":"MCL 500.3181-.3189"},{"id":"auto-c021","sec":"auto","front":"PIP priority: general rule","back":"Own policy, or policy of spouse / resident relative. No household policy → occupant or pedestrian claims through the MACP (post-2019), except under the employer-vehicle, passenger-transport and motorcycle rules.","source":"MCL 500.3114(1),(4); 500.3115"},{"id":"auto-c022","sec":"auto","front":"PIP priority: employee in employer's vehicle","back":"Insurer of the employer-furnished vehicle.","source":"MCL 500.3114(3)"},{"id":"auto-c023","sec":"auto","front":"PIP priority: motorcyclist hit by a motor vehicle","back":"1) insurer of the vehicle's owner, 2) of the vehicle's operator, 3) motorcycle operator's auto insurer, 4) motorcycle owner's auto insurer.","source":"MCL 500.3114(5)"},{"id":"auto-c024","sec":"auto","front":"Property protection insurance (PPI)","back":"Up to $1,000,000 per accident per policy, Michigan only; covers others' property incl. properly parked cars; excludes moving vehicles and out-of-state accidents.","source":"MCL 500.3121, .3123"},{"id":"auto-c025","sec":"auto","front":"Tort threshold (noneconomic)","back":"Death, serious impairment of body function, or permanent serious disfigurement; no recovery if more than 50% at fault.","source":"MCL 500.3135(1),(2)"},{"id":"auto-c026","sec":"auto","front":"Mini-tort","back":"Up to $3,000 (accidents after July 1, 2020) for vehicle damage not covered by insurance; claimant must not be more than 50% at fault; small claims.","source":"MCL 500.3135(3)(e),(4)"},{"id":"auto-c027","sec":"auto","front":"MCCA retention, Jul 1, 2025 – Jun 30, 2027","back":"$675,000. The MCCA pays 100% of PIP above that, for unlimited-PIP policies only.","source":"michigancatastrophic.com; MCL 500.3104(2)"},{"id":"auto-c028","sec":"auto","front":"Michigan Assigned Claims Plan","back":"Administered by the MAIPF; notice within 1 year of the accident; medical capped at $250,000 (or $2M for QHC-gap cases).","source":"MCL 500.3172, .3174"},{"id":"auto-c029","sec":"auto","front":"PIP deadlines","back":"Overdue 30 days after reasonable proof; 12% interest. Suit within 1 year of the accident (or of the last loss if notice given or benefits paid).","source":"MCL 500.3142; 500.3145"},{"id":"auto-c030","sec":"auto","front":"Chapter 32 cancellation (auto)","back":"After 55 days or on renewal: only for a final license suspension/revocation. Notice: certified mail, at least 20 days; appeal within 7 days.","source":"MCL 500.3220, .3224, .3230"},{"id":"auto-c031","sec":"auto","front":"Auto nonrenewal notice (Chapter 32)","back":"Chapter 32 (MCL 500.3204): a nonrenewal is not a \"cancellation\" if notice is mailed first-class at least 20 days before the termination date. Chapter 32 does not apply to nonpayment cancellations (3208, 3212). Separately, the Essential Insurance Act (MCL 500.2123) requires 30 days' written notice stating each specific reason for a \"termination\" of auto insurance (20 days within the first 55 days).","source":"MCL 500.3204, .3208, .3212; MCL 500.2123, .2104(5)"},{"id":"auto-c032","sec":"auto","front":"Aftermarket crash parts","back":"If the insurer requests non-OEM parts, the written estimate must identify each part with a disclosure in at least 10-point bold type.","source":"MCL 257.1363"},{"id":"auto-c033","sec":"auto","front":"Michigan collision options","back":"Insurers must offer: Limited collision (no deductible; pays only if the operator was not more than 50% at fault) and Broad form (pays regardless of fault; deductible waived if not more than 50% at fault). Standard collision, and limited collision with a deductible, may also be offered. Rejection of both offered coverages must be in writing.","source":"MCL 500.3037(1),(2),(4),(8)"},{"id":"auto-c034","sec":"auto","front":"PAP 09 18: newly acquired auto","back":"Liability/med pay/UM: ask within 14 days. Collision/OTC: 14 days if any declared auto has it; otherwise 4 days, with a $500 deductible.","source":"ISO PP 00 01 09 18, Definitions K"},{"id":"auto-c035","sec":"auto","front":"PAP 09 18: supplementary payments","back":"Bail bond up to $250; loss of earnings up to $250/day; appeal/attachment bonds; post-judgment interest; all in addition to limits.","source":"ISO PP 00 01 09 18, Part A"},{"id":"auto-c036","sec":"auto","front":"PAP 09 18: transportation expenses","back":"$30/day, max $900, no deductible; theft: after 48 hrs; other losses: after 24 hrs out of use. Non-owned auto loss of use $30/day.","source":"ISO PP 00 01 09 18, Part D"},{"id":"auto-c037","sec":"auto","front":"PAP policy territory","back":"U.S., its territories and possessions, Puerto Rico, and Canada (not Mexico).","source":"ISO PP 00 01 09 18, Part F"},{"id":"auto-c038","sec":"auto","front":"DIFS Bulletin 96-02","back":"Named non-owner / extended non-owned endorsements in Michigan give residual liability ONLY (named person + spouse); no PIP, PPI or physical damage.","source":"DIFS Bulletin 96-02"},{"id":"auto-c039","sec":"auto","front":"BACF covered auto symbols","back":"1 any; 2 owned; 3 owned private passenger; 4 owned other than PP; 5 owned no-fault; 6 owned compulsory UM; 7 specifically described; 8 hired; 9 non-owned; 19 mobile equipment subject to compulsory/FR law.","source":"ISO CA 00 01 11 20, Section I"},{"id":"auto-c040","sec":"auto","front":"Garagekeepers bases","back":"Legal liability (pays only if the insured is liable); direct excess (regardless of liability, excess over the owner's insurance); direct primary (regardless of liability, primary).","source":"ISO CA 99 37 10 01"},{"id":"auto-c041","sec":"auto","front":"Motor Carrier Act minimums (49 CFR 387.9)","back":"For-hire, nonhazardous property, GVWR 10,001+ lbs: $750,000; oil/hazmat: $1,000,000; certain bulk hazmat/explosives/radioactive: $5,000,000. Evidence: MCS-90.","source":"49 CFR 387.9; 387.15"},{"id":"comm-c001","sec":"cpp","front":"Components of a commercial package policy (CPP)","back":"Common Policy Declarations + Common Policy Conditions (IL 00 17) + interline endorsements + two or more coverage parts. One coverage part = monoline.","source":"ISO IL 00 17 11 98; IRMI glossary 'commercial package policy'"},{"id":"comm-c002","sec":"cpp","front":"IL 00 17 Common Policy Conditions (6)","back":"Cancellation; Changes; Examination of Books and Records (up to 3 years after); Inspections and Surveys; Premiums (first Named Insured pays and receives return premium); Transfer of Rights and Duties (needs written consent, except on death of an individual named insured).","source":"ISO IL 00 17 11 98"},{"id":"comm-c003","sec":"cpp","front":"IL 00 17 insurer cancellation notice","back":"10 days for nonpayment of premium; 30 days for any other reason. Refund is pro rata if the insurer cancels; may be less than pro rata if the first Named Insured cancels.","source":"ISO IL 00 17 11 98, A."},{"id":"comm-c004","sec":"cpp","front":"CGL Supplementary Payments: bail bonds / loss of earnings","back":"Up to $250 for bail bonds; actual loss of earnings up to $250 a day. Paid in addition to limits.","source":"ISO CG 00 01 04 13, Supp. Payments 1.b, 1.d"},{"id":"comm-c005","sec":"cpp","front":"CGL Coverage C – Medical Payments time limit","back":"Expenses must be incurred and reported within 1 year of the accident. Paid regardless of fault.","source":"ISO CG 00 01 04 13, Cov. C 1.a-b"},{"id":"comm-c006","sec":"cpp","front":"CGL General Aggregate vs Products-Completed Operations Aggregate","back":"General aggregate = Coverage C + Coverage A (except products-completed ops) + Coverage B. Products-completed ops aggregate = Coverage A BI/PD in the products-completed operations hazard.","source":"ISO CG 00 01 04 13, Sec. III 2-3"},{"id":"comm-c007","sec":"cpp","front":"'Insured contract' (CGL) list","back":"Lease of premises (not the fire-damage indemnity part); sidetrack agreement; easement/license (except construction within 50 ft of a railroad); municipal indemnity required by ordinance; elevator maintenance agreement; assumption of another's tort liability in a business contract.","source":"ISO CG 00 01 04 13, Sec. V def. 9"},{"id":"comm-c008","sec":"cpp","front":"Claims-made Basic ERP","back":"Automatic, no charge. 60 days for unreported occurrences; 5 years for claims from occurrences reported within 60 days after the policy ends. No reinstated limits.","source":"FC&S 'Claims-Made CGL Form' (2014, CG 00 02 04 13)"},{"id":"comm-c009","sec":"cpp","front":"Claims-made Supplemental ERP","back":"Written request within 60 days after the policy ends; premium up to 200% of annual premium; unlimited duration; starts after the basic ERP ends; reinstates aggregate limits.","source":"FC&S 'Claims-Made CGL Form' (2014); Austin & Stanovich (2012)"},{"id":"comm-c010","sec":"cpp","front":"OCP (CG 00 09)","back":"Covers the owner (named insured) for BI/PD from the designated contractor's operations and the owner's general supervision. Ends when the work is completed or put to its intended use; premium refunds go to the contractor.","source":"ISO CG 00 09 04 13"},{"id":"comm-c011","sec":"cpp","front":"Commercial property vacancy","back":"Vacant more than 60 consecutive days: no coverage for vandalism, sprinkler leakage, building glass, water damage, theft or attempted theft; other losses reduced 15%. Owner's building is vacant unless at least 31% is rented/used.","source":"ISO CP 00 10 10 12, E.6"},{"id":"comm-c012","sec":"cpp","front":"CP 00 10 10 12 debris removal","back":"25% of paid loss plus deductible, plus up to an additional $25,000 per location (when the loss plus debris removal exceeds the limit or debris removal exceeds the 25%); must be reported within 180 days. Older editions: additional $10,000.","source":"ISO CP 00 10 10 12, A.4.a"},{"id":"comm-c013","sec":"cpp","front":"CP 00 10 small additional coverages","back":"Fire dept service charge $1,000 (no deductible); pollutant clean-up $10,000 per 12 months; increased cost of construction lesser of $10,000 or 5%; electronic data $2,500; preservation of property 30 days.","source":"ISO CP 00 10 10 12, A.4"},{"id":"comm-c014","sec":"cpp","front":"CP 00 10 coverage extensions","back":"Require 80%+ coinsurance. Newly acquired building $250,000 / BPP $100,000 (30 days); personal effects & property of others $2,500; valuable papers $2,500; off-premises $10,000; outdoor property $1,000 ($250 per tree); non-owned trailers $5,000; portable storage $10,000.","source":"ISO CP 00 10 10 12, A.5"},{"id":"comm-c015","sec":"cpp","front":"Business Income period of restoration","back":"Begins 72 hours after loss for Business Income; immediately for Extra Expense. Extended Business Income: up to 60 days after operations resume.","source":"ISO CP 00 30 10 12, F.3; A.5.c"},{"id":"comm-c016","sec":"cpp","front":"Civil Authority (CP 00 30 and BOP)","back":"Premises within 1 mile of the damaged property; Business Income starts 72 hours after the civil authority action and lasts up to 4 consecutive weeks.","source":"ISO CP 00 30 10 12, A.5.a; BP 00 03 07 13, Sec. I A.5.i"},{"id":"comm-c017","sec":"cpp","front":"Builders risk – when coverage ends","back":"Earliest of: expiration/cancellation, accepted by purchaser, interest ceases, construction abandoned, 90 days after completion, or 60 days after occupancy or intended use. Limit compared to value at completion.","source":"ISO CP 00 20 06 95"},{"id":"comm-c018","sec":"cpp","front":"Basic vs Broad vs Special causes of loss","back":"Basic: fire, lightning, explosion, windstorm/hail, smoke, aircraft/vehicles, riot, vandalism, sprinkler leakage, sinkhole, volcanic. Broad adds falling objects; weight of snow, ice or sleet; water damage; collapse. Special = open perils.","source":"ISO CP 10 10 10 12; CP 10 20 10 12; CP 10 30 09 17"},{"id":"comm-c019","sec":"cpp","front":"Ordinance or Law (CP 04 05) Coverages A/B/C","back":"A = loss to the undamaged portion; B = demolition cost; C = increased cost of construction.","source":"ISO CP 04 05 09 17, C."},{"id":"comm-c020","sec":"cpp","front":"Robbery vs safe burglary vs theft (crime)","back":"Robbery: taking from a person by force or threat (or an obviously unlawful act they witness). Safe burglary: taking from a locked safe with marks of forcible entry, or taking the safe itself. Theft: any unlawful taking to the insured's deprivation.","source":"ISO CR 00 21 11 15, F. defs. 20, 21, 23"},{"id":"comm-c021","sec":"cpp","front":"Crime: loss sustained vs discovery tail","back":"Loss sustained (CR 00 21): 1 year after cancellation to discover loss. Discovery (CR 00 20): occurrence can be any time; 60 days after the policy ends to discover.","source":"ISO CR 00 21 11 15, E.1.g; Rough Notes PF&M 251.4-2"},{"id":"comm-c022","sec":"cpp","front":"Nationwide Marine Definition classes","back":"Imports; exports; domestic shipments; instrumentalities of transportation and communication (bridges, tunnels, piers, pipelines, towers); personal property floaters; commercial property floaters. Michigan's own statutory definition of marine insurance is MCL 500.614 (1956); it covers similar risks and excludes buildings and their contents.","source":"IMUA 'Nationwide Marine Definition'; MCL 500.614; NAIC Model 701 state chart (2021)"},{"id":"comm-c023","sec":"cpp","front":"CM 00 01 inland marine conditions","back":"No abandonment; limit reinstated after loss (except total loss of a scheduled item); suit within 2 years of first knowledge of loss; valuation = least of ACV, restoration cost, or replacement cost.","source":"ISO CM 00 01 09 04"},{"id":"comm-c024","sec":"cpp","front":"Common carrier exceptions","back":"Act of God, public enemy, act of the shipper, public authority, inherent vice. The carrier must also prove it was free of negligence.","source":"Missouri Pacific R.R. v. Elmore & Stahl, 377 U.S. 134 (1964)"},{"id":"comm-c025","sec":"cpp","front":"Farm property coverage letters","back":"A Dwellings; B Other private structures; C Household personal property; D Loss of use; E Scheduled farm personal property; F Unscheduled farm personal property (80% coinsurance); G Other farm structures. Farm liability: H BI/PD, I P&AI, J Med pay.","source":"ISO FP 00 10 09 94; FC&S 'Farm Liability Coverage Form' (2013)"},{"id":"comm-c026","sec":"bop","front":"BOP Business Income","back":"Actual loss sustained for up to 12 consecutive months; no dollar limit; 72-hour waiting period; ordinary payroll for 60 days; Extended BI 60 days.","source":"ISO BP 00 03 07 13, Sec. I A.5.f"},{"id":"comm-c027","sec":"bop","front":"BOP valuation (no coinsurance clause)","back":"Replacement cost if the limit is at least 80% of RC; otherwise the greater of ACV or (limit / 80% of RC) x loss. RC is not paid until repair/replacement, except building repairs of $2,500 or less are settled on the RC basis even before repair.","source":"ISO BP 00 03 07 13, Sec. I E.5.d"},{"id":"comm-c028","sec":"bop","front":"BOP automatic limit increases","back":"Building +8% a year (prorated) unless another % is shown. BPP seasonal +25% if the BPP limit is at least 100% of average monthly values.","source":"ISO BP 00 03 07 13, Sec. I C.4-5"},{"id":"comm-c029","sec":"bop","front":"BOP additional coverage amounts","back":"Fire dept $2,500; money orders/counterfeit $1,000; forgery $2,500; ICC $10,000; pollutant $10,000; dependent properties $5,000; fire extinguisher recharge $5,000; electronic data $10,000; computer interruption $10,000; fungi $15,000.","source":"ISO BP 00 03 07 13, Sec. I A.5"},{"id":"comm-c030","sec":"bop","front":"BOP liability aggregates","back":"Products-completed ops aggregate and general aggregate each = 2 × the Liability and Medical Expenses limit. Professional services are excluded.","source":"ISO BP 00 03 07 13, Sec. II D.4; B.1.j"},{"id":"comm-c031","sec":"bop","front":"BOP 5-day cancellation","back":"Allowed if the building is vacant/unoccupied 60+ days, repairs not started within 30 days of loss payment, under a vacate/demolition order, fixtures being removed, or no utilities 30+ days / taxes unpaid over 1 year.","source":"ISO BP 00 03 07 13, Sec. III A.2.a"},{"id":"comm-c032","sec":"bop","front":"Protective safeguard symbols","back":"P-1 sprinkler; P-2 automatic fire alarm; P-3 security service; P-4 private fire dept contract; P-9 described system. Fire is excluded if the insured knew of an impairment and didn't notify the insurer.","source":"ISO IL 04 15 04 98; FC&S (2020) re BP 04 30"},{"id":"comm-c033","sec":"bop","front":"Utility Services: Direct Damage vs Time Element","back":"BP 04 56 covers physical damage to covered property; BP 04 57 covers BI/Extra Expense, both from off-premises utility interruption. Overhead transmission lines are covered only if the Schedule shows them.","source":"ISO BP 04 57 01 06; FC&S (2020)"},{"id":"comm-c034","sec":"bop","front":"Hired and Non-Owned Auto Liability (BOP)","back":"Covers liability for hired autos used by you or your employees, and non-owned autos (e.g., employees' cars) used in your business. Requires premium shown in Declarations.","source":"FC&S 'Businessowners Program Endorsements Described' (2020, BP 04 04)"},{"id":"comm-c035","sec":"other","front":"Umbrella's three functions","back":"Excess limits over underlying; drop down when underlying aggregates are exhausted; broader coverage for claims not covered by underlying, subject to a self-insured retention (SIR).","source":"IRMI glossary 'umbrella liability policy'"},{"id":"comm-c036","sec":"other","front":"D&O Side A / B / C","back":"A: covers D&Os directly when the company can't or won't indemnify. B: reimburses the company for indemnifying D&Os. C: entity coverage (securities claims).","source":"IRMI glossary (Side A; corporate reimbursement; entity securities coverage)"},{"id":"comm-c037","sec":"other","front":"ERISA fidelity bond amount","back":"At least 10% of funds handled; minimum $1,000; maximum $500,000 ($1,000,000 if the plan holds employer securities). Covers fraud or dishonesty, not fiduciary errors.","source":"29 U.S.C. 1112(a)"},{"id":"comm-c038","sec":"other","front":"Surety bond parties","back":"Principal (who must perform, e.g., the contractor); obligee (who is protected, e.g., the owner); surety (who guarantees). The principal must reimburse the surety.","source":"FAR 48 CFR 28.001; surety.org"},{"id":"comm-c039","sec":"other","front":"Contract bonds","back":"Bid bond: bidder will sign the contract and furnish bonds. Performance bond: contract will be completed. Payment bond: labor and material suppliers will be paid.","source":"FAR 48 CFR 28.001"},{"id":"comm-c040","sec":"other","front":"Michigan surplus lines tax and filings","back":"2% premium tax + 0.5% regulatory fee; sworn statements due Feb 15 and Aug 15. Self-procured insurance: insured reports within 30 days and pays the same.","source":"MCL 500.1905(3)(d); 500.1951"},{"id":"comm-c041","sec":"other","front":"Michigan surplus lines required notice","back":"In red ink, at least 10-point type: 'This insurance has been placed with an insurer that is not licensed by the state of Michigan. In case of insolvency, payment of claims may not be guaranteed.'","source":"MCL 500.1922"},{"id":"comm-c042","sec":"other","front":"Eligible surplus lines insurer (MI)","back":"Michigan statute: capital and surplus of at least $1,500,000; $75,000 MI deposit or $1,000,000 US trust (Lloyd's-type $50,000,000); appoints the commissioner as agent for service of process. Note: since the federal NRRA (2010), U.S. nonadmitted insurers effectively need the greater of the home-state minimum or $15,000,000, and alien insurers qualify through the NAIC Quarterly Listing.","source":"MCL 500.1920(4); 500.1921; 15 U.S.C. 8204"},{"id":"comm-c043","sec":"other","front":"NFIP maximum limits / ICC","back":"Single-family and 2-4 family: $250,000 building; residential contents $100,000. Other residential (5+ units): $500,000 building. Non-residential: $500,000 building / $500,000 contents. ICC up to $30,000 (building + ICC can't exceed the building maximum).","source":"44 CFR 61.6(a); 44 CFR Pt. 61 App. A(1) III.D; FEMA brochures (2024)"},{"id":"comm-c044","sec":"other","front":"NFIP waiting period","back":"30 days, except: purchase in connection with making, increasing, extending or renewing a loan (effective at loan closing, no wait); initial purchase within 13 months after a map revision takes effect (1-day wait); flooding on burned federal land (1-day wait if bought within 60 days of fire containment).","source":"44 CFR 61.11(a)-(d); agents.floodsmart.gov 'Flood Insurance 101'"},{"id":"comm-c045","sec":"other","front":"Risk retention group (LRRA 1986)","back":"Member-owned liability insurer chartered in one state; members in similar businesses; liability coverage only; can't join state guaranty funds (required notice).","source":"15 U.S.C. 3901(a)(4); 3902(a)"},{"id":"comm-c046","sec":"other","front":"Cyber: first-party vs third-party","back":"First-party: forensics, notification/call center, legal counsel, business interruption, extortion. Third-party: liability to affected consumers, regulatory inquiries.","source":"NAIC 'Cyber Insurance' consumer guide"},{"id":"core-c001","sec":"gen","front":"Risk vs. hazard vs. peril","back":"Risk = uncertainty of loss. Hazard = a condition that increases the chance of loss (e.g., poor housekeeping). Peril = the cause of loss (fire, windstorm, collision).","source":"IRMI glossary: risk; hazard; peril"},{"id":"core-c002","sec":"gen","front":"Pure risk vs. speculative risk","back":"Pure risk = chance of loss only (generally insurable). Speculative risk = chance of gain or loss, e.g., a business venture or gambling (generally not insurable).","source":"IRMI glossary: pure risk; speculative risk"},{"id":"core-c003","sec":"gen","front":"Five methods of handling risk","back":"Avoidance (don't do the activity); Retention (deductibles, self-insurance); Sharing (pooling within a group); Reduction (loss prevention/reduction, e.g., sprinklers); Transfer (insurance, hold-harmless agreements).","source":"IRMI glossary: avoidance; risk retention; risk sharing; loss control; hold harmless agreement"},{"id":"core-c004","sec":"gen","front":"Characteristics of an ideally insurable risk","back":"Large number of exposure units; accidental and unintentional loss; determinable and measurable loss; no catastrophic loss; calculable chance of loss; economically feasible premium.","source":"Rejda & McNamara, Principles of Risk Management and Insurance (13th ed.)"},{"id":"core-c005","sec":"gen","front":"Law of large numbers","back":"The more independent exposure units in a group, the more likely actual losses will equal expected losses.","source":"IRMI glossary: law of large numbers"},{"id":"core-c006","sec":"gen","front":"Treaty vs. facultative reinsurance","back":"Treaty: covers whole classes of business; the reinsurer must accept all qualifying risks. Facultative: each risk is negotiated separately; the reinsurer may decline.","source":"IRMI glossary: treaty reinsurance; facultative reinsurance"},{"id":"core-c007","sec":"gen","front":"Pro rata vs. excess of loss reinsurance","back":"Pro rata (proportional, e.g., quota share): the reinsurer takes a set % of premium and pays the same % of losses. Excess of loss: the reinsurer pays losses above the ceding company's retention, up to a limit.","source":"IRMI glossary: pro rata reinsurance; quota share reinsurance; excess of loss reinsurance"},{"id":"core-c008","sec":"gen","front":"Stock vs. mutual vs. reciprocal","back":"Stock: owned by stockholders (paid-in capital). Mutual: owned by its policyholders. Reciprocal: unincorporated subscribers who pool risks, managed by an attorney-in-fact.","source":"IRMI glossary: stock company; mutual company; reciprocal"},{"id":"core-c009","sec":"gen","front":"A.M. Best Financial Strength Rating tiers","back":"A++/A+ Superior; A/A- Excellent; B++/B+ Good; B/B- Fair; C++/C+ Marginal; C/C- Weak; D Poor; E Under Regulatory Supervision; F In Liquidation; S Suspended.","source":"A.M. Best, Guide to Best's Financial Strength Ratings"},{"id":"core-c010","sec":"gen","front":"Independent agency system vs. exclusive agency vs. direct writer","back":"Independent: the agent represents several insurers and owns the expirations. Exclusive (captive): the agent represents one company or group. Direct writer: the insurer sells through its own employees.","source":"IRMI glossary: independent agency system; exclusive agency system; direct writer"},{"id":"core-c011","sec":"gen","front":"Express, implied, and apparent authority","back":"Express = written in the agency contract. Implied = actions reasonably necessary to carry out the express powers. Apparent = what a reasonable third party would believe the agent can do based on the insurer's conduct (related to estoppel).","source":"IRMI glossary: express authority; implied authority; apparent agency"},{"id":"core-c012","sec":"gen","front":"Michigan: agent of the insurer vs. agent of the insured","back":"Agent of the insurer = represents the insurer. Agent of the insured = a producer NOT appointed by the placing insurer; represents the insured. A license alone creates no authority to bind an insurer.","source":"MCL 500.1201(b), (c), (h)"},{"id":"core-c013","sec":"gen","front":"Michigan agent fiduciary rule","back":"An agent is a fiduciary for all money received as agent; premiums and return premiums must be held in a separate account and not commingled.","source":"MCL 500.1207(1)-(2)"},{"id":"core-c014","sec":"gen","front":"Elements of a valid contract (Michigan)","back":"Competent parties; proper subject matter (legal purpose); legal consideration; mutuality of agreement (offer and acceptance); mutuality of obligation.","source":"AFT Michigan v Michigan, 497 Mich 197 (2015)"},{"id":"core-c015","sec":"gen","front":"Adhesion / aleatory / unilateral / conditional / personal","back":"Adhesion: take it or leave it; ambiguities construed against the insurer. Aleatory: unequal exchange based on chance. Unilateral: only the insurer makes an enforceable promise. Conditional: payment depends on the insured meeting conditions. Personal: insures a person, so it cannot be assigned without the insurer's written consent.","source":"IRMI glossary; ISO HO 00 03 05 11 Sections I & II Cond. E"},{"id":"core-c016","sec":"gen","front":"Representation vs. warranty vs. concealment","back":"Representation: a statement believed true to the best of the applicant's knowledge; if materially false and relied on, the policy may be voided. Warranty: a statement of fact guaranteed true; if untrue, it voids the policy. Concealment: willfully withholding a material fact the insurer did not ask about.","source":"IRMI glossary: representation; warranty; concealment"},{"id":"core-c017","sec":"gen","front":"Waiver vs. estoppel","back":"Waiver = intentional, voluntary surrender of a known right. Estoppel = a party can't contradict its prior conduct that another reasonably relied on (e.g., an insurer that repeatedly accepted late premiums).","source":"IRMI glossary: waiver; estoppel"},{"id":"core-c018","sec":"gen","front":"Reasonable expectations doctrine (and Michigan)","back":"Some courts give the coverage an insured would reasonably expect even if the wording doesn't. Michigan's Supreme Court declined to adopt it (Wilkie, 2003); ambiguities are still construed against the insurer.","source":"IRMI glossary: reasonable expectations doctrine; Wilkie v Auto-Owners, 469 Mich 41 (2003)"},{"id":"core-c019","sec":"basics","front":"When must insurable interest exist (property)?","back":"At the time of loss. The insurer pays no insured more than that insured's interest at the time of loss.","source":"ISO HO 00 03 05 11, Sec. I Cond. A"},{"id":"core-c020","sec":"basics","front":"Loss ratio and combined ratio","back":"Loss ratio = incurred losses / earned premium. Combined ratio = loss ratio (incl. loss adjustment expense) + expense ratio; under 100% = underwriting profit.","source":"IRMI glossary: loss ratio; combined ratio"},{"id":"core-c021","sec":"basics","front":"Physical vs. moral vs. morale hazard","back":"Physical: a tangible condition (e.g., poor housekeeping). Moral: the insured's character or dishonesty. Morale: indifference or carelessness because insurance will pay.","source":"IRMI glossary: hazard; moral hazard; morale hazard"},{"id":"core-c022","sec":"basics","front":"Four elements of negligence","back":"Duty owed; breach of duty; proximate cause; actual injury or damage.","source":"IRMI glossary: negligence"},{"id":"core-c023","sec":"basics","front":"Michigan comparative fault rule","back":"Contributory fault doesn't bar recovery; damages are reduced by the plaintiff's % of fault. If the plaintiff's fault is greater than the others' combined (>50%), economic damages are still reduced but NO noneconomic damages are awarded.","source":"MCL 600.2958; 600.2959"},{"id":"core-c024","sec":"basics","front":"Special vs. general vs. punitive damages","back":"Special: measurable (medical bills, lost wages). General: subjective (pain and suffering). Punitive: to punish; in Michigan, available only if a statute expressly authorizes them.","source":"IRMI glossary; Gilbert v DaimlerChrysler, 685 NW2d 391 (Mich 2004)"},{"id":"core-c025","sec":"basics","front":"Absolute vs. strict vs. vicarious liability","back":"Absolute: no-fault liability for ultrahazardous activities (blasting, wild animals). Strict: liability without negligence, e.g., defective products. Vicarious: a principal is liable for its agent's or employee's acts.","source":"Restatement (2d) Torts §§519-520; IRMI glossary: strict liability; vicarious liability"},{"id":"core-c026","sec":"basics","front":"ISO construction codes 1-6","back":"1 Frame; 2 Joisted masonry; 3 Noncombustible; 4 Masonry noncombustible; 5 Modified fire resistive (rated 1 to under 2 hours); 6 Fire resistive (rated 2+ hours).","source":"IRMI glossary (ISO Commercial Lines Manual construction codes)"},{"id":"core-c027","sec":"basics","front":"ACV, RC, functional RC","back":"ACV commonly = replacement cost minus depreciation (or market value / broad evidence rule). RC = like kind and quality, no depreciation deduction. Functional RC = property that performs the same function equally well, even if not identical.","source":"IRMI glossary: actual cash value; replacement cost; functional replacement cost"},{"id":"core-c028","sec":"basics","front":"Agreed value vs. stated amount","back":"Agreed value (CP optional coverage) suspends coinsurance until the expiration date. Stated amount (auto physical damage) is only a ceiling: the insurer pays the least of the stated amount, ACV, or the cost to repair/replace.","source":"ISO CP 00 10 10 12, G.1; ISO CA 99 28 (summary)"},{"id":"core-c029","sec":"basics","front":"Policy structure (DICE)","back":"Declarations, Insuring agreement, Conditions, Exclusions, plus Definitions and Endorsements (endorsements modify the policy).","source":"IRMI glossary: declarations; insuring agreement; exclusion; endorsement"},{"id":"core-c030","sec":"basics","front":"Coinsurance formula (ISO BPP)","back":"(Limit carried / (Value at time of loss x Coinsurance %)) x Loss - Deductible = payment, capped at the limit. The deductible is applied AFTER the coinsurance reduction.","source":"ISO CP 00 10 10 12, F.1 and D"},{"id":"core-c031","sec":"basics","front":"Coinsurance example from the ISO form","back":"Value $250,000; 80% coinsurance; limit $100,000; loss $40,000; deductible $250: $100,000 / $200,000 = 0.5; $40,000 x 0.5 = $20,000 - $250 = $19,750 paid.","source":"ISO CP 00 10 10 12, F.1 Example 1"},{"id":"core-c032","sec":"basics","front":"Pro rata vs. contribution by equal shares","back":"Pro rata: each insurer pays its limit / total limits. Equal shares (CGL): equal payments until the smallest limit is exhausted, then the rest continue equally; used only if all policies permit it, otherwise by limits.","source":"ISO CP 00 90 07 88, G.1; ISO CG 00 01 Sec. IV 4.c; IRMI glossary"},{"id":"core-c033","sec":"basics","front":"BPP vacancy rule","back":"Vacant more than 60 consecutive days: no coverage for vandalism, sprinkler leakage, building glass breakage, water damage, theft, or attempted theft; other covered losses reduced 15%. An owner's building is vacant unless at least 31% of its square footage is used for customary operations.","source":"ISO CP 00 10 10 12, E.6"},{"id":"core-c034","sec":"basics","front":"Liberalization clause (CP vs. HO)","back":"Broadened coverage without extra premium applies automatically. CP 00 90: revisions adopted within 45 days before or during the policy period. HO 00 03: implementation within 60 days before or during the policy period.","source":"ISO CP 00 90 07 88, E; ISO HO 00 03 05 11, Sections I & II Cond. A"},{"id":"core-c035","sec":"basics","front":"Standard mortgage clause vs. loss payable clause","back":"Mortgage clause: the mortgagee is protected even if the insured's claim is denied (if it pays premium due, files proof of loss within 60 days after notice, and reports risk changes) and gets notice of cancellation or nonrenewal. A loss payable clause usually gives no recovery if the insured's claim can be denied.","source":"ISO HO 00 03 05 11, Sec. I Cond. L; IRMI glossary: loss payable clause"},{"id":"core-c036","sec":"basics","front":"No benefit to bailee","back":"No person or organization, other than the insured, having custody of covered property (e.g., a warehouse, mover, or cleaner for a fee) benefits from the insurance.","source":"ISO CP 00 90 07 88, F; ISO HO 00 03 05 11, Sec. I Cond. M"},{"id":"core-c037","sec":"basics","front":"Abandonment","back":"The insured cannot abandon damaged property to the insurer (\"There can be no abandonment of any property to us\"). The insurer may choose to take property at an agreed or appraised value.","source":"ISO CP 00 10 10 12, E.1, E.4.a"},{"id":"core-c038","sec":"basics","front":"Staff vs. independent vs. public adjuster","back":"Staff = insurer's employee. Independent = works on contract for insurers or self-insureds. Public = represents the INSURED, paid a % of the settlement.","source":"IRMI glossary: adjuster; independent adjuster; public adjuster"},{"id":"core-c039","sec":"basics","front":"Michigan timely claim payment (MCL 500.2006)","back":"The insurer must specify in writing what makes up proof of loss within 30 days after receiving the claim. Payment is timely if made within 60 days after proof of loss; otherwise 12% simple annual interest runs from day 60. For the insured, interest is owed even if the claim was reasonably in dispute. \"Reasonably in dispute\" only excuses the unfair-trade-practice violation, and it limits interest for third-party tort claimants: they get interest only if liability was not reasonably in dispute and a court found a bad-faith refusal.","source":"MCL 500.2006(1), (3), (4); Griswold Props v Lexington Ins Co, 276 Mich App 551 (2007)"},{"id":"core-c040","sec":"wc","front":"WDCA exclusive remedy and its only exception","back":"Comp benefits are the employee's exclusive remedy against the employer; the only exception is an intentional tort (deliberate act plus specific intent; intent is deemed if the employer had actual knowledge injury was certain and willfully disregarded it).","source":"MCL 418.131(1)"},{"id":"core-c041","sec":"wc","front":"Who must carry Michigan comp (418.115)","back":"Private employers with 3+ employees at one time; employers with fewer than 3 if 1 works 35+ hours per week for 13+ weeks in the past 52; ALL public employers; agricultural employers per special rules.","source":"MCL 418.115"},{"id":"core-c042","sec":"wc","front":"Waiting period","back":"No weekly comp for the first 7 days; it begins on day 8. If disability lasts 2 weeks or longer (or death results), it is paid back to the date of injury.","source":"MCL 418.311"},{"id":"core-c043","sec":"wc","front":"Weekly benefit and maximum","back":"80% of after-tax average weekly wage, up to a maximum = 90% of the state average weekly wage (set each Jan. 1). The 2026 maximum is $1,201/week (SAWW $1,333.88) for injuries in 2026.","source":"MCL 418.351; 418.355; Michigan WDCA 2026 Weekly Benefit Tables"},{"id":"core-c044","sec":"wc","front":"Death and funeral benefits","back":"Death: 80% of after-tax AWW to wholly dependent survivors for 500 weeks. A magistrate may extend payments to a dependent who is still under 21 at the end of the 500 weeks, until that dependent turns 21. Minimum weekly death benefit is 50% of SAWW. Funeral: up to $6,000 or the actual cost, whichever is less.","source":"MCL 418.321; 418.356(2); 418.345"},{"id":"core-c045","sec":"wc","front":"Specific loss schedule highlights","back":"Arm 269 weeks; hand 215; leg 215; foot 162; eye 162; thumb 65; great toe 33. 80% loss of vision in one eye = loss of the eye.","source":"MCL 418.361(2)"},{"id":"core-c046","sec":"wc","front":"Second Injury Fund","back":"A prior loss of a hand, arm, foot, leg, or eye plus a second such loss from work = conclusive total and permanent disability; the Second Injury Fund pays after the second-loss payments end.","source":"MCL 418.521(1)"},{"id":"core-c047","sec":"wc","front":"Medical benefits and choice of doctor","back":"Reasonable medical, surgical, hospital, and medicine costs plus appliances. After 28 days from the start of medical care, the employee may switch to a physician of their own choice by notifying the employer.","source":"MCL 418.315(1)"},{"id":"core-c048","sec":"wc","front":"Notice and claim deadlines","back":"Notice to the employer within 90 days of injury (late notice excused unless the employer is prejudiced); claim within 2 years. Occupational disease claim within 2 years after the worker knew or should have known it was work-related.","source":"MCL 418.381(1); 418.441"},{"id":"core-c049","sec":"wc","front":"Self-insurance and group self-insurance","back":"An employer secures comp by (a) the director's authorization to self-insure or (b) insuring with an authorized insurer. Group: 2+ employers in the same industry with combined assets of $1,000,000+, or 2+ public employers of the same type.","source":"MCL 418.611(1)-(2)"},{"id":"core-c050","sec":"wc","front":"Michigan WC Placement Facility","back":"All WC insurers must participate; it covers employers unable to buy coverage normally. Board: 5 insurers, 2 policyholders, 1 agent, 1 public member (2-year terms). Agent commission is no more than 5% of premium. Rating plans A, B, and C.","source":"MCL 500.2301; 500.2310; 500.2312"},{"id":"core-c051","sec":"wc","front":"FELA vs. USL&HW vs. Jones Act","back":"FELA: interstate railroad workers sue for negligence (comparative). USL&HW (33 USC 901+): longshore and harbor workers, no-fault benefits, on navigable waters and adjoining piers, docks, etc. Jones Act (46 USC 30104, formerly 46 USC 688): seamen and crew sue the employer for negligence with a jury trial.","source":"45 USC 51, 53; 33 USC 903-904; 46 USC 30104"},{"id":"core-c052","sec":"wc","front":"WC & EL policy structure (WC 00 00 00 C)","back":"General Section; Part One WC (statutory benefits, no dollar limit); Part Two Employers Liability; Part Three Other States (Item 3.C); Part Four Your Duties; Part Five Premium; Part Six Conditions.","source":"NCCI WC 00 00 00 C (Ed. 1-15)"},{"id":"core-c053","sec":"wc","front":"Standard employers liability limits","back":"$100,000 BI by accident (each accident) / $500,000 BI by disease (policy limit) / $100,000 BI by disease (each employee).","source":"National standard EL limits (as reproduced in NCRB Basic Manual Rule 5); NCCI WC 00 00 00 C, Part Two G; CAOM Michigan WC Placement Facility Basic Manual, Rule Eight"},{"id":"core-c054","sec":"wc","front":"Other States coverage (Part Three)","back":"Applies to states in Item 3.C: new work begun there mid-term is treated as if the state were in 3.A (tell the insurer at once). Work already underway on the effective date in an unlisted state is covered only if the insurer is notified within 30 days.","source":"NCCI WC 00 00 00 C, Part Three"},{"id":"core-c055","sec":"wc","front":"WC premium computation","back":"Manual premium = (payroll / 100) x class rate. x Experience mod (1.00 average; \u003c1 credit; >1 debit) = standard premium. Premium discount (larger premiums) applies after the experience mod. Final premium is set by audit (up to 3 years after the policy ends).","source":"CAOM Michigan WC Placement Facility Basic Manual, Part One premium algorithm and Rule Seven; IRMI glossary: standard premium; premium discount; NCCI WC 00 00 00 C, Part Five G"},{"id":"core-c056","sec":"wc","front":"Voluntary compensation endorsement","back":"Pays statutory-equivalent benefits to scheduled employees not required to be covered (e.g., farm or domestic workers). The claimant must release the employer and insurer and transfer recovery rights; if the claimant sues instead, the insurer's duty to pay ends.","source":"NCCI WC 00 03 11 A; IRMI glossary"},{"id":"prop-c001","sec":"basics","front":"MPCGA: who must be a member?","back":"Every insurer authorized to write non-life/non-disability insurance in Michigan, as a condition of its authority. Excluded: the Michigan Basic Property Insurance Association, surplus lines insurers (not 'authorized' for this chapter), and life/disability insurers.","source":"MCL 500.7911, 500.7911a"},{"id":"prop-c002","sec":"basics","front":"MPCGA covered-claim cap (statute and 2026)","back":"Claims are capped at $5,000,000 (CPI-adjusted each Jan 1; $7,980,000 for 2026). Workers' comp and no-fault PIP claims are not capped. The cap in effect when the claim is paid applies.","source":"MCL 500.7925(6); DIFS Bulletin 2026-04-INS"},{"id":"prop-c003","sec":"basics","front":"MPCGA net worth exclusion","back":"No first- or third-party claim by or against an insured whose net worth (including affiliates) exceeds $25,000,000 (CPI-adjusted; $39,920,000 for 2026), measured at Dec 31 of the year before the insolvency.","source":"MCL 500.7925(4); DIFS Bulletin 2026-04-INS"},{"id":"prop-c004","sec":"basics","front":"MPCGA unearned premium limits","back":"Covered only up to the first $500 per person per insolvent insurer (CPI-adjusted; $2,063 for 7/1/2026-6/30/2027). No refund under $50.","source":"MCL 500.7925(2)(a); DIFS Bulletin 2026-13-INS"},{"id":"prop-c005","sec":"basics","front":"MPCGA: coverage continuation and cancellation after receivership","back":"Policies continue until they expire, are replaced, or are canceled by the association, but no more than 30 days after the receiver is appointed. The association may cancel on 10 days' notice. Covered claims must arise within 30 days after the appointment.","source":"MCL 500.7931(4)-(5); 500.7925(1)(d)"},{"id":"prop-c006","sec":"basics","front":"MPCGA assessment cap; stay of suits","back":"Assessments are capped at 1% of the member's prior-year Michigan net direct written premium per year. Court proceedings involving the insolvent insurer are stayed 6 months after the receiver is appointed.","source":"MCL 500.7941(3); 500.7945(1)"},{"id":"prop-c007","sec":"basics","front":"Fire policy (500.2833): minimum coverage","back":"Actual cash value at the time of loss; direct loss by fire and lightning; pro rata coverage for 5 days for property removed to protect it from a covered peril.","source":"MCL 500.2833(1)(a)-(b)"},{"id":"prop-c008","sec":"basics","front":"Fire policy: cancellation and minimum earned premium","back":"The insured may cancel at any time. The insurer may cancel on at least 10 days' mailed notice. Minimum earned premium = greater of pro rata or $25. (For HOME insurance, 500.2123 requires 30 days, or 20 days during the first 55 days.)","source":"MCL 500.2833(1)(h)-(i); 500.2123"},{"id":"prop-c009","sec":"basics","front":"Fire policy: loss payment and suit deadline","back":"Loss is payable within 30 days after receipt of proof of the amount of loss (subject to 2845). Suit must be filed within 1 year after the loss, or the policy period if longer, tolled from notice of loss until formal denial.","source":"MCL 500.2833(1)(p)-(q)"},{"id":"prop-c010","sec":"basics","front":"Fire policy: mortgagee provisions","back":"The insurer may cancel the mortgagee's interest on 10 days' written notice. If the insured fails to file proof of loss, the mortgagee files it within 60 days after notice. An insurer that denies the owner is subrogated to the mortgagee's rights for what it pays.","source":"MCL 500.2833(1)(j)"},{"id":"prop-c011","sec":"basics","front":"Michigan appraisal steps","back":"Written demand. Each side names an independent appraiser within 20 days. The appraisers pick an umpire within 15 days; otherwise a circuit court judge (county of loss or property) picks one. Any 2 of 3 set the loss. Each pays its own appraiser; the umpire and other costs are split equally.","source":"MCL 500.2833(1)(m)"},{"id":"prop-c012","sec":"basics","front":"Fire policy effective time","back":"12:01 a.m. standard time at the location of the property.","source":"MCL 500.2833(1)(s)"},{"id":"prop-c013","sec":"basics","front":"500.2845 fire/explosion withholding","back":"In participating municipalities, when a real-property fire or explosion settlement exceeds 49% of the insurance, the insurer withholds 25% of the ACV or settlement, whichever is less (residential cap $12,000 base, CPI-adjusted), to secure repair or cleanup.","source":"MCL 500.2845(1),(15)"},{"id":"prop-c014","sec":"basics","front":"Home/auto termination notice (Essential Insurance Act)","back":"At least 30 days' written notice stating the effective date and each specific reason. Within the first 55 days of a new policy: effective not less than 20 days after mailing. Nonpayment: as provided in the policy.","source":"MCL 500.2123"},{"id":"prop-c015","sec":"basics","front":"500.3020 casualty cancellation","back":"The insurer may cancel on not less than 10 days' notice. Minimum earned premium = greater of pro rata or $25 (not for auto). Malpractice nonrenewal requires not less than 60 days' notice.","source":"MCL 500.3020(1)"},{"id":"prop-c016","sec":"basics","front":"TRIA key numbers (2019 reauthorization)","back":"Insurer deductible 20% of prior-year direct earned premium. Federal share 80%. Program trigger $200 million. Annual cap $100 billion. Certification requires more than $5 million in losses. Program ends Dec 31, 2027 (extension bills pending in 2026).","source":"TRIA §§102(1),(7), 103(e), 108(a); 15 U.S.C. 6701 note"},{"id":"prop-c017","sec":"basics","front":"TRIA certification","back":"By the Secretary of the Treasury, in consultation with the Secretary of Homeland Security and the Attorney General. Not for a war declared by Congress (except workers' comp). Not reviewable by courts.","source":"TRIA §102(1)"},{"id":"prop-c018","sec":"basics","front":"TRIA: lines covered vs excluded","back":"Covered: commercial P&C, including workers' comp, excess, and D&O. Excluded: commercial auto, burglary/theft, surety, professional liability, farmowners MP, crop, mortgage/title, medical malpractice, health/life, NFIP flood, reinsurance.","source":"TRIA §102(11)"},{"id":"prop-c019","sec":"basics","front":"Producer terminated (500.1209): what may the producer do?","back":"Service existing policies. Without the insurer's approval, the producer may not bind new risks, renew, or increase the insurer's obligation (unless the contract says otherwise). The insurer may not cancel or nonrenew policies because of the termination.","source":"MCL 500.1209(1)"},{"id":"prop-c020","sec":"basics","front":"Permitted reasons to terminate a home/auto producer","back":"Malfeasance; breach of fiduciary duty or trust; violation of the Code; failure to perform the contract; fewer than 25 home and auto applications in the prior 12 months. NOT permitted: geographic location or location-related loss experience.","source":"MCL 500.1209(2)-(3)"},{"id":"prop-c021","sec":"basics","front":"Eligible person: home insurance","back":"Owner-occupant or tenant of a house, condo or co-op unit, room, or apartment, or owner-occupant of a dwelling of up to 4 units. Excluded: arson conviction (5 yrs); claim denied for arson or fraud (5 yrs); refuses 80% of RC / 100% of market value / 100% ACV (tenant); nonpayment cancellation (2 yrs); taxes delinquent 2+ yrs.","source":"MCL 500.2103(2)"},{"id":"prop-c022","sec":"basics","front":"Home underwriting rules may NOT consider…","back":"The age of the structure (physical-condition rules must disregard age); location of the risk (redlining); neighboring residential property or traffic patterns as an 'adjacent hazard'. Inspection selection may not use race, color, creed, marital status, sex, national origin, residence, age, disability, or lawful occupation.","source":"MCL 500.2117(2)(b),(h); 500.2108(8); 500.2121(1)"},{"id":"prop-c023","sec":"basics","front":"Declination rules (500.2122)","back":"Give each specific reason. Written application means a written explanation. Oral application allows an oral explanation, plus a written one if requested within 90 days. Refusing to provide an application form counts as a declination.","source":"MCL 500.2122"},{"id":"prop-c024","sec":"basics","front":"Michigan Basic Property Insurance Association (FAIR plan) basics","back":"All property insurers are members. Agents write for the pool without an additional license. Inspection within the prior 6 months. 1-year policy term. Binders up to 60 days. Home policies: replacement cost at least 80% of RC; repair cost at least 100% of market value (up to 120%).","source":"MCL 500.2920, .2923, .2924, .2925"},{"id":"prop-c025","sec":"dwelling","front":"DP-1 / DP-2 / DP-3 perils","back":"DP-1: fire, lightning, internal explosion (Extended Coverage and V&MM by premium). DP-2: 16 broad named perils. DP-3: open perils on A and B, broad named perils on C. No form covers theft of contents; theft is added by endorsement.","source":"ISO DP 00 01 07 88; DP 00 02 07 88; DP 00 03 12 02"},{"id":"prop-c026","sec":"dwelling","front":"Dwelling Coverages A-E","back":"A Dwelling; B Other Structures; C Personal Property (on the Described Location); D Fair Rental Value; E Additional Living Expense (DP-2 and DP-3 only). Liability requires the Personal Liability Supplement.","source":"ISO DP 00 03 12 02; DP 00 01 07 88"},{"id":"prop-c027","sec":"dwelling","front":"DP-3 (12 02) Other Coverages percentages","back":"Other structures 10% of A (additional). Tenant improvements 10% of C. World-wide 10% of C (reduces C). Fair rental value plus ALE 20% of A (additional). Trees 5% of A, $500 per tree. Fire department $500, no deductible. Ordinance or law 10% of A.","source":"ISO DP 00 03 12 02, Other Coverages"},{"id":"prop-c028","sec":"dwelling","front":"Dwelling loss settlement","back":"DP-1: ACV. DP-2 and DP-3: buildings at replacement cost if insured to at least 80%; ACV until repaired unless the loss is under 5% of the insurance and under $2,500; 180 days to give notice of intent to repair.","source":"ISO DP 00 01 07 88 Cond. 5; DP 00 03 12 02 Cond. E"},{"id":"prop-c029","sec":"dwelling","front":"Broad Theft (DP 04 72) vs Limited Theft (DP 04 73)","back":"Broad Theft: owner-occupied (or tenant named insured), on- and off-premises. Off-premises only if on-premises is bought, and its limit cannot exceed the on-premises limit. Limited Theft: non-owner-occupied, on-premises only. Manual minimum $1,000.","source":"ISO Dwelling Policy Program Manual Rule 510"},{"id":"prop-c030","sec":"dwelling","front":"Dwelling Under Construction (DP 11 43)","back":"The Coverage A limit is provisional. The amount of insurance = provisional limit x (actual value ÷ completed value). Premium is based on the average amount of insurance. Occupancy is allowed 30 days after completion.","source":"ISO DP 11 43 12 02"},{"id":"prop-c031","sec":"dwelling","front":"Personal Liability Supplement (DL 24 01)","back":"Coverage L Personal Liability and Coverage M Medical Payments to Others (expenses within 3 years). Additional coverages include claim expenses ($250/day lost earnings) and damage to property of others up to $1,000.","source":"ISO DL 24 01 12 02"},{"id":"prop-c032","sec":"ho","front":"HO forms at a glance","back":"HO-2 named perils (A, B, C). HO-3 open A and B, named C. HO-4 tenant: C and D only. HO-5 open A, B, C. HO-6 condo/co-op unit owners, named perils A and C. HO-8 modified: 10 basic perils, for older homes where replacement cost far exceeds market value.","source":"ISO HO 00 02/03/04/05/06/08; The Institutes AIC 43"},{"id":"prop-c033","sec":"ho","front":"HO-3 05 11 Coverage C special limits","back":"Money $200. Securities/documents $1,500. Watercraft $1,500. Trailers $1,500. Theft of jewelry/watches/furs $1,500. Theft of firearms $2,500. Theft of silverware $2,500. Business property on premises $2,500, away $1,500. Portable electronics in a vehicle $1,500. Vehicle media $250.","source":"ISO HO 00 03 05 11, Sec. I C.3"},{"id":"prop-c034","sec":"ho","front":"HO-3 (HO 00 03 05 11) Coverage C limits at other locations","back":"Property usually kept at an insured's other residence: 10% of C or $1,000, whichever is greater. This limit does not apply to property moved out while the home is being repaired and unfit to live in, or to property in a newly acquired principal residence for 30 days. Property in a self-storage facility: same 10%/$1,000 limit, except for property moved out during repairs or property usually kept at another residence.","source":"ISO HO 00 03 05 11, Sec. I Coverage C.2.a-b"},{"id":"prop-c035","sec":"ho","front":"HO-3 (HO 00 03 05 11) Section I Additional Coverages ($/%)","back":"Debris removal +5%. Tree removal $1,000 ($500 per tree). Trees/shrubs 5% of A ($500 per tree, no windstorm). Fire department $500. Property removed 30 days. Credit card/forgery $500. Loss assessment $1,000. Landlord's furnishings $2,500. Ordinance or law 10% of A. Grave markers $5,000.","source":"ISO HO 00 03 05 11, Sec. I E.1-12"},{"id":"prop-c036","sec":"ho","front":"HO-3 80% replacement cost rule","back":"If insured to at least 80% of RC: pay RC (least of limit, RC, amount spent). If below 80%: pay the greater of ACV or (insurance ÷ 80% of RC) x RC loss. Foundations and underground pipes are excluded from the 80% calculation.","source":"ISO HO 00 03 05 11, Sec. I Cond. D.2"},{"id":"prop-c037","sec":"ho","front":"HO-3 vacancy rules","back":"Vandalism/malicious mischief and glass breakage are not covered if the dwelling was vacant more than 60 consecutive days before the loss. A dwelling under construction is not vacant.","source":"ISO HO 00 03 05 11, Sec. I Perils A.2.c(4); E.9"},{"id":"prop-c038","sec":"ho","front":"HO-3 (HO 00 03 05 11) key condition time limits","back":"Proof of loss: within 60 days of the insurer's request. Appraisal: 20 days to name appraisers, 15 days to agree on an umpire. Our option: 30 days after proof of loss. Loss payment: 60 days (Michigan statute: 30 days after proof of the amount of loss). Suit: within 2 years. Michigan law requires at least 1 year or the policy period if longer, tolled from notice of loss until formal denial. Notice of intent to claim replacement cost: 180 days. Mortgagee notice: 10 days. Liberalization: 60 days.","source":"ISO HO 00 03 05 11, Sec. I Cond. C, F, H-J, L; Secs I & II Cond. A; MCL 500.2833(1)(p)-(q)"},{"id":"prop-c039","sec":"ho","front":"HO-3 cancellation by insurer","back":"Nonpayment: 10 days. New policy in force under 60 days: any reason, 10 days. After 60 days or on renewal: only material misrepresentation or substantial change in risk, 30 days. Nonrenewal: 30 days. (Michigan home insurance: 30 days, or 20 days in the first 55 days, per 500.2123.)","source":"ISO HO 00 03 05 11, Secs I & II Cond. C-D; MCL 500.2123"},{"id":"prop-c040","sec":"ho","front":"Coverage F basics","back":"Medical expenses incurred or ascertained within 3 years. Not for you or regular household residents (except residence employees). Manual minimum $1,000 per person; Coverage E minimum $100,000.","source":"ISO HO 00 03 05 11, Sec. II B; ISO HO Manual Table 301 (RIJRA)"},{"id":"prop-c041","sec":"ho","front":"HO-3 (HO 00 03 05 11) Section II additional coverages","back":"Claim expenses (including $250/day lost earnings). First aid. Damage to property of others $1,000 at RC (not if intentional by an insured age 13+). Loss assessment $1,000. All are in addition to the limits.","source":"ISO HO 00 03 05 11, Sec. II Add'l Cov."},{"id":"prop-c042","sec":"ho","front":"Watercraft liability under HO-3 05 11","back":"Covered: sailboats under 26 ft; owned outboards totaling 25 hp or less; inboards 50 hp or less if not owned. Owned outboards over 25 hp are covered only if acquired during the policy period, or declared at inception or reported within 45 days. Otherwise use HO 24 75.","source":"ISO HO 00 03 05 11, Sec. II Excl. B; PF&M 2014"},{"id":"prop-c043","sec":"ho","front":"Scheduled Personal Property (HO 04 61)","back":"Open perils, worldwide, no deductible. Newly acquired jewelry, furs, cameras, or musical instruments: lesser of 25% of the class limit or $10,000, report within 30 days. Newly acquired fine arts: 25% at ACV, report within 90 days.","source":"PF&M HO 04 61 (2017)"},{"id":"prop-c044","sec":"ho","front":"Personal Property Replacement Cost (HO 04 90 05 11)","back":"RC for Coverage C, carpeting, appliances, awnings. Not eligible: antiques, fine arts, memorabilia, items in poor condition, obsolete stored items. Over $500: ACV until replaced. 180 days to claim RC.","source":"ISO HO 04 90 05 11"},{"id":"prop-c045","sec":"ho","front":"Personal Injury endorsement (HO 24 82) perils","back":"False arrest, detention or imprisonment; malicious prosecution; libel, slander, defamation; invasion of privacy; wrongful eviction or entry.","source":"PF&M 2014"},{"id":"prop-c046","sec":"ho","front":"Earthquake (HO 04 54) key terms","back":"Shocks within 72 hours count as one earthquake. Deductible = % x the greater of the A or C limit (10 00 edition minimum $250). Excludes exterior masonry veneer (unless removed), earthquake-caused flood, and filling land.","source":"ISO HO 04 54 10 00"},{"id":"prop-c047","sec":"ho","front":"Limited Fungi endorsements (HO 04 26/27/28, 04 02 edition) schedule and use","back":"Schedule: $10,000 for the Section I additional coverage (loss, removal, tear-out, testing), and a $50,000 Coverage E aggregate sublimit (within the Coverage E limit, not added to it). HO 04 27 is for HO-3 and HO-5. HO 04 26 is for all other forms. HO 04 28 is for HO-4 with HO 05 24, or HO-6 with HO 17 31 or HO 17 32.","source":"ISO HO 04 26 / 04 27 / 04 28 04 02; PF&M 2014"},{"id":"reg-c001","sec":"reg","front":"Appointment notice deadline (insurer)","back":"Within 15 days from the date the agency contract is executed or the first application is submitted. The director verifies eligibility within 30 days.","source":"MCL 500.1208a(3),(4)"},{"id":"reg-c002","sec":"reg","front":"Can a producer bind coverage without an appointment?","back":"No. A producer may not bind coverage for an insurer unless that insurer has appointed the producer.","source":"MCL 500.1208a(2)"},{"id":"reg-c003","sec":"reg","front":"Termination notice to director","back":"Within 30 days after the effective date of termination, whether or not for cause. A copy goes to the producer within 15 days (certified mail or overnight if for cause). The producer may file comments within 30 days.","source":"MCL 500.1208b(1),(2),(4)"},{"id":"reg-c004","sec":"reg","front":"Auto/home producer termination: allowed reasons","back":"Malfeasance; breach of fiduciary duty; violation of the Code; failure to perform the contract; fewer than 25 home and auto applications in 12 months. Geographic location is NOT an allowed basis.","source":"MCL 500.1209(2),(3)"},{"id":"reg-c005","sec":"reg","front":"Controlled business limit","back":"No more than 15% of total premium placed in any 12-month period may be on the agent's own risks or those of employees, employer or business associates.","source":"MCL 500.1208"},{"id":"reg-c006","sec":"reg","front":"Sell / Solicit / Negotiate","back":"Sell: exchange a contract for money on behalf of an insurer. Solicit: attempt to sell, or urge a person to apply for a particular kind of insurance from a particular company. Negotiate: confer or advise directly about a particular contract's substantive terms.","source":"MCL 500.1201(m),(n),(o)"},{"id":"reg-c007","sec":"reg","front":"Agent of the insured","back":"A producer NOT appointed by the insurer with which the policy is placed. Treated as representing the insured, not the insurer.","source":"MCL 500.1201(b)"},{"id":"reg-c008","sec":"reg","front":"Resident producer license requirements","back":"Age 18+; no 1239(1) act; prelicensing education completed; fees paid; exam passed for each line.","source":"MCL 500.1205(1)"},{"id":"reg-c009","sec":"reg","front":"Prelicensing hours: P&C","back":"40 hours for the combined property and casualty producer/solicitor program (also covers personal lines); 20 for property only, casualty only, or personal lines only. Must include ethics instruction.","source":"MCL 500.1204a(1)(b),(c)"},{"id":"reg-c010","sec":"reg","front":"Business entity license","back":"Needs its own producer license and must designate an individual licensed producer responsible for its compliance with Michigan insurance laws.","source":"MCL 500.1205(2)"},{"id":"reg-c011","sec":"reg","front":"Moving to Michigan","back":"Apply for a resident license within 90 days after establishing legal residence. No prelicensing education or exam for lines already held.","source":"MCL 500.1206b(2)"},{"id":"reg-c012","sec":"reg","front":"Temporary producer license","back":"Up to 180 days, no exam. For example, a surviving spouse or personal representative of a deceased or disabled producer, or the designee of a producer entering military service.","source":"MCL 500.1211b"},{"id":"reg-c013","sec":"reg","front":"Solicitor","back":"A natural person who solicits applications and collects premiums for a licensed resident agent, under a written contract, with the agent having notified the director. An agent must immediately notify the director when a solicitor's authority ends.","source":"MCL 500.1211(1); 500.1212; 500.1218"},{"id":"reg-c014","sec":"reg","front":"Counselor written agreement","back":"Signed by counselor and client BEFORE services. States the work and the fee. The fee may NOT be waived. Discloses any commission. Kept at least 2 years.","source":"MCL 500.1236"},{"id":"reg-c015","sec":"reg","front":"Who needs no counselor license to advise?","back":"A licensed agent giving customary advice, and an attorney admitted in Michigan.","source":"MCL 500.1232"},{"id":"reg-c016","sec":"reg","front":"Commissions to unlicensed persons","back":"Prohibited for anyone required to be licensed. Renewal or deferred commissions are OK if the person was licensed at the time of sale. May be paid to an agency.","source":"MCL 500.1240"},{"id":"reg-c017","sec":"reg","front":"Change of name or address","back":"Notify the commissioner within 30 days (legal name or address; also mailing and email address).","source":"MCL 500.1206(5); 500.1238(1)"},{"id":"reg-c018","sec":"reg","front":"Assumed name","back":"Notify the commissioner BEFORE using any name other than the legal name.","source":"MCL 500.1211a"},{"id":"reg-c019","sec":"reg","front":"Reporting administrative / criminal actions","back":"Administrative action: within 30 days after final disposition. Criminal prosecution: within 30 days after the initial pretrial hearing date.","source":"MCL 500.1247"},{"id":"reg-c020","sec":"reg","front":"CE requirement","back":"24 hours every 2 years, with at least 3 in ethics. Hour = at least 50 minutes. Carryover: up to 12 hours, but ethics hours don't count toward the next period's ethics requirement.","source":"MCL 500.1204c(2),(13),(18)"},{"id":"reg-c021","sec":"reg","front":"CE 90-day grace period","back":"No new sales or binding; may service existing policies and receive commissions on them. License canceled if CE is still unmet after 90 days.","source":"MCL 500.1204c(11)"},{"id":"reg-c022","sec":"reg","front":"License lapse (non-CE reason)","back":"May reinstate without an exam within 12 months of the lapse.","source":"MCL 500.1206(3)"},{"id":"reg-c023","sec":"reg","front":"1239(1) mandatory denial: felony","back":"Any felony within 10 years before application; regardless of date, felonies involving violence, criminal sexual conduct, or fiduciary or financial crimes (fraud, embezzlement, bribery, extortion).","source":"MCL 500.1239(1)(d),(e)"},{"id":"reg-c024","sec":"reg","front":"Chapter 12 civil fines (1244)","back":"Up to $1,000 per violation, or $5,000 if the person knew or should have known; max $50,000 per order. Knowingly violating a cease and desist order: up to $20,000 per violation, max $100,000.","source":"MCL 500.1244(1),(3)"},{"id":"reg-c025","sec":"reg","front":"UTPA fines (2038)","back":"$1,000 per violation, $10,000 aggregate; knowing violations $5,000 each, $50,000 aggregate per 6 months. Violating a cease and desist order: up to $20,000 per violation (2040).","source":"MCL 500.2038(1)(a); 500.2040(1
