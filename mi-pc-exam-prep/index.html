\n\u003ch4>Unfair Discrimination\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Life and annuities\u003c/strong>: no unfair discrimination between individuals of the \u003cstrong>same class and equal expectation of life\u003c/strong> in rates, dividends, benefits or terms. \u003ccite>[MCL 500.2019]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Accident and health\u003c/strong>: no unfair discrimination between individuals of the \u003cstrong>same class and essentially the same hazard\u003c/strong>. \u003ccite>[MCL 500.2020]\u003c/cite>\n\u003c/li>\u003cli>\nRefusing to insure, refusing to continue, or limiting coverage \u003cstrong>because of\u003c/strong> any of the following is prohibited \u003ccite>[MCL 500.2027(a)(i)]\u003c/cite>:\n\u003cul>\n\u003cli>\nrace, color, creed\n\u003c/li>\u003cli>\nmarital status (but marital status may be used to classify family units)\n\u003c/li>\u003cli>\nsex, gender, gender identity or expression, sexual orientation\n\u003c/li>\u003cli>\nnational origin\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Residence, age, disability, lawful occupation or location\u003c/strong> may be used only if reasonably related to the risk. \u003ccite>[MCL 500.2027(a)(ii)]\u003c/cite>\n\u003c/li>\u003cli>\nFor \u003cstrong>property\u003c/strong> insurance, location may be used only if there is a \u003cstrong>statistically significant relationship\u003c/strong> between the location and the risk of \u003cstrong>fire\u003c/strong> loss within the area. \"Area\" means a \u003cstrong>single ZIP code\u003c/strong>. \u003ccite>[MCL 500.2027(a)(iii)]\u003c/cite>\n\u003c/li>\u003cli>\nIt is unfair to refuse to insure, or to refuse to continue to insure, \u003cstrong>solely because the applicant was previously denied coverage\u003c/strong> by an insurer. \u003ccite>[MCL 500.2027(b)]\u003c/cite>\n\u003c/li>\u003cli>\nDifferent rates for the same coverage based on the listed traits are unfair unless the difference is actuarially sound and supported by loss statistics. \u003ccite>[MCL 500.2027(c)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Life insurers and race or color\u003c/strong>: a life insurer may not discriminate by race or color. Violations bring:\n\u003cul>\n\u003cli>\nfor the insurer, a civil fine of \u003cstrong>$1,000\u003c/strong> per violation\n\u003c/li>\u003cli>\nfor an officer or agent, a misdemeanor: up to \u003cstrong>1 year\u003c/strong> in jail and/or a fine of \u003cstrong>$500-$1,000\u003c/strong>\n \u003ccite>[MCL 500.2082, am. 2025 PA 46, eff. Mar. 24, 2026]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Rebating\u003c/h4>\n\u003cul>\n\u003cli>\nNo insurer, agent or solicitor may offer, give or pay, directly or indirectly, any \u003cstrong>rebate of premium\u003c/strong>, part of the commission, or \u003cstrong>valuable consideration or inducement not specified in the policy\u003c/strong>, including stocks or securities. \u003ccite>[MCL 500.2066(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nOn satisfactory evidence of a violation, the commissioner \u003cstrong>revokes\u003c/strong> the license, and no license is issued for \u003cstrong>1 year\u003c/strong>. \u003ccite>[MCL 500.2066(2)]\u003c/cite>\n\u003c/li>\u003cli>\nIt is also a misdemeanor, with a fine of up to \u003cstrong>$100 per violation\u003c/strong> or county jail. \u003ccite>[MCL 500.2069]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Insured who accepts a rebate\u003c/strong>: an insured who knowingly accepts a rebate has the \u003cstrong>insurance reduced\u003c/strong> in proportion to the rebate's share of the total premium. The insured also commits a misdemeanor, with a fine of up to \u003cstrong>$100\u003c/strong>. \u003ccite>[MCL 500.2070]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Allowed gift (P&amp;C)\u003c/strong>: an insurer or P&amp;C producer may give an applicant or insured an article of merchandise costing the insurer \u003cstrong>$50 or less per calendar year\u003c/strong>. \u003ccite>[MCL 500.2024b, am. 2018 PA 542]\u003c/cite>\n\u003c/li>\u003cli>\nFor comparison, a life insurer or agent may give a life applicant merchandise with an invoice value of \u003cstrong>$5 or less\u003c/strong>. \u003ccite>[MCL 500.2024a]\u003c/cite>\n\u003c/li>\u003cli>\nSection 2024 prohibits rebates and special inducements for life, annuity and A&amp;H contracts. \u003ccite>[MCL 500.2024]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Claims and Other Practices (Course of Conduct)\u003c/h4>\n\u003cul>\n\u003cli>\nThe unfair claims practices below count only when they show \u003cstrong>a course of conduct indicating a persistent tendency\u003c/strong>, not isolated incidents. \u003ccite>[MCL 500.2026(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nmisrepresenting facts or policy provisions\n\u003c/li>\u003cli>\nfailing to acknowledge or act promptly on claim communications\n\u003c/li>\u003cli>\nrefusing to pay without a reasonable investigation\n\u003c/li>\u003cli>\nfailing to settle in good faith once liability is reasonably clear\n\u003c/li>\u003cli>\ncompelling insureds to sue by lowballing\n\u003c/li>\u003cli>\nfailing to explain a denial\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nInsurers must keep a \u003cstrong>complaint record\u003c/strong> since the last examination. An agent who receives a written complaint about an insurer must \u003cstrong>promptly forward it to the insurer\u003c/strong>, unless the agent resolves it to the insured's satisfaction within a reasonable time. \u003ccite>[MCL 500.2026(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Timely claim payment\u003c/strong>:\n\u003cul>\n\u003cli>\nThe insurer must specify what proof of loss it needs within \u003cstrong>30 days\u003c/strong> of receiving the claim.\n\u003c/li>\u003cli>\nA claim is timely if paid within \u003cstrong>60 days\u003c/strong> after proof of loss.\n\u003c/li>\u003cli>\nLate benefits bear \u003cstrong>12% simple interest per year\u003c/strong> from 60 days after proof of loss.\n \u003ccite>[MCL 500.2006(1),(3),(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Workers' compensation\u003c/strong>: a premium deposit may not exceed \u003cstrong>the greater of 25% of projected annual premium or $2,500\u003c/strong>, and the insurer may not require buying other insurance. \u003ccite>[MCL 500.2016(1)(b),(c)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Automatic credit insurance\u003c/strong>: it is unfair to write insurance automatically on a debtor unless the debtor rejects it, unless the creditor pays the premium. \u003ccite>[MCL 500.2023]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Rate information\u003c/strong>: rating organizations and insurers must furnish rate information to an affected insured on written request. \u003ccite>[MCL 500.2021]\u003c/cite>\n\u003c/li>\u003cli>\nViolating chapter 5 (privacy) or its rules is itself an unfair trade practice. \u003ccite>[MCL 500.2013]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Fiduciary Responsibilities\u003c/h3>\n\u003cul>\n\u003cli>\nAn agent is a \u003cstrong>fiduciary\u003c/strong> for all money received or held as agent. \u003ccite>[MCL 500.1207(1)]\u003c/cite>\n\u003c/li>\u003cli>\nPremiums and return premiums are \u003cstrong>fiduciary money\u003c/strong>. They must be \u003cstrong>segregated\u003c/strong> and \u003cstrong>not commingled\u003c/strong> with the agent's own money.\n\u003cul>\n\u003cli>\nThe agent may use \u003cstrong>own money to open\u003c/strong> the separate account.\n\u003c/li>\u003cli>\nFurther deposits of own money are allowed \u003cstrong>only to pay or avoid bank charges\u003c/strong>, and must be separately accounted for.\n \u003ccite>[MCL 500.1207(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nThe separate account must be at a \u003cstrong>federally insured\u003c/strong> state or federal institution, and \u003cstrong>may bear interest\u003c/strong>. \u003ccite>[MCL 500.1207(3)]\u003c/cite>\n\u003c/li>\u003cli>\nThe agent may hold \u003cstrong>return premiums\u003c/strong> in the account to pay an insured's future premiums \u003cstrong>with the insured's written authorization\u003c/strong>. \u003ccite>[MCL 500.1207(4)]\u003c/cite>\n\u003c/li>\u003cli>\nRecords must show at least the date received, payee name, amount and description of fiduciary money. They are open to examination by the director. \u003ccite>[MCL 500.1207(6),(10)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Failure to turn over fiduciary money in a timely manner is prima facie evidence\u003c/strong> of a violation of fiduciary duty. \u003ccite>[MCL 500.1207(8)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Placing refused coverage\u003c/strong>: if the agent's insurers refuse part of the coverage, the agent may place it through another licensed agent or a risk-sharing plan. The agent must tell the buyer \u003cstrong>in writing\u003c/strong> that the coverage is not in effect until the buyer receives \u003cstrong>written evidence of insurance\u003c/strong>. \u003ccite>[MCL 500.1207(12)]\u003c/cite>\n\u003c/li>\u003cli>\nAn agent may not agree to pay losses out of commissions unless claims are adjusted by company adjusters or licensed independent adjusters. \u003ccite>[MCL 500.1207(14)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Forgery\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Forging another's name\u003c/strong> to an insurance application, or to any document related to an insurance transaction, is a 1239(1)(h) cause. The director must deny the license and may suspend or revoke an existing one, and/or fine. \u003ccite>[MCL 500.1239(1)(h)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Insurance Fraud Regulation\u003c/h3>\n\u003cul>\n\u003cli>\nA \u003cstrong>fraudulent insurance act\u003c/strong> is an act committed \u003cstrong>knowingly and with intent to injure, defraud or deceive\u003c/strong>. Examples \u003ccite>[MCL 500.4503]\u003c/cite>:\n\u003cul>\n\u003cli>\npresenting false material information in an \u003cstrong>application\u003c/strong>\n\u003c/li>\u003cli>\npresenting false material information in support of a \u003cstrong>claim\u003c/strong>, including computer-generated information\n\u003c/li>\u003cli>\nhelping prepare such statements\n\u003c/li>\u003cli>\nsoliciting or accepting risks for an \u003cstrong>insolvent insurer\u003c/strong>\n\u003c/li>\u003cli>\nremoving or concealing an insurer's assets or records from the commissioner\n\u003c/li>\u003cli>\ndiverting insurer funds\n\u003c/li>\u003cli>\nacting as or using a \u003cstrong>runner, capper or steerer\u003c/strong>\n\u003c/li>\u003cli>\nknowingly assisting or benefiting from the fraud\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Runner, capper or steerer\u003c/strong>: a person paid by a practitioner for procuring clients or patients in order to obtain insurance benefits or assert claims. A practitioner who advertises through public media is not one. \u003ccite>[MCL 500.4501(h)]\u003c/cite>\n\u003c/li>\u003cli>\n\"Statement\" includes proofs of loss, invoices, estimates, bills, claim forms, medical records and X-rays. \u003ccite>[MCL 500.4501(i)]\u003c/cite>\n\u003c/li>\u003cli>\n\"Authorized agency\" includes the state police, local police and sheriffs, prosecutors, federal investigators, DIFS (formerly OFIR) and the Department of State. \u003ccite>[MCL 500.4501(a)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Penalties\u003c/strong> \u003ccite>[MCL 500.4511]\u003c/cite>:\n\u003cul>\n\u003cli>\ncommitting a fraudulent insurance act: a \u003cstrong>felony\u003c/strong>, up to \u003cstrong>4 years\u003c/strong> in prison and/or a fine of up to \u003cstrong>$50,000\u003c/strong>, plus mandatory \u003cstrong>restitution\u003c/strong>\n\u003c/li>\u003cli>\n\u003cstrong>agreement or conspiracy\u003c/strong> to commit one: a felony, up to \u003cstrong>10 years\u003c/strong> and/or \u003cstrong>$50,000\u003c/strong>, plus restitution\n\u003c/li>\u003cli>\nif a practitioner or insurer is found guilty, the court notifies the licensing authority\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Sharing information\u003c/strong>: on an authorized agency's \u003cstrong>written request\u003c/strong>, an insurer may release information about suspected fraud, such as applications, premium payment records, claim history and investigation materials. An insurer may also report suspected fraud on its own. Information may be used \u003cstrong>only\u003c/strong> to investigate suspected insurance fraud. \u003ccite>[MCL 500.4507(1),(2),(6)]\u003c/cite>\n\u003c/li>\u003cli>\nAfter an insurer reports, it may request in writing the agency's related information. The agency may provide it within \u003cstrong>30 days\u003c/strong> on a showing of good cause. \u003ccite>[MCL 500.4507(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Immunity\u003c/strong>: a person who reports or furnishes information about suspected fraud \u003cstrong>without malice\u003c/strong> is not liable for libel, slander or other torts, unless the person knows the information is false. \u003ccite>[MCL 500.4509(1),(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Health care fraud conspiracy\u003c/strong>: conspiring to defraud a health care corporation or health care insurer through a \u003cstrong>false claim\u003c/strong> for health care benefits is a \u003cstrong>felony\u003c/strong>, up to \u003cstrong>10 years\u003c/strong> and/or \u003cstrong>$50,000\u003c/strong>. \u003ccite>[MCL 752.1005]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>False death, sickness or disability claims\u003c/strong>: an agent, physician, insured or other person who presents a false certificate or claim commits a \u003cstrong>misdemeanor\u003c/strong>, punishable by up to \u003cstrong>$1,000\u003c/strong> or up to \u003cstrong>3 months\u003c/strong> in county jail. \u003ccite>[MCL 500.2088]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Consumer Privacy Regulation (Chapter 5, Privacy of Financial Information)\u003c/h3>\n\u003ch4>Scope and Definitions\u003c/h4>\n\u003cul>\n\u003cli>\nChapter 5 protects \u003cstrong>nonpublic personal financial information\u003c/strong> about individuals who obtain insurance for \u003cstrong>personal, family or household\u003c/strong> purposes. It does \u003cstrong>not\u003c/strong> cover companies, or individuals buying for \u003cstrong>business, commercial or agricultural\u003c/strong> purposes. \u003ccite>[MCL 500.501(1)]\u003c/cite>\n\u003c/li>\u003cli>\nIt does not override Michigan health-information confidentiality laws. \u003ccite>[MCL 500.501(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Consumer\u003c/strong>: an individual who seeks, obtains or has obtained a personal-lines insurance product or service. Applicants are included. \u003ccite>[MCL 500.503(f)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Customer\u003c/strong>: a consumer with a \u003cstrong>continuing relationship\u003c/strong> with the licensee. \u003ccite>[MCL 500.503(h),(i)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Licensee\u003c/strong> includes licensed insurers and producers. \u003ccite>[MCL 500.503(l)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Nonpublic personal financial information\u003c/strong> excludes health information protected by other law and publicly available information. \u003ccite>[MCL 500.503(n)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Opt out\u003c/strong>: the consumer's direction not to disclose to \u003cstrong>nonaffiliated third parties\u003c/strong>. \u003ccite>[MCL 500.503(o)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Notices\u003c/h4>\n\u003cul>\n\u003cli>\nA \u003cstrong>producer\u003c/strong> establishes a customer relationship when the consumer \u003cstrong>obtains insurance through that licensee\u003c/strong>. An insurer does so when it \u003cstrong>delivers the policy\u003c/strong>. \u003ccite>[MCL 500.509(1)]\u003c/cite>\n\u003c/li>\u003cli>\nThe relationship ends if a policy is lapsed or inactive and there has been no contact for \u003cstrong>12 consecutive months\u003c/strong>. \u003ccite>[MCL 500.509(2)(a)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Initial notice\u003c/strong>: a clear and conspicuous privacy notice must be given \u003cstrong>no later than when the customer relationship is established\u003c/strong>. It may come later if the relationship was not at the customer's election, or if earlier notice would substantially delay the transaction and the customer agrees. \u003ccite>[MCL 500.507(1)(a); MCL 500.511(1)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Annual notice\u003c/strong>: required at least \u003cstrong>once in any 12 consecutive months\u003c/strong> while the relationship continues. \u003ccite>[MCL 500.513(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nIt is \u003cstrong>not\u003c/strong> required if the licensee shares information only under the 535/537/539 exceptions \u003cstrong>and\u003c/strong> its policies have not changed. \u003ccite>[MCL 500.513(2), am. 2020 PA 90]\u003c/cite>\n\u003c/li>\u003cli>\nIt is not required for \u003cstrong>former customers\u003c/strong>. \u003ccite>[MCL 500.513(3)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Notice content\u003c/strong>: categories of information collected and disclosed, categories of recipients, the \u003cstrong>right to opt out\u003c/strong> and how to exercise it, and confidentiality and security practices. \u003ccite>[MCL 500.515(1)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Agent exemption\u003c/strong>: an agent or employee of a principal licensee need not give notices, if the principal does and the agent discloses only to the principal or its affiliates. \u003ccite>[MCL 500.505(1)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Surplus lines\u003c/strong>: surplus lines brokers comply by giving a \u003cstrong>16-point\u003c/strong> \"PRIVACY NOTICE\" statement and not disclosing information. \u003ccite>[MCL 500.505(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Delivery\u003c/strong>: in writing, or electronically if the consumer agrees, by hand delivery, mail, or a website with required acknowledgment. \u003ccite>[MCL 500.527(1)]\u003c/cite>\n\u003cul>\n\u003cli>\nPosting a \u003cstrong>sign in the office\u003c/strong> or general advertising does \u003cstrong>not\u003c/strong> count.\n\u003c/li>\u003cli>\nEmailing a consumer who did not transact electronically does \u003cstrong>not\u003c/strong> count.\n\u003c/li>\u003cli>\nA notice may \u003cstrong>never\u003c/strong> be given \u003cstrong>solely orally\u003c/strong>.\n \u003ccite>[MCL 500.527(2),(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Opt-Out\u003c/h4>\n\u003cul>\n\u003cli>\nBefore disclosing to a \u003cstrong>nonaffiliated third party\u003c/strong>, the licensee must give an initial notice and an opt-out notice, and allow a \u003cstrong>reasonable opportunity to opt out\u003c/strong>. \u003ccite>[MCL 500.529(1)]\u003c/cite>\n\u003c/li>\u003cli>\nA \u003cstrong>30-day\u003c/strong> window from mailing (by mail form or toll-free number) is reasonable. \u003ccite>[MCL 500.529(2)(a)]\u003c/cite>\n\u003c/li>\u003cli>\nThe licensee must honor an opt-out \u003cstrong>as soon as reasonably practicable\u003c/strong>. The consumer may opt out \u003cstrong>at any time\u003c/strong>. \u003ccite>[MCL 500.523(1),(2)]\u003c/cite>\n\u003c/li>\u003cli>\nAn opt-out lasts until \u003cstrong>revoked in writing\u003c/strong>, or electronically if agreed. It survives the end of the relationship for information already collected, but not for a new relationship. \u003ccite>[MCL 500.523(2),(3)]\u003c/cite>\n\u003c/li>\u003cli>\nJoint consumers may receive one opt-out notice. One joint consumer may opt out for all. \u003ccite>[MCL 500.521]\u003c/cite>\n\u003c/li>\u003cli>\nDisclosing beyond what the initial notice describes requires a \u003cstrong>revised notice\u003c/strong> and a new opt-out opportunity. \u003ccite>[MCL 500.525]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>No opt-out right\u003c/strong> applies in these cases:\n\u003cul>\n\u003cli>\n\u003cstrong>Service providers and joint marketing\u003c/strong>: disclosure to a nonaffiliated service provider or joint marketer, if the licensee gave the initial notice and has a \u003cstrong>contract\u003c/strong> limiting use. \u003ccite>[MCL 500.535]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Transaction exceptions\u003c/strong>: disclosures needed to effect, administer or enforce a transaction, including claims, servicing, reinsurance and the auto placement facility. \u003ccite>[MCL 500.537]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Other exceptions\u003c/strong>: with consent, fraud prevention, to rating organizations, guaranty funds, auditors, regulators and law enforcement, to consumer reporting agencies under the FCRA, in a sale or merger, and to comply with law or subpoena. \u003ccite>[MCL 500.539]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Account numbers\u003c/strong>: a licensee may not give a policy, credit card or account number to a nonaffiliated third party for \u003cstrong>telemarketing, direct mail or email marketing\u003c/strong>. Exceptions: a consumer reporting agency, a service provider marketing the licensee's own products, a producer, affinity programs, or encrypted numbers without the key. \u003ccite>[MCL 500.533]\u003c/cite>\n\u003c/li>\u003cli>\nA licensee may not unfairly discriminate against a consumer who opts out. \u003ccite>[MCL 500.543]\u003c/cite>\n\u003c/li>\u003cli>\nA violation of chapter 5 or its rules is an \u003cstrong>unfair trade practice\u003c/strong> under the UTPA. \u003ccite>[MCL 500.2013; Mich Admin Code R 500.560(a)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Safeguarding Rules (R 500.551-.560)\u003c/h4>\n\u003cul>\n\u003cli>\nTitle: \"Standards for Safeguarding Customer Financial Information\". \u003ccite>[Mich Admin Code R 500.551]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003cp>Since Jan. 20, 2021, MCL 500.555 requires a comprehensive written information security program, but licensees with fewer than 25 employees, including independent contractors, are exempt (500.565(1)). So is an agent covered by its principal's program (500.565(3)), and a HIPAA-compliant licensee is exempt from all but 559 and 561 (500.565(2)). A licensee must notify the director within 10 business days of a qualifying cybersecurity event (500.559(1)). R 500.551-.560 remain in the Admin Code, but MCL 500.550 makes chapter 5A exclusive.\u003c/p>\n\u003cul>\n\u003cli>\nThe program must ensure the security and confidentiality of customer information, protect against anticipated threats, and protect against unauthorized access that could cause substantial harm or inconvenience. \u003ccite>[R 500.554]\u003c/cite>\n\u003c/li>\u003cli>\nExample steps that count as compliance \u003ccite>[R 500.555-.559]\u003c/cite>:\n\u003cul>\n\u003cli>\nassess risk\n\u003c/li>\u003cli>\nmanage and control risk, including \u003cstrong>staff training\u003c/strong> and regular testing\n\u003c/li>\u003cli>\noversee \u003cstrong>service providers\u003c/strong> with due diligence and contract requirements\n\u003c/li>\u003cli>\nadjust the program as technology, threats and business change\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nCompliance with the \u003cstrong>HIPAA\u003c/strong> privacy and security rules for all customer information also satisfies chapter 5 and these rules. \u003ccite>[R 500.560(b)]\u003c/cite>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\n\u003cstrong>MCL 500.1204c amended by 2026 PA 78\u003c/strong>, immediately effective \u003cstrong>July 27, 2026\u003c/strong>.\n\u003cul>\n\u003cli>\nIt adds association-participation CE credit of up to 4 hours (subsection 14).\n\u003c/li>\u003cli>\nSubsection 15 also says \"any activity by an insurance producer, as determined by the director, may be credited\". Its scope is unclear, and I found no DIFS implementation guidance.\n\u003c/li>\u003cli>\nThe PSI outline (Sept 2021) predates this change. No questions test it.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>MCL 500.2082\u003c/strong> was amended by 2025 PA 46 (eff. Mar. 24, 2026). The current fine is $1,000 per violation for the insurer; for an officer or agent, up to 1 year in jail and a $500-$1,000 fine. Older study materials may show different figures.\n\u003c/li>\u003cli>\n\u003cstrong>MCL 500.2027\u003c/strong> was amended by 2023 PA 156 (eff. Feb. 13, 2024). It added gender, gender identity or expression, and sexual orientation. Older prep materials may omit these.\n\u003c/li>\u003cli>\n\u003cstrong>MCL 500.2024b\u003c/strong>: the P&amp;C gift limit is \u003cstrong>$50 per calendar year\u003c/strong> (2018 PA 542). Older materials may show the original 2005 limit, which I did not verify.\n\u003c/li>\u003cli>\n\u003cstrong>CE lapse wording\u003c/strong>: the statute (1204c(11)) says a 90-day grace period, then the license is \"cancelled\". The DIFS FAQ calls it a 90-day \"suspension\", then \"terminated for education\", with reinstatement within 1 year of the review date by completing 24 hours and reapplying through NIPR. The questions use the statute's terms of service-only conduct and a 90-day window.\n\u003c/li>\u003cli>\n\u003cstrong>Solicitor prelicensing currency\u003c/strong>: MCL 500.1214(2) says the solicitor's course must be completed within \u003cstrong>6 months\u003c/strong> before the application. MCL 500.1204(2), for producers, and the DIFS FAQ say \u003cstrong>12 months\u003c/strong>. This is a conflict for solicitors. The 6-month figure is not tested.\n\u003c/li>\u003cli>\n\u003cstrong>Ethics hours in prelicensing\u003c/strong>: the statute requires ethics instruction but sets no hour count. A secondary source claims \"6 hours of ethics and Michigan law\", which I could not verify; the rule R 500.1-.6 PDF could not be downloaded. Not tested.\n\u003c/li>\u003cli>\n\u003cstrong>Statutory fees in MCL 500.240\u003c/strong> (for example, the $10 exam fee) apply only when the director administers exams. PSI charges its own fee; see Exam Logistics.\n\u003c/li>\u003cli>\n\u003cstrong>Penalties outside the cited sections\u003c/strong>: the 2069 misdemeanor penalties for 2064/2066 allow \"imprisonment in the county jail\" with no stated maximum term. Only the fine caps are tested.\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"gen","title":"General Insurance","weight":"10.5% · 16 items","secs":["gen"],"html":"\u003cp>Outline weight: 10.5% (16 items). Concepts below are national and tested in generic terms; Michigan-specific twists are noted where they exist.\u003c/p>\n\u003ch3>Risk Management Key Terms\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Risk\u003c/strong>: uncertainty about whether given events will happen. In practice the word also means the insured person or property. \u003ccite>[IRMI glossary \"risk\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Pure vs. speculative risk\u003c/strong>: pure risk can only cause a loss, never a gain, and is generally insurable. Speculative risk can cause a gain or a loss (a business venture, gambling) and generally is not insurable. \u003ccite>[IRMI \"pure risk\"; \"speculative risk\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Exposure\u003c/strong>: being subject to loss from some hazard or contingency. The word also means the rating unit or premium base (for example, payroll per $100). \u003ccite>[IRMI \"exposure\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Hazard\u003c/strong>: a condition that increases the probability of loss, e.g., poor housekeeping in a factory or inadequate lighting in a crime-prone area. \u003ccite>[IRMI \"hazard\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Peril\u003c/strong>: a cause of loss, e.g., fire, windstorm, collision. \u003ccite>[IRMI \"peril\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Loss\u003c/strong>: the reduction in value the policy responds to. A direct loss comes from direct damage to property. An indirect (consequential) loss follows from that damage, e.g., loss of rent. \u003ccite>[IRMI \"direct loss\"; \"consequential loss\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Methods of Handling Risk\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Avoidance\u003c/strong>: preventing the risk entirely by not doing the activity, e.g., a contractor declines remediation jobs. \u003ccite>[IRMI \"avoidance\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Retention\u003c/strong>: planned acceptance of losses through deductibles, deliberate noninsurance, or loss-sensitive plans. Self-insurance is a form of retention. \u003ccite>[IRMI \"risk retention\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Sharing\u003c/strong>: each group member's premiums and losses are allocated within the group by a set formula. Insurance pools and reciprocals work this way: subscribers pool their risks. \u003ccite>[IRMI \"risk sharing\"; \"reciprocal\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Reduction (loss control)\u003c/strong>: lowering the frequency of losses (prevention, e.g., driver training) or their severity (reduction, e.g., sprinklers, firewalls). \u003ccite>[IRMI \"loss control\"; \"loss reduction\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Transfer\u003c/strong>: shifting the financial consequences of a risk to another party. The two main forms are buying insurance and noninsurance contractual transfer, such as a hold-harmless or indemnity agreement. \u003ccite>[IRMI \"hold harmless agreement\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Elements of an (Ideally) Insurable Risk\u003c/h3>\n\u003cul>\n\u003cli>\nThere are six characteristics:\n\u003cul>\n\u003cli>\nA large number of exposure units.\n\u003c/li>\u003cli>\nAccidental and unintentional loss.\n\u003c/li>\u003cli>\nA determinable and measurable loss.\n\u003c/li>\u003cli>\nNo catastrophic loss.\n\u003c/li>\u003cli>\nA calculable chance of loss.\n\u003c/li>\u003cli>\nAn economically feasible premium.\n \u003ccite>[Rejda &amp; McNamara, \u003cem>Principles of Risk Management and Insurance\u003c/em>, 13th ed., \"Characteristics of an Ideally Insurable Risk\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch3>Adverse Selection &amp; Law of Large Numbers\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Adverse selection\u003c/strong>: an imbalance in an exposure group. It occurs because people who see a high chance of loss for themselves buy insurance far more often than people who see a low chance. Underwriting exists largely to counter it. \u003ccite>[IRMI \"adverse selection\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Law of large numbers\u003c/strong>: the larger the number of exposure units independently exposed to loss, the more likely actual losses will equal expected losses. In other words, a larger pool makes the data more credible. \u003ccite>[IRMI \"law of large numbers\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Reinsurance\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Reinsurance\u003c/strong>: the reinsurer, for a premium, indemnifies the \"reinsured\" (the primary insurer, also called the ceding company) for part or all of the liability it assumed. \u003ccite>[IRMI \"reinsurance\"; \"ceding company\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Treaty vs. facultative\u003c/strong>:\n\u003cul>\n\u003cli>\nTreaty: an agreement covering whole classes of business. The reinsurer must accept every risk that qualifies under the treaty. \u003ccite>[IRMI \"treaty reinsurance\"]\u003c/cite>\n\u003c/li>\u003cli>\nFacultative: each risk is offered and negotiated separately, and the reinsurer may decline any submission. \u003ccite>[IRMI \"facultative reinsurance\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Pro rata (proportional) vs. excess of loss (nonproportional)\u003c/strong>:\n\u003cul>\n\u003cli>\nPro rata: the reinsurer receives a set percentage of the premium and pays the same percentage of losses. Quota share is a pro rata form that cedes an agreed percentage of every risk in a class. Surplus reinsurance covers amounts above the ceding company's retention, and losses are shared in proportion to each party's share of the limit. \u003ccite>[IRMI \"pro rata reinsurance\"; \"proportional reinsurance\"; \"quota share reinsurance\"; \"surplus reinsurance\"]\u003c/cite>\n\u003c/li>\u003cli>\nExcess of loss: the reinsurer pays the part of a loss above the ceding company's retention, up to a limit. Its premium is calculated independently of the original premium. \u003ccite>[IRMI \"excess of loss reinsurance\"; \"nonproportional reinsurance\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Purposes\u003c/strong>:\n\u003cul>\n\u003cli>\nCapacity: the largest amount of insurance a company can write. \u003ccite>[IRMI \"capacity\"]\u003c/cite>\n\u003c/li>\u003cli>\nSurplus relief: offsetting unusual drains on surplus, especially when premium volume is growing fast. \u003ccite>[IRMI \"surplus relief\"]\u003c/cite>\n\u003c/li>\u003cli>\nStabilizing results and protecting against catastrophes. \u003ccite>[IRMI \"reinsurance\"; \"capacity\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nIf an insurer reinsures part of a risk and the reinsurer pays late, the original insurer still owes the Michigan timely-payment interest. \u003ccite>[MCL 500.2006(5)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Types of Insurers\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Stock company\u003c/strong>: owned by stockholders, with a capital fund they paid in on top of surplus and reserves. \u003ccite>[IRMI \"stock company\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Mutual company\u003c/strong>: owned by its insureds. Every owner is an insured and every insured is an owner. \u003ccite>[IRMI \"mutual company\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Reciprocal (interinsurance exchange)\u003c/strong>: an unincorporated group of subscribers who pool risks. It is managed by an attorney-in-fact. \u003ccite>[IRMI \"reciprocal\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Lloyd's\u003c/strong>: an association and marketplace of independent underwriters, not an insurance company. \u003ccite>[IRMI \"Lloyd's of London\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Fraternal benefit society\u003c/strong>: members share a common ethnic, religious, or vocational affiliation. Fraternals mainly write life insurance. \u003ccite>[IRMI \"fraternal benefit society\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Financial Status: Independent Rating Services\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>A.M. Best Financial Strength Rating (FSR)\u003c/strong>: an independent opinion of an insurer's ability to meet its ongoing policy and contract obligations. \u003ccite>[A.M. Best, \u003cem>Guide to Best's Financial Strength Ratings\u003c/em>]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>A.M. Best scale\u003c/strong>:\n\u003c/li>\u003c/ul>\n\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rating\u003c/th>\u003cth>Descriptor\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A++, A+\u003c/td>\u003ctd>Superior\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A, A-\u003c/td>\u003ctd>Excellent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B++, B+\u003c/td>\u003ctd>Good\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B, B-\u003c/td>\u003ctd>Fair\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C++, C+\u003c/td>\u003ctd>Marginal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C, C-\u003c/td>\u003ctd>Weak\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D\u003c/td>\u003ctd>Poor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>E\u003c/td>\u003ctd>Under Regulatory Supervision\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F\u003c/td>\u003ctd>In Liquidation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S\u003c/td>\u003ctd>Suspended\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\"Secure\" covers A++ through B+; \"Vulnerable\" covers B and below. \u003ccite>[A.M. Best Guide]\u003c/cite>\u003c/p>\n\u003cul>\n\u003cli>\nAn FSR is not a recommendation to buy a policy. It does not address claims-payment practices. \u003ccite>[A.M. Best Guide, Rating Disclosure]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Distribution Systems\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Independent agency (\"American agency\") system\u003c/strong>: independent contractor agents sell for one or more insurers on commission. The agent owns, uses, and controls the policy records and expiration data. \u003ccite>[IRMI \"independent agency system\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Exclusive (captive) agency system\u003c/strong>: the agent represents only one company or a group under common management. \u003ccite>[IRMI \"exclusive agency system\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Direct writer\u003c/strong>: the insurer uses its own employed sales force instead of independent agents or brokers. \u003ccite>[IRMI \"direct writer\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Producers and General Rules of Agency\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Michigan definitions\u003c/strong>:\n\u003cul>\n\u003cli>\nAn \"agent of the insurer\" sells, solicits, or negotiates as the insurer's representative. \u003ccite>[MCL 500.1201(c)]\u003c/cite>\n\u003c/li>\u003cli>\nAn \"agent of the insured\" is a producer who is not appointed by the insurer that writes the policy. That producer represents the insured, not the insurer. \u003ccite>[MCL 500.1201(b)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nA producer license by itself does not create any actual, apparent, or inherent authority to represent or commit an insurer. \u003ccite>[MCL 500.1201(h)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Express authority\u003c/strong>: the powers spelled out in the agency contract. \u003ccite>[IRMI \"express authority\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Implied authority\u003c/strong>: actions beyond the written grant that are reasonably necessary for the agent's job. When the insurer does not object, the authority is treated as part of the contract. \u003ccite>[IRMI \"implied authority\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Apparent authority (apparent agency)\u003c/strong>: the agent has whatever power a reasonable person would assume, based on how the principal (insurer) presented things. It is tied to estoppel. \u003ccite>[IRMI \"apparent agency\"; Restatement (Third) of Agency §2.03]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Fiduciary duty\u003c/strong>: an agent is a fiduciary for all money received in the capacity of agent. Premiums and return premiums must be kept in a separate account and not commingled. Failing to remit on time is prima facie evidence of a fiduciary violation. \u003ccite>[MCL 500.1207(1), (2), (8)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Placing a refused risk\u003c/strong>: if an agent places refused coverage through another agent, the agent must tell the buyer in writing that the coverage is not in effect until the buyer receives written evidence of insurance. \u003ccite>[MCL 500.1207(12)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Duty to advise (Michigan case law)\u003c/strong>: an agent generally has no duty to advise an insured about the adequacy of coverage unless a \"special relationship\" exists. \u003ccite>[Harts v Farmers Ins Exch, 461 Mich 1 (1999)]\u003c/cite> A special relationship can arise when the agent:\n\u003cul>\n\u003cli>\nmisrepresents coverage,\n\u003c/li>\u003cli>\nmust clarify an ambiguous request,\n\u003c/li>\u003cli>\ngives inaccurate advice in response to an inquiry, or\n\u003c/li>\u003cli>\nassumes an additional duty.\n \u003ccite>[Harts; later Mich Ct App decisions]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch3>Contracts: Elements of a Legal Contract\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Michigan elements of a valid contract\u003c/strong>: competent parties, a proper subject matter (legal purpose), legal consideration, mutuality of agreement (offer and acceptance), and mutuality of obligation. \u003ccite>[AFT Michigan v Michigan, 497 Mich 197 (2015)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Consideration in insurance\u003c/strong>: the insured provides premium plus compliance with policy conditions. The insurer provides its promise to pay. Examples of the wording:\n\u003cul>\n\u003cli>\nHO: \"in return for the premium and compliance with all applicable provisions.\" \u003ccite>[ISO HO 00 03 05 11, Agreement]\u003c/cite>\n\u003c/li>\u003cli>\nWC: \"In return for the payment of the premium and subject to all terms.\" \u003ccite>[NCCI WC 00 00 00 C (Ed. 1-15), preamble]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Offer and acceptance\u003c/strong>: the applicant's application is typically the offer. The insurer accepts by issuing the policy or a binder. A binder is temporary evidence of coverage until the policy is issued. \u003ccite>[IRMI \"binder\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Distinct Characteristics of an Insurance Contract\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Adhesion\u003c/strong>: the insurer drafts the policy, and the insured takes it or leaves it without bargaining over the wording. Courts therefore construe ambiguities against the drafter, the insurer. \u003ccite>[IRMI \"contract of adhesion\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Aleatory\u003c/strong>: an exchange of unequal value that depends on an uncertain event. An insured may pay premiums for years with no loss, or pay little and collect a large loss. \u003ccite>[IRMI \"aleatory contract\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Unilateral\u003c/strong>: only the insurer makes legally enforceable promises. The insured just has to meet conditions such as paying premium and reporting losses. \u003ccite>[IRMI \"unilateral contract\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Conditional\u003c/strong>: the insurer's duty to pay depends on the insured performing the policy conditions. For example, there is no duty to provide coverage if the insured's failure to perform duties after loss prejudices the insurer. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. C; IRMI \"unilateral contract\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Personal\u003c/strong>: the contract insures a person, not the property itself, so it cannot be assigned without the insurer's written consent. \u003ccite>[ISO HO 00 03 05 11, Secs. I &amp; II Conds. E \"Assignment\"; NCCI WC 00 00 00 C, Part Six C]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Legal Interpretations Affecting Contracts\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Ambiguities\u003c/strong>: ambiguous policy language is construed against the insurer, the drafter. \u003ccite>[IRMI \"contract of adhesion\"; Wilkie v Auto-Owners Ins Co, 469 Mich 41 (2003)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Reasonable expectations doctrine\u003c/strong>: some courts read a policy to give the protection an insured would reasonably expect, even if the wording does not. \u003ccite>[IRMI \"reasonable expectations doctrine\"]\u003c/cite> Michigan's Supreme Court declined to adopt this rule. It enforces unambiguous policies as written and resolves ambiguities against the insurer. \u003ccite>[Wilkie, 469 Mich 41 (2003)]\u003c/cite> (See Flags.)\n\u003c/li>\u003cli>\n\u003cstrong>Indemnity\u003c/strong>: the insured is restored to their pre-loss position, without profiting. Examples in the forms:\n\u003cul>\n\u003cli>\nThe CP form will \"not pay you more than your financial interest.\" \u003ccite>[ISO CP 00 10 10 12, E.4.d]\u003c/cite>\n\u003c/li>\u003cli>\nThe HO form pays no insured more than that insured's interest at the time of loss. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. A]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Utmost good faith (uberrimae fidei)\u003c/strong>: both parties are presumed to fully disclose all pertinent facts. \u003ccite>[IRMI \"uberrimae fidei\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Representation\u003c/strong>: a statement in the application that the applicant believes to be true. If it is false and the insurer relied on it, the insurer may have grounds to void the policy. A misrepresentation that is intentional and material can void the contract. \u003ccite>[IRMI \"representation\"; \"misrepresentation\"; \"material misrepresentation\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Warranty\u003c/strong>: a statement of fact about the risk, given by the insured, that will void the policy if untrue. Warranties are held to a stricter standard than representations. \u003ccite>[IRMI \"warranty\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Concealment\u003c/strong>: willfully holding back pertinent information even though the insurer did not ask about it. Concealment can void the policy. \u003ccite>[IRMI \"concealment\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Fraud\u003c/strong>: deception intended to cheat or mislead. Fraud in procuring insurance may void the policy. \u003ccite>[IRMI \"fraud\"]\u003c/cite> Examples in the forms:\n\u003cul>\n\u003cli>\nThe CP form is void for fraud at any time, or for intentional concealment or misrepresentation of a material fact about the coverage, property, interest, or claim. \u003ccite>[ISO CP 00 90 07 88, A]\u003c/cite>\n\u003c/li>\u003cli>\nThe HO form gives no coverage to any insured who intentionally concealed or misrepresented a material fact, engaged in fraudulent conduct, or made false statements, before or after a loss. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. R]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Waiver\u003c/strong>: the intentional, voluntary surrender of a known right. \u003ccite>[IRMI \"waiver\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Estoppel\u003c/strong>: a party cannot contradict its own earlier conduct when another party reasonably relied on it. Example: an insurer that repeatedly accepted late premiums may be estopped from canceling for late payment. \u003ccite>[IRMI \"estoppel\"]\u003c/cite>\n\u003c/li>\u003cli>\nPolicies limit oral waivers:\n\u003cul>\n\u003cli>\nHO: a waiver or change must be in writing by the insurer, and requesting an appraisal or examination does not waive the insurer's rights. \u003ccite>[ISO HO 00 03 05 11, Sec. I &amp; II Cond. B]\u003c/cite>\n\u003c/li>\u003cli>\nWC: terms may be changed or waived only by endorsement. \u003ccite>[WC 00 00 00 C, General Section A]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\n\u003cstrong>Reasonable expectations in Michigan\u003c/strong>: the PSI outline lists this as a generic concept. Michigan's Supreme Court in Wilkie (2003) declined to adopt the doctrine. Exam answers should use the generic definition. I did not read the full Wilkie opinion; secondary sources consistently report the holding.\n\u003c/li>\u003cli>\n\u003cstrong>Elements of insurable risk\u003c/strong>: the six-item list comes from a standard textbook (Rejda). Other texts phrase or number the items differently.\n\u003c/li>\u003cli>\n\u003cstrong>A.M. Best scale\u003c/strong>: from the A.M. Best guide (2009 version, hosted on a Nevada state site). The current ambest.com page returned 404, but the rating symbols have been stable.\n\u003c/li>\u003cli>\n\u003cstrong>Harts duty-to-advise\u003c/strong>: authorities disagree on whether the rule covers independent agents as well as captive agents. This is not tested.\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"basics","title":"P&C Basics","weight":"20% · 30 items (with MI laws)","secs":["basics"],"html":"\u003cp>Outline weight: 20% (30 items). The Michigan-law sub-block (MPCGA, 500.2833 fire policy, 500.2123/.3020 cancellation, appraisal, TRIA, 500.1209, Essential Insurance Act) is covered by another file. Where ISO base-form wording is shown below, Michigan amendatory endorsements and statutes may change it.\u003c/p>\n\u003ch3>Insurable Interest\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Definition\u003c/strong>: the insured's financial or legal relationship to the subject of insurance. It usually comes from property rights, contract rights, or potential legal liability. \u003ccite>[IRMI \"insurable interest\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Property insurance\u003c/strong>: insurable interest must exist at the time of loss. Payment is capped at that insured's interest. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. A; ISO CP 00 10 10 12, E.4.d]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Liability insurance\u003c/strong>: insurable interest comes from the insured's potential legal liability. \u003ccite>[IRMI \"insurable interest\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Underwriting\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Function\u003c/strong>: deciding whether to accept a risk and, if so, how much insurance to write and at what rate. \u003ccite>[IRMI \"underwriting\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Loss ratio\u003c/strong> = incurred losses ÷ earned premium. Example: $50,000 ÷ $100,000 = 50%. \u003ccite>[IRMI \"loss ratio\"]\u003c/cite>\n\u003c/li>\u003cli>\nExpense ratio = underwriting expenses ÷ written premium (statutory/trade basis) or ÷ earned premium (GAAP basis). Or delete the bullet; only the loss ratio is on the outline.\n\u003c/li>\u003cli>\n\u003cstrong>Combined ratio\u003c/strong> = loss ratio (including loss adjustment expense) + expense ratio. Under 100% means an underwriting profit. \u003ccite>[IRMI \"combined ratio\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Hazards\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Physical hazard\u003c/strong>: a tangible condition that raises the chance of loss, e.g., poor housekeeping or inadequate lighting. \u003ccite>[IRMI \"hazard\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Moral hazard\u003c/strong>: comes from the insured's character or circumstances, e.g., dishonesty or an incentive to cause a loss. Underwriters avoid vacant buildings partly for this reason (arson for profit). \u003ccite>[IRMI \"moral hazard\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Morale hazard\u003c/strong>: the insured's indifference to loss because insurance will pay, e.g., carelessness. It reflects attitude, not integrity. \u003ccite>[IRMI \"morale hazard\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Negligence\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Elements\u003c/strong>: (1) a duty owed to the plaintiff, (2) breach of that duty, (3) proximate cause, (4) actual injury or damage. \u003ccite>[IRMI \"negligence\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Contributory negligence (common law)\u003c/strong>: any negligence by the plaintiff bars recovery. Many states have replaced it. \u003ccite>[IRMI \"contributory negligence\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Comparative negligence\u003c/strong>: the plaintiff's damages are reduced by the plaintiff's percentage of fault. \u003ccite>[IRMI \"comparative negligence\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Assumption of risk\u003c/strong>: a person who knowingly and voluntarily accepts a known risk cannot recover for the resulting injury. \u003ccite>[IRMI \"assumption of risk\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Michigan rule (general tort)\u003c/strong>:\n\u003cul>\n\u003cli>\nA plaintiff's contributory fault does not bar recovery. \u003ccite>[MCL 600.2958]\u003c/cite>\n\u003c/li>\u003cli>\nDamages are reduced by the plaintiff's percentage of fault. \u003ccite>[MCL 600.2959]\u003c/cite>\n\u003c/li>\u003cli>\nIf the plaintiff's fault is greater than the combined fault of all others (that is, more than 50%), economic damages are still reduced but noneconomic damages are not awarded. \u003ccite>[MCL 600.2959]\u003c/cite>\n\u003c/li>\u003cli>\nIn practice: comparative fault for economic damages, with a more-than-50% bar on noneconomic damages. \u003ccite>[MCL 600.2959]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Michigan fault allocation\u003c/strong>: each person's liability is allocated in direct proportion to their percentage of fault. Nonparties' fault is also considered. \u003ccite>[MCL 600.2957(1)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Michigan auto no-fault tort\u003c/strong>: damages are also assessed on comparative fault. \u003ccite>[MCL 500.3135(2)(b)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Damages\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Compensatory damages\u003c/strong> make amends for the actual loss. \u003ccite>[IRMI \"compensatory damages\"]\u003c/cite> They come in two types:\n\u003cul>\n\u003cli>\n\u003cstrong>Special damages\u003c/strong>: objectively measurable losses such as medical bills, lost wages, and loss of use. \u003ccite>[IRMI \"special damages\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>General damages\u003c/strong>: subjective awards for pain and suffering. \u003ccite>[IRMI \"general damages\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Punitive (exemplary) damages\u003c/strong>: awarded beyond compensation to punish wanton or willful conduct. \u003ccite>[IRMI \"punitive damages\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Michigan on punitive damages\u003c/strong>: they are generally not recoverable. They are available \"only when expressly authorized by the Legislature.\" \u003ccite>[Gilbert v DaimlerChrysler Corp, 685 NW2d 391 (Mich 2004); Casey v Auto Owners Ins Co, 729 NW2d 277 (Mich App 2006), via IADC Michigan Damages Compendium]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Michigan \"exemplary\" damages\u003c/strong> are compensatory in nature: they compensate for injured feelings caused by the defendant's egregious conduct. \u003ccite>[Peisner v Detroit Free Press, Inc, 364 NW2d 600 (Mich 1984), via IADC compendium]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Absolute, Strict, and Vicarious Liability\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Strict liability\u003c/strong>: liability imposed without regard to fault or negligence. The classic example is a manufacturer or seller of a defective, dangerous product. \u003ccite>[IRMI \"strict liability\"; LII Wex \"strict liability\" (animals, abnormally dangerous activities, products)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Absolute liability\u003c/strong>: liability without fault for ultrahazardous or abnormally dangerous activities (blasting, keeping wild animals). Exercising care is no defense. \u003ccite>[Restatement (Second) of Torts §§519–520 (via LII/Justia); totalcsr insurance glossary]\u003c/cite> (See Flags.)\n\u003c/li>\u003cli>\n\u003cstrong>Vicarious liability\u003c/strong>: a principal is liable for the acts of its agents, for example an employer for its employees acting in the scope of employment (respondeat superior). It can also apply to partners, independent contractors, and children. \u003ccite>[IRMI \"vicarious liability\"; LII Wex \"vicarious liability\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Causes of Loss (Perils): Named vs. Open\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Named perils\u003c/strong>: covers only the perils listed. The insured must prove a listed peril caused the loss. \u003ccite>[IRMI \"named perils coverage\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Special (open) perils\u003c/strong>: covers all causes of loss except those specifically excluded. It was formerly called \"all risks.\" \u003ccite>[IRMI \"open perils\"; \"special perils\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Direct vs. Consequential (Indirect) Loss\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Direct loss\u003c/strong>: from direct physical damage to property. \u003ccite>[IRMI \"direct loss\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Consequential (indirect) loss\u003c/strong>: results from the direct damage, e.g., loss of rent, business income, or extra expense. \u003ccite>[IRMI \"consequential loss\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Blanket vs. Specific Insurance\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Specific insurance\u003c/strong>: each item (each building, or the personal property in a building) has its own limit. \u003ccite>[ISO CP 03 21 10 12, definitions]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Blanket insurance\u003c/strong>: one limit covers two or more items or locations. \u003ccite>[ISO CP 03 21 10 12; IRMI \"blanket limit\"]\u003c/cite>\n\u003c/li>\u003cli>\nWith blanket insurance, coinsurance applies to the total value of all property under that limit. \u003ccite>[ISO CP 00 10 10 12, F.1.b and Example 3]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Basic Types of Construction (ISO Commercial Lines Manual codes; 1 = least fire-resistive, 6 = most)\u003c/h3>\n\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Code\u003c/th>\u003cth>Class\u003c/th>\u003cth>Description\u003c/th>\u003cth>Source\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Frame\u003c/td>\u003ctd>Exterior walls of wood, brick veneer, stone veneer, wood ironclad, or stucco on wood\u003c/td>\u003ctd>\u003ccite>[IRMI \"frame construction\"]\u003c/cite>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Joisted masonry\u003c/td>\u003ctd>Masonry exterior walls with a combustible floor and roof\u003c/td>\u003ctd>\u003ccite>[IRMI \"joisted masonry construction\"]\u003c/cite>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Noncombustible\u003c/td>\u003ctd>Exterior walls, floor, and supports of metal, asbestos, gypsum, or other noncombustible materials\u003c/td>\u003ctd>\u003ccite>[IRMI \"noncombustible construction\"]\u003c/cite>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Masonry noncombustible\u003c/td>\u003ctd>Masonry exterior walls with a metal or other noncombustible floor and roof\u003c/td>\u003ctd>\u003ccite>[IRMI \"masonry noncombustible construction\"]\u003c/cite>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Modified fire resistive\u003c/td>\u003ctd>Masonry or fire-resistive walls, floors, and roof rated at least 1 hour but less than 2 hours\u003c/td>\u003ctd>\u003ccite>[IRMI \"modified fire resistive construction\"]\u003c/cite>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Fire resistive\u003c/td>\u003ctd>Walls, floors, and roof rated at least 2 hours\u003c/td>\u003ctd>\u003ccite>[IRMI \"fire resistive construction\"]\u003c/cite>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Loss Valuation\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Actual cash value (ACV)\u003c/strong> is calculated one of three ways, depending on policy wording and state law:\n\u003cul>\n\u003cli>\nreplacement cost minus depreciation,\n\u003c/li>\u003cli>\nfair market value, or\n\u003c/li>\u003cli>\nthe broad evidence rule.\n \u003ccite>[IRMI \"actual cash value\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nACV is the default valuation in the BPP form. \u003ccite>[ISO CP 00 10 10 12, E.7.a]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Replacement cost (RC)\u003c/strong>: the cost to replace with material of like kind and quality, with no deduction for depreciation. \u003ccite>[IRMI \"replacement cost\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>CP Replacement Cost optional coverage\u003c/strong>:\n\u003cul>\n\u003cli>\nIt does not pay RC until the property is actually repaired or replaced, as soon as reasonably possible. \u003ccite>[ISO CP 00 10 10 12, G.3.d]\u003c/cite>\n\u003c/li>\u003cli>\nThe insured may settle on an ACV basis and still claim the RC difference by giving notice within 180 days. \u003ccite>[ISO CP 00 10 10 12, G.3.c]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Functional replacement cost\u003c/strong>: the cost of property that performs the same function with equal efficiency, even if it is not identical. An example is plaster walls replaced with drywall. \u003ccite>[IRMI \"functional replacement cost\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Agreed value (CP optional coverage)\u003c/strong>:\n\u003cul>\n\u003cli>\nThe Coinsurance condition is suspended until the agreed value expiration date. \u003ccite>[ISO CP 00 10 10 12, G.1.a–c]\u003c/cite>\n\u003c/li>\u003cli>\nRecovery is limited to the proportion that the limit bears to the Agreed Value shown in the Declarations. \u003ccite>[ISO CP 00 10 10 12, G.1.a–c]\u003c/cite>\n\u003c/li>\u003cli>\nIf the agreed value is not extended, coinsurance is reinstated. \u003ccite>[ISO CP 00 10 10 12, G.1.b]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Stated amount\u003c/strong>: commonly used for auto physical damage. The insurer pays the least of the stated amount, ACV, or the cost to repair or replace, so the stated amount is a ceiling, not a guaranteed payment. \u003ccite>[ISO CA 99 28 \"Stated Amount Insurance\" (VA SCC filing, summary only); see Flags]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Policy Structure (D-I-C-E + endorsements)\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Declarations\u003c/strong>: names the named insured, address, policy period, location, limits, and other information specific to the insured. \u003ccite>[IRMI \"declarations\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Insuring agreement\u003c/strong>: the insurer's promise to pay. It is broad, and exclusions and definitions narrow it. \u003ccite>[IRMI \"insuring agreement\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Definitions\u003c/strong>: words in quotation marks have the special meanings given in the Definitions section. \u003ccite>[ISO CP 00 10 10 12 preamble]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Conditions\u003c/strong>: the rules that govern the contract, e.g., cancellation, duties after loss, other insurance. \u003ccite>[IRMI \"common policy conditions\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Exclusions\u003c/strong>: the hazards, perils, property, or circumstances not covered. \u003ccite>[IRMI \"exclusion\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Endorsements\u003c/strong>: forms that change or add to the policy by broadening, restricting, clarifying, or adding parties. \u003ccite>[IRMI \"endorsement\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Additional coverages and coverage extensions\u003c/strong>: e.g., debris removal, preservation of property, fire department service charge, pollutant clean-up. \u003ccite>[ISO CP 00 10 10 12, A.4]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Common Policy Provisions\u003c/h3>\n\u003ch4>Insureds\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Named insured\u003c/strong>: anyone specifically designated by name in the policy. \u003ccite>[IRMI \"named insured\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>First named insured\u003c/strong>: the one listed first in the declarations. They receive cancellation notices and return premiums and are responsible for paying premium. \u003ccite>[IRMI \"first named insured\"]\u003c/cite> In WC: \"the insured first named in Item 1 ... will act on behalf of all insureds to change this policy, receive return premium, and give or receive notice of cancelation.\" \u003ccite>[NCCI WC 00 00 00 C, Part Six E]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Additional insured\u003c/strong>: a person or organization added at the named insured's request, e.g., a landlord or project owner. \u003ccite>[IRMI \"additional insured\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Policy Period and Territory\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>CP\u003c/strong>: covers loss commencing during the policy period and within the coverage territory: the USA (including territories and possessions), Puerto Rico, and Canada. \u003ccite>[ISO CP 00 90 07 88, H]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>HO Section I\u003c/strong>: applies only to loss occurring during the policy period. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. Q]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Cancellation and Nonrenewal (ISO base-form terms; Michigan statutes may override — see other file)\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>HO base form\u003c/strong> \u003ccite>[ISO HO 00 03 05 11, Secs. I &amp; II Conds. C, D]\u003c/cite>:\n\u003cul>\n\u003cli>\nThe insured may cancel at any time.\n\u003c/li>\u003cli>\nThe insurer may cancel for nonpayment with 10 days' notice.\n\u003c/li>\u003cli>\nIn the first 60 days of a new policy, the insurer may cancel for any reason with 10 days' notice.\n\u003c/li>\u003cli>\nAfter 60 days or on renewals, the insurer may cancel only for material misrepresentation or substantial change in risk, with 30 days' notice.\n\u003c/li>\u003cli>\nReturn premium is pro rata.\n\u003c/li>\u003cli>\nNonrenewal requires 30 days' notice.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Commercial form\u003c/strong> \u003ccite>[ISO-based commercial form text (Conifer/Accelerant MI forms reproducing IL 00 17 language)]\u003c/cite>:\n\u003cul>\n\u003cli>\nThe first named insured may cancel.\n\u003c/li>\u003cli>\nThe insurer gives 10 days' notice for nonpayment and 30 days for any other reason.\n\u003c/li>\u003cli>\nIf the insurer cancels, the refund is pro rata. If the insured cancels, the refund may be less than pro rata.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Deductibles\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>CP order of operations\u003c/strong>: (1) apply the coinsurance (or agreed value) reduction first, (2) then subtract the deductible, (3) then pay the result or the limit, whichever is less. The deductible applies once per occurrence. \u003ccite>[ISO CP 00 10 10 12, D]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>HO\u003c/strong>: if two or more deductibles apply to one loss, only the highest applies. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. B]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Other Insurance\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Nonconcurrency\u003c/strong>: two or more policies cover the same exposure but do not match. IRMI's example is different inception and expiration dates, which can leave coverage gaps. \u003ccite>[IRMI \"nonconcurrency\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Primary vs. excess\u003c/strong>: primary insurance pays first. Excess insurance pays only above a stated amount or above the primary insurance. \u003ccite>[IRMI \"excess insurance\"; \"other insurance clause\"]\u003c/cite> Under the CP form, other insurance that is not on the same plan and terms is treated as primary, and the CP pays only the excess, \"whether you can collect on it or not.\" \u003ccite>[ISO CP 00 90 07 88, G.2]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Pro rata (contribution by limits)\u003c/strong>: each insurer pays the share that its limit bears to the total of all limits. \u003ccite>[ISO CP 00 90 07 88, G.1; ISO HO 00 03 05 11, Sec. I Cond. G; IRMI \"contribution by limits\"]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cem>Worked example\u003c/em>: Insurer A has a $300,000 limit and B has $200,000, total $500,000. On a $100,000 loss, A pays 3/5 = $60,000 and B pays 2/5 = $40,000. \u003ccite>[method per CP 00 90 G.1]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Contribution by equal shares (CGL)\u003c/strong>: if all the other insurance permits equal shares, each insurer pays equal amounts until it has paid its limit or the loss is fully paid. If any other policy does not permit equal shares, the insurers contribute by limits. \u003ccite>[ISO CG 00 01, Sec. IV Cond. 4.c \"Method Of Sharing\" (text via Law Insider sample); IRMI \"contribution by equal shares\"]\u003c/cite>\n\u003cul>\n\u003cli>\n\u003cem>Worked example 1\u003c/em>: $250,000 loss. A has a $100,000 limit and B has $300,000.\n\u003cul>\n\u003cli>\nEqual shares: each pays $100,000, which exhausts A. B pays the remaining $50,000. Totals: A $100,000, B $150,000.\n\u003c/li>\u003cli>\nBy limits instead: A pays 100/400 = $62,500 and B pays $187,500.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cem>Worked example 2\u003c/em>: $90,000 loss. A has $50,000 and B has $100,000. Under equal shares each pays $45,000, since neither limit is reached.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>WC policy (Part One E and Part Two F)\u003c/strong>: all shares are equal until the loss is paid. If one source is exhausted, the remaining shares stay equal. \u003ccite>[NCCI WC 00 00 00 C]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Limits of Liability\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Per person\u003c/strong>: the most paid for one person's injuries. Example: with a $50,000 per-person limit, claimants with $25,000 and $75,000 of damages get $25,000 and $50,000. \u003ccite>[IRMI \"per person limit\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Per occurrence or accident\u003c/strong>: the most paid for all injury and damage from one occurrence. \u003ccite>[ISO CG 00 01, Sec. III.5]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Split limits\u003c/strong>: three separate amounts per accident: per-person BI / per-accident BI / per-accident PD, e.g., 250/500/100. \u003ccite>[IRMI \"split limits\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Combined single limit (CSL)\u003c/strong>: one limit applies to BI and PD combined per accident. \u003ccite>[IRMI \"split limits\" (contrast)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>CGL aggregates\u003c/strong>: limits apply separately to each consecutive annual period. \u003ccite>[ISO CG 00 01 04 13, Sec. III.1–7]\u003c/cite>\n\u003cul>\n\u003cli>\nThe \u003cem>General Aggregate\u003c/em> is the most paid for Coverage C medical expenses, Coverage A damages (except products-completed operations), and Coverage B damages combined. \u003ccite>[ISO CG 00 01 04 13, Sec. III.2]\u003c/cite>\n\u003c/li>\u003cli>\nThe \u003cem>Products-Completed Operations Aggregate\u003c/em> is a separate limit for Coverage A BI/PD within the products-completed operations hazard. \u003ccite>[ISO CG 00 01 04 13, Sec. III.3]\u003c/cite>\n\u003c/li>\u003cli>\nOnce the general aggregate is paid out, only products-completed operations coverage remains. \u003ccite>[IRMI \"general aggregate limit\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Limits apply regardless of the number of\u003c/strong> insureds, claims or suits, or claimants. \u003ccite>[ISO CG 00 01 04 13, Sec. III.1]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Property Limits and Restoration (Nonreduction) of Limits\u003c/h4>\n\u003cul>\n\u003cli>\nProperty limits apply per item or location (specific) or across items (blanket). \u003ccite>[ISO CP 03 21 10 12]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Inflation Guard\u003c/strong>: automatically increases the limit by an annual percentage, prorated by days. Example: $100,000 × 8% × 146/365 = $3,200. \u003ccite>[ISO CP 00 10 10 12, G.2]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Reinstatement\u003c/strong>: an aggregate limit is reduced by claim payments. Policies sometimes restore it automatically, with or without an extra premium, or only at the insured's request for extra premium. \u003ccite>[IRMI \"reinstatement\"]\u003c/cite> The commonly taught rule is that property per-occurrence limits are restored after a loss while liability aggregates are eroded by payments (see Flags).\n\u003c/li>\u003c/ul>\n\u003ch4>Coinsurance (ISO CP 00 10 10 12, F.1)\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Formula\u003c/strong>: (Limit carried ÷ (Value at time of loss × Coinsurance %)) × Loss − Deductible = payment. Payment is capped at the limit. \u003ccite>[ISO CP 00 10 10 12, F.1]\u003c/cite>\n\u003c/li>\u003cli>\nValue is measured at the time of loss, not at inception. \u003ccite>[ISO CP 00 10 10 12, F.1.a]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Form Example 1 (underinsured)\u003c/strong>: value $250,000, 80% coinsurance, limit $100,000, loss $40,000, deductible $250.\n\u003cul>\n\u003cli>\nRequired insurance: $200,000. Ratio: 0.50.\n\u003c/li>\u003cli>\n$40,000 × 0.5 = $20,000 − $250 = \u003cstrong>$19,750\u003c/strong>. The remaining $20,250 is not covered.\n\u003c/li>\u003cli>\n\u003ccite>[ISO CP 00 10 10 12, F.1 Ex. 1]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Form Example 2 (adequate)\u003c/strong>: same facts but a $200,000 limit. The limit meets the requirement, so the payment is $40,000 − $250 = \u003cstrong>$39,750\u003c/strong>. \u003ccite>[ISO CP 00 10 10 12, F.1 Ex. 2]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Form Example 3 (blanket)\u003c/strong>: total value $250,000 at 90% requires $225,000. The limit is $180,000, so the ratio is 0.80.\n\u003cul>\n\u003cli>\nThe loss is $50,000: $50,000 × 0.8 = $40,000 − $1,000 deductible = \u003cstrong>$39,000\u003c/strong>.\n\u003c/li>\u003cli>\n\u003ccite>[ISO CP 00 10 10 12, F.1 Ex. 3]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Extra worked example A\u003c/strong>: value $400,000, 80% coinsurance, limit $240,000, loss $50,000, deductible $1,000.\n\u003cul>\n\u003cli>\nRequired insurance: $320,000. Ratio: 0.75.\n\u003c/li>\u003cli>\n$37,500 − $1,000 = \u003cstrong>$36,500\u003c/strong>.\n\u003c/li>\u003cli>\n\u003ccite>[method per CP 00 10 F.1]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Extra worked example B (total loss)\u003c/strong>: value $300,000, 80% coinsurance, limit $200,000, loss $300,000, no deductible.\n\u003cul>\n\u003cli>\nRequired insurance: $240,000. Ratio: 0.8333. $300,000 × 0.8333 = $250,000.\n\u003c/li>\u003cli>\nPayment is capped at the \u003cstrong>$200,000\u003c/strong> limit.\n\u003c/li>\u003cli>\n\u003ccite>[CP 00 10 F.1 \"or the Limit of Insurance, whichever is less\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>HO dwelling (different rule)\u003c/strong>: full RC on Coverage A/B is paid only if the insurance is at least 80% of full replacement cost immediately before the loss. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. D.2.a]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Vacancy vs. Unoccupancy\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Vacant\u003c/strong>: the building contains little or no furniture or personal property. \u003cstrong>Unoccupied\u003c/strong>: people are absent, even though contents remain. \u003ccite>[IRMI \"vacant\"; \"unoccupied\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>When a building counts as vacant under CP\u003c/strong> \u003ccite>[ISO CP 00 10 10 12, E.6.a]\u003c/cite>:\n\u003cul>\n\u003cli>\nFor a tenant, the \"building\" is its unit, and it is vacant when it lacks enough business personal property to conduct customary operations.\n\u003c/li>\u003cli>\nFor an owner or general lessee, the building is vacant unless at least 31% of its total square footage is rented and used for customary operations, or used by the owner.\n\u003c/li>\u003cli>\nBuildings under construction or renovation are not vacant.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Effect under CP\u003c/strong>: after more than 60 consecutive days of vacancy, there is no coverage for vandalism, sprinkler leakage (unless protected against freezing), building glass breakage, water damage, theft, or attempted theft. All other covered losses are reduced by 15%. \u003ccite>[ISO CP 00 10 10 12, E.6.b]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>HO\u003c/strong>: vandalism and malicious mischief, and glass breakage, are not covered if the dwelling was vacant more than 60 consecutive days before the loss. A dwelling under construction is not vacant. \u003ccite>[ISO HO 00 03 05 11, Sec. I Perils; Additional Coverage \"Glass or Safety Glazing Material\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Named Insured Provisions\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Duties after loss (HO)\u003c/strong> \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. C]\u003c/cite>:\n\u003cul>\n\u003cli>\nGive prompt notice.\n\u003c/li>\u003cli>\nNotify police of theft.\n\u003c/li>\u003cli>\nProtect the property from further damage and keep repair records.\n\u003c/li>\u003cli>\nPrepare an inventory.\n\u003c/li>\u003cli>\nShow the property, provide records, and submit to examination under oath.\n\u003c/li>\u003cli>\nSend a signed, sworn proof of loss within 60 days after the insurer's request.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Duties after loss (CP)\u003c/strong>: substantially the same, with sworn proof of loss within 60 days after the insurer's request. \u003ccite>[ISO CP 00 10 10 12, E.3]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Assignment\u003c/strong>: assignment of the policy is not valid unless the insurer gives written consent. \u003ccite>[ISO HO 00 03 05 11, Secs. I &amp; II Cond. E]\u003c/cite> In WC: \"Your rights or duties under this policy may not be transferred without our written consent.\" \u003ccite>[WC 00 00 00 C, Part Six C]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Abandonment\u003c/strong>: CP says \"There can be no abandonment of any property to us.\" HO says the insurer \"need not accept any property abandoned by an 'insured'.\" \u003ccite>[ISO CP 00 10 10 12, E.1; ISO HO 00 03 05 11, Sec. I Cond. K]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Insurer Provisions\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Liberalization\u003c/strong>: broadened coverage adopted without additional premium applies automatically to existing policies. \u003ccite>[IRMI \"liberalization clause\"]\u003c/cite>\n\u003cul>\n\u003cli>\nCP: the revision must be adopted within 45 days before or during the policy period. \u003ccite>[ISO CP 00 90 07 88, E]\u003c/cite>\n\u003c/li>\u003cli>\nHO: the implementation date must fall within 60 days before or during the policy period. It does not apply to general program revisions that both broaden and restrict coverage. \u003ccite>[ISO HO 00 03 05 11, Secs. I &amp; II Cond. A]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Subrogation\u003c/strong>: after paying a loss, the insurer takes over the insured's right to recover from the party legally liable. \u003ccite>[IRMI \"subrogation\"]\u003c/cite>\n\u003cul>\n\u003cli>\nCP: the insured may waive recovery rights in writing before a loss. After a loss, the insured may waive only against another insured, a business owned or controlled by or owning the insured, or the insured's tenant. \u003ccite>[ISO CP 00 90 07 88, I]\u003c/cite>\n\u003c/li>\u003cli>\nHO: an insured may waive in writing before a loss. Subrogation does not apply to Coverage F (Medical Payments) or to Damage to Property of Others. \u003ccite>[ISO HO 00 03 05 11, Secs. I &amp; II Cond. F]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Salvage and recovered property\u003c/strong>: salvage is damaged property that can be saved. \u003ccite>[IRMI \"salvage\"]\u003c/cite>\n\u003cul>\n\u003cli>\nCP: if property is recovered after settlement, at the insured's option it is returned and the insured repays the insurer. \u003ccite>[ISO CP 00 10 10 12, E.5]\u003c/cite>\n\u003c/li>\u003cli>\nHO: the insured may keep or take back the property and the payment is adjusted. \u003ccite>[ISO HO 00 03 05 11, Sec. I Cond. O]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Claim settlement options\u003c/strong>:\n\u003cul>\n\u003cli>\nCP: at the insurer's option it may pay the value, pay the cost to repair or replace, take all or part of the property at an agreed or appraised value, or repair, rebuild, or replace with like kind and quality. The insurer gives notice of its intentions within 30 days after the sworn proof of loss. \u003ccite>[ISO CP 00 10
