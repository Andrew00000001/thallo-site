damaged portion of the building (within building limit); Coverage B = demolition cost; Coverage C = increased cost of construction; coinsurance does not apply to Coverage B. \u003ccite>[ISO CP 04 05 09 17, C.1-3]\u003c/cite>\n\u003c/li>\u003cli>\nSpoilage (CP 04 40): covers \"perishable stock\" for selected causes: Breakdown or Contamination (change in temperature/humidity from mechanical breakdown of refrigeration at the premises; contamination by refrigerant) and Power Outage (from interruption of power on or off premises due to conditions beyond your control); optional selling-price valuation. \u003ccite>[ISO CP 04 40 06 07, A., C.3, D.]\u003c/cite>\n\u003c/li>\u003cli>\nPeak Season Limit (CP 12 30): increases the limit on covered personal property by a scheduled amount, at described locations, only during the scheduled period(s). \u003ccite>[ISO CP 12 30 06 95]\u003c/cite>\n\u003c/li>\u003cli>\nValue reporting: for fluctuating values; limit set for peak exposure, premium based on values actually reported periodically (provisional premium adjusted); late/inaccurate reports penalized. \u003ccite>[IRMI glossary \"reporting form coverage\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Commercial Crime (CR 00 21 11 15 loss sustained; CR 00 20 discovery)\u003c/h3>\n\u003cul>\n\u003cli>\nDefinitions: \"Robbery\" = unlawful taking of property from the care and custody of a person by one who caused or threatened bodily harm or committed an obviously unlawful act witnessed by that person. \"Safe burglary\" = unlawful taking from a locked safe/vault by unlawful entry evidenced by marks of forcible entry on its exterior, or taking the safe/vault itself from inside the premises. \"Theft\" = unlawful taking of property to the deprivation of the insured. \u003ccite>[ISO CR 00 21 11 15, F. defs. 20, 21, 23]\u003c/cite>\n\u003c/li>\u003cli>\n\"Burglary\" (general term) = theft of property from within premises by a person who unlawfully enters or exits the premises. \u003ccite>[IRMI glossary \"burglary\"]\u003c/cite>\n\u003c/li>\u003cli>\nInsuring agreements (11 15 edition): 1 Employee Theft; 2 Forgery or Alteration; 3 Inside the Premises – Theft of Money and Securities; 4 Inside the Premises – Robbery or Safe Burglary of Other Property; 5 Outside the Premises; 6 Computer and Funds Transfer Fraud; 7 Money Orders and Counterfeit Money. \u003ccite>[ISO CR 00 21 11 15, A.1-7]\u003c/cite>\n\u003c/li>\u003cli>\nEmployee Theft includes forgery by employees; \"employee\" includes a person for the first 30 days after termination (unless terminated for theft/dishonesty), temporary and leased workers. \u003ccite>[ISO CR 00 21 11 15, A.1; F. \"Employee\"]\u003c/cite>\n\u003c/li>\u003cli>\nInside the Premises – Money and Securities covers theft, disappearance or destruction; Inside – Other Property covers only robbery of a custodian or safe burglary; Outside the Premises covers money/securities and other property in the care of a \"messenger\" or armored motor vehicle company. \u003ccite>[ISO CR 00 21 11 15, A.3-5]\u003c/cite>\n\u003c/li>\u003cli>\nMoney Orders and Counterfeit Money: money orders not paid on presentation and counterfeit money accepted in good faith in exchange for merchandise, money or services. \u003ccite>[ISO CR 00 21 11 15, A.7]\u003c/cite>\n\u003c/li>\u003cli>\nLoss sustained form: occurrence during the policy period, discovered during the policy period or within the extended period to discover — no later than 1 year after cancellation (ends immediately if replacement insurance is obtained). \u003ccite>[ISO CR 00 21 11 15, A.; E.1.g]\u003c/cite>\n\u003c/li>\u003cli>\nLoss sustained form covers losses from prior insurance (by same insurer, or another insurer whose discovery period expired) if coverage was continuous; for another insurer's prior policy, payment is the lesser of the limits. \u003ccite>[ISO CR 00 21 11 15, E.1.k-l]\u003c/cite>\n\u003c/li>\u003cli>\nDiscovery form: occurrence may take place at any time; loss must be discovered during the policy period or within 60 days after cancellation. \u003ccite>[RNC PF&amp;M 251.4-2 (06 22 edition analysis)]\u003c/cite>\n\u003c/li>\u003cli>\n\"Discover\" = when you first become aware of facts that would cause a reasonable person to assume a covered loss has been or will be incurred. \u003ccite>[ISO CR 00 21 11 15, F. def. 5]\u003c/cite>\n\u003c/li>\u003cli>\nDuties: notify insurer as soon as possible (and police if a law was violated, except for employee theft/forgery); detailed sworn proof of loss within 120 days. Legal action not until 90 days after proof of loss and within 2 years of discovery. \u003ccite>[ISO CR 00 21 11 15, E.1.e, E.1.i]\u003c/cite>\n\u003c/li>\u003cli>\nEmployee Theft terminates as to an employee as soon as you (or a non-colluding partner/officer etc.) learn of theft or dishonesty by that employee (before or after hiring), or on 30 days' notice from insurer. \u003ccite>[ISO CR 00 21 11 15, E.2.a]\u003c/cite>\n\u003c/li>\u003cli>\nExcludes theft or dishonest acts by you, your partners or members; employee theft excludes inventory shortages proven only by inventory/profit-and-loss computation. \u003ccite>[ISO CR 00 21 11 15, D.1.a; D.2.a]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Commercial Inland Marine\u003c/h3>\n\u003cul>\n\u003cli>\nNationwide Marine Definition (NAIC; 1933, revised 1953, latest 1976): classes are Imports; Exports; Domestic Shipments; Bridges, Tunnels and Other Instrumentalities of Transportation and Communication (piers, wharves, pipelines, power/phone lines, radio/TV towers); Personal Property Floater Risks; Commercial Property Floater Risks. \u003ccite>[IMUA \"Nationwide Marine Definition\"]\u003c/cite>\n\u003c/li>\u003cli>\nMichigan defines marine insurance by statute in MCL 500.614 (1956 PA 218). It covers transit risks, personal property floater risks, jewelers block, and bridges/tunnels/instrumentalities of transportation and communication (excluding buildings and their contents). It is not an adoption of the 1976 NMD. \u003ccite>[MCL 500.614; IMUA digest]\u003c/cite>\n\u003c/li>\u003cli>\nCM 00 01 Inland Marine Conditions: no abandonment of property to insurer; appraisal; sworn proof of loss within 60 days after request; payment within 30 days after proof; pair/sets; reinstatement of limit after loss (limit not reduced except total loss of a scheduled item); legal action within 2 years after you first have knowledge of the loss; valuation = least of ACV, cost of reasonably restoring, or cost of replacing with substantially identical property. \u003ccite>[ISO CM 00 01 09 04]\u003c/cite>\n\u003c/li>\u003cli>\nFiled ISO classes: accounts receivable, camera &amp; musical instrument dealers, commercial articles, equipment dealers, film, floor plan, jewelers block, mail, physicians &amp; surgeons equipment, signs, theatrical property, valuable papers &amp; records. \u003ccite>[Verisk, \"Commercial Inland Marine\" program sheet (2022)]\u003c/cite>\n\u003c/li>\u003cli>\nNonfiled classes include bailees customers, builders risk, computer systems (EDP), contractors equipment, installation, motor truck cargo (carriers, owners, contingent), annual transit, trip transit, fine arts, salespersons samples, warehouse legal liability. \u003ccite>[Verisk, \"Commercial Inland Marine\" program sheet (2022)]\u003c/cite>\n\u003c/li>\u003cli>\nAccounts receivable coverage pays uncollectible amounts due from customers, interest on loans to offset them, extra collection expenses, and cost to reestablish records — after direct loss to the records. \u003ccite>[ISO BP 00 03 07 13, Sec. I A.6.f (same coverage structure)]\u003c/cite>\n\u003c/li>\u003cli>\nBailee coverage: inland marine coverage on property entrusted to the insured for storage, repair or servicing (dry cleaners, jewelers, repairers, furriers). \u003ccite>[IRMI glossary \"bailee coverage\"]\u003c/cite>\n\u003c/li>\u003cli>\nInstallation floater: inland marine coverage on property (usually equipment) being installed by a contractor — a specialized type of builders risk. \u003ccite>[IRMI glossary \"installation floater\"]\u003c/cite>\n\u003c/li>\u003cli>\nGeneral descriptions (secondary sources, not form text): commercial articles = cameras and musical instruments used commercially; equipment dealers = dealers' stock of mobile equipment; signs = neon/electric/mechanical signs; jewelers block = a jeweler's stock and customers' property; valuable papers = cost to research, replace or restore records; contractors equipment = contractors' mobile equipment and tools; EDP/computer systems = hardware, software and media. \u003ccite>[Verisk program sheet (2022) for class names; descriptions from secondary sources — see Flags]\u003c/cite>\n\u003c/li>\u003cli>\nMotor truck cargo covers loss of property in transit, either while carried by a common carrier or on the insured's own vehicles, depending on the form. \u003ccite>[IRMI glossary \"motor truck cargo\"]\u003c/cite>\n\u003c/li>\u003cli>\nCommon carrier liability: carrier is liable for cargo loss except when caused by act of God, public enemy, act of the shipper, public authority, or inherent vice/nature of the goods — and must prove freedom from negligence. \u003ccite>[Missouri Pacific R.R. v. Elmore &amp; Stahl, 377 U.S. 134 (1964)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Equipment Breakdown (EB 00 20 01 13)\u003c/h3>\n\u003cul>\n\u003cli>\nFormerly \"boiler and machinery.\" Covered cause: a \"breakdown\" to \"covered equipment\" (boilers, machinery, electrical and communication equipment). \u003ccite>[FC&amp;S \"Equipment Breakdown Coverage Form\" (propertycasualty360.com, 2016)]\u003c/cite>\n\u003c/li>\u003cli>\nCoverages: property damage, expediting expenses, business income/extra expense, spoilage, utility interruption (with a waiting period), newly acquired premises, ordinance or law, errors and omissions, brands and labels, contingent BI, limited fungus, green upgrades; several sublimits default to $25,000 (ammonia contamination, hazardous substance, data and media, water damage, consequential loss). \u003ccite>[FC&amp;S \"Equipment Breakdown Coverage Form\" (2016)]\u003c/cite>\n\u003c/li>\u003cli>\nValuation is replacement cost by default; the Actual Cash Value endorsement (EB 99 59) changes it to ACV. \u003ccite>[FC&amp;S \"Equipment Breakdown Coverage Form\" (2016)]\u003c/cite>\n\u003c/li>\u003cli>\nSuspension: an insurer representative may immediately suspend coverage on equipment found in a dangerous condition by written notice. \u003ccite>[FC&amp;S \"Equipment Breakdown Coverage Form\" (2016)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Farm Coverage\u003c/h3>\n\u003cul>\n\u003cli>\nCoverage letters: A Dwellings; B Other Private Structures Appurtenant to Dwellings; C Household Personal Property; D Loss of Use; E Scheduled Farm Personal Property; F Unscheduled Farm Personal Property; G Other Farm Structures. \u003ccite>[ISO FP 00 10 09 94]\u003c/cite>\n\u003c/li>\u003cli>\nCurrent split: FP 00 12 (dwellings, appurtenant structures, household personal property = A–D), FP 00 13 (farm personal property = E, F), FP 00 14 (barns, outbuildings, other farm structures = G); FP 00 30 Mobile Agricultural Machinery and Equipment; FP 00 40 Livestock; FL 00 20 Farm Liability. \u003ccite>[Rough Notes PF&amp;M 471.1 \"Overview of the ISO Farm Program\"]\u003c/cite>\n\u003c/li>\u003cli>\nCoverage B: up to 10% of Coverage A may be applied (additional) to unattached private garages. \u003ccite>[ISO FP 00 10 09 94, Cov. B 1.a]\u003c/cite>\n\u003c/li>\u003cli>\nCoverage D: additional living expense, fair rental value, and civil-authority prohibition of use (up to 2 weeks); no deductible applies. \u003ccite>[ISO FP 00 10 09 94, Cov. D]\u003c/cite>\n\u003c/li>\u003cli>\nCoverage F (blanket unscheduled farm personal property) requires insurance of at least 80% of ACV (coinsurance). \u003ccite>[ISO FP 00 10 09 94, Cov. F Loss Condition – Coinsurance]\u003c/cite>\n\u003c/li>\u003cli>\n\"Livestock\" = cattle, sheep, swine, goats, horses, mules and donkeys. \u003ccite>[ISO FP 00 10 09 94, Definitions 6]\u003c/cite>\n\u003c/li>\u003cli>\nBroad causes of loss add for livestock: electrocution; attacks by dogs or wild animals (not sheep); accidental shooting; drowning from external causes; loading/unloading accidents. Basic includes earthquake and flood loss to livestock and collision. \u003ccite>[ISO FP 00 10 09 94, Sec. B]\u003c/cite>\n\u003c/li>\u003cli>\nFarm Liability (FL 00 20): Coverage H = Bodily Injury and Property Damage Liability; Coverage I = Personal and Advertising Injury Liability; Coverage J = Medical Payments (expenses incurred or medically ascertained within 3 years of the accident). \u003ccite>[FC&amp;S \"Farm Liability Coverage Form\" (propertycasualty360.com, 2013)]\u003c/cite>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\nCG 00 02 04 13 form text not obtained; claims-made/ERP/claim-information facts come from FC&amp;S (2014) and Austin &amp; Stanovich (2012) analyses (consistent with each other).\n\u003c/li>\u003cli>\nCrime: CR 00 20 (discovery) text not obtained; the 60-day discovery window is from Rough Notes PF&amp;M. Several secondary sources say the discovery form gives employee-benefit-plan losses 1 year — not verified. Editions differ: the PSI outline lists Computer Fraud and Funds Transfer Fraud separately (2006 editions); the 11 15 edition combines them; a 06 22 edition reportedly has 8 insuring agreements (adds \"Fidelity\" and \"Fraudulent Impersonation\").\n\u003c/li>\u003cli>\nVacancy is a Loss Condition in CP 00 10, not in CP 00 90 (the CP 00 90 07 88 form has no vacancy clause).\n\u003c/li>\u003cli>\nBuilders risk facts are from CP 00 20 06 95; current edition may word them differently.\n\u003c/li>\u003cli>\nValue Reporting form (CP 13 10) text not obtained — facts from IRMI only.\n\u003c/li>\u003cli>\nPollution Liability Coverage Extension endorsement text not found; not tested.\n\u003c/li>\u003cli>\nEquipment breakdown: EB 00 20 01 13 / EB 99 59 09 07 from FC&amp;S; a newer EB edition may exist. Older BM forms not reviewed.\n\u003c/li>\u003cli>\nFarm: coverage-letter details come from the older combined FP 00 10 09 94 form; current FP 00 12/13/14 (04 16 editions reportedly) may differ in sublimits.\n\u003c/li>\u003cli>\nFL 00 20: FC&amp;S notes a discrepancy in loss-of-earnings amount ($250 vs $500 per day) — not tested.\n\u003c/li>\u003cli>\nInland marine form descriptions are general (IRMI/Verisk); individual ISO filed-form wording not reviewed.\n\u003c/li>\u003cli>\nState amendatory endorsements (e.g., Michigan changes) can override IL 00 17 cancellation and CGL conditions; MI amendatories not reviewed.\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"bop","title":"Businessowners Policy","weight":"6% · 9 items","secs":["bop"],"html":"\u003cp>Edition relied on: BP 00 03 07 13 (form text read; © ISO 2012). Endorsements: IL 04 15 04 98 (protective safeguard symbols), BP 04 57 01 06 (utility services time element text), FC&amp;S summary of BP 04 30 07 13 / BP 04 56 / BP 04 57 07 13 / BP 04 04 01 10.\u003c/p>\n\u003ch3>Characteristics and Purpose / Eligibility\u003c/h3>\n\u003cul>\n\u003cli>\nBOP packages property and liability for small-to-medium businesses; liability uses a single \"Liability and Medical Expenses\" limit; products-completed operations aggregate and general aggregate are each twice that limit. \u003ccite>[IRMI white paper \"Businessowners Policy Basics\"; ISO BP 00 03 07 13, Sec. II D.4]\u003c/cite>\n\u003c/li>\u003cli>\nISO eligibility rules (current per IRMI): no more than $6 million annual gross sales and no location over 35,000 sq ft; eligible classes include apartments, offices, mercantile, processing/service, wholesale, motels, restaurants, contractors with restrictions. \u003ccite>[IRMI white paper \"Businessowners Policy Basics\"]\u003c/cite>\n\u003c/li>\u003cli>\nIneligible regardless of size: manufacturers; auto repair/service stations, auto/motor home/mobile home/motorcycle dealers, parking lots/garages; bars and pubs; places of amusement; banks and financial institutions. \u003ccite>[IRMI white paper \"Businessowners Policy Basics\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Section I — Property\u003c/h3>\n\u003cul>\n\u003cli>\nCovered causes: direct physical loss unless excluded or limited (open perils). \u003ccite>[ISO BP 00 03 07 13, Sec. I A.3]\u003c/cite>\n\u003c/li>\u003cli>\nCovers Buildings and Business Personal Property (in building or within 100 feet). \u003ccite>[ISO BP 00 03 07 13, Sec. I A.1]\u003c/cite>\n\u003c/li>\u003cli>\nTheft limits: $2,500 for furs, jewelry/watches/precious metals (not items $100 or less), patterns/dies/molds. \u003ccite>[ISO BP 00 03 07 13, Sec. I A.4.c]\u003c/cite>\n\u003c/li>\u003cli>\nValuation: replacement cost (no depreciation) if limit is 80% or more of full replacement cost; if less, the greater of ACV or (limit ÷ 80% of RC) × loss. No separate coinsurance clause. \u003ccite>[ISO BP 00 03 07 13, Sec. I E.5.d(1)]\u003c/cite>\n\u003c/li>\u003cli>\nMay settle at ACV and claim RC by notifying within 180 days; RC is paid only after repair/replacement, but if the cost to repair or replace damaged BUILDING property is $2,500 or less, the loss is settled on the RC basis whether or not repaired. \u003ccite>[ISO BP 00 03 07 13, Sec. I E.5.d(1)(c)-(d)]\u003c/cite>\n\u003c/li>\u003cli>\nBuilding limit automatically increases 8% annually (prorated) unless a different % is shown. \u003ccite>[ISO BP 00 03 07 13, Sec. I C.4]\u003c/cite>\n\u003c/li>\u003cli>\nBPP seasonal increase: 25% (unless another % is shown) if the BPP limit is at least 100% of average monthly values for the prior 12 months (or time in business). \u003ccite>[ISO BP 00 03 07 13, Sec. I C.5]\u003c/cite>\n\u003c/li>\u003cli>\nOutdoor signs attached to buildings limited to $1,000 per sign per occurrence (unless Outdoor Signs optional coverage). \u003ccite>[ISO BP 00 03 07 13, Sec. I C.2]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Additional Coverages\u003c/h4>\n\u003cul>\n\u003cli>\nDebris removal: 25% of loss + deductible, plus up to an additional $25,000 per location; reported within 180 days. \u003ccite>[ISO BP 00 03 07 13, Sec. I A.5.a]\u003c/cite>\n\u003c/li>\u003cli>\nPreservation of property: 30 days. Fire department service charge: up to $2,500 per premises; no deductible. \u003ccite>[ISO BP 00 03 07 13, Sec. I A.5.b-c; D.3]\u003c/cite>\n\u003c/li>\u003cli>\nBusiness Income: actual loss sustained during the period of restoration occurring within 12 consecutive months after the loss; not subject to the Section I limits (no dollar limit); ordinary payroll covered only for 60 days unless more shown; period of restoration begins 72 hours after loss. \u003ccite>[ISO BP 00 03 07 13, Sec. I A.5.f; H. \"period of restoration\"]\u003c/cite>\n\u003c/li>\u003cli>\nExtended Business Income: up to 60 consecutive days after operations resume (unless more shown). \u003ccite>[ISO BP 00 03 07 13, Sec. I A.5.f(2)]\u003c/cite>\n\u003c/li>\u003cli>\nExtra Expense: within 12 consecutive months; not subject to limits. Civil Authority: within 1 mile; BI begins 72 hours after the action, up to 4 consecutive weeks. \u003ccite>[ISO BP 00 03 07 13, Sec. I A.5.g, A.5.i]\u003c/cite>\n\u003c/li>\u003cli>\nPollutant clean-up $10,000 per location per 12 months; Money Orders and Counterfeit Money $1,000; Forgery or Alteration $2,500; Increased Cost of Construction $10,000 per building; Business Income from Dependent Properties $5,000; Fire Extinguisher Systems Recharge $5,000; Electronic Data $10,000 per policy year; Interruption of Computer Operations $10,000 per policy year; limited fungi coverage $15,000. \u003ccite>[ISO BP 00 03 07 13, Sec. I A.5.h-q; A.5 fungi]\u003c/cite>\n\u003c/li>\u003cli>\nNo deductible: Fire Department Service Charge, Business Income, Extra Expense, Civil Authority, Fire Extinguisher Systems Recharge Expense. \u003ccite>[ISO BP 00 03 07 13, Sec. I D.3]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Coverage Extensions (in addition to limits)\u003c/h4>\n\u003cul>\n\u003cli>\nNewly acquired/constructed: $250,000 per building, $100,000 BPP per building, 30 days. Personal property off-premises $10,000. Outdoor property $2,500 ($1,000 per tree/shrub/plant; fire, lightning, explosion, riot, aircraft only). Personal effects $2,500 (not theft). Valuable papers $10,000 on premises / $5,000 off. Accounts receivable $10,000 on premises / $5,000 off. BPP in portable storage units $10,000 (90 days). \u003ccite>[ISO BP 00 03 07 13, Sec. I A.6.a-g]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Conditions\u003c/h4>\n\u003cul>\n\u003cli>\nVacancy: &gt;60 consecutive days — no coverage for vandalism, sprinkler leakage (unless protected from freezing), building glass, water damage, theft, attempted theft; other losses reduced 15%; owner's building vacant unless at least 31% rented/used. \u003ccite>[ISO BP 00 03 07 13, Sec. I E.8]\u003c/cite>\n\u003c/li>\u003cli>\nLegal action within 2 years; sworn proof of loss within 60 days of request. \u003ccite>[ISO BP 00 03 07 13, Sec. I E.3-4]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Optional Coverages\u003c/h4>\n\u003cul>\n\u003cli>\nOutdoor Signs; Money and Securities (theft, disappearance, destruction at premises, bank, living quarters, or in transit); Employee Dishonesty (loss sustained during policy period and discovered no later than 1 year after policy end; cancelled as to an employee upon discovery of a dishonest act); Equipment Breakdown. \u003ccite>[ISO BP 00 03 07 13, Sec. I G.1-4]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Section II — Liability\u003c/h3>\n\u003cul>\n\u003cli>\nBusiness Liability covers BI, PD and personal &amp; advertising injury (occurrence-based, same structure as CGL); Medical Expenses for accidents, incurred and reported within one year. \u003ccite>[ISO BP 00 03 07 13, Sec. II A.1-2]\u003c/cite>\n\u003c/li>\u003cli>\nExcludes professional services. \u003ccite>[ISO BP 00 03 07 13, Sec. II B.1.j]\u003c/cite>\n\u003c/li>\u003cli>\nWho is an insured mirrors CGL (individual + spouse, partners, LLC members/managers, officers/directors, employees, volunteers, real estate manager, etc.). \u003ccite>[ISO BP 00 03 07 13, Sec. II C.]\u003c/cite>\n\u003c/li>\u003cli>\nLimits: Liability and Medical Expenses limit per occurrence (and per person/organization for P&amp;AI); separate Medical Expenses per-person limit and Damage To Premises Rented To You limit (amounts shown in Declarations); products-completed ops aggregate = 2× Liability &amp; Medical Expenses limit; general aggregate = 2× that limit. \u003ccite>[ISO BP 00 03 07 13, Sec. II D.1-4]\u003c/cite>\n\u003c/li>\u003cli>\nSupplementary payments: bail bonds up to $250; loss of earnings up to $250 a day. \u003ccite>[ISO BP 00 03 07 13, Sec. II A.1.f]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Section III — Common Policy Conditions\u003c/h3>\n\u003cul>\n\u003cli>\nInsurer may cancel on 5 days' notice if the building has been vacant/unoccupied 60+ consecutive days (not seasonal or under construction; 65%+ of rental units/floor area vacant = unoccupied), permanent repairs not started/contracted within 30 days of initial loss payment, an order to vacate/demolition order/unsafe declaration exists, fixed items are being removed, or utilities not furnished 30+ days / property taxes unpaid over 1 year. \u003ccite>[ISO BP 00 03 07 13, Sec. III A.2.a]\u003c/cite>\n\u003c/li>\u003cli>\nOtherwise 10 days for nonpayment, 30 days other reasons; books and records up to 3 years after; Section III also contains Inspections and Surveys, Liberalization, Other Insurance, Premiums, Premium Audit and Transfer of Your Rights and Duties conditions. \u003ccite>[ISO BP 00 03 07 13, Sec. III A.2.b-c, D, E, G, H, I, J, L]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Selected Endorsements\u003c/h3>\n\u003cul>\n\u003cli>\nProtective Safeguards: insured must maintain listed devices/services; symbols P-1 automatic sprinkler system, P-2 automatic fire alarm (central station or reporting to fire alarm station), P-3 security service with hourly rounds when closed, P-4 service contract with privately owned fire department, P-9 described system; fire losses are excluded if insured knew of an impairment and failed to notify, or failed to maintain the safeguard in working order (sprinkler shutoff restored within 48 hours needs no notice). \u003ccite>[ISO IL 04 15 04 98; BOP version BP 04 30 07 13 adds P-5 commercial cooking exhaust/extinguishing per FC&amp;S 2020]\u003c/cite>\n\u003c/li>\u003cli>\nUtility Services – Direct Damage (BP 04 56): covers direct damage to covered property from interruption of utility service caused by a covered cause of loss to off-premises utility property listed in the schedule. \u003ccite>[FC&amp;S \"Businessowners Program Endorsements Described\" (2020)]\u003c/cite>\n\u003c/li>\u003cli>\nUtility Services – Time Element (BP 04 57): covers Business Income/Extra Expense from such an interruption; utility types: water supply, communication supply, power supply (wastewater removal added 07 13); overhead transmission lines not covered unless indicated in the Schedule; electronic data excluded. \u003ccite>[ISO BP 04 57 01 06; FC&amp;S (2020)]\u003c/cite>\n\u003c/li>\u003cli>\nHired Auto and Non-Owned Auto Liability (BP 04 04): covers BI/PD from use of a hired auto by you or your employees in your business, and use of a non-owned auto in your business by any person; requires a premium shown in the Declarations. \u003ccite>[FC&amp;S \"Businessowners Program Endorsements Described\" (2020)]\u003c/cite>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\nBOP eligibility thresholds ($6M sales, 35,000 sq ft, etc.) vary by ISO rule edition and insurer filings — not tested as numbers.\n\u003c/li>\u003cli>\nMedical Expenses and Damage To Premises Rented To You amounts are set in the BOP Declarations, not the form — no default amounts tested.\n\u003c/li>\u003cli>\nBP 04 56/04 57 07 13 text not read; types/overhead-line rule from 01 06 edition plus FC&amp;S summary of 07 13 changes.\n\u003c/li>\u003cli>\nBP 04 30 symbol wording taken from interline IL 04 15 04 98; BOP version adds P-5 per FC&amp;S.\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"wc","title":"Workers' Compensation","weight":"5% · 8 items","secs":["wc"],"html":"\u003cp>Outline weight: 5% (8 items). Statute text is from legislature.mi.gov (\"MCL complete through PA 103 of 2026\").\u003c/p>\n\u003ch3>Michigan Workers' Disability Compensation Act (WDCA, MCL ch. 418)\u003c/h3>\n\u003ch4>Exclusive Remedy (418.131)\u003c/h4>\n\u003cul>\n\u003cli>\nWorkers' comp benefits are the employee's exclusive remedy against the employer for a personal injury or occupational disease. The only exception is an \u003cstrong>intentional tort\u003c/strong>. \u003ccite>[MCL 418.131(1)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Intentional tort\u003c/strong>: the employer committed a deliberate act and specifically intended an injury. Intent is deemed if the employer had actual knowledge that an injury was certain to occur and willfully disregarded that knowledge. Whether an intentional tort occurred is a question of law for the court. \u003ccite>[MCL 418.131(1)]\u003c/cite>\n\u003c/li>\u003cli>\nFor this section, \"employer\" includes the employer's insurer (and a self-insurer's service agent) when it furnishes, or fails to furnish, safety inspections or advisory services. \u003ccite>[MCL 418.131(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Losing the shield\u003c/strong>: an employer that fails to secure compensation (§611), or violates the statutory-employer rule (§171), can be sued in a civil action despite §131. \u003ccite>[MCL 418.641(2)]\u003c/cite> In that suit the employer may not use these defenses: the employee's negligence (unless willful), the fellow-servant rule, or assumption of risk. \u003ccite>[MCL 418.141]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Employers Covered (418.115)\u003c/h4>\n\u003cul>\n\u003cli>\nPrivate employers (other than agricultural) that regularly employ \u003cstrong>3 or more employees at one time\u003c/strong>. \u003ccite>[MCL 418.115(a)]\u003c/cite>\n\u003c/li>\u003cli>\nPrivate employers with \u003cstrong>fewer than 3\u003c/strong> employees if at least 1 has been regularly employed by that employer \u003cstrong>35+ hours per week for 13+ weeks during the preceding 52 weeks\u003c/strong>. \u003ccite>[MCL 418.115(b)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>All public employers\u003c/strong>, regardless of the number of employees. \u003ccite>[MCL 418.115(c)]\u003c/cite>\n\u003c/li>\u003cli>\nAgricultural employers of \u003cstrong>3+ regular employees\u003c/strong> paid hourly or salary (not piecework) and employed \u003cstrong>35+ hours per week for 13+ consecutive weeks\u003c/strong> during the preceding 52 weeks. \u003ccite>[MCL 418.115(d)]\u003c/cite>\n\u003c/li>\u003cli>\nAgricultural employers of \u003cstrong>1+ employees\u003c/strong> working \u003cstrong>35+ hours per week for 5+ consecutive weeks\u003c/strong> must provide medical and hospital coverage (§315) for work injuries. \u003ccite>[MCL 418.115(e)]\u003c/cite>\n\u003c/li>\u003cli>\nAny other private employer may voluntarily assume coverage. Buying a WC policy counts as assuming it, except for domestic and agricultural employees, who may be included by specific endorsement. \u003ccite>[MCL 418.121]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Who is an employee\u003c/strong> \u003ccite>[MCL 418.161(1)(l)]\u003c/cite>:\n\u003cul>\n\u003cli>\nEvery person in the service of another under a contract of hire, including aliens and minors.\n\u003c/li>\u003cli>\nA minor under 18 who was illegally employed receives \u003cstrong>double compensation\u003c/strong>, unless permits were used fraudulently.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Exclusions by election or endorsement\u003c/strong>:\n\u003cul>\n\u003cli>\nA policy may, by endorsement, exclude named partners or the employer's spouse, child, or parent. \u003ccite>[MCL 418.161(2)]\u003c/cite>\n\u003c/li>\u003cli>\nA corporate officer owning at least 10% of a corporation with no more than 10 stockholders may elect exclusion by written notice to the carrier. The same applies to an LLC manager-member owning at least 10% of an LLC with no more than 10 members. \u003ccite>[MCL 418.161(3)–(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Statutory employer\u003c/strong>: a principal that hires an uninsured contractor is liable to the contractor's employees as if it employed them directly. The principal may then recover from the contractor. \u003ccite>[MCL 418.171(1)–(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Covered Injuries (418.301)\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Compensable injury\u003c/strong>: a personal injury \"arising out of and in the course of employment.\" It counts if work causes, contributes to, or aggravates pathology so as to create pathology medically distinguishable from what existed before. \u003ccite>[MCL 418.301(1)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Mental disabilities and aging conditions\u003c/strong> (heart and cardiovascular conditions, degenerative arthritis) are compensable if contributed to, aggravated, or accelerated by employment \"in a significant manner.\" \u003ccite>[MCL 418.301(2)]\u003c/cite> Mental disabilities must also arise from actual events of employment, not unfounded perceptions. \u003ccite>[MCL 418.301(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Going to or from work\u003c/strong>: an employee on the work premises within a reasonable time before or after working hours is presumed to be in the course of employment. \u003ccite>[MCL 418.301(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Social or recreational activity\u003c/strong>: an injury from an activity whose major purpose is social or recreational is not covered. \u003ccite>[MCL 418.301(3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Notice and claim deadlines\u003c/strong> \u003ccite>[MCL 418.381(1)–(3)]\u003c/cite>:\n\u003cul>\n\u003cli>\nNotice of injury to the employer within \u003cstrong>90 days\u003c/strong>. Late notice is excused unless the employer proves prejudice.\n\u003c/li>\u003cli>\nClaim within \u003cstrong>2 years\u003c/strong> after the injury, or 2 years after death.\n\u003c/li>\u003cli>\nNo payment for any period more than 2 years before the application for hearing.\n\u003c/li>\u003cli>\nNo nursing or attendant care payment for any period more than 1 year before the application.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003c/ul>\n\u003ch4>Occupational Disease (418.401–.441)\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Personal injury includes disease\u003c/strong> caused by conditions characteristic of and peculiar to the employer's business. \u003cstrong>Ordinary diseases of life\u003c/strong> that the public is generally exposed to outside employment are not compensable. \u003ccite>[MCL 418.401(2)(b)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Hernia\u003c/strong>: must be clearly recent in origin, result from a work strain, and be promptly reported. \u003ccite>[MCL 418.401(2)(b)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Police and firefighter presumption\u003c/strong>: for covered members, respiratory and heart diseases that develop during active service are a \"personal injury.\" They are presumed work-related in the absence of evidence to the contrary. \u003ccite>[MCL 418.405(1), (3)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Firefighter cancer presumption\u003c/strong>: certain cancers in firefighters with 60+ months of service are presumed work-related. The claim is made against the Christopher R. Slezak First Responder Presumed Coverage Fund, and the presumption can be rebutted by evidence of substantial tobacco use. \u003ccite>[MCL 418.405(2), (6)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Disablement\u003c/strong> from an occupational disease is treated as the happening of a personal injury. \u003ccite>[MCL 418.411; .415]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Date of disablement\u003c/strong> is the date the magistrate determines. \u003ccite>[MCL 418.425]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>No compensation\u003c/strong> if the employee willfully and falsely represented in writing that he or she had not previously suffered from the disease. \u003ccite>[MCL 418.431]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Proportional compensation\u003c/strong> applies when non-compensable causes contribute to the disability. \u003ccite>[MCL 418.431]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Last employer rule\u003c/strong>: liability falls on the last employer in whose employment the disease was contracted. \u003ccite>[MCL 418.435]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>OD claim deadline\u003c/strong>: within \u003cstrong>2 years\u003c/strong> after the employee (or dependents) knew, reasonably believed, or with ordinary diligence could have discovered that the disease or death was work-related. \u003ccite>[MCL 418.441]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Benefits Provided\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Waiting period\u003c/strong>: nothing is paid unless the incapacity lasts at least 1 week. Compensation begins on the \u003cstrong>8th day\u003c/strong>. If incapacity lasts \u003cstrong>2 weeks or longer\u003c/strong>, or death results, compensation is computed from the date of injury. \u003ccite>[MCL 418.311]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Medical\u003c/strong> \u003ccite>[MCL 418.315(1)–(2)]\u003c/cite>:\n\u003cul>\n\u003cli>\nReasonable medical, surgical, hospital, and medicine costs, plus dental, crutches, artificial limbs, eyes, teeth, glasses, and hearing aids.\n\u003c/li>\u003cli>\nAfter \u003cstrong>28 days\u003c/strong> from the start of medical care, the employee may treat with a physician of their own choice by notifying the employer. The employer may petition to object.\n\u003c/li>\u003cli>\nFamily-provided attendant care is capped at 56 hours per week.\n\u003c/li>\u003cli>\nProviders are paid the lesser of their usual and customary charge or the fee-schedule maximum.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Total disability\u003c/strong>: \u003cstrong>80% of after-tax average weekly wage (AWW)\u003c/strong>, up to the maximum weekly rate under §355, for the duration of the disability. The conclusive presumption of total and permanent disability does not extend beyond \u003cstrong>800 weeks\u003c/strong> from the date of injury. \u003ccite>[MCL 418.351(1); 418.301(7)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Partial disability\u003c/strong>: 80% of the difference between the pre-injury after-tax AWW and post-injury wage earning capacity, subject to the maximum. \u003ccite>[MCL 418.301(8)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Refusing work\u003c/strong>: an employee who refuses a bona fide offer of reasonable employment without good cause gets no wage-loss benefits during the refusal. \u003ccite>[MCL 418.301(9)(a)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Death\u003c/strong> \u003ccite>[MCL 418.321]\u003c/cite>:\n\u003cul>\n\u003cli>\nWholly dependent survivors receive 80% of the after-tax AWW for \u003cstrong>500 weeks\u003c/strong> from the date of death.\n\u003c/li>\u003cli>\nA magistrate may extend payments for a dependent under \u003cstrong>21\u003c/strong> until that dependent turns 21.\n\u003c/li>\u003cli>\nPartial dependents receive a proportional amount.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Minimum benefits\u003c/strong> \u003ccite>[MCL 418.356(2)–(4)]\u003c/cite>:\n\u003cul>\n\u003cli>\nDeath benefit minimum: \u003cstrong>50% of the state average weekly wage (SAWW)\u003c/strong>.\n\u003c/li>\u003cli>\nSpecific-loss minimum: \u003cstrong>25% of SAWW\u003c/strong>.\n\u003c/li>\u003cli>\nTotal disability has \u003cstrong>no minimum\u003c/strong>.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Funeral and burial\u003c/strong>: the reasonable cost, not more than \u003cstrong>$6,000\u003c/strong> or the actual cost, whichever is less. The employer also pays the expense of the last sickness. \u003ccite>[MCL 418.345]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Maximum weekly rate\u003c/strong>: set each January 1 for injuries in that year at \u003cstrong>90% of the SAWW as of the prior June 30\u003c/strong>, rounded up to the next $1. \u003ccite>[MCL 418.355(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>2026 maximum: $1,201.00 per week\u003c/strong>, based on a SAWW of $1,333.88, for injuries occurring in calendar year 2026. Check: 0.9 × 1,333.88 = 1,200.49, rounded up to $1,201. The 2025 maximum was $1,164. \u003ccite>[Michigan LEO/WDCA \"2026 Weekly Benefit Tables\" (wca_2026_Rate_Book.pdf): \"The 2026 maximum weekly compensation rate is $1201.00 based on a State Average Weekly Wage of $1333.88\"; 2025 Rate Book: \"$1164.00\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Example\u003c/strong>: an after-tax AWW of $1,000 gives $800 per week. An after-tax AWW of $1,800 would give $1,440, but for a 2026 injury it is capped at $1,201. \u003ccite>[MCL 418.351(1); 418.355]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Specific Loss Schedule (418.361) — compensation at 80% of after-tax AWW for the period listed\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Weeks by member\u003c/strong> \u003ccite>[MCL 418.361(2)]\u003c/cite>:\n\u003c/li>\u003c/ul>\n\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Member\u003c/th>\u003cth>Weeks\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Thumb\u003c/td>\u003ctd>65\u003c/td>\u003c/tr>\u003ctr>\u003ctd>First finger\u003c/td>\u003ctd>38\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Second finger\u003c/td>\u003ctd>33\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Third finger\u003c/td>\u003ctd>22\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fourth finger\u003c/td>\u003ctd>16\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Great toe\u003c/td>\u003ctd>33\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Other toe\u003c/td>\u003ctd>11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hand\u003c/td>\u003ctd>215\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Arm\u003c/td>\u003ctd>269\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Foot\u003c/td>\u003ctd>162\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Leg\u003c/td>\u003ctd>215\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Eye\u003c/td>\u003ctd>162\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\n\u003cstrong>Partial losses\u003c/strong> \u003ccite>[MCL 418.361(2)]\u003c/cite>:\n\u003cul>\n\u003cli>\nLoss of the first phalange is ½ of the thumb, finger, or toe. Loss of more than 1 phalange is the whole digit.\n\u003c/li>\u003cli>\nPayment for more than 1 finger cannot exceed the payment for a hand.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Amputation thresholds\u003c/strong> \u003ccite>[MCL 418.361(2)]\u003c/cite>:\n\u003cul>\n\u003cli>\nAn amputation 6+ inches below the elbow is a \"hand\"; above that point it is an \"arm.\"\n\u003c/li>\u003cli>\nAn amputation 7+ inches below the tibial table is a \"foot\"; above that point it is a \"leg.\"\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Eye\u003c/strong>: 80% loss of vision in one eye counts as total loss of that eye. \u003ccite>[MCL 418.361(2)(l)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Total and permanent disability\u003c/strong> includes \u003ccite>[MCL 418.361(3)]\u003c/cite>:\n\u003cul>\n\u003cli>\nloss of sight of both eyes,\n\u003c/li>\u003cli>\nloss of both legs or both feet at or above the ankle,\n\u003c/li>\u003cli>\nloss of both arms or both hands at or above the wrist,\n\u003c/li>\u003cli>\nloss of any 2 of these,\n\u003c/li>\u003cli>\npermanent and complete paralysis of both legs, both arms, or 1 leg and 1 arm,\n\u003c/li>\u003cli>\nincurable insanity or imbecility,\n\u003c/li>\u003cli>\npermanent and total loss of industrial use of both legs, both hands, both arms, or 1 leg and 1 arm.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Loss of a second member\u003c/strong> while the first is being paid: payments for the second loss start when payments for the first end. \u003ccite>[MCL 418.361(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Second Injury Fund (418.521)\u003c/h4>\n\u003cul>\n\u003cli>\nAn employee who already has a permanent loss of a hand, arm, foot, leg, or eye, and then loses another of these through a work injury, is \u003cstrong>conclusively presumed totally and permanently disabled\u003c/strong>. \u003ccite>[MCL 418.521(1)]\u003c/cite>\n\u003c/li>\u003cli>\nThe \u003cstrong>Second Injury Fund\u003c/strong> pays T&amp;P benefits starting when payments for the second loss end, after subtracting the weeks already paid for both losses. \u003ccite>[MCL 418.521(1)]\u003c/cite>\n\u003c/li>\u003cli>\nThe SIF also reimburses carriers for certain differential and adjusted benefits, e.g., the one-time increase to up to 50% of SAWW after 2 years of continuous disability. \u003ccite>[MCL 418.521(2); 418.356(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Self-Insurance and Group Self-Insurance (418.611)\u003c/h4>\n\u003cul>\n\u003cli>\nEvery employer must secure payment of compensation either by:\n\u003cul>\n\u003cli>\n\u003cstrong>(a)\u003c/strong> getting the director's authorization to self-insure, based on proof of solvency and financial ability (the director may require a bond, excess insurance, a letter of credit, or other security), or\n\u003c/li>\u003cli>\n\u003cstrong>(b)\u003c/strong> insuring with an insurer authorized to write workers' comp in Michigan.\n \u003ccite>[MCL 418.611(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Group self-insurance\u003c/strong>: 2 or more employers in the same industry with \u003cstrong>combined assets of $1,000,000 or more\u003c/strong>, or 2 or more public employers of the same type, may pool their liabilities as a self-insured group with the director's permission. \u003ccite>[MCL 418.611(2)]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Penalty for failing to insure\u003c/strong>: a misdemeanor, with a fine up to $1,000, up to 6 months in jail, or both. Each day is a separate offense. \u003ccite>[MCL 418.641(1)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Michigan Workers' Compensation Placement Facility (MCL 500.2301 et seq.)\u003c/h4>\n\u003cul>\n\u003cli>\nEvery insurer authorized to write workers' comp in Michigan must participate. The facility's purposes are to provide coverage to anyone unable to get it through ordinary methods and to preserve price competition by encouraging maximum use of the normal private market. \u003ccite>[MCL 500.2301]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Board of governors\u003c/strong>: appointed by the commissioner (now the DIFS director) for 2-year terms. It has 9 members: 5 participating insurers, 2 policyholders, 1 licensed agent, and 1 member of the public. \u003ccite>[MCL 500.2310]\u003c/cite>\n\u003c/li>\u003cli>\nThe plan of operation provides for:\n\u003cul>\n\u003cli>\nservicing carriers,\n\u003c/li>\u003cli>\nproducer \u003cstrong>commissions of no more than 5% of total premium\u003c/strong>,\n\u003c/li>\u003cli>\nthree rating plans: \u003cstrong>A\u003c/strong> (poor loss experience or safety noncompliance, with surcharges), \u003cstrong>B\u003c/strong> (applicants who are self-insured or members of self-insured groups), and \u003cstrong>C\u003c/strong> (all others, with no surcharge).\n \u003ccite>[MCL 500.2312(2)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>CAOM\u003c/strong> (Compensation Advisory Organization of Michigan) handles Michigan WC data collection, experience modifications, and placement facility services. \u003ccite>[caom.com]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Federal Workers' Compensation Laws\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>FELA (45 USC 51–60)\u003c/strong>:\n\u003cul>\n\u003cli>\nRailroad common carriers in interstate commerce are liable in \u003cstrong>damages\u003c/strong> to employees injured or killed through the railroad's negligence, in whole or in part. \u003ccite>[45 USC 51]\u003c/cite>\n\u003c/li>\u003cli>\nIt is a negligence system, not a no-fault benefit system. \u003ccite>[45 USC 51]\u003c/cite>\n\u003c/li>\u003cli>\nContributory negligence does not bar recovery; damages are reduced in proportion. The employee bears no reduction if the carrier violated a safety statute. \u003ccite>[45 USC 53]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>US Longshore and Harbor Workers' Compensation Act (USL&amp;HW / LHWCA, 33 USC 901 et seq.)\u003c/strong>:\n\u003cul>\n\u003cli>\nEvery employer must secure compensation for covered employees. Compensation is payable \u003cstrong>irrespective of fault\u003c/strong>. \u003ccite>[33 USC 904(a)–(b)]\u003c/cite>\n\u003c/li>\u003cli>\nIt covers injuries on US navigable waters or on an adjoining pier, wharf, dry dock, terminal, building way, marine railway, or other adjoining area used for loading, unloading, repairing, or building vessels. \u003ccite>[33 USC 903(a)]\u003c/cite>\n\u003c/li>\u003cli>\nIt excludes a \"master or member of a crew of any vessel\"; those workers fall under the Jones Act. \u003ccite>[33 USC 902(3)(G)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Jones Act (now 46 USC 30104; formerly 46 App. USC 688, as cited in the PSI outline)\u003c/strong>:\n\u003cul>\n\u003cli>\nA \u003cstrong>seaman\u003c/strong> injured in the course of employment (or the seaman's personal representative) may sue the employer at law with a jury trial.\n\u003c/li>\u003cli>\nThe federal laws governing railway employees (FELA) apply to these suits.\n \u003ccite>[46 USC 30104(a); LII historical note]\u003c/cite>\n\u003c/li>\u003cli>\nThe employee's contributory negligence reduces recovery but does not bar it. \u003ccite>[IRMI \"Jones Act\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Employers liability exclusions\u003c/strong>: the standard WC policy's employers liability coverage excludes work subject to LHWCA, FELA, and other federal comp laws, and bodily injury to a master or crew member of any vessel. These exposures need endorsements (e.g., Maritime WC 00 02 01; FELA WC 00 01 04). \u003ccite>[NCCI WC 00 00 00 C, Part Two C.8–C.10; NCRB Basic Manual Rule 5]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Workers' Compensation and Employers Liability Policy (NCCI WC 00 00 00 C, Ed. 1-15)\u003c/h3>\n\u003ch4>General Section\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>The policy\u003c/strong>: includes the Information Page and all listed endorsements and schedules. Its terms may be changed or waived only by endorsement. \u003ccite>[WC 00 00 00 C, Gen. A]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Who is insured\u003c/strong>: the employer named in Item 1. A partner is insured only as an employer of the partnership's employees. \u003ccite>[Gen. B]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Workers compensation law\u003c/strong>: the WC and occupational disease law of each state in Item 3.A. It excludes federal WC and OD laws and nonoccupational disability benefit laws. \u003ccite>[Gen. C]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>\"State\"\u003c/strong>: any US state and the District of Columbia. \u003ccite>[Gen. D]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Locations\u003c/strong>: all workplaces in Items 1 or 4, plus all other workplaces in Item 3.A states unless otherwise insured or self-insured. \u003ccite>[Gen. E]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Part One — Workers Compensation Insurance\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Covered injury\u003c/strong>: bodily injury by accident (must occur during the policy period) or by disease. For disease, the employee's last day of last exposure must fall in the policy period. \u003ccite>[Part One A]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>We will pay\u003c/strong>: \"promptly when due the benefits required of you by the workers compensation law.\" \u003cstrong>There is no dollar limit; coverage is statutory.\u003c/strong> \u003ccite>[Part One B]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Defense and costs\u003c/strong>: the insurer has the right and duty to defend, and pays defense costs in addition to benefits. \u003ccite>[Part One C–D]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Other insurance\u003c/strong>: equal shares. \u003ccite>[Part One E]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Payments you must make\u003c/strong>: the employer reimburses the insurer for payments above regular benefits caused by:\n\u003cul>\n\u003cli>\nits serious and willful misconduct,\n\u003c/li>\u003cli>\nknowingly employing someone in violation of law,\n\u003c/li>\u003cli>\nviolating a health or safety law, or\n\u003c/li>\u003cli>\ndischarging, coercing, or discriminating against an employee in violation of the WC law.\n \u003ccite>[Part One F]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Recovery from others (subrogation)\u003c/strong>. \u003ccite>[Part One G]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Statutory provisions\u003c/strong>: notice to the employer is notice to the insurer. The employer's bankruptcy does not relieve the insurer. The insurer is directly and primarily liable to injured workers. \u003ccite>[Part One H]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Part Two — Employers Liability Insurance\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Covers\u003c/strong> \u003ccite>[Part Two A–B]\u003c/cite>:\n\u003cul>\n\u003cli>\ndamages for employee bodily injury arising out of and in the course of employment in an Item 3.A state,\n\u003c/li>\u003cli>\nthird-party-over actions,\n\u003c/li>\u003cli>\ncare and loss of services,\n\u003c/li>\u003cli>\nconsequential bodily injury to a spouse, child, parent, brother, or sister,\n\u003c/li>\u003cli>\ndual-capacity claims.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Suits\u003c/strong> must be brought in the USA, its territories or possessions, or Canada. \u003ccite>[Part Two A.5]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Exclusions\u003c/strong> \u003ccite>[Part Two C]\u003c/cite>:\n\u003cul>\n\u003cli>\nliability assumed under contract,\n\u003c/li>\u003cli>\npunitive damages for an employee employed in violation of law,\n\u003c/li>\u003cli>\nbodily injury to an employee knowingly employed in violation of law,\n\u003c/li>\u003cli>\nobligations under WC, OD, unemployment, or disability benefits laws,\n\u003c/li>\u003cli>\nintentionally caused bodily injury,\n\u003c/li>\u003cli>\nbodily injury outside the US or Canada (unless a citizen or resident is temporarily abroad),\n\u003c/li>\u003cli>\nemployment practices claims,\n\u003c/li>\u003cli>\nLHWCA and other federal comp laws,\n\u003c/li>\u003cli>\nFELA,\n\u003c/li>\u003cli>\nmaster or crew of a vessel,\n\u003c/li>\u003cli>\nfines and penalties,\n\u003c/li>\u003cli>\nMigrant and Seasonal Agricultural Worker Protection Act damages.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Limits\u003c/strong>: shown in Item 3.B. \u003ccite>[Part Two G]\u003c/cite>\n\u003cul>\n\u003cli>\nBodily Injury by Accident — each accident.\n\u003c/li>\u003cli>\nBodily Injury by Disease — policy limit (aggregate).\n\u003c/li>\u003cli>\nBodily Injury by Disease — each employee.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Standard EL limits: $100,000 each accident / $500,000 disease–policy limit / $100,000 disease–each employee\u003c/strong>. These may be increased. \u003ccite>[NCRB (NC Rate Bureau) Basic Manual Rule 5, mirroring NCCI]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Defense\u003c/strong>: in addition to limits; the duty ends when the limit is paid. \u003ccite>[Part Two D–E]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Part Three — Other States Insurance\u003c/h4>\n\u003cul>\n\u003cli>\nApplies only if states are listed in \u003cstrong>Item 3.C\u003c/strong>. \u003ccite>[Part Three A.1]\u003c/cite>\n\u003c/li>\u003cli>\nIf the insured \u003cem>begins\u003c/em> work in a 3.C state after the effective date, the policy applies as though that state were listed in 3.A. \u003ccite>[Part Three A.2]\u003c/cite>\n\u003c/li>\u003cli>\nIf the insurer cannot pay benefits directly in that state, it reimburses the insured. \u003ccite>[Part Three A.3]\u003c/cite>\n\u003c/li>\u003cli>\nIf the insured already had work on the effective date in a state not listed in 3.A, there is \u003cstrong>no coverage there unless the insurer is notified within 30 days\u003c/strong>. \u003ccite>[Part Three A.4]\u003c/cite>\n\u003c/li>\u003cli>\nThe insured must \"tell us at once\" when work begins in a 3.C state. \u003ccite>[Part Three B]\u003c/cite>\n\u003c/li>\u003cli>\nMonopolistic state-fund states should not be listed in 3.C. \u003ccite>[NCRB Basic Manual Rule 5]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Part Four — Your Duties If Injury Occurs\u003c/h4>\n\u003cul>\n\u003cli>\nTell the insurer at once. \u003ccite>[Part Four]\u003c/cite>\n\u003c/li>\u003cli>\nProvide immediate medical and other services required by law. \u003ccite>[Part Four]\u003c/cite>\n\u003c/li>\u003cli>\nGive names and addresses of injured persons and witnesses. \u003ccite>[Part Four]\u003c/cite>\n\u003c/li>\u003cli>\nPromptly forward notices and legal papers. \u003ccite>[Part Four]\u003c/cite>\n\u003c/li>\u003cli>\nCooperate. \u003ccite>[Part Four]\u003c/cite>\n\u003c/li>\u003cli>\nDo nothing to interfere with recovery from others. \u003ccite>[Part Four]\u003c/cite>\n\u003c/li>\u003cli>\nDo not voluntarily make payments, assume obligations, or incur expenses except at your own cost. \u003ccite>[Part Four]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Part Five — Premium\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Manuals\u003c/strong>: premium is set by the insurer's manuals of rules, rates, rating plans, and classifications. \u003ccite>[Part Five A]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Classification\u003c/strong>: proper classifications are assigned by endorsement if the original ones do not fit. \u003ccite>[Part Five B]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Basis\u003c/strong>: premium = rate × premium basis, and remuneration (payroll) is the most common basis. \u003ccite>[Part Five C]\u003c/cite>\n\u003cul>\n\u003cli>\nThe basis includes payroll of officers and employees, plus other persons whose injuries could make the insurer liable under Part One, such as uninsured subcontractors.\n\u003c/li>\u003cli>\nThe contract price may be used if there are no payroll records.\n\u003c/li>\u003cli>\nUninsured-subcontractor payroll is not counted if the insured proves those employers lawfully secured WC coverage.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Final premium\u003c/strong>: the premium shown is an estimate. The final premium is based on actual exposure, determined by \u003cstrong>audit\u003c/strong>. \u003ccite>[Part Five E, G]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Cancellation premium\u003c/strong>: if the insurer cancels, the final premium is pro rata. If the insured cancels, it is more than pro rata (short rate). \u003ccite>[Part Five E]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Audit window\u003c/strong>: during the policy period and within \u003cstrong>3 years\u003c/strong> after it ends. \u003ccite>[Part Five G]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Part Six — Conditions\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Inspection\u003c/strong>: the insurer may inspect, but its inspections are not safety inspections and it does not warrant safety. \u003ccite>[Part Six A]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Long-term policy\u003c/strong>: a policy period longer than \u003cstrong>1 year and 16 days\u003c/strong> is treated as a new policy at each anniversary. \u003ccite>[Part Six B]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Transfer of rights and duties\u003c/strong>: requires written consent. If the insured dies and the insurer is notified within \u003cstrong>30 days\u003c/strong>, the legal representative is covered. \u003ccite>[Part Six C]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Cancellation\u003c/strong>: the insured may cancel with advance written notice. The insurer must give \u003cstrong>at least 10 days'\u003c/strong> advance written notice, but conflicting state law controls. \u003ccite>[Part Six D]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Sole representative\u003c/strong>: the first named insured. \u003ccite>[Part Six E]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch4>Voluntary Compensation Endorsement (WC 00 03 11 A, Ed. 8-91)\u003c/h4>\n\u003cul>\n\u003cli>\n\u003cstrong>Purpose\u003c/strong>: pays the equivalent of statutory benefits to employees whom the law does not require to be covered (listed in the Schedule), e.g., domestic, farm, or casual workers, or excluded officers and partners. \u003ccite>[WC 00 03 11 A; NCRB Basic Manual Rule 5; IRMI \"voluntary compensation endorsement\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Before payment\u003c/strong>, the claimant must:\n\u003cul>\n\u003cli>\ngive a written release of the employer and insurer,\n\u003c/li>\u003cli>\ntransfer recovery rights to the insurer, and\n\u003c/li>\u003cli>\ncooperate.\n \u003ccite>[WC 00 03 11 A, D]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\nIf the claimant sues instead, the duty to pay ends; the employee may effectively choose common-law remedies. \u003ccite>[WC 00 03 11 A, D; IRMI]\u003c/cite>\n\u003c/li>\u003cli>\nPart Two employers liability applies as though the schedule state were listed in 3.A. \u003ccite>[WC 00 03 11 A, F]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Premium Computation\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cstrong>Manual premium\u003c/strong> = (payroll ÷ 100) × rate for each classification. Rates are stated \"per $100 of payroll.\" \u003ccite>[NCRB Basic Manual Rule 5; IRMI \"manual premium\"]\u003c/cite>\n\u003cul>\n\u003cli>\nExample: $250,000 payroll at a $4.00 rate = 2,500 × $4.00 = $10,000.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Experience modification\u003c/strong>: compares the employer's actual losses with the expected losses for its classes and payroll. \u003ccite>[Pinnacol; EMC]\u003c/cite> The mod is usually based on 3 years of experience, excluding the most recent completed policy year. \u003ccite>[Pinnacol; EMC]\u003c/cite>\n\u003cul>\n\u003cli>\nA mod of 1.00 is average, under 1.00 is a credit, and over 1.00 is a debit. \u003ccite>[Pinnacol; EMC; IRMI \"experience modification\"]\u003c/cite>\n\u003c/li>\u003cli>\nStandard premium = manual premium adjusted by the experience mod. Example: $10,000 × 0.85 = $8,500. \u003ccite>[IRMI \"standard premium\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>Premium discount\u003c/strong>: a volume discount reflecting lower expense ratios on larger policies. It is applied after experience rating, to standard premium, at graduated rates. In the Michigan Placement Facility, discount applies only when total standard premium exceeds $10,000 (0% on the first $10,000, then 5.1% / 6.5% / 7.5% bands). Voluntary-market insurers file their own discount tables. It is not available with retrospective rating. \u003ccite>[IRMI \"premium discount\"]\u003c/cite>\n\u003c/li>\u003cli>\n\u003cstrong>Audit\u003c/strong>: payroll audit after expiration sets the earned (final) premium. \u003ccite>[IRMI \"payroll audit\"; WC 00 00 00 C Part Five G]\u003c/cite>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\n\u003cstrong>2026 maximum weekly rate ($1,201; SAWW $1,333.88)\u003c/strong>:\n\u003cul>\n\u003cli>\nmichigan.gov blocked direct download (403), so the figure comes from the search-engine snippet of the official 2026 rate book plus a law-firm post dated Feb. 12, 2026. The figure is consistent with the §355 formula.\n\u003c/li>\u003cli>\nIt applies to injuries in calendar 2026 only, and the maximum changes every January 1.\n\u003c/li>\u003cli>\nAvoid exam reliance on the specific dollar figure.\n\u003c/li>\u003c/ul>\n\u003c/li>\u003cli>\n\u003cstrong>EL standard limits\u003c/strong> (100k/500k/100k): verified in the NC Rate Bureau Basic Manual (an NCCI-style manual). Michigan WC data and experience mods are handled by CAOM, not NCCI. The NCCI policy form is used nationally, but I did not see a Michigan-specific manual rule on EL limits.\n\u003c/li>\u003cli>\n\u003cstrong>Premium discount threshold\u003c/strong>: the $5,000 figure is from IRMI and NCCI-style practice. Thresholds vary by state (e.g., Massachusetts uses $10,000). Michigan is a loss-cost state where insurers file their own rates and discounts. Treat the $5,000 figure as conceptual.\n\u003c/li>\u003cli>\n\u003cstrong>Experience mod period\u003c/strong> (3 years, excluding the most recent year): from carrier explainers (Pinnacol/EMC), not CAOM's Michigan plan. The Michigan specifics were not verified.\n\u003c/li>\u003cli>\n\u003cstrong>WC policy cancellation\u003c/strong>: the policy says at least 10 days' notice, \"changed to comply\" with any conflicting state law. Michigan-specific WC cancellation rules were not researched.\n\u003c/li>\u003cli>\n\u003cstrong>Jones Act citation\u003c/strong>: the outline cites 46 USC 688, which was recodified in 2006 as 46 USC 30104.\n\u003c/li>\u003cli>\n\u003cstrong>Placement Facility statutes\u003c/strong>: the board composition and rating plans are from MCL 500.2310 and 500.2312. I could not retrieve every section of 500.2301 et seq. (several section numbers returned no text, possibly repealed or unused).\n\u003c/li>\u003c/ul>\u003c/div>"},{"id":"other","title":"Other Coverages & Options","weight":"4% · 6 items","secs":["other"],"html":"\u003ch3>Umbrella / Excess Liability (Personal and Commercial)\u003c/h3>\n\u003cul>\n\u003cli>\nUmbrella functions: (1) excess limits when underlying limits are exhausted; (2) drops down when underlying aggregate limits are exhausted; (3) covers some claims not covered by underlying policies, subject to a self-insured retention. \u003ccite>[IRMI glossary \"umbrella liability policy\"]\u003c/cite>\n\u003c/li>\u003cli>\nExcess (\"follow form\") policies generally follow the underlying policy's terms and don't broaden coverage. \u003ccite>[IRMI glossary \"follow form\"]\u003c/cite>\n\u003c/li>\u003cli>\nPersonal umbrella sits over homeowners/auto/watercraft liability; commercial umbrella over CGL, auto, employers liability — required underlying limits are set by the insurer (no standard). \u003ccite>[IRMI article \"Plugging Liability Insurance Gaps with the Personal Umbrella Policy\"; see Flags]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Specialty Liability\u003c/h3>\n\u003cul>\n\u003cli>\nE&amp;O: protects against liability for an error or omission in performance of professional duties; designed for financial loss rather than BI/PD. \u003ccite>[IRMI glossary \"errors and omissions insurance\"]\u003c/cite>\n\u003c/li>\u003cli>\nD&amp;O: Side A covers directors/officers directly when the organization can't or won't indemnify; Side B (corporate reimbursement) reimburses the organization for indemnifying D&amp;Os; Side C (entity coverage) covers the organization itself, typically for securities claims. \u003ccite>[IRMI glossary \"Side A coverage\", \"corporate reimbursement coverage\", \"entity securities coverage\"]\u003c/cite>\n\u003c/li>\u003cli>\nFiduciary liability: liability of trustees, employers, fiduciaries and administrators for errors in administering employee benefit plans under ERISA; usually excluded from CGL; separate from the ERISA fidelity bond. \u003ccite>[IRMI glossary \"fiduciary liability\"; IRMI \"Fiduciary Liability Insurance Basics\"]\u003c/cite>\n\u003c/li>\u003cli>\nERISA fidelity bond: every fiduciary/person handling plan funds must be bonded for at least 10% of funds handled, minimum $1,000, maximum $500,000 ($1,000,000 for plans holding employer securities); protects the plan against fraud or dishonesty. \u003ccite>[29 U.S.C. 1112(a)]\u003c/cite>\n\u003c/li>\u003cli>\nEPLI: liability coverage for wrongful acts arising from the employment process (e.g., discrimination, harassment, wrongful termination). \u003ccite>[IRMI glossary \"employment practices liability insurance\"]\u003c/cite>\n\u003c/li>\u003cli>\nLiquor liability (CG 00 33): covers injury for which the insured is liable by reason of selling, serving or furnishing alcoholic beverages; CGL liquor exclusion applies only to insureds in the business of manufacturing, distributing, selling, serving or furnishing alcohol (host liquor stays covered). \u003ccite>[ISO CG 00 33 04 13, Sec. I 1.a; CG 00 01 04 13, Excl. c]\u003c/cite>\n\u003c/li>\u003cli>\nMichigan: retail liquor licensees must file proof of financial responsibility (dram shop) of not less than $50,000 — liquor liability insurance, bond, cash/securities, or group self-insurance pool; licensee may cancel only on 30 days' notice to the commission with replacement proof. \u003ccite>[MCL 436.1803(1), (4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Surety Bonds\u003c/h3>\n\u003cul>\n\u003cli>\nBond = written instrument by a principal (bidder/contractor) and a surety to assure fulfillment of the principal's obligations to a third party, the obligee; if obligations aren't met, the bond pays the obligee's loss to the extent stipulated. \u003ccite>[FAR 48 CFR 28.001 \"Bond\"]\u003c/cite>\n\u003c/li>\u003cli>\nBid guarantee/bond: assures the bidder will not withdraw its bid within the acceptance period and will sign the contract and furnish required bonds. Performance bond: secures performance of the contract. Payment bond: assures payment to persons supplying labor or material. \u003ccite>[FAR 48 CFR 28.001]\u003c/cite>\n\u003c/li>\u003cli>\nSurety vs insurance: three-party contract; surety is secondarily liable and underwrites expecting no losses; the principal must reimburse (indemnify) the surety. \u003ccite>[surety.org \"What is a Surety Bond?\"; SFAA/AGC Surety Claims Guide; IRMI]\u003c/cite>\n\u003c/li>\u003cli>\nCommercial surety examples: license and permit bonds, court (judicial) bonds, fiduciary bonds — protect the public/obligees, often required for licensing or by courts. \u003ccite>[surety.org \"What is a Surety Bond?\"]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Surplus Lines (Michigan Surplus Lines Insurance Act, MCL 500.1901–.1955)\u003c/h3>\n\u003cul>\n\u003cli>\n\"Eligible unauthorized insurer\" = insurer not authorized in Michigan but eligible to write under chapter 19; \"surplus lines insurance\" = insurance procured from or continued/renewed with an unauthorized insurer (solicited, issued, negotiated, or premiums remitted in Michigan). \u003ccite>[MCL 500.1903(1)(a),(d)]\u003c/cite>\n\u003c/li>\u003cli>\nNo one may solicit, bind or act as agent/broker for surplus lines without a license under chapter 19 and 500.1206a; license requires application, exam (waivable if licensed within prior 12 months), and compliance with 500.1204–.1206. \u003ccite>[MCL 500.1905(1),(3)]\u003c/cite>\n\u003c/li>\u003cli>\nLicensee must file sworn statements by February 15 and August 15 (for 6-month periods ending Dec 31 and June 30) and pay 2% premium tax plus 0.5% regulatory fee. \u003ccite>[MCL 500.1905(3)(d)]\u003c/cite>\n\u003c/li>\u003cli>\nBefore placement, licensee must tell the insured coverage is with an insurer not licensed in Michigan and payment of loss may not be guaranteed if it becomes insolvent. \u003ccite>[MCL 500.1905(5)]\u003c/cite>\n\u003c/li>\u003cli>\nInsurance may not be placed with an unauthorized insurer if available from an authorized insurer; rebuttable presumption of availability for no-fault auto, private passenger auto physical damage, owner-occupied homeowners within MBPIA limits, workers comp (not partially self-insured), and any coverage readily available from 3 or more authorized insurers. \u003ccite>[MCL 500.1910(1)-(2)]\u003c/cite>\n\u003c/li>\u003cli>\nPresumed unavailable: risks where only part is acceptable to admitted insurers, and coverage the licensee can't procure after diligent search among authorized insurers; commissioner keeps a list of lines generally unavailable (export list), published at least quarterly, acting on add/remove requests within 30 days. \u003ccite>[MCL 500.1910(3)-(4)]\u003c/cite>\n\u003c/li>\u003cli>\nWritten evidence (policy, binder, certificate) must be delivered within 30 days after binding when acting on prior written authority or a communication of coverage. \u003ccite>[MCL 500.1912]\u003c/cite>\n\u003c/li>\u003cli>\nFees: surplus lines fee only if reasonable and not included in premium; for personal lines, fee not to exceed the greater of $100 or 10% of premium; fees disclosed in writing before sale and itemized; fees not taxed as premium. \u003ccite>[MCL 500.1915]\u003c/cite>\n\u003c/li>\u003cli>\nPremium paid to licensee (or authorized resident agent) is deemed paid to the insurer. \u003ccite>[MCL 500.1916-.1917]\u003c/cite>\n\u003c/li>\u003cli>\nEligibility of insurer: stable, unimpaired financial condition; Add: 'Since the NRRA (15 U.S.C. 8204), states may not apply other eligibility criteria to U.S. nonadmitted insurers than the NAIC model's (capital and surplus of the greater of the home-state minimum or $15,000,000); alien insurers on the NAIC Quarterly Listing are eligible.'; must appoint the commissioner as agent for service of process. \u003ccite>[MCL 500.1920(4); 500.1921(1)-(3)]\u003c/cite>\n\u003c/li>\u003cli>\nRequired notice on the face of each policy/cover note, in red ink, at least 10-point type: \"This insurance has been placed with an insurer that is not licensed by the state of Michigan. In case of insolvency, payment of claims may not be guaranteed.\" \u003ccite>[MCL 500.1922]\u003c/cite>\n\u003c/li>\u003cli>\nRates of unauthorized insurers are not regulated except they may not be unfairly discriminatory; forms may not misrepresent the policy. \u003ccite>[MCL 500.1904]\u003c/cite>\n\u003c/li>\u003cli>\nPlacement with a non-eligible unauthorized insurer is allowed only after attempts with authorized then eligible insurers (unless the insured insists), with a special notice to the insured. \u003ccite>[MCL 500.1950]\u003c/cite>\n\u003c/li>\u003cli>\nInsureds who self-procure from an unauthorized insurer must report to the commissioner within 30 days and pay 2% tax + 0.5% regulatory fee. \u003ccite>[MCL 500.1951]\u003c/cite>\n\u003c/li>\u003cli>\nKnowing and willful violation: misdemeanor, up to 1 year and/or $1,000 fine. \u003ccite>[MCL 500.1952]\u003c/cite>\n\u003c/li>\u003cli>\nA person licensed for surplus lines in his or her home state receives a Michigan nonresident surplus lines license. \u003ccite>[MCL 500.1206a(4)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>National Flood Insurance Program (NFIP)\u003c/h3>\n\u003cul>\n\u003cli>\nSFIP is available from NFIP Direct (FEMA's servicing arm) or Write Your Own (WYO) companies — private P&amp;C insurers that write and service flood policies in their own names while the federal government pays all losses; coverage is the same either way. \u003ccite>[FEMA brochure \"Federal Disaster Assistance: Meeting the Flood Insurance Requirement\" (07-2024); agents.floodsmart.gov \"Flood Insurance 101\"]\u003c/cite>\n\u003c/li>\u003cli>\n\"Flood\" = general and temporary condition of partial or complete inundation of two or more acres of normally dry land area or of two or more properties (one of which is the insured's), from overflow, runoff, mudflow, etc. \u003ccite>[44 CFR Pt. 61 App. A(1), II.B.1]\u003c/cite>\n\u003c/li>\u003cli>\nSFIP coverages: A Building Property; B Personal Property; C Other Coverages (e.g., debris removal; property removed to safety up to $1,000 of expenses and 45 days at the safe location); D Increased Cost of Compliance. \u003ccite>[44 CFR Pt. 61 App. A(1), III]\u003c/cite>\n\u003c/li>\u003cli>\nBuilding: single-family and 2-4 family $250,000; other residential (5+ units) $500,000; residential condo building $250,000 x units; non-residential $500,000. Contents: residential $100,000; non-residential $500,000.; building and contents bought separately, each with its own deductible. \u003ccite>[FEMA brochures (07-2024; Commercial Summary of Coverage 01-2024)]\u003c/cite>\n\u003c/li>\u003cli>\nICC: up to $30,000 to elevate, demolish, relocate or floodproof after substantial/repetitive damage — paid in addition to the building claim but building + ICC cannot exceed the building maximum. \u003ccite>[44 CFR Pt. 61 App. A(1) III.D; FEMA Commercial Summary of Coverage (01-2024)]\u003c/cite>\n\u003c/li>\u003cli>\nResidential minimum deductibles (Risk Rating 2.0): $1,000 if building coverage $100,000 or less; $1,250 if over $100,000; pre-FIRM statutorily discounted buildings $1,500 / $2,000; contents $1,000. \u003ccite>[FEMA \"Simple Guide for Residential Manufactured/Mobile Homes\" (RR2.0), citing FIM Sec. 3]\u003c/cite>\n\u003c/li>\u003cli>\nWaiting period: typically 30 days; exceptions — purchase in connection with making, increasing, extending or renewing a loan; additional coverage on a renewal bill; building newly mapped into an SFHA (purchase within 13 months after map revision); burned federal land flooding (1-day if bought within 60 days of fire containment). \u003ccite>[agents.floodsmart.gov \"Flood Insurance 101\"]\u003c/cite>\n\u003c/li>\u003cli>\nBasements: building and contents coverage below the lowest elevated floor / in basements is limited to listed items. \u003ccite>[44 CFR Pt. 61 App. A(1), III.A.8, III.B.5]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Other Policies\u003c/h3>\n\u003cul>\n\u003cli>\nBoatowners policy: most common watercraft policy for individuals; combines property, liability, medical payments and uninsured boaters coverage; fills gaps in homeowners watercraft coverage. \u003ccite>[IRMI glossary \"boatowners policy\"]\u003c/cite>\n\u003c/li>\u003cli>\nMiscellaneous (recreational) type vehicles: motorcycles, motor homes, golf carts, snowmobiles, ATVs are added to a personal auto policy by the Miscellaneous Type Vehicle endorsement (PP 03 23) — see auto area for details. \u003ccite>[ISO PP 03 23 (auto area research); see Flags]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Alternative Funding Mechanisms\u003c/h3>\n\u003cul>\n\u003cli>\nSelf-insurance: formal decision to retain risk and fund losses from a set-aside fund instead of paying premium. \u003ccite>[IRMI glossary \"self-insurance\"]\u003c/cite>\n\u003c/li>\u003cli>\nRisk retention group (Liability Risk Retention Act of 1986): its members are its owners; members engaged in similar or related businesses; chartered/licensed as a liability insurer in one state; may write only liability insurance (no personal-risk liability, no employer's liability except FELA) for members; name must include \"Risk Retention Group.\" \u003ccite>[15 U.S.C. 3901(a)(2),(4)]\u003c/cite>\n\u003c/li>\u003cli>\nRRGs are exempt from most non-domiciliary state laws (chartering state regulates); a state may not require or permit an RRG to participate in its insurance guaranty association; policies must carry a 10-point notice that \"State insurance insolvency guaranty funds are not available for your risk retention group.\" \u003ccite>[15 U.S.C. 3902(a)]\u003c/cite>\n\u003c/li>\u003cli>\nPurchasing group: group of members with similar liability exposures that buys liability insurance on a group basis for its members only. \u003ccite>[15 U.S.C. 3901(a)(5)]\u003c/cite>\n\u003c/li>\u003c/ul>\n\u003ch3>Cyber\u003c/h3>\n\u003cul>\n\u003cli>\nFirst-party cyber covers the insured's own costs: legal counsel on notification duties, customer notification and call center, forensic investigation, business interruption income loss, cyber extortion and fraud. \u003ccite>[NAIC \"Cyber Insurance\" consumer guide]\u003c/cite>\n\u003c/li>\u003cli>\nThird-party cyber covers liability to others: claims by affected consumers, regulatory inquiry response. There are no standardized cyber policy forms. \u003ccite>[NAIC \"Cyber Insurance\" consumer guide; NAIC RITF memo (2022)]\u003c/cite>\n\u003c/li>\u003cli>\nCGL CG 00 01 excludes electronic data damages (except BI) and P&amp;AI from TCPA/CAN-SPAM/FCRA violations. \u003ccite>[ISO CG 00 01 04 13, Excl. p, q]\u003c/cite>\n\u003c/li>\u003c/ul>\u003cdiv class=\"flags\">\u003ch4>Watch-outs: changing values &amp; source notes\u003c/h4>\u003cul>\n\u003cli>\nNFIP: current FEMA Flood Insurance Manual could not be downloaded (Access Denied); deductibles taken from FEMA RR2.0 residential manufactured/mobile home guide — verify against current FIM Sec. 3. Limits ($250k/$100k; $500k/$500k) and ICC $30,000 are statutory/long-standing but subject to change. GFIP amounts change annually (not tested).\n\u003c/li>\u003cli>\nSurplus lines: Michigan statute states a 2% tax + 0.5% fee; the federal Nonadmitted and Reinsurance Reform Act (2010) home-state rules were not reviewed.\n\u003c/li>\u003cli>\nUmbrella required-underlying limits and personal umbrella terms are insurer-specific (no standard form reviewed).\n\u003c/li>\u003cli>\nMiscellaneous type vehicle endorsement details belong to auto research; not independently verified here.\n\u003c/li>\u003cli>\nSurety \"expects no losses\" characterization is from IRMI/SFAA commentary (economic distinction), not a statute.\n\u003c/li>\u003c/ul>\u003c/div>"}],"meta":{"verified":"October 12, 2026","sourcesNote":"Michigan Compiled Laws (Insurance Code of 1956, Act 218; Workers' Disability Compensation Act, Act 317 of
