raisers cannot agree on an umpire within 15 days. Who may select the umpire?","choices":["The Director of the Department of Insurance and Financial Services, at either party's request","The insurer, subject to the insured's approval","A circuit court judge in the county where the loss occurred or the property is located","The American Arbitration Association, at the request of either party"],"answer":2,"explain":"MCL 500.2833(1)(m): if the appraisers cannot agree on an umpire within 15 days, either party may ask a circuit court judge in the county where the loss occurred or the property is located to select one. A written agreement signed by any 2 of the 3 sets the loss.","source":"MCL 500.2833(1)(m)"},{"id":"prop-012","topic":"mi","sub":"Appraisal","q":"Under the appraisal provision required by Michigan law, how are appraisal costs paid?","choices":["The insurer pays all appraisal costs, including both appraisers and the umpire","The losing party pays all costs, as determined by the umpire","The insured pays all costs if the award is less than the insurer's last offer","Each party pays its own appraiser; the umpire and other appraisal expenses are split equally"],"answer":3,"explain":"Each appraiser is paid by the party that selected that appraiser. Other appraisal expenses and the umpire's compensation are paid equally by the insured and insurer. Each party must also select its appraiser within 20 days after the written demand.","source":"MCL 500.2833(1)(m)"},{"id":"prop-013","topic":"mi","sub":"Cancellation and Nonrenewal","q":"An insurer issued a new homeowners policy to an eligible person 40 days ago and now wants to terminate it for a reason other than nonpayment. Under the Essential Insurance Act, the termination can be effective no sooner than:","choices":["10 days after the notice is mailed","20 days after the notice is mailed","30 days after the notice is mailed","45 days after the notice is mailed"],"answer":1,"explain":"Generally, termination of home or auto insurance requires at least 30 days' notice stating each specific reason. A notice mailed or delivered within the first 55 days after initial issuance may be effective not less than 20 days after mailing.","source":"MCL 500.2123(1)-(2)"},{"id":"prop-014","topic":"mi","sub":"Cancellation and Nonrenewal","q":"Under MCL 500.3020, a casualty insurance policy (other than workers' compensation or mortgage guaranty) may be canceled by the insurer by mailing the insured a written notice of cancellation of not less than:","choices":["5 days","10 days","20 days","30 days"],"answer":1,"explain":"Section 3020(1)(b) requires not less than 10 days' written notice of cancellation by the insurer. A malpractice policy may be nonrenewed only on not less than 60 days' notice.","source":"MCL 500.3020(1)(b),(d)"},{"id":"prop-015","topic":"mi","sub":"Terrorism Risk Insurance Program","q":"Under the Terrorism Risk Insurance Act as reauthorized in 2019 (current law as of October 2026), which statement is correct?","choices":["The insurer deductible is 20% of the insurer's direct earned premium for the preceding calendar year","The federal share of compensation is 90% of insured losses above the insurer's deductible","The program trigger is $100 million in aggregate industry insured losses","The program is permanent and has no termination date"],"answer":0,"explain":"The insurer deductible is 20% of prior-year direct earned premium. The federal share is 80% (not 90%) and the program trigger is $200 million for 2020 and later. The program terminates December 31, 2027 unless extended; extension bills were pending in October 2026.","source":"TRIA §102(7), §103(e)(1), §108(a), 15 U.S.C. 6701 note"},{"id":"prop-016","topic":"mi","sub":"Terrorism Risk Insurance Program","q":"Under TRIA, an act may NOT be certified as an act of terrorism if the aggregate property and casualty insurance losses resulting from it do not exceed:","choices":["$1 million","$5 million","$100 million","$200 million"],"answer":1,"explain":"TRIA §102(1)(B)(ii) bars certification if aggregate P&C losses do not exceed $5,000,000. $200 million is the separate program trigger for federal payments. (A pending 2026 House bill would raise the $5 million figure to $10 million beginning in 2029.)","source":"TRIA §102(1)(B), 15 U.S.C. 6701 note"},{"id":"prop-017","topic":"mi","sub":"Terrorism Risk Insurance Program","q":"Under TRIA, who certifies that an event is an \"act of terrorism\"?","choices":["The Secretary of Homeland Security, in consultation with the FBI Director and the Secretary of Defense","The President, with the consent of Congress","The Treasury Secretary, in consultation with the Homeland Security Secretary and the Attorney General","The NAIC, in consultation with the insurance commissioners of the affected states"],"answer":2,"explain":"Certification is by the Secretary of the Treasury, in consultation with the Secretary of Homeland Security and the Attorney General. The decision to certify or not certify is final and not subject to judicial review.","source":"TRIA §102(1)(A),(C), 15 U.S.C. 6701 note"},{"id":"prop-018","topic":"mi","sub":"Termination of Authority to Represent Insurer","q":"An insurer terminates a producer's agency contract, and the written agreement says nothing about the producer's authority after termination. Under MCL 500.1209, the producer may:","choices":["Bind new risks and renew existing policies for 30 days after receiving notice of termination","Renew each existing policy one time without insurer approval, but not bind any new risks","Not perform any act on behalf of the insurer, including servicing existing policies, once notice of termination is received","Service existing policies, but not bind new risks, renew, or increase the insurer's obligation without approval"],"answer":3,"explain":"If the agreement does not address the post-termination period, the producer may continue servicing existing policies. The producer may not bind new risks, renew a policy, or increase the insurer's obligation without the insurer's approval. The insurer may not cancel or nonrenew policies because of the producer's termination.","source":"MCL 500.1209(1)"},{"id":"prop-019","topic":"mi","sub":"Termination of Authority to Represent Insurer","q":"An insurer writing home and auto insurance in Michigan may terminate an independent producer's authority to represent it for all of the following reasons EXCEPT:","choices":["Unfavorable loss experience attributable to the geographic location of the producer's business","Submission of fewer than 25 home and auto applications in the preceding 12 months","Malfeasance","Breach of fiduciary duty"],"answer":0,"explain":"MCL 500.1209(2) permits termination for malfeasance, breach of fiduciary duty or trust, violation of the Code, failure to perform the contract, or fewer than 25 applications in 12 months. Subsection (3) forbids termination based primarily on geographic location or location-related loss experience.","source":"MCL 500.1209(2)-(3)"},{"id":"prop-020","topic":"mi","sub":"Essential Insurance Act","q":"Under the Essential Insurance Act, which of the following persons is an \"eligible person\" for home insurance?","choices":["An owner-occupant of a 3-family dwelling","A landlord who owns, but does not live in, a single-family rental house","A homeowner whose property taxes have been delinquent for 3 years","A homeowner convicted of arson 2 years ago"],"answer":0,"explain":"An eligible person for home insurance is an owner-occupant or tenant of a house, condo or co-op unit, room, or apartment, or the owner-occupant of a dwelling of not more than 4 units. A non-occupying owner is not included. Also excluded: arson convictions within the preceding 5 years; property taxes delinquent 2 or more years.","source":"MCL 500.2103(2)"},{"id":"prop-021","topic":"mi","sub":"Essential Insurance Act","q":"Under MCL 500.2117, an insurer's underwriting rules for home insurance may be based on all of the following EXCEPT:","choices":["A dwelling unoccupied more than 60 days with evidence of intent to vacate","The physical condition of the property, based on specific housing and safety code provisions","The age of the dwelling","Failure to correct, after written notice, a physical condition directly related to a paid claim"],"answer":2,"explain":"Physical-condition rules must be objective, related to the insured perils, and based on specific code provisions 'without regard to the age of the structure.' Unoccupancy over 60 days with intent to vacate, and failure to correct a condition after notice, are permitted bases.","source":"MCL 500.2117(2)(b),(c),(g)"},{"id":"prop-022","topic":"mi","sub":"Essential Insurance Act","q":"Under MCL 500.2122, when an applicant who applied orally for home insurance is declined, the insurer or agent must:","choices":["Provide the specific reasons in writing by certified mail within 10 days","Provide reasons only if the applicant files a complaint with DIFS","Refer the applicant to the Michigan Basic Property Insurance Association, with no explanation required","State each specific reason (orally is allowed) and offer a written explanation if requested within 90 days"],"answer":3,"explain":"Each specific reason for a declination must be given. If the request was in writing, the explanation must be in writing. If it was oral, an oral explanation may be given, and a written one must be offered if the applicant requests it within 90 days. Refusing to provide an application form counts as a declination.","source":"MCL 500.2122(1)-(2)"},{"id":"prop-023","topic":"mi","sub":"Essential Insurance Act","q":"Under the Essential Insurance Act, refusing to insure, refusing to continue to insure, or limiting coverage because of the location of the risk is called:","choices":["Rebating","Churning","Twisting","Redlining"],"answer":3,"explain":"MCL 500.2108(8) requires every filing to specify that the insurer will not refuse to insure, refuse to continue to insure, or limit coverage because of the location of the risk. The statute calls that practice redlining and prohibits it.","source":"MCL 500.2108(8)"},{"id":"prop-024","topic":"dwelling","sub":"Characteristics and Purpose","q":"Under the Dwelling Property 1 – Basic Form (DP 00 01 07 88), which perils are covered when NO premium is shown for Extended Coverage or Vandalism and Malicious Mischief?","choices":["Fire, lightning, and internal explosion","Fire, lightning, windstorm, and hail","Fire, lightning, and vandalism","All risks of direct physical loss except those excluded"],"answer":0,"explain":"DP-1 covers fire or lightning and internal explosion. Paying the Extended Coverage premium adds windstorm or hail, explosion, riot or civil commotion, aircraft, vehicles, smoke, and volcanic eruption. V&MM is a separate optional premium.","source":"ISO DP 00 01 07 88, Perils Insured Against 1A-1B, 2-9"},{"id":"prop-025","topic":"dwelling","sub":"Property Coverages","q":"Under the Dwelling Property 3 – Special Form (DP 00 03 12 02), which statement about the perils insured against is correct?","choices":["Coverages A, B, and C are all written on an open-perils basis","Coverage A is open perils, while Coverages B and C are basic named perils","Coverages A and B are open perils, and Coverage C is named perils","All coverages are named perils, but theft is included"],"answer":2,"explain":"DP-3 insures Coverages A and B against risk of direct physical loss unless excluded. Coverage C personal property is covered only for the listed broad named perils, which do not include theft.","source":"ISO DP 00 03 12 02, Perils Insured Against A-B","noShuffle":true},{"id":"prop-026","topic":"dwelling","sub":"Selected Endorsements - Broad Theft Coverage","q":"A landlord insures a rental dwelling she does not occupy under a DP-3 policy and wants theft coverage for her appliances and furnishings in the building. Which endorsement is appropriate under ISO dwelling program rules?","choices":["Broad Theft Coverage (DP 04 72), on- and off-premises","Personal Liability Supplement (DL 24 01)","Limited Theft Coverage (DP 04 73), on-premises only","No endorsement is needed, because DP-3 Coverage C includes theft"],"answer":2,"explain":"Broad Theft (DP 04 72) is for owner-occupied dwellings and tenant named insureds, and may include off-premises coverage. Non-owner-occupied risks use Limited Theft Coverage (DP 04 73), on-premises only. The DP-3's own Coverage C perils do not include theft.","source":"ISO Dwelling Policy Program Manual Rule 510.A; ISO DP 00 03 12 02, Coverage C perils"},{"id":"prop-027","topic":"dwelling","sub":"Selected Endorsements - Broad Theft Coverage","q":"Under ISO dwelling program rules for Broad Theft Coverage, off-premises theft coverage:","choices":["May be purchased without on-premises coverage, at any limit the insured selects","Is available only for non-owner-occupied dwellings rented to tenants","Is automatically included at 10% of the Coverage C limit","Is available only with on-premises coverage, at a limit no greater than the on-premises limit"],"answer":3,"explain":"Off-premises coverage is available only when on-premises coverage is purchased. Its limit may not be greater than the on-premises limit. The manual's minimum limit is $1,000 each.","source":"ISO Dwelling Policy Program Manual Rule 510.A.1"},{"id":"prop-028","topic":"dwelling","sub":"Property Coverages","q":"An owner-occupant has a DP-3 (DP 00 03 12 02). A covered fire forces her family to live in a hotel. Which coverage pays the necessary increase in living expenses?","choices":["Coverage E – Additional Living Expense","Coverage C – Personal Property","Coverage D – Fair Rental Value","Coverage B – Other Structures"],"answer":0,"explain":"In the dwelling forms, Coverage D is Fair Rental Value (for the part rented to others) and Coverage E is Additional Living Expense. The DP-3 also provides up to 20% of Coverage A as additional insurance for D and E combined.","source":"ISO DP 00 03 12 02, Coverages D-E; Other Coverage 5"},{"id":"prop-029","topic":"dwelling","sub":"Conditions","q":"Under the ISO dwelling forms (DP-1 and DP-2 in the 07 88 edition, DP-3 in the 12 02 edition), which form settles losses to the dwelling on an actual cash value basis rather than replacement cost?","choices":["DP-3 Special Form","DP-2 Broad Form","DP-1 Basic Form","DP-2 and DP-3 Forms"],"answer":2,"explain":"The DP-1 settles covered losses at actual cash value, but not more than the cost to repair or replace. DP-2 and DP-3 pay replacement cost on buildings if insurance is at least 80% of replacement cost.","source":"ISO DP 00 01 07 88, Cond. 5; ISO DP 00 02 07 88 and DP 00 03 12 02, Loss Settlement"},{"id":"prop-030","topic":"dwelling","sub":"Personal Liability Supplement","q":"The Personal Liability Supplement (DL 24 01) added to a dwelling policy provides:","choices":["Coverage E – Personal Liability and Coverage F – Medical Payments to Others","Coverage L – Loss of Use and Coverage M – Mortgagee Interest","Coverage D – Fair Rental Value and Coverage E – Additional Living Expense","Coverage L – Personal Liability and Coverage M – Medical Payments to Others"],"answer":3,"explain":"The dwelling forms contain no liability coverage. The Personal Liability Supplement adds Coverage L – Personal Liability and Coverage M – Medical Payments to Others. Its terms mirror Homeowners Section II, for example medical expenses incurred within 3 years and $1,000 damage to property of others.","source":"ISO DL 24 01 12 02, Coverages L-M"},{"id":"prop-031","topic":"dwelling","sub":"Selected Endorsements - Dwelling Under Construction","q":"Under the Dwelling Under Construction endorsement (DP 11 43), the Coverage A limit shown in the declarations is:","choices":["Provisional; the amount of insurance on any date is that limit times the ratio of actual to completed value","Fixed at the dwelling's full completed value from inception, regardless of construction progress","Limited to the cost of materials delivered to the site, excluding the value of labor performed","Reduced by 50% until a certificate of occupancy is issued for the completed dwelling"],"answer":0,"explain":"DP 11 43 makes the Coverage A limit provisional. The actual amount of insurance on any date is that percentage of the provisional amount equal to the ratio of actual value to completed value. Premium is based on the average amount of insurance, and occupancy is permitted for 30 days after completion.","source":"ISO DP 11 43 12 02"},{"id":"prop-032","topic":"dwelling","sub":"Selected Endorsements - Automatic Increase in Insurance","q":"The Automatic Increase in Insurance endorsement (DP 04 11) attached to a dwelling policy:","choices":["Increases Coverage A and B limits annually by the percentage shown, applied pro rata over the policy period","Increases the Coverage C limit by 10% after each paid loss, up to the amount of the Coverage A limit","Automatically restores the policy limits after a paid loss, without an additional premium","Increases all coverage limits to the dwelling's full replacement cost at each annual renewal"],"answer":0,"explain":"DP 04 11 increases the declared Coverage A and B limits annually by the percentage shown in the policy, applied pro rata during the policy period.","source":"ISO DP 04 11 12 02","noShuffle":true},{"id":"prop-033","topic":"ho","sub":"Coverage Forms","q":"Which homeowners form covers the dwelling, other structures, AND personal property on an open-perils (special) basis?","choices":["HO-2 Broad Form","HO-3 Special Form","HO-5 Comprehensive Form","HO-8 Modified Coverage Form"],"answer":2,"explain":"HO-5 insures Coverages A, B, and C against risk of direct physical loss unless excluded. HO-3 is open perils on A and B but named perils on C. HO-2 and HO-8 are named perils.","source":"ISO HO 00 05 10 00, Sec. I Perils; ISO HO 00 03 05 11, Sec. I Perils"},{"id":"prop-034","topic":"ho","sub":"Coverage Forms","q":"Under the HO-6 Unit-Owners Form (HO 00 06 05 11), Coverage A – Dwelling covers:","choices":["The entire condominium building, including the roof, the common areas, and every other owner's unit","Nothing; HO-6 has no Coverage A, so every building item falls under the association's master policy","Only the unit owner's personal property, such as furniture, clothing, and electronics kept inside the unit","Unit alterations, appliances, fixtures, and improvements, and property the owner must insure under the association agreement"],"answer":3,"explain":"HO-6 Coverage A covers alterations, appliances, fixtures, and improvements within the unit, real property pertaining exclusively to the unit, property that is the owner's responsibility under the association agreement, and structures solely owned at the location.","source":"ISO HO 00 06 05 11, Sec. I Coverage A"},{"id":"prop-035","topic":"ho","sub":"Coverage Forms","q":"Under the HO-8 Modified Coverage Form (HO 00 08 10 00 edition), theft coverage is:","choices":["Unlimited, and covered both on and off the residence premises","Limited to 10% of Coverage C when off the residence premises","Excluded entirely","Limited to $1,000 per loss, on the residence premises only"],"answer":3,"explain":"HO-8's Theft peril excludes theft off the residence premises and limits recovery to $1,000 in any one loss caused by theft. Property in a bank, safe deposit company, or public warehouse is considered on the residence premises.","source":"ISO HO 00 08 10 00, Sec. I Perils 9; PF&M ISO Homeowners Optional Endorsements (2014), HO 04 30"},{"id":"prop-036","topic":"ho","sub":"Coverage Forms","q":"Under the HO-8 (HO 00 08 10 00), if the insured repairs a damaged older home at the same site within 180 days, the insurer pays the lesser of the limit or the amount actually spent, but no more than:","choices":["The cost of using common, functionally equivalent construction materials and methods","The original construction cost of the home, adjusted for inflation to the date of loss","The market value of the home, including the land, at the time of the loss","80% of the cost to replace the home with materials of like kind and quality"],"answer":0,"explain":"HO-8's building loss settlement is designed for homes whose replacement cost greatly exceeds market value. It pays repair costs with common, functionally equivalent materials and methods. If the insured does not repair, it pays the least of the limit, market value excluding land, or ACV.","source":"ISO HO 00 08 10 00, Sec. I Cond. C.2"},{"id":"prop-037","topic":"ho","sub":"Definitions","q":"Under the HO-3 (HO 00 03 05 11) definition of \"insured,\" which of the following is an insured?","choices":["The named insured's 25-year-old son who moved out to attend graduate school full time","The named insured's 22-year-old daughter, a full-time college student who lived at home before leaving for school","A 30-year-old roommate who is not related to the named insured but shares the household expenses","The named insured's sister who lives in her own home across town and visits on weekends"],"answer":1,"explain":"\"Insured\" includes a full-time student who was a household resident before leaving for school, if under 24 and a relative, or under 21 and in an insured's care. The 25-year-old is too old. An unrelated adult roommate and a relative in her own household are not insureds.","source":"ISO HO 00 03 05 11, Definitions B.5"},{"id":"prop-038","topic":"ho","sub":"Definitions","q":"Under the HO-3 (HO 00 03 05 11), an activity engaged in for compensation is NOT considered a \"business\" if no insured received more than what amount of total compensation for it in the 12 months before the policy period?","choices":["$1,000","$2,000","$2,500","$5,000"],"answer":1,"explain":"The 2011 \"business\" definition excludes activities for which no insured receives more than $2,000 in total compensation in the 12 months before the policy period. It also excludes volunteer work and certain home day care: mutual exchange, or care for a relative.","source":"ISO HO 00 03 05 11, Definitions B.3"},{"id":"prop-039","topic":"ho","sub":"Section I - Coverage B","q":"Under the HO-3 (HO 00 03 05 11), Coverage B – Other Structures:","choices":["Is limited to 10% of Coverage A, and using it reduces the Coverage A limit","Is limited to 20% of Coverage A, as additional insurance","Is limited to 10% of Coverage A, and using it does not reduce the Coverage A limit","Covers a detached garage the insured rents to a neighbor to store a business inventory"],"answer":2,"explain":"Coverage B is limited to 10% of the Coverage A limit, and its use does not reduce Coverage A. Coverage B excludes structures from which a business is conducted, and structures rented to non-tenants unless used solely as a private garage.","source":"ISO HO 00 03 05 11, Sec. I Coverage B"},{"id":"prop-040","topic":"ho","sub":"Section I - Coverage C","q":"An HO-3 (HO 00 03 05 11) insured has a $100,000 Coverage C limit. Personal property usually kept at the insured's vacation cottage (not the residence premises) is destroyed by a covered fire. The most the policy will pay is:","choices":["$1,000","$5,000","$10,000","$100,000"],"answer":2,"explain":"Property usually located at an insured's residence other than the residence premises is limited to 10% of Coverage C or $1,000, whichever is greater. 10% of $100,000 is $10,000. The same limit applies to property in a self-storage facility.","source":"ISO HO 00 03 05 11, Sec. I Coverage C.2"},{"id":"prop-041","topic":"ho","sub":"Section I - Coverage C Special Limits","q":"A burglar steals $4,000 of jewelry from an HO-3 (HO 00 03 05 11) insured's home. Ignoring the deductible, the policy will pay:","choices":["$1,000","$1,500","$2,500","$4,000"],"answer":1,"explain":"Jewelry, watches, furs, and precious and semiprecious stones have a $1,500 special limit for loss by theft. If the same jewelry were destroyed by fire, the special limit would not apply.","source":"ISO HO 00 03 05 11, Sec. I Coverage C.3.e"},{"id":"prop-042","topic":"ho","sub":"Section I - Coverage C Special Limits","q":"Under the HO-3 (HO 00 03 05 11) special limits of liability, which statement is correct?","choices":["Money, bank notes, and coins are limited to $500","Watercraft, including trailers and outboard motors, is limited to $2,500","Business property on the residence premises is limited to $1,500","Theft of firearms is limited to $2,500"],"answer":3,"explain":"The HO-3 05 11 special limits are: money $200; theft of firearms $2,500; business property on premises $2,500 (off premises $1,500); watercraft $1,500.","source":"ISO HO 00 03 05 11, Sec. I Coverage C.3"},{"id":"prop-043","topic":"ho","sub":"Section I - Coverage C","q":"Which of the following is NOT covered as personal property under Coverage C of the HO-3 (HO 00 03 05 11)?","choices":["The insured's pet dog","A riding lawn mower, not required to be registered, used solely to service the residence","A guest's luggage while in the insured's home","A model airplane not designed to carry people or cargo"],"answer":0,"explain":"Coverage C does not cover animals, birds, or fish. A non-registered motor vehicle used solely to service the residence, a guest's property in a residence occupied by an insured (at the insured's request), and model or hobby aircraft are covered.","source":"ISO HO 00 03 05 11, Sec. I Coverage C.1, C.4"},{"id":"prop-044","topic":"ho","sub":"Section I - Coverage D","q":"A covered fire next door causes the civil authority to prohibit an HO-3 insured from using his undamaged home. Under the HO-3 (HO 00 03 05 11), Coverage D pays additional living expense and fair rental value for no more than:","choices":["72 hours","1 week","2 weeks","30 days"],"answer":2,"explain":"Civil Authority Prohibits Use covers ALE and fair rental value for no more than two weeks when a civil authority prohibits use because of direct damage to neighboring premises by a Peril Insured Against.","source":"ISO HO 00 03 05 11, Sec. I Coverage D.3"},{"id":"prop-045","topic":"ho","sub":"Section I - Additional Coverages","q":"Under the HO-3 (HO 00 03 05 11) additional coverage for Trees, Shrubs and Other Plants, which statement is correct?","choices":["The limit is 10% of Coverage A, up to $1,000 for any one tree, shrub or plant","The limit is 5% of Coverage A, up to $500 for any one tree, shrub or plant","Windstorm is a covered peril for trees, shrubs and plants","Trees grown for business purposes are covered"],"answer":1,"explain":"Trees, shrubs, plants, and lawns are covered up to 5% of the Coverage A limit, no more than $500 per tree. The covered perils are fire or lightning, explosion, riot, aircraft, non-resident vehicles, V&MM, and theft. Windstorm and property grown for business are not covered.","source":"ISO HO 00 03 05 11, Sec. I Add'l Cov. E.3"},{"id":"prop-046","topic":"ho","sub":"Section I - Additional Coverages","q":"Under the HO-3 (HO 00 03 05 11), the Ordinance or Law additional coverage lets the insured use up to what amount for increased costs due to enforcement of building ordinances after a covered loss?","choices":["5% of Coverage A","10% of Coverage C","10% of Coverage A","$2,500"],"answer":2,"explain":"The insured may use up to 10% of the Coverage A limit for increased costs from enforcing an ordinance or law, including related debris removal. This coverage is additional insurance. It does not cover loss in value or pollutant cleanup costs.","source":"ISO HO 00 03 05 11, Sec. I Add'l Cov. E.11"},{"id":"prop-047","topic":"ho","sub":"Perils Insured Against","q":"An HO-3 (HO 00 03 05 11) dwelling has been vacant for 75 consecutive days when vandals break windows and spray-paint the walls. How is the vandalism loss to the dwelling treated?","choices":["Covered in full, because vandalism is a named peril with no vacancy limit","Covered only if the dwelling was under construction","Covered at 50% of the loss, as the policy's penalty for vacancy","Not covered, because the dwelling had been vacant for more than 60 consecutive days"],"answer":3,"explain":"HO-3 Coverages A and B exclude vandalism and malicious mischief, and any ensuing loss from the wrongful act, if the dwelling has been vacant for more than 60 consecutive days immediately before the loss. A dwelling being constructed is not considered vacant.","source":"ISO HO 00 03 05 11, Sec. I Perils A.2.c(4)"},{"id":"prop-048","topic":"ho","sub":"Exclusions","q":"All of the following are Section I exclusions in the HO-3 (HO 00 03 05 11) EXCEPT:","choices":["Accidental discharge of water from within a plumbing system on the residence premises","Earthquake","Water that backs up through sewers or drains","Neglect of an insured to use all reasonable means to save property at and after a loss"],"answer":0,"explain":"Sewer or drain backup (Water exclusion), earth movement, and neglect are Section I exclusions. Accidental discharge or overflow of water from a plumbing, heating, air conditioning, or sprinkler system or a household appliance is covered, including necessary tear-out.","source":"ISO HO 00 03 05 11, Sec. I Excl. A.2, A.3, A.5; Sec. I Perils A.2.c Exception"},{"id":"prop-049","topic":"ho","sub":"Conditions - Loss Settlement","q":"An HO-3 (HO 00 03 05 11) dwelling has a replacement cost of $300,000 and is insured for $210,000. A covered loss costs $40,000 to repair (actual cash value $28,000). Ignoring the deductible, how much will the insurer pay after repairs are complete?","choices":["$28,000","$35,000","$37,333","$40,000"],"answer":1,"explain":"80% of $300,000 is $240,000, so the home is underinsured. The insurer pays the greater of ACV ($28,000) or ($210,000 / $240,000) x $40,000 = $35,000. It therefore pays $35,000.","source":"ISO HO 00 03 05 11, Sec. I Cond. D.2.b"},{"id":"prop-050","topic":"ho","sub":"Conditions - Loss Settlement","q":"Under the HO-3 (HO 00 03 05 11) loss settlement condition, the insurer will pay replacement cost before repair or replacement is complete only if the cost to repair or replace is:","choices":["Less than $1,000, regardless of the amount of insurance on the building","Less than 5% of the amount of insurance on the building AND less than $2,500","Less than 10% of the amount of insurance on the building","Less than the deductible"],"answer":1,"explain":"The insurer pays no more than ACV until actual repair or replacement is complete. The exception is when the cost is both less than 5% of the insurance on the building and less than $2,500. The insured may claim ACV first and notify the insurer within 180 days of the intent to repair.","source":"ISO HO 00 03 05 11, Sec. I Cond. D.2.d-e"},{"id":"prop-051","topic":"ho","sub":"Conditions","q":"Under the HO-3 (HO 00 03 05 11) Duties After Loss condition, the insured must send the insurer a signed, sworn proof of loss within:","choices":["30 days after the date of the loss","60 days after the insurer's request","90 days after notice of the loss","1 year after the loss"],"answer":1,"explain":"The insured must send a signed, sworn proof of loss within 60 days after the insurer's request. Other duties include prompt notice, notifying police of theft, protecting the property, preparing an inventory, and submitting to examination under oath.","source":"ISO HO 00 03 05 11, Sec. I Cond. C.8"},{"id":"prop-052","topic":"ho","sub":"Section II - Coverage F","q":"Under the HO-3 (HO 00 03 05 11), Coverage F – Medical Payments to Others would pay for which of the following?","choices":["Medical bills of the named insured's spouse, who fell down the stairs at home","Medical bills of the named insured's 10-year-old son, who broke his arm at a playground","Medical bills of a guest who tripped on the insured's sidewalk, incurred within 3 years of the accident","Medical bills of the named insured, who was injured mowing the lawn"],"answer":2,"explain":"Coverage F pays necessary medical expenses incurred or medically ascertained within three years of the accident. It does not apply to you or regular residents of your household, except residence employees. A guest injured on the insured location with permission is covered.","source":"ISO HO 00 03 05 11, Sec. II Coverage F"},{"id":"prop-053","topic":"ho","sub":"Section II - Coverage E","q":"Under the HO-3 (HO 00 03 05 11), the insurer's duty to settle or defend a claim under Coverage E – Personal Liability ends when:","choices":["The suit is found by the court to be groundless, false, or fraudulent","The insured is found to be more than 50% at fault for the claimant's injury","The policy expires before the suit is filed","The limit for the occurrence is exhausted by payment of a judgment or settlement"],"answer":3,"explain":"Coverage E provides a defense at the insurer's expense even if the suit is groundless, false, or fraudulent. The duty to settle or defend ends when the limit for the occurrence is exhausted by payment of a judgment or settlement.","source":"ISO HO 00 03 05 11, Sec. II Coverage E"},{"id":"prop-054","topic":"ho","sub":"Section II - Exclusions","q":"An HO-3 (HO 00 03 05 11) named insured owns a boat with a 40-horsepower outboard motor that she bought two years before the current policy period and never declared to the insurer. She negligently injures a swimmer while operating it. Coverage E:","choices":["Does not apply, because the outboard exceeds 25 horsepower and was never declared or reported","Applies, because outboard motors of any horsepower are covered while owned by an insured","Applies, because watercraft liability is excluded only for boats 26 feet or longer","Applies only up to $1,500"],"answer":0,"explain":"Owned outboard motors over 25 total horsepower are covered only if acquired during the policy period, or if acquired before it and declared at inception or reported in writing within 45 days of acquisition. Neither applies here, so the Watercraft Liability exclusion applies. The Watercraft endorsement (HO 24 75) can add this coverage.","source":"ISO HO 00 03 05 11, Sec. II Excl. B.2.c(2); PF&M 2014 (HO 24 75)"},{"id":"prop-055","topic":"ho","sub":"Section II - Additional Coverages","q":"Under the HO-3 (HO 00 03 05 11) Section II additional coverage for Damage to Property of Others, which loss would be covered?","choices":["The insured's 15-year-old intentionally smashes a neighbor's mailbox","The insured's 8-year-old accidentally breaks a borrowed video game console","The insured damages his own car while backing out of the garage","The insured damages a customer's equipment while running his home business"],"answer":1,"explain":"Damage to Property of Others pays up to $1,000 per occurrence at replacement cost. It does not cover damage caused intentionally by an insured 13 or older, property owned by an insured, business-related damage, or damage arising from motor vehicles.","source":"ISO HO 00 03 05 11, Sec. II Add'l Cov. C"},{"id":"prop-056","topic":"ho","sub":"Section II - Coverage E Exclusions","q":"Under the HO-3 (HO 00 03 05 11), Coverage E excludes property damage to property rented to, occupied or used by, or in the care of an insured, EXCEPT damage caused by:","choices":["Theft, vandalism, or windstorm","Water, collapse, or freezing","Fire, smoke, or explosion","Any accidental occurrence"],"answer":2,"explain":"Property damage to property rented to or in the care of an insured is excluded under Coverage E, except damage caused by fire, smoke, or explosion. For example, a tenant who accidentally starts a fire in a rented home has liability coverage.","source":"ISO HO 00 03 05 11, Sec. II Excl. F.3"},{"id":"prop-057","topic":"ho","sub":"Selected Endorsements - Scheduled Personal Property","q":"An insured has the Scheduled Personal Property Endorsement (HO 04 61) with $20,000 scheduled for jewelry. She buys a new $8,000 ring and loses it two weeks later before reporting it. How much does the endorsement pay?","choices":["Nothing, because the ring was not scheduled","$1,500, the special limit for theft of jewelry","$8,000, because new acquisitions are fully covered for 30 days","$5,000, the lesser of 25% of the jewelry limit or $10,000"],"answer":3,"explain":"Newly acquired jewelry, furs, cameras, and musical instruments in an already-scheduled class are covered for the lesser of 25% of that class's limit or $10,000, if reported within 30 days. 25% of $20,000 is $5,000. The endorsement is open-perils, so a mysterious loss is covered, and no deductible applies.","source":"PF&M Analysis: HO 04 61 Scheduled Personal Property Endorsement (July 2017); Texas HO 23 03 05 11"},{"id":"prop-058","topic":"ho","sub":"Selected Endorsements - Personal Property Replacement Cost","q":"Under the Personal Property Replacement Cost Loss Settlement endorsement (HO 04 90 05 11), which item remains on an actual cash value basis?","choices":["A rare antique clock that cannot be replaced","A ten-year-old refrigerator in daily use","A three-year-old living room sofa in good condition","Wall-to-wall carpeting in the bedrooms"],"answer":0,"explain":"HO 04 90 settles Coverage C, carpeting, appliances, awnings, and outdoor equipment at replacement cost. These are ineligible and remain at ACV: antiques, fine arts, and rarities that cannot be replaced; memorabilia and collectors' items; items not in good or workable condition; obsolete stored items. If the cost exceeds $500, only ACV is paid until the item is replaced.","source":"ISO HO 04 90 05 11, B. and C.2"},{"id":"prop-059","topic":"ho","sub":"Selected Endorsements - Earthquake","q":"Under the ISO Earthquake endorsement (HO 04 54, 10 00 edition), which statement is correct?","choices":["The deductible is a flat $500 per earthquake, regardless of the limits","Shocks within a 72-hour period are considered a single earthquake","Exterior masonry veneer is always covered, with no option to exclude it","Flood or tidal wave caused by an earthquake is covered"],"answer":1,"explain":"HO 04 54 treats shocks within 72 hours as one earthquake. The deductible is a percentage of the greater of the Coverage A or C limit (minimum $250 in the 10 00 edition). Exterior masonry veneer is excluded unless that exclusion is removed, and flood caused by earthquake is excluded.","source":"ISO HO 04 54 10 00"},{"id":"prop-060","topic":"ho","sub":"Selected Endorsements - Permitted Incidental Occupancies","q":"An insured operates a piano-teaching studio in her home and adds the Permitted Incidental Occupancies – Residence Premises endorsement (HO 04 42 10 00). Which statement is correct?","choices":["The $2,500 business property special limit still applies to her studio equipment","The endorsement converts the homeowners policy into a businessowners policy for the studio","Section II covers liability arising from the described business, except bodily injury to its employees","Coverage B automatically covers any other structure used for the business at its usual limit"],"answer":2,"explain":"HO 04 42 removes the Section II business exclusion for the described business and applies the full Coverage C limit to that business's property. It still excludes BI to employees of the business. A described other structure is insured for its own scheduled limit instead of under Coverage B.","source":"ISO HO 04 42 10 00"},{"id":"prop-061","topic":"ho","sub":"Selected Endorsements - Personal Injury","q":"Which of the following would be covered by adding the Personal Injury endorsement (HO 24 82) to a homeowners policy?","choices":["The insured's child damages a neighbor's fence","The insured's dog bites a mail carrier","A guest slips on the insured's icy steps","A neighbor sues the insured for slander"],"answer":3,"explain":"HO 24 82 adds personal injury coverage: false arrest, detention or imprisonment, malicious prosecution; libel, slander, or defamation; invasion of privacy; and wrongful eviction or entry. Dog bites, slip-and-falls, and property damage are bodily injury or property damage already covered under Coverage E.","source":"PF&M Analysis: ISO Homeowners Optional Coverage Endorsements (July 2014), HO 24 82"},{"id":"prop-062","topic":"ho","sub":"Selected Endorsements - Business Pursuits","q":"The Business Pursuits endorsement (HO 24 71) is designed to cover the liability of an insured who:","choices":["Works as a schoolteacher or salesperson for an employer","Is a partner in a law firm with several other partners","Is the sole owner and operator of a retail store","Runs a licensed day care center from home"],"answer":0,"explain":"HO 24 71 covers liability arising from an insured's business activities when the insured is not the sole owner or a partner. Examples are clerical employees, salespersons, collectors, messengers, and teachers; teachers may add corporal punishment coverage.","source":"PF&M Analysis: ISO Homeowners Optional Coverage Endorsements (July 2014), HO 24 71"},{"id":"prop-063","topic":"ho","sub":"Selected Endorsements - Home Day Care","q":"A homeowner runs a day care in her home, caring for three unrelated neighborhood children for pay and earning about $15,000 a year. Under the unendorsed HO-3 (HO 00 03 05 11), liability arising from the day care is:","choices":["Covered, because home day care is never a \"business\" under the HO-3 definition","Excluded as a \"business\"; the Home Day Care Coverage endorsement (HO 04 97) can add coverage","Covered up to $2,000 of annual receipts","Covered only under Coverage F – Medical Payments to Others"],"answer":1,"explain":"Day care run for pay is a \"business\" under HO 00 03 05 11: it is an occupation, and it is an activity engaged in for compensation. The definition's home day care carve-outs cover only care paid for by a mutual exchange of services or care for a relative, and the $2,000 exception could not apply because she earns far more than $2,000. Section II excludes business liability. The Home Day Care Coverage endorsement (HO 04 97) can add coverage.","source":"ISO HO 00 03 05 11, Definitions B.3, Sec. II Excl. E.2; PF&M 2014 (HO 04 97)"},{"id":"prop-064","topic":"ho","sub":"Selected Endorsements - Limited Fungi, Wet or Dry Rot, or Bacteria","q":"The ISO Limited Fungi, Wet or Dry Rot, or Bacteria Coverage endorsement for HO-3 and HO-5 (HO 04 27, 04 02 edition) pre-prints a schedule showing which limits?","choices":["$5,000 for the Section I additional coverage and a $25,000 Coverage E aggregate sublimit","$25,000 for the Section I additional coverage and a $100,000 Coverage E aggregate sublimit","$10,000 for the Section I additional coverage and a $50,000 Coverage E aggregate sublimit","No limit for Section I and $10,000 per occurrence for Section II"],"answer":2,"explain":"The HO 04 27 schedule shows $10,000 for the Section I additional coverage (removal, tear-out, and testing) and a $50,000 Section II Coverage E aggregate sublimit. That sublimit is within, not in addition to, the Coverage E limit. Companies may file different amounts.","source":"ISO HO 04 27 04 02, Schedule"},{"id":"prop-065","topic":"ho","sub":"Selected Endorsements - Home Business Insurance Coverage","q":"Which ISO endorsement is a self-contained, extensive form providing both property and liability coverage for a described business operated in the insured's residence or an other structure on the residence premises?","choices":["Business Pursuits (HO 24 71)","Scheduled Personal Property (HO 04 61)","Personal Injury (HO 24 82)","Home Business Insurance Coverage (HO 07 01)"],"answer":3,"explain":"HO 07 01 Home Business Insurance Coverage is structured like a self-contained policy, giving property and liability coverage for a described business run from the residence or a structure on the residence premises. Business Pursuits covers liability for business activities of an insured who is not an owner or partner.","source":"PF&M Analysis: ISO Homeowners Optional Coverage Endorsements (July 2014), HO 07 01"},{"id":"prop-066","topic":"ho","sub":"Section II - Coverage E and F","q":"Under the ISO Homeowners program manual, the basic (minimum) limits for Section II are:","choices":["Coverage E $100,000; Coverage F $1,000 per person","Coverage E $50,000; Coverage F $500 per person","Coverage E $300,000; Coverage F $5,000 per person","Coverage E $25,000; Coverage F $1,000 per person"],"answer":0,"explain":"The ISO Homeowners manual's minimum limits are $100,000 for Coverage E – Personal Liability and $1,000 for Coverage F – Medical Payments to Others, for all forms. Higher limits are available for additional premium.","source":"ISO Homeowners Policy Program Manual Table 301 as reproduced in RIJRA HO Manual (eff. 11/1/2021)"},{"id":"prop-067","topic":"ho","sub":"Conditions","q":"Under the HO-3 (HO 00 03 05 11) Concealment or Fraud condition, if one insured intentionally conceals a material fact relating to the insurance, Section I property coverage is:","choices":["Denied only to the insured who committed the fraud","Provided to no insureds under the policy","Reduced by 50%","Unaffected unless the fraud occurred before the loss"],"answer":1,"explain":"Section I Condition R states that coverage is provided to no insureds if, before or after a loss, an insured intentionally concealed or misrepresented a material fact, engaged in fraudulent conduct, or made false statements. Under Section II (Cond. J), coverage is denied only to the insured involved.","source":"ISO HO 00 03 05 11, Sec. I Cond. R; Sec. II Cond. J"},{"id":"reg-001","topic":"reg","sub":"Producer Appointment","q":"When an insurer appoints a producer as its agent, the insurer must file the notice of appointment with the director within how many days from the date the agency contract is executed or the first insurance application is submitted?","choices":["5 days","10 days","15 days","30 days"],"answer":2,"explain":"The appointing insurer must file the notice of appointment within 15 days from the date the agency contract is executed or the first application is submitted. The 30-day figure is the director's time limit to verify the producer's eligibility.","source":"MCL 500.1208a(3),(4)"},{"id":"reg-002","topic":"reg","sub":"Producer Appointment","q":"Dana holds a Michigan property and casualty producer license but has no appointment with Insurer X. Which statement is correct?","choices":["Dana may not bind coverage for Insurer X unless Insurer X appoints her.","Dana may bind coverage for Insurer X for up to 15 days while an appointment is pending.","Dana's license alone gives her apparent authority to bind any insurer admitted in Michigan.","Dana may bind coverage for Insurer X if she notifies the director within 30 days."],"answer":0,"explain":"A producer may not bind coverage for an insurer unless that insurer has appointed the producer. A license by itself does not create actual, apparent or inherent authority to commit an insurer.","source":"MCL 500.1208a(2); MCL 500.1201(h)"},{"id":"reg-003","topic":"reg","sub":"Termination of Appointment","q":"An insurer ends its relationship with a producer because of low production, which is not a cause listed in MCL 500.1239. What notice must the insurer give the director?","choices":["Notice within 30 days following the effective date of the termination","No notice, because the termination was not for cause","Notice at least 15 days before the termination takes effect","Notice within 90 days following the effective date of the termination"],"answer":0,"explain":"An insurer must notify the director within 30 days after the effective date of a termination for any reason. For-cause terminations also have a 30-day deadline.","source":"MCL 500.1208b(1),(2)"},{"id":"reg-004","topic":"reg","sub":"Termination of Appointment","q":"An insurer terminates a producer for forging a customer's signature, a cause listed in MCL 500.1239. Within 15 days after notifying the director, how must the insurer send the producer a copy of the notification?","choices":["By regular first-class mail, postage prepaid, to the producer's last known address","By email to the producer's address on file with DIFS","By personal service on the producer through a licensed process server","By certified mail, return receipt requested, or nationally recognized overnight delivery"],"answer":3,"explain":"For a for-cause termination, the copy must go to the producer's last known address by certified mail, return receipt requested, or by nationally recognized overnight delivery. The producer then has 30 days to file written comments with the director.","source":"MCL 500.1208b(4)"},{"id":"reg-005","topic":"reg","sub":"Termination of Appointment","q":"As a condition of keeping its authority to do business, an insurer that writes automobile and home insurance in Michigan may terminate a producer's auto/home authority for all of the following reasons EXCEPT:","choices":["Malfeasance","Breach of fiduciary duty or trust","Submission of fewer than 25 home and auto applications in the preceding 12 months","The geographic location of the producer's auto and home business"],"answer":3,"explain":"Section 1209(2) allows termination for malfeasance, breach of fiduciary duty, a violation of the Code, failure to perform the contract, or fewer than 25 applications in 12 months. Section 1209(3) bars terminations based primarily on the geographic location of the producer's business.","source":"MCL 500.1209(2),(3)"},{"id":"reg-006","topic":"reg","sub":"Termination of Appointment","q":"An insurer terminates a producer who holds property rights in the renewals. Their written agreement says nothing about the producer's authority after termination. What may the producer do?","choices":["Bind new risks and renew existing policies for the insurer, without its approval, until the policies expire","Service existing policies, but not bind new risks, renew, or increase the insurer's obligation without approval","Renew existing policies automatically for one additional term, but not bind new risks","Nothing, because all of the producer's authority ends on the date of the termination notice"],"answer":1,"explain":"If the agreement is silent, the producer may keep servicing existing policies but may not bind new risks, renew, or increase the insurer's obligation without the insurer's approval. The insurer also may not cancel or nonrenew a policy because the producer was terminated.","source":"MCL 500.1209(1)"},{"id":"reg-007","topic":"reg","sub":"Producer Appointment","q":"During any 12-month period, the premium an agent places on his own risks and on the risks of his employees, employer, or business associates may not exceed what percentage of the total premium the agent placed during that period?","choices":["10%","15%","20%","25%"],"answer":1,"explain":"Michigan limits this \"controlled business\" to 15% of the total premium the agent placed in any 12-month period.","source":"MCL 500.1208"},{"id":"reg-008","topic":"reg","sub":"Duties","q":"Which of the following persons must hold a Michigan insurance producer license?","choices":["An insurer's claims adjuster employee who receives no commission","An agency receptionist who schedules appointments and receives no commission","An insurer employee who is paid a commission on each homeowners policy she sells to Michigan residents","A car rental clerk whose only insurance sales are coverage incidental to rentals of 30 days"],"answer":2,"explain":"The license exemptions for officers and employees apply only to those who receive no commission and whose duties are clerical, administrative, claims-related and so on. Insurance sold only as incidental to a vehicle rental of 90 days or less is also exempt.","source":"MCL 500.1202(2)(a),(h); MCL 500.1201a(1)"},{"id":"reg-009","topic":"reg","sub":"Duties","q":"Under the Michigan Insurance Code, \"solicit\" means:","choices":["Exchanging a contract of insurance, by any means, for money or its equivalent on behalf of an insurer","Conferring directly with a purchaser about the substantive benefits, terms or conditions of a particular contract","Auditing or abstracting insurance policies for a fee","Attempting to sell insurance, or asking or urging a person to apply for a particular kind of insurance from a particular company"],"answer":3,"explain":"This is the statutory definition of \"solicit.\" The first choice defines \"sell,\" the second defines \"negotiate,\" and the third describes work that requires a counselor license.","source":"MCL 500.1201(m),(n),(o); MCL 500.1232"},{"id":"reg-010","topic":"reg","sub":"Types of Licensees","q":"Under Michigan's producer lines of authority, the \"personal lines\" qualification covers:","choices":["Property and casualty insurance sold to individuals and families for primarily noncommercial purposes","Only automobile insurance sold to individuals","Life and health insurance sold to individuals and families for primarily personal purposes","Any property and casualty coverage, personal or commercial, with an annual premium under $10,000"],"answer":0,"explain":"Personal lines means property and casualty coverage sold to individuals and families for primarily noncommercial purposes.","source":"MCL 500.1206(1)(f)"},{"id":"reg-011","topic":"reg","sub":"Business Entity","q":"To be licensed as an insurance producer in Michigan, a business entity must do which of the following?","choices":["Appoint at least two licensed producers as officers","Designate an individual licensed producer responsible for its compliance with Michigan insurance laws","Post a $50,000 surety bond with the director and keep it in force while the entity is licensed","Pass the same written examination that an individual producer must pass"],"answer":1,"explain":"A business entity acting as a producer must hold its own producer license and designate an individual licensed producer responsible for its compliance with Michigan insurance laws, rules and regulations.","source":"MCL 500.1205(2)"},{"id":"reg-012","topic":"reg","sub":"Producer","q":"What is the minimum number of hours of instruction in a registered prelicensing program of study for a combined property and casualty producer/solicitor license?","choices":["20 hours","24 hours","40 hours","50 hours"],"answer":2,"explain":"A combined property and casualty program requires 40 hours and also satisfies the personal lines requirement. Property-only and casualty-only programs each require 20 hours. Twenty-four hours is the CE requirement, not the prelicensing requirement.","source":"MCL 500.1204a(1)(b)(iv),(v),(vii)"},{"id":"reg-013","topic":"reg","sub":"Producer","q":"The director may waive the prelicensing education or examination requirement for a producer applicant who:","choices":["Has 5 years of experience as a commercial claims supervisor","Was licensed as an insurance producer 3 years ago","Holds a Michigan real estate broker license","Holds the Chartered Property Casualty Underwriter (CPCU) designation"],"answer":3,"explain":"The waiver list includes certain designations, such as CPCU, CIC, AAI and ARM, a producer license held within the preceding 12 months, an insurance-concentration degree, and limited licenses. A license held 3 years ago falls outside the 12-month window.","source":"MCL 500.1204(2)(a)-(d)"},{"id":"reg-014","topic":"reg","sub":"Producer","q":"A licensed producer moves to Michigan from another state, where she was licensed for property and casualty. Which statement is correct?","choices":["She must apply for a resident license within 90 days after establishing legal residence; no prelicensing education or exam is required for lines she held.","She must complete 40 hours of prelicensing education and pass the Michigan exam within 12 months after establishing legal residence.","She may keep using her nonresident license indefinitely as long as she renews it.","She must apply for a resident license within 30 days after establishing legal residence and pass only the Michigan law portion of the exam."],"answer":0,"explain":"A producer licensed in another state who moves to Michigan must apply within 90 days of establishing legal residence. Prelicensing education and the exam are not required for qualifications previously held.","source":"MCL 500.1206b(2)"},{"id":"reg-015","topic":"reg","sub":"Producer","q":"A licensed Michigan producer dies unexpectedly. To allow time to sell the agency, the director may issue a temporary producer license to the surviving spouse without an examination. For how long?","choices":["30 days","90 days","180 days","1 year"],"answer":2,"explain":"A temporary producer license may be issued without an examination for up to 180 days. Eligible recipients include the surviving spouse or personal representative of a producer who dies or becomes disabled.","source":"MCL 500.1211b(1)(a)"},{"id":"reg-016","topic":"reg","sub":"Types of Licensees","q":"A licensed solicitor in Michigan may solicit applications and collect premiums on behalf of:","choices":["Any insurer admitted in Michigan, without a written contract, notice to the director, or any further authorization","A licensed resident producer, under a written contract specifying the solicitor's authority, after the producer notifies the director","Any consumer who signs a written fee agreement specifying the solicitor's authority","A surplus lines insurer, through the Michigan Surplus Lines Association"],"answer":1,"explain":"A solicitor acts for a licensed resident producer (agent). There must be a written contract specifying the solicitor's authority, the solicitor must be licensed, and the agent must notify the director of the appointment.","source":"MCL 500.1211(1); MCL 500.1212"},{"id":"reg-017","topic":"reg","sub":"Counselor","q":"Which of the following persons may give opinions about the coverage and value of a client's insurance policies WITHOUT an insurance counselor license?","choices":["A person who advertises as an \"insurance consultant\" and charges hourly fees to review policies","An unlicensed person who audits and abstracts policies for business clients for a fee","An attorney admitted to practice law in Michigan","A financial planner who holds himself out to the public as an insurance counselor"],"answer":2,"explain":"Section 1232 does not apply to a person admitted to practice law in Michigan, and it does not prohibit a licensed agent's customary advice. Auditing or abstracting policies, giving such opinions, or holding oneself out as a counselor otherwise requires a counselor license.","source":"MCL 500.1232"},{"id":"reg-018","topic":"reg","sub":"Counselor","q":"Before providing services, an insurance counselor must prepare a written agreement that both the counselor and the client sign. The agreement must do all of the following EXCEPT:","choices":["Outline the nature of the work to be performed","State the counselor's fee","Disclose that the counselor will receive a commission on any insurance the counselor places as an agent","State that the fee will be waived if the client buys insurance through the counselor"],"answer":3,"explain":"The agreement must state that the counselor's fee may NOT be waived under any circumstances. It must also describe the work, state the fee, and disclose any commission. The counselor keeps a copy for at least 2 years.","source":"MCL 500.1236"},{"id":"reg-019","topic":"reg","sub":"Counselor","q":"An insurance counselor must keep a copy of each signed client agreement for at least how long after the services are completed?","choices":["1 year","2 years","3 years","5 years"],"answer":1,"explain":"The counselor must retain a copy of the agreement for not less than 2 years after completing the services, and it must be available to the commissioner.","source":"MCL 500.1236"},{"id":"reg-020","topic":"reg","sub":"Commissions","q":"Producer Lee sold several policies while licensed, then retired and let his license lapse. The insurer continues paying Lee renewal commissions on those policies. This is:","choices":["Permitted, because Lee was licensed when the policies were sold","Prohibited, because commissions may be paid only to currently licensed persons","Permitted only if Lee reinstates his license within 12 months","Prohibited unless the director approves each payment"],"answer":0,"explain":"Renewal or other deferred commissions may be paid to a person who was licensed at the time of the sale, solicitation or negotiation.","source":"MCL 500.1240(3)"},{"id":"reg-021","topic":"reg","sub":"Commissions","q":"An agent pays her unlicensed neighbor $25 for each referral who buys a policy from her. This practice is:","choices":["Permitted, if the payments total less than $50 per calendar year","Permitted, if the agent discloses the payments in writing to the insurer and to each referred customer","Prohibited, because a referral fee paid to an unlicensed person may not depend on the referral applying for or buying a policy","Permitted, if the neighbor signs a written referral agreement with the agent before any payments are made"],"answer":2,"explain":"DIFS allows a producer to pay an unlicensed person a referral fee only if the fee is not contingent on the referral applying for or buying a policy (MCL 500.1240(4); DIFS Referral Fees FAQ). Paying $25 for each referral who buys is contingent on a sale, so it is prohibited (MCL 500.1207(11); 500.1240(1)). The $50 limit applies only to merchandise given to applicants and insureds.","source":"MCL 500.1207(11); MCL 500.1240(1),(4); DIFS Insurance Compensation and Rebating FAQ - Referral Fees (updated 05/09/16); MCL 500.2024b"},{"id":"reg-022","topic":"reg","sub":"Change of Name and Address","q":"A Michigan producer moves to a new home address within the state. Within how many days must the producer notify the director of the change?","choices":["10 days","15 days","30 days","60 days"],"answer":2,"explain":"Licensees must report a change of legal name or address within 30 days, and a change of mailing or email address within 30 days.","source":"MCL 500.1206(5); MCL 500.1238(1)"},{"id":"reg-023","topic":"reg","sub":"Assumed Names","q":"A producer wants to do business as \"Lakeshore Insurance Solutions\" instead of her legal name. Under Michigan law, she must:","choices":["Notify the commissioner before using the assumed name","Notify the commissioner within 30 days after she first uses the name","Obtain written approval from each appointing insurer","Do nothing, as long as her legal name appears on each policy"],"answer":0,"explain":"A producer doing business under any name other than the legal name must notify the commissioner before using the assumed name.","source":"MCL 500.1211a"},{"id":"reg-024","topic":"reg","sub":"Reporting of Actions","q":"A Michigan resident producer is fined by the Ohio insurance department. When must the producer report this administrative action to the Michigan director?","choices":["Within 10 days after the hearing is scheduled","Within 30 days after the final disposition of the matter","Only at the next license renewal","Within 60 days after the action is initiated"],"answer":1,"explain":"A producer must report any administrative action taken in another jurisdiction, or by another Michigan agency, within 30 days after final disposition, with a copy of the order or other relevant documents.","source":"MCL 500.1247(1)"},{"id":"reg-025","topic":"reg","sub":"Reporting of Actions","q":"A producer is criminally charged in another state. When must the producer report the criminal prosecution to the Michigan director?","choices":["Within 30 days after the initial pretrial hearing date","Within 30 days after a conviction or guilty plea, if any","Within 10 days after the arrest","Only if the charge is a felony"],"answer":0,"explain":"A producer must report any criminal prosecution, in any jurisdiction, within 30 days after the initial pretrial hearing date, with the initial complaint and the resulting order.","source":"MCL 500.1247(2)"},{"id":"reg-026","topic":"reg","sub":"Continuing Education Requirements","q":"To keep a Michigan producer license in force, a resident producer must complete how much continuing education in each 2-year review period?","choices":["12 hours, including 2 hours of ethics","20 hours, including 3 hours of ethics","24 hours, including 3 hours of ethics","30 hours, including 6 hours of ethics"],"answer":2,"explain":"Producers need at least 24 hours of approved CE every 2 years, with at least 3 of those hours in ethics.","source":"MCL 500.1204c(1),(2)"},{"id":"reg-027","topic":"reg","sub":"Continuing Education Requirements","q":"A producer completes 40 CE hours in her current 2-year period, including 5 hours of ethics. Which statement about carryover is correct?","choices":["All 16 extra hours carry over, including the 2 extra ethics hours, toward next period's ethics requirement.","No hours may carry over to the next period.","Up to 16 hours may carry over, but only as ethics credit.","At most 12 hours may carry over, and extra ethics hours cannot satisfy the next period's ethics requirement."],"answer":3,"explain":"Excess hours beyond 24 may carry over, up to a maximum of 12. Ethics hours may not be applied to the next period's ethics requirement; DIFS counts excess ethics hours as general hours.","source":"MCL 500.1204c(13); DIFS CE Carryover FAQ"},{"id":"reg-028","topic":"reg","sub":"Continuing Education Requirements","q":"A producer has not completed her CE requirement by her license expiration date. During the 90-day grace period, she may:","choices":["Continue writing new business as long as she has enrolled in an approved CE course","Service policies she previously sold and receive commissions on them, but not sell new policies or bind coverage","Bind coverage and service existing policies, but not solicit or sell new policies","Neither service existing policies nor receive any commissions on policies she previously sold"],"answer":1,"explain":"During the 90-day grace period, the producer may not solicit or sell new policies, bind coverage, or otherwise act as a producer. She may service policies previously sold and receive commissions on them. If CE is still not met after 90 days, the license is canceled.","source":"MCL 500.1204c(11)"},{"id":"reg-029","topic":"reg","sub":"Continuing Education Requirements","q":"The director is required to waive the CE requirement for which of the following producers?","choices":["A producer licensed only for personal lines","A producer who has held a license for more than 20 years","A producer licensed to write only limited line credit insurance","A producer who holds the CPCU designation"],"answer":2,"explain":"The director must waive CE for producers licensed only for limited line credit insurance, and for travel- or baggage-only producers whose employment is for another purpose. The director must also waive CE when military service prevents compliance or when the director determines that enforcement would cause severe hardship. Neither a CPCU nor long licensure is a waiver ground.","source":"MCL 500.1204c(9)"},{"id":"reg-030","topic":"reg","sub":"Maintenance and Duration","q":"A producer's license lapsed 8 months ago for a reason OTHER than failing to meet CE requirements. Which statement is correct?","choices":["The producer must complete prelicensing education and retake the exam.","The producer may reinstate the same license without passing a written examination.","The license cannot be reinstated, and the producer must wait 1 year to reapply.","The producer may reinstate only after completing 48 hours of CE."],"answer":1,"explain":"A producer whose license lapsed for a reason other than unmet CE may reinstate the same license without a written exam within 12 months of the lapse.","source":"MCL 500.1206(3)"},{"id":"reg-031","topic":"reg","sub":"Suspension, Revocation, Refusal to Issue or Renew","q":"Under MCL 500.1239(1), the director must refuse to issue a producer license to an applicant who:","choices":["Was convicted of a felony 6 years before filing the application","Received a misdemeanor traffic ticket 2 years ago","Failed the licensing exam once before passing it on the second attempt","Is 19 years old"],"answer":0,"explain":"A felony conviction within 10 years before the application is filed is a 1239(1)(d) cause, and the director shall not issue a license for it. A felony involving violence, criminal sexual conduct, or a fiduciary or financial crime bars licensure regardless of date.","source":"MCL 500.1239(1)(d),(e); MCL 500.1205(1)(a)"},{"id":"reg-032","topic":"reg","sub":"Forgery","q":"All of the following are grounds for the director to suspend or revoke a producer's license EXCEPT:","choices":["Forging another person's name to an insurance application or any document related to an insurance transaction","Knowingly accepting insurance business from an unlicensed individual","Improperly using notes or any other reference material to complete an insurance licensing exam","Placing coverage the agent's insurers refused through another licensed agent, with the required written notice to the buyer"],"answer":3,"explain":"Forgery, knowingly accepting business from an unlicensed person, and cheating on the exam are all 1239 causes. Placing refused coverage through another licensed agent, with the required written notice, is expressly permitted by 1207(12).","source":"MCL 500.1239(1)(h),(i), (2)(d); MCL 500.1207(12)"},{"id":"reg-033","topic":"reg","sub":"Suspension, Revocation, Refusal to Issue or Renew","q":"The director gives written notice denying an application for a resident producer license. Within how many days after the written denial may the applicant demand a hearing?","choices":["10 days","20 days","30 days","60 days"],"answer":2,"explain":"The applicant may make a written demand for a hearing within 30 days after the written denial. The hearing is held under the Administrative Procedures Act.","source":"MCL 500.1239(4)"},{"id":"reg-034","topic":"reg","sub":"Penalties and Fines","q":"After a hearing, the director finds that a producer violated the licensing chapter (Chapter 12) and that the producer knew or reasonably should have known of the violation. What is the maximum civil fine per violation?","choices":["$500","$1,000","$5,000","$20,000"],"answer":2,"explain":"Under 1244, the fine is up to $1,000 per violation, or up to $5,000 per violation if the person knew or reasonably should have known of the violation. One order may not require more than $50,000 in fines. The $20,000 figure applies to knowingly violating a cease and desist order.","source":"MCL 500.1244(1)(a),(3)"},{"id":"reg-035","topic":"reg","sub":"Cease and Desist Order","q":"A producer knowingly violates a cease and desist order issued under the licensing chapter. After notice and a hearing, the director may impose a civil fine of up to:","choices":["$5,000 per violation, with no aggregate limit","$20,000 per violation, not to exceed $100,000 in one order","$50,000 per violation","$1,000 per violation, not to exceed $10,000 in one order"],"answer":1,"explain":"Knowingly violating a Chapter 12 cease and desist order can bring up to $20,000 per violation, capped at $100,000 per order, and/or suspension or revocation of the license.","source":"MCL 500.1244(3)"},{"id":"reg-036","topic":"reg","sub":"Penalties and Fines","q":"Under the Uniform Trade Practices Act, a person who did NOT know, and could not reasonably have known, that a practice was prohibited may be fined up to $1,000 per violation, with what aggregate maximum?","choices":["$5,000","$10,000","$50,000","$100,000"],"answer":1,"explain":"Under 2038, non-knowing violations carry a fine of up to $1,000 each, with a $10,000 aggregate. Knowing violations carry up to $5,000 each, with a $50,000 aggregate for all violations in a 6-month period.","source":"MCL 500.2038(1)(a)"},{"id":"reg-037","topic":"reg","sub":"Suspension, Revocation, Refusal to Issue or Renew","q":"The commissioner finds that protecting the public requires emergency action against a solicitor. Which statement about summary suspension is correct?","choices":["A summary suspension may be ordered without a prior hearing; a requested hearing must be held within 20 days after it takes effect.","A summary suspension may not take effect until a hearing has been held on at least 10 days' notice.","Summary suspension is available only after a criminal conviction.","A summary suspension automatically becomes a revocation after 30 days unless the solicitor requests a hearing."],"answer":0,"explain":"The commissioner may order summary suspension without a prior hearing when public protection requires emergency action. If requested, a hearing is held within 20 days, unless the licensee asks for a later date, and a decision is announced within 30 days after the hearing.","source":"MCL 500.1242(4)"},{"id":"reg-038","topic":"reg","sub":"Misrepresentation","q":"An agent makes an incomplete and misleading comparison of a client's current policy with a new policy to persuade the client to let the current policy lapse and buy the new one. This practice is called:","choices":["Rebating","Twisting","Sliding","Boycott"],"answer":1,"explain":"A misleading representation or incomplete comparison of policies made to induce a person to lapse, surrender or replace a policy is known as twisting, and Michigan prohibits it. Rebating is giving inducements not specified in the policy.","source":"MCL 500.2005a(a); MCL 500.2064(2); MCL 500.2005(f)"},{"id":"reg-039","topic":"reg","sub":"Rebating","q":"A property and casualty producer wants to thank new homeowners clients with a gift. Under Michigan law, the producer may give an applicant or insured an article of merchandise without it being an illegal rebate if its cost to the insurer is:","choices":["$5 or less per policy","$25 or less per calendar year","$50 or less per calendar year","$100 or less per policy term"],"answer":2,"explain":"Sections 2024, 2066 and 2070 do not prohibit a P&C insurer or producer from giving merchandise that costs the insurer $50 or less per calendar year (as amended by 2018 PA 542). The $5 limit applies to life insurance applicants.","source":"MCL 500.2024b; MCL 500.2024a"},{"id":"reg-040","topic":"reg","sub":"Rebating","q":"An insured knowingly accepts a rebate of part of the agent's commission in exchange for buying a policy. What is the consequence for the INSURED?","choices":["None, because only the agent who offered the rebate can be penalized for rebating under Michigan law","The policy is void from inception","The insured must pay a civil fine equal to 10 times the rebate, but the amount of coverage is unchanged","Coverage is reduced in proportion to the rebate's share of the premium, and the insured faces a misdemeanor fine of up to $100"],"answer":3,"explain":"The insurance is reduced in the same proportion that the rebate bears to the total premium. The insured is also guilty of a misdemeanor with a fine of up to $100.","source":"MCL 500.2070"},{"id":"reg-041","topic":"reg","sub":"Rebating","q":"On satisfactory evidence that an agent paid illegal rebates, the commissioner revokes the agent's license. How long must pass before a new license may be issued to that agent?","choices":["30 days","6 months","1 year","5 years"],"answer":2,"explain":"After revocation for rebating, which follows the 2068 notice-and-hearing procedure, no license may be issued to the offender within 1 year. Rebating is also a misdemeanor, with a fine of up to $100 per violation.","source":"MCL 500.2066(2); MCL 500.2069"},{"id":"reg-042","topic":"reg","sub":"Boycott, Coercion, and Intimidation","q":"Several insurers agree that none of them will write policies for customers of a particular agency, unreasonably restraining that agency's business. This is an example of:","choices":["Boycott, which is an unfair method of competition","Rebating, because the agency loses commissions","Defamation, because the agency's reputation suffers","A permitted underwriting practice, if applied uniformly"],"answer":0,"explain":"Entering into any agreement to commit, or by concerted action committing, any act of boycott, coercion or intimidation that results or tends to result in unreasonable restraint of the business of insurance is an unfair trade practice.","source":"MCL 500.2012"},{"id":"reg-043","topic":"reg","sub":"Deception","q":"A producer tells prospects that a competing insurer is \"about to go bankrupt,\" a false and derogatory claim intended to hurt the competitor. This unfair trade practice is known as:","choices":["Twisting","Defamation","Coercion","Unfair discrimination"],"answer":1,"explain":"Making or circulating a statement that is false or maliciously critical of the financial condition of a person in the insurance business, and calculated to injure that person, is defamation, an unfair trade practice.","source":"MCL 500.2009"},{"id":"reg-044","topic":"reg","sub":"Unfair Discrimination","q":"An insurer refuses to write a homeowners policy for an applicant solely because another insurer previously denied the applicant coverage. This is:","choices":["Permitted, because insurers may decline any risk","Permitted, if the prior denial occurred within the last 3 years","Permitted, if the agent discloses the reason in writing","An unfair trade practice"],"answer":3,"explain":"Refusing to insure, or to continue to insure, an individual or risk solely because the applicant was previously denied coverage by an insurer is an unfair method of competition and an unfair or deceptive act.","source":"MCL 500.2027(b)"},{"id":"reg-045","topic":"reg","sub":"Unfair Discrimination","q":"For property insurance, an insurer may refuse to insure based on the location of the risk only if:","choices":["The property is in a city with more than 100,000 residents under the most recent federal census","There is a statistically significant relationship between the location and fire-loss risk within its ZIP code","The applicant has lived at the location for less than 1 year, as shown on the application","The agent approves the refusal in writing"],"answer":1,"explain":"For property insurance, location may be used only when there is a statistically significant relationship between the location of the risk and the risk of fire loss within the area. \"Area\" means a single ZIP code.","source":"MCL 500.2027(a)(iii)"},{"id":"reg-046","topic":"reg","sub":"Inducement","q":"A bank tells a mortgage applicant that the loan will be approved only if the homeowners policy is bought through the bank's affiliated agency. Under Michigan law, this is:","choices":["Permitted, because the lender has an insurable interest in the mortgaged home","Permitted, if the premium is competitive","Permitted, if the borrower signs a written consent at the loan closing","Prohibited; a lender may not require the borrower to use a particular agent or insurer"],"answer":3,"explain":"No person may require, as a condition of lending money or extending credit, that the borrower obtain insurance through a particular agent or insurer. The lender keeps a reasonable right to approve or disapprove the insurance selected. Section 1207(13) likewise bars inducing purchases through a particular agent by promising to lend money.","source":"MCL 500.2077(1),(3); MCL 500.1207(13)"},{"id":"reg-047","topic":"reg","sub":"False Information and Advertising","q":"A telemarketing campaign by an insurance agency does not disclose that its purpose is to solicit insurance or that an insurance agent will make contact. This is:","choices":["Permitted, if the calls are made only to existing customers","Permitted, if no policy is sold on the first call","Permitted for personal lines but not commercial lines","An unfair or deceptive act or practice"],"answer":3,"explain":"Using any method of marketing that fails to disclose in a conspicuous manner that a purpose of the marketing is solicitation of insurance, and that contact will be made by an insurance agent or insurer, is an unfair or deceptive practice.","source":"MCL 500.2005a(c)"},{"id"
