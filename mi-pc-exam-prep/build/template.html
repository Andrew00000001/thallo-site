<title>Michigan P&amp;C Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a policy-jacket header (declarations band carrying the exam's PSI series number) over a tabbed study workbench */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunk:#E7EBF0; --ink:#14223A; --muted:#556275; --line:#D2D9E2;
  --accent:#0C6773; --accent-ink:#FFFFFF; --accent-soft:#DAEDEF;
  --good:#1B7743; --good-soft:#DDF1E4; --bad:#AE271E; --bad-soft:#F7DFDC; --warn:#8F5400; --warn-soft:#FAEBD2;
  --mark:#FFE27A; --band:#14223A; --band-ink:#F2F4F6; --band-muted:#A9B6C7;
  --f-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141C; --surface:#161F2A; --sunk:#1D2835; --ink:#E3E9F0; --muted:#9AA8B9; --line:#2B3747;
    --accent:#5CC0CC; --accent-ink:#06222A; --accent-soft:#15343A;
    --good:#5DCB8B; --good-soft:#143425; --bad:#F2847B; --bad-soft:#3C1D1B; --warn:#F0B45C; --warn-soft:#38290F;
    --mark:#6A5813; --band:#0A1017; --band-ink:#E3E9F0; --band-muted:#8E9CAE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#161F2A; --sunk:#1D2835; --ink:#E3E9F0; --muted:#9AA8B9; --line:#2B3747;
  --accent:#5CC0CC; --accent-ink:#06222A; --accent-soft:#15343A;
  --good:#5DCB8B; --good-soft:#143425; --bad:#F2847B; --bad-soft:#3C1D1B; --warn:#F0B45C; --warn-soft:#38290F;
  --mark:#6A5813; --band:#0A1017; --band-ink:#E3E9F0; --band-muted:#8E9CAE;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,cite,.mono{font-family:var(--f-mono);font-size:.86em}
cite{font-style:normal;color:var(--muted);white-space:normal}
mark{background:var(--mark);color:var(--ink);padding:0 .1em;border-radius:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:87.5%;line-height:1.15;text-wrap:balance;margin:0}

.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}

/* Jacket band */
.jacket{background:var(--band);color:var(--band-ink)}
.jacket .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between;padding-block:22px 18px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted)}
.jacket h1{font-size:clamp(26px,4.4vw,40px);font-weight:800;letter-spacing:-.01em;margin-top:4px}
.decl{display:grid;grid-template-columns:repeat(4,auto);gap:2px 22px;font-family:var(--f-mono);font-size:12px}
.decl dt{color:var(--band-muted);text-transform:uppercase;letter-spacing:.06em}
.decl dd{margin:0;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
@media (max-width:560px){.decl{gap:2px 16px}.decl dd{font-size:13px}.jacket .wrap{padding-block:16px 14px}}

/* Tabs */
.tabs-bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:14px 14px 12px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
@media (max-width:640px){.sync{display:none}}
.sync{margin-left:auto;align-self:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;padding-left:12px}

main{padding-block:24px 64px}
.view[hidden]{display:none!important}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{font-size:22px;font-weight:750;margin-bottom:6px}
.panel h3{font-size:18px;font-weight:700}
.lede{max-width:68ch}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:var(--r);font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
select,input[type="search"]{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;min-width:0}

/* Dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.dash{grid-template-columns:minmax(0,1fr)}}
.score-big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tbl{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:70px}
.meter>span{display:block;height:100%;background:var(--accent)}
.meter.good>span{background:var(--good)}
.meter.bad>span{background:var(--bad)}
.meter.warn>span{background:var(--warn)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}

/* Study */
.study{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.study{grid-template-columns:minmax(0,1fr)}}
.toc{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
@media (max-width:860px){.toc{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}}
.toc button{appearance:none;border:0;background:none;text-align:left;padding:7px 10px;border-radius:var(--r);cursor:pointer;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:1px;line-height:1.3}
@media (max-width:860px){.toc button{white-space:nowrap;border:1px solid var(--line);background:var(--surface)}}
.toc button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.toc .w{font-family:var(--f-mono);font-size:11px;opacity:.85}
.guide{max-width:76ch}
.guide h2{font-size:28px;font-weight:800;margin:4px 0 4px}
.guide h3{font-size:20px;font-weight:750;margin:28px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.guide h4,.guide h5,.guide h6{font-size:16px;font-weight:700;margin:18px 0 6px;font-family:var(--f-body)}
.guide ul{margin:6px 0;padding-left:20px}
.guide li{margin:4px 0}
.guide p{margin:8px 0}
.guide table{margin:10px 0}
.guide .flags{background:var(--warn-soft);border-radius:var(--r);padding:12px 16px;margin-top:18px}

/* Question */
.qwrap{max-width:780px}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-bottom:18px}
.progress>span{display:block;height:100%;background:var(--accent);transition:width .2s}
.stem{font-size:19px;line-height:1.5;font-weight:500;margin:0 0 18px}
.choices{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.choice{appearance:none;width:100%;text-align:left;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;font-size:16px;line-height:1.45}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice .k{font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:4px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice.is-right{border-color:var(--good);background:var(--good-soft)}
.choice.is-right .k{background:var(--good);color:var(--surface);border-color:var(--good)}
.choice.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.is-wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.choice[disabled]{cursor:default}
.feedback{margin-top:16px;border-left:4px solid var(--good);background:var(--surface);padding:14px 16px;border-radius:0 var(--r) var(--r) 0}
.feedback.bad{border-left-color:var(--bad)}
.feedback strong.v{font-family:var(--f-display);font-size:18px}
.feedback p{margin:6px 0}
.qnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:18px}
.kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
@media (max-width:960px){.exam{grid-template-columns:minmax(0,1fr)}}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.grid button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-family:var(--f-mono);font-size:12px;padding:5px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.grid button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:0}
.grid button.r{background:var(--good-soft);border-color:var(--good)}
.grid button.w{background:var(--bad-soft);border-color:var(--bad)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
@media (max-width:960px){.side{position:static}}
.confirm{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:14px;margin-top:12px}
.result-hero{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:flex-end}

/* Flashcards */
.card-stage{perspective:1400px;max-width:640px}
.fcard{display:grid;cursor:pointer;transform-style:preserve-3d;transition:transform .45s ease}
.fcard.flipped{transform:rotateY(180deg)}
.fface{grid-area:1/1;min-height:240px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.fface.back{transform:rotateY(180deg)}
.fface .t{font-size:21px;font-weight:600;line-height:1.4}
.fface .b{font-size:18px;line-height:1.5}
.fface .lab{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}.progress>span{transition:none}}

/* Key numbers */
.kn td:first-child{width:38%}
.kn td.v{font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted)}
.foot{border-top:1px solid var(--line);padding-block:20px 0;margin-top:40px;font-size:13px;color:var(--muted)}
.foot p{margin:4px 0;max-width:90ch}
</style>

<header class="jacket">
  <div class="wrap">
    <div>
      <div class="eyebrow">Michigan DIFS · PSI exam series 16-81</div>
      <h1>Property &amp; Casualty Producer Exam Prep</h1>
    </div>
    <dl class="decl" aria-label="Exam specifications">
      <div><dt>Items</dt><dd>150</dd></div>
      <div><dt>Time</dt><dd>2 h 30 m</dd></div>
      <div><dt>Pass</dt><dd>74%</dd></div>
      <div><dt>Need</dt><dd>111 right</dd></div>
    </dl>
  </div>
</header>

<div class="tabs-bar">
  <div class="wrap" style="display:flex">
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-home" data-view="home" aria-selected="true">Dashboard</button>
      <button class="tab" role="tab" id="tab-study" data-view="study" aria-selected="false">Study guide</button>
      <button class="tab" role="tab" id="tab-practice" data-view="practice" aria-selected="false">Practice</button>
      <button class="tab" role="tab" id="tab-exam" data-view="exam" aria-selected="false">Mock exam</button>
      <button class="tab" role="tab" id="tab-cards" data-view="cards" aria-selected="false">Flashcards</button>
      <button class="tab" role="tab" id="tab-numbers" data-view="numbers" aria-selected="false">Key numbers</button>
    </nav>
    <span class="sync" id="sync">Progress: this browser</span>
  </div>
</div>

<main class="wrap">
  <section class="view" id="view-home"></section>
  <section class="view" id="view-study" hidden></section>
  <section class="view" id="view-practice" hidden></section>
  <section class="view" id="view-exam" hidden></section>
  <section class="view" id="view-cards" hidden></section>
  <section class="view" id="view-numbers" hidden></section>
  <footer class="foot" id="foot"></footer>
</main>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const SECTIONS = [
  {key:'reg',      name:'Insurance Regulation',                 pct:10,   items:15, topics:['reg']},
  {key:'gen',      name:'General Insurance',                    pct:10.5, items:16, topics:['gen']},
  {key:'basics',   name:'P&C Basics + Michigan Laws',           pct:20,   items:30, topics:['basics','mi']},
  {key:'dwelling', name:'Dwelling Policy',                      pct:2.5,  items:4,  topics:['dwelling']},
  {key:'ho',       name:'Homeowners Policy',                    pct:15,   items:22, topics:['ho']},
  {key:'auto',     name:'Automobile (incl. MI No-Fault)',       pct:15,   items:22, topics:['auto']},
  {key:'cpp',      name:'Commercial Package Policy',            pct:12,   items:18, topics:['cpp']},
  {key:'bop',      name:'Businessowners Policy',                pct:6,    items:9,  topics:['bop']},
  {key:'wc',       name:"Workers' Compensation",                pct:5,    items:8,  topics:['wc']},
  {key:'other',    name:'Other Coverages & Options',            pct:4,    items:6,  topics:['other']}
];
const SEC = Object.fromEntries(SECTIONS.map(s=>[s.key,s]));
const T2S = {}; SECTIONS.forEach(s=>s.topics.forEach(t=>T2S[t]=s.key));
const QS = DATA.questions.map(q=>Object.assign({}, q, {sec:T2S[q.topic]})).filter(q=>q.sec);
const QBY = Object.fromEntries(QS.map(q=>[q.id,q]));
const CARDS = DATA.cards;
const PASS = 0.74;
const LETTERS = ['A','B','C','D'];

/* ---------- utilities ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b)=> b ? Math.round(100*a/b) : 0;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function fmtTime(ms){ ms=Math.max(0,ms); const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(ss).padStart(2,'0'); }
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ---------- progress store (account sync via db, fallback to this browser) ---------- */
const LS_KEY = 'mipc-progress-v1';
function blank(){ return {v:1, q:{}, cards:{}, exams:[], updated:0}; }
let P = lsGet(LS_KEY) || blank();
const sync = {ref:null, timer:null, writing:false, again:false};
function setSyncLabel(t){ const el=$('#sync'); if(el) el.textContent=t; }
function save(){
  P.updated = Date.now();
  lsSet(LS_KEY, P);
  if(!sync.ref) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(flush, 1500);
}
async function flush(){
  if(!sync.ref) return;
  if(sync.writing){ sync.again=true; return; }
  sync.writing=true;
  try{ await sync.ref.set(JSON.parse(JSON.stringify(P))); setSyncLabel('Progress: saved to your account'); }
  catch(e){ setSyncLabel('Progress: this browser'); if(e && (e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')) sync.ref=null; }
  sync.writing=false;
  if(sync.again){ sync.again=false; flush(); }
}
async function initSync(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.doc('data/users/'+id+'/progress');
    const snap = await ref.get();
    sync.ref = ref;
    if(snap.exists){
      const remote = snap.data() || {};
      if((remote.updated||0) >= (P.updated||0)){ P = Object.assign(blank(), JSON.parse(JSON.stringify(remote))); lsSet(LS_KEY,P); }
      else flush();
    } else if(P.updated){ flush(); }
    setSyncLabel('Progress: saved to your account');
    renderAll();
  }catch(e){ /* stay on browser storage */ }
}

function record(id, ok){
  const s = P.q[id] || {a:0,c:0,last:0,t:0};
  s.a++; if(ok) s.c++; s.last = ok?1:0; s.t = Date.now();
  P.q[id]=s;
}
function secStats(key){
  const qs = QS.filter(q=>q.sec===key);
  let seen=0, lastRight=0, a=0, c=0;
  qs.forEach(q=>{ const s=P.q[q.id]; if(s){ seen++; a+=s.a; c+=s.c; if(s.last) lastRight++; } });
  return {total:qs.length, seen, lastRight, acc: seen? lastRight/seen : null, a, c};
}
function missedIds(secKey){ return QS.filter(q=>(!secKey||q.sec===secKey) && P.q[q.id] && !P.q[q.id].last).map(q=>q.id); }

/* ---------- navigation ---------- */
let VIEW = 'home';
function go(v, opts){
  VIEW = v;
  document.querySelectorAll('.tab').forEach(t=>{ const on=t.dataset.view===v; t.setAttribute('aria-selected', String(on)); if(on && t.scrollIntoView) t.scrollIntoView({block:'nearest',inline:'nearest'}); });
  document.querySelectorAll('.view').forEach(el=>el.hidden = (el.id!=='view-'+v));
  if(v==='home') renderHome();
  if(v==='study') renderStudy(opts&&opts.sec);
  if(v==='practice') renderPractice(opts);
  if(v==='exam') renderExam();
  if(v==='cards') renderCards(opts&&opts.sec);

      </nav>

      <div id="guide-content">${g.html}</div>

  </div>`;
  el.querySelectorAll('.toc button').forEach(b=>b.addEventListener('click',()=>{ renderStudy(b.dataset.g); window.scrollTo({top:0}); }));
  const input = $('#study-q');
  input.addEventListener('input', ()=>searchGuide(input.value));
}
function searchGuide(q){
  q = q.trim().toLowerCase();
  const body = $('#guide-content');
  if(!q){ const g = DATA.guide.find(x=>x.id===STUDY_SEC); body.innerHTML = g.html; return; }
  // search across all sections
  const hits = [];
  DATA.guide.forEach(g=>{
    const tmp = document.createElement('div'); tmp.innerHTML = g.html;
    tmp.querySelectorAll('li, p, tr').forEach(n=>{
      if(n.tagName==='LI' && n.querySelector('li')) return;
      const t = n.textContent; if(t.toLowerCase().includes(q)) hits.push({g, html: n.tagName==='TR' ? '<div class="tbl"><table><tbody>'+n.outerHTML+'</tbody></table></div>' : '<p>'+n.innerHTML+'</p>'});
    });
  });
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  body.innerHTML = hits.length ? `<p class="muted">${hits.length} match${hits.length===1?'':'es'} across the guide</p>` + hits.slice(0,200).map(h=>`<div style="border-top:1px solid var(--line);padding-top:6px;margin-top:6px"><div class="eyebrow" style="color:var(--muted)">${esc(h.g.title)}</div>${highlight(h.html, re)}</div>`).join('') : `<div class="empty">No matches for “${esc(q)}”.</div>`;
}
function highlight(html, re){
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  const walker=document.createTreeWalker(tmp, NodeFilter.SHOW_TEXT); const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{ if(!re.test(n.nodeValue)) return; re.lastIndex=0; const span=document.createElement('span'); span.innerHTML=esc(n.nodeValue).replace(re, m=>'<mark>'+m+'</mark>'); n.replaceWith(span); });
  return tmp.innerHTML;
}

function makeItem(id){

}
function choiceHTML(item, mode){
  const q = QBY[item.id];

  return `<ul class="choices">${item.order.map((ci,pos)=>{
    let cls='choice', pressed = item.picked===ci;
    if(reveal){ if(ci===q.answer) cls+=' is-right'; else if(pressed) cls+=' is-wrong'; }
    return `<li><button class="${cls}" data-ci="${ci}" aria-pressed="${pressed&&!reveal}" ${reveal?'disabled':''}><span class="k">${LETTERS[pos]}</span><span>${esc(q.choices[ci])}</span></button></li>`;
  }).join('')}</ul>`;
}
function explainHTML(item){
  const q = QBY[item.id];
  const ok = item.picked===q.answer;

  return `<div class="feedback ${ok?'':'bad'}" role="status">

}

function pickIds(pool, n, mode){
  if(mode==='missed') pool = pool.filter(q=>P.q[q.id] && !P.q[q.id].last);
  if(mode==='random') return shuffle(pool).slice(0,n).map(q=>q.id);
  const unseen = shuffle(pool.filter(q=>!P.q[q.id]));
  const missed = shuffle(pool.filter(q=>P.q[q.id] && !P.q[q.id].last));
  const rest = pool.filter(q=>P.q[q.id] && P.q[q.id].last).sort((a,b)=>(P.q[a.id].t||0)-(P.q[b.id].t||0));
  return missed.concat(unseen, rest).slice(0,n).map(q=>q.id);
}
function weightedIds(n, mode){
  const out=[];
  SECTIONS.forEach(s=>{
    const k = Math.max(1, Math.round(n*s.items/150));
    out.push(...pickIds(QS.filter(q=>q.sec===s.key), k, mode));
  });
  return shuffle(out).slice(0, n);
}

    </aside>
  </div>`;
  el.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{ it.picked = +b.dataset.ci; lsSet(EX_KEY,EX); drawExamQ(); }));
  $('#ex-prev').addEventListener('click',()=>examGo(EX.idx-1));
  $('#ex-next').addEventListener('click',()=>{ if(EX.idx+1<n) examGo(EX.idx+1); else askSubmit(); });
  $('#ex-flag').addEventListener('click',()=>{ it.flagged=!it.flagged; lsSet(EX_KEY,EX); drawExamQ(); });
  $('#ex-grid').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) examGo(+b.dataset.i); });
  $('#ex-submit').addEventListener('click', askSubmit);
  if(EX.confirm) askSubmit();
  clearInterval(tick);
  tick = setInterval(()=>{
    const left = EX.ends-Date.now(); const t=$('#ex-timer');
    if(t){ t.textContent = fmtTime(left); t.classList.toggle('low', left<10*60*1000); }
    if(left<=0){ clearInterval(tick); submitExam(); }
  }, 1000);
}
function examGo(i){ if(i<0||i>=EX.items.length) return; EX.idx=i; EX.confirm=false; lsSet(EX_KEY,EX); drawExamQ(); }
function askSubmit(){
  EX.confirm = true;
  const un = EX.items.length - examAnsweredCount();
  const fl = EX.items.filter(i=>i.flagged).length;
  $('#ex-confirm').innerHTML = `<div class="confirm small"><strong>Submit now?</strong><br>${un? un+' unanswered (scored as wrong). ':''}${fl? fl+' flagged. ':''}You can't change answers after submitting.<div class="row" style="margin-top:10px"><button class="btn primary" id="ex-yes">Submit</button><button class="btn" id="ex-no">Keep working</button></div></div>`;
  $('#ex-yes').addEventListener('click', submitExam);
  $('#ex-no').addEventListener('click', ()=>{ EX.confirm=false; $('#ex-confirm').innerHTML=''; });
}
function submitExam(){
  clearInterval(tick);
  if(!EX || EX.submitted) return;
  EX.submitted = true; EX.confirm=false;
  const used = Math.min(Date.now(), EX.ends) - EX.start;
  const bySec = {}; let score=0;
  EX.items.forEach(it=>{
    const q=QBY[it.id]; const ok = it.picked===q.answer;
    bySec[q.sec] = bySec[q.sec] || [0,0]; bySec[q.sec][1]++; if(ok){ bySec[q.sec][0]++; score++; }
    if(it.picked!==null) record(it.id, ok); else record(it.id, false);
  });
  EX.result = {score, total:EX.items.length, bySec, used};
  P.exams.push({t:Date.now(), score, total:EX.items.length, bySec, used});
  if(P.exams.length>30) P.exams = P.exams.slice(-30);
  save(); lsSet(EX_KEY, EX);
  drawExamResult();
  window.scrollTo({top:0});
}
let EX_FILTER = 'wrong';
function drawExamResult(){
  const el = $('#view-exam');
  const r = EX.result; const passed = r.score/r.total >= PASS;
  const list = EX.items.map((it,i)=>({it,i,q:QBY[it.id]})).filter(o=> EX_FILTER==='all' || (EX_FILTER==='wrong' ? o.it.picked!==o.q.answer : o.it.flagged));
  el.innerHTML = `
  <div class="stack">
    <div class="panel">
      <div class="result-hero">
        <div>
          <div class="eyebrow" style="color:var(--muted)">Mock exam result</div>
          <div class="row" style="gap:14px;align-items:baseline;margin-top:6px"><span class="score-big">${pct(r.score,r.total)}%</span>${passed?'<span class="pill good">Pass</span>':'<span class="pill bad">Fail</span>'}</div>
          <p class="muted" style="margin:6px 0 0">${r.score} of ${r.total} correct · passing is 74% (111 of 150) · time used ${fmtTime(r.used)}</p>
        </div>
        <div class="row"><button class="btn primary" id="ex-again">New mock exam</button><button class="btn" id="ex-drill">Drill the questions I missed</button></div>
      </div>
      <div class="tbl" style="margin-top:18px"><table>
        <thead><tr><th>Section</th><th class="num">Correct</th><th style="min-width:120px">Score</th></tr></thead>
        <tbody>${SECTIONS.map(s=>{const v=r.bySec[s.key]||[0,0]; const a=v[1]?v[0]/v[1]:null; return `<tr><td>${esc(s.name)}</td><td class="num">${v[0]}/${v[1]}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="meter ${meterClass(a)}" style="flex:1"><span style="width:${a===null?0:Math.round(a*100)}%"></span></div><span class="mono small" style="width:38px;text-align:right">${a===null?'—':Math.round(a*100)+'%'}</span></div></td></tr>`;}).join('')}</tbody>
      </table></div>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <h3>Review</h3>
        <div class="row" role="group" aria-label="Filter review">
          <button class="chip" data-f="wrong" aria-pressed="${EX_FILTER==='wrong'}">Missed</button>
          <button class="chip" data-f="flag" aria-pressed="${EX_FILTER==='flag'}">Flagged</button>
          <button class="chip" data-f="all" aria-pressed="${EX_FILTER==='all'}">All</button>
        </div>
      </div>
      ${list.length? list.map(({it,i,q})=>`<div style="border-top:1px solid var(--line);padding-top:14px;margin-top:14px">
        <div class="eyebrow" style="color:var(--muted)">Q${i+1} · ${esc(SEC[q.sec].name)}</div>
        <p style="margin:4px 0 10px;font-weight:600">${esc(q.q)}</p>
        ${choiceHTML(it,'reveal')}
        ${it.picked===null?'<p class="small" style="color:var(--bad)">Not answered.</p>':''}
        <p class="small" style="margin:10px 0 0">${esc(q.explain)}</p>
        ${q.source?`<p style="margin:4px 0 0"><cite>${esc(q.source)}</cite></p>`:''}
      </div>`).join('') : '<div class="empty" style="margin-top:12px">Nothing in this filter.</div>'}
    </div>
  </div>`;
  el.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{ EX_FILTER=b.dataset.f; drawExamResult(); }));
  $('#ex-again').addEventListener('click', ()=>{ EX=null; lsDel(EX_KEY); renderExam(); });
  $('#ex-drill').addEventListener('click', ()=>{
    const ids = EX.items.filter(it=>it.picked!==QBY[it.id].answer).map(it=>it.id);
    go('practice', {ids, label:'Missed on mock exam'});
  });
}

/* ---------- flashcards ---------- */
let FC = null;
function renderCards(sec){
  const el = $('#view-cards');
  if(sec){ FC = null; lsSet('mipc-fc-cfg',{sec}); }
  const cfg = lsGet('mipc-fc-cfg') || {sec:'all'};
  const curSec = sec || cfg.sec || 'all';
  if(!FC || FC.sec!==curSec){
    const pool = CARDS.filter(c=>curSec==='all' || c.sec===curSec);
    const due = shuffle(pool).sort((a,b)=>(P.cards[a.id]||0)-(P.cards[b.id]||0));
    FC = {sec:curSec, queue: due.map(c=>c.id), flipped:false, seen:0};
  }
  const pool = CARDS.filter(c=>curSec==='all' || c.sec===curSec);
  const mastered = pool.filter(c=>(P.cards[c.id]||0)>=3).length;
  const cur = FC.queue[0] ? CARDS.find(c=>c.id===FC.queue[0]) : null;
  el.innerHTML = `
  <div class="stack">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <label class="field" for="fc-sec">Deck
        <select id="fc-sec">
          <option value="all">All decks (${CARDS.length})</option>
          ${SECTIONS.map(s=>{const k=CARDS.filter(c=>c.sec===s.key).length; return k?`<option value="${s.key}" ${curSec===s.key?'selected':''}>${esc(s.name)} (${k})</option>`:'';}).join('')}
        </select>
      </label>
      <span class="mono small muted">${mastered} of ${pool.length} mastered (3 right in a row)</span>
    </div>
    ${cur? `
    <div class="card-stage">
      <div class="fcard ${FC.flipped?'flipped':''}" id="fc" tabindex="0" role="button" aria-label="Flip card">
        <div class="fface"><span class="lab">${esc(SEC[cur.sec]?SEC[cur.sec].name:'')}</span><div class="t">${esc(cur.front)}</div><span class="kbd">Tap or press Space to flip</span></div>
        <div class="fface back"><span class="lab">Answer</span><div class="b">${esc(cur.back)}</div>${cur.source?`<cite>${esc(cur.source)}</cite>`:''}</div>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="fc-again" ${FC.flipped?'':'disabled'}>Again</button>
      <button class="btn primary" id="fc-good" ${FC.flipped?'':'disabled'}>Got it</button>
      <span class="kbd">${FC.queue.length} left in this round</span>
    </div>` : `<div class="empty">Round complete. <button class="btn" id="fc-restart">Start another round</button></div>`}
  </div>`;
  $('#fc-sec').addEventListener('change', e=>renderCards(e.target.value));
  const card=$('#fc');
  if(card){
    const flip=()=>{ FC.flipped=!FC.flipped; card.classList.toggle('flipped', FC.flipped); $('#fc-again').disabled=!FC.flipped; $('#fc-good').disabled=!FC.flipped; };
    card.addEventListener('click', flip);
    card.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); } });
    $('#fc-again').addEventListener('click', ()=>gradeCard(cur.id,false));
    $('#fc-good').addEventListener('click', ()=>gradeCard(cur.id,true));
  }
  const rs=$('#fc-restart'); if(rs) rs.addEventListener('click', ()=>{ FC=null; renderCards(curSec); });
}
function gradeCard(id, ok){
  P.cards[id] = ok ? Math.min(5,(P.cards[id]||0)+1) : 0;
  save();
  FC.queue.shift();
  if(!ok){ FC.queue.splice(Math.min(3, FC.queue.length), 0, id); }
  FC.flipped=false;
  renderCards();
}

/* ---------- key numbers ---------- */
function renderNumbers(){
  const el = $('#view-numbers');
  const groups = {};
  (DATA.numbers||[]).forEach(n=>{ (groups[n.group]=groups[n.group]||[]).push(n); });
  el.innerHTML = `
  <div class="stack">
    <div class="panel">
      <h2>Key numbers</h2>
      <p class="muted lede" style="margin:0">Dollar limits, percentages and deadlines that show up on the exam. Each one is tied to the statute, form or agency page it came from.</p>
      <label class="field" for="kn-q" style="margin-top:12px;max-width:340px">Filter
        <input type="search" id="kn-q" placeholder="e.g. days, PIP, vacancy">
      </label>
    </div>
    <div id="kn-body" class="stack"></div>
  </div>`;
  const draw = (q)=>{
    q=(q||'').toLowerCase();
    $('#kn-body').innerHTML = Object.keys(groups).map(g=>{
      const rows = groups[g].filter(n=>!q || (n.item+' '+n.value+' '+(n.source||'')).toLowerCase().includes(q));
      if(!rows.length) return '';
      return `<div class="panel"><h3 style="margin-bottom:8px">${esc(g)}</h3><div class="tbl"><table class="kn"><tbody>${rows.map(n=>`<tr><td>${esc(n.item)}</td><td class="v">${esc(n.value)}</td><td><cite>${esc(n.source||'')}</cite></td></tr>`).join('')}</tbody></table></div></div>`;
    }).join('') || '<div class="empty">No matches.</div>';
  };
  draw('');
  $('#kn-q').addEventListener('input', e=>draw(e.target.value));
}

/* ---------- global events ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='exam') go('exam');
  if(act==='practice-sec'){ PR=null; go('practice',{sec:b.dataset.sec, n:20, mode:'smart'}); }
  if(act==='cards-sec') go('cards',{sec:b.dataset.sec});
  if(act==='study-logistics') go('study',{sec:'logistics'});
  if(act==='missed'){ PR=null; go('practice',{ids: shuffle(missedIds()).slice(0,50), label:'Retry missed'}); }
  if(act==='reset'){
    $('#reset-box').innerHTML = `<div class="confirm small"><strong>Erase all progress?</strong> Answers, mock exam history and flashcard progress will be cleared.<div class="row" style="margin-top:10px"><button class="btn primary" data-act="reset-yes">Erase</button><button class="btn" data-act="reset-no">Cancel</button></div></div>`;
  }
  if(act==='reset-no') $('#reset-box').innerHTML='';
  if(act==='reset-yes'){ P = blank(); save(); PR=null; EX=null; lsDel(PR_KEY); lsDel(EX_KEY); renderHome(); }
});
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,select,textarea')) return;
  const k = e.key.toLowerCase();
  const idx = ['1','2','3','4'].indexOf(k) >= 0 ? ['1','2','3','4'].indexOf(k) : ['a','b','c','d'].indexOf(k);
  if(VIEW==='practice' && PR && !PR.done){
    const it = PR.items[PR.idx];
    if(idx>=0 && it.picked===null){ answerPractice(it.order[idx]); e.preventDefault(); }
    else if(k==='enter' && it.picked!==null){ nextPractice(); e.preventDefault(); }
  }
  if(VIEW==='exam' && EX && !EX.submitted){
    const it = EX.items[EX.idx];
    if(idx>=0){ it.picked = it.order[idx]; lsSet(EX_KEY,EX); drawExamQ(); e.preventDefault(); }
    else if(k==='enter'){ if(EX.idx+1<EX.items.length) examGo(EX.idx+1); e.preventDefault(); }
    else if(k==='arrowleft'){ examGo(EX.idx-1); }
    else if(k==='arrowright'){ examGo(EX.idx+1); }
  }
});

function renderFoot(){
  $('#foot').innerHTML = `<p><strong>Sources.</strong> ${esc(DATA.meta.sourcesNote)}</p><p>Content verified ${esc(DATA.meta.verified)}. ${QS.length} questions · ${CARDS.length} flashcards. Rules change: check PSI's current Michigan candidate bulletin and content outline before your test date.</p><p>Not affiliated with PSI or the Michigan Department of Insurance and Financial Services. Practice questions are original and are not actual exam questions.</p>`;
}
function renderAll(){ if(VIEW==='home') renderHome(); renderFoot(); }

function start(hot){
  if(hot && hot.EX) EX = hot.EX; else { const ex = lsGet(EX_KEY); if(ex && ex.items && ex.items.every(i=>QBY[i.id])) EX = ex; }
  if(hot && hot.PR) PR = hot.PR; else { const pr = lsGet(PR_KEY); if(pr && pr.items && !pr.done && pr.items.every(i=>QBY[i.id])) PR = pr; }
  renderFoot();
  go((hot && hot.VIEW) || (EX && !EX.submitted ? 'exam' : 'home'));
  initSync();
}
if(window.claude && window.claude.hot){ try{ window.claude.hot.snapshot(()=>({EX, PR, VIEW})); }catch(e){} }
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
