name: BBG News auto-post

on:
  schedule:
    - cron: "4,19,34,49 * * * *" # every 15 min, off the top of the hour; the bot decides what's due
  workflow_dispatch: # also started by the Discord app (relay/worker.js) with a clip
    inputs:
      preview:
        description: "Only render preview images and sample Reels (nothing is posted)"
        type: boolean
        default: false
      clip_url:
        description: "Clip from Discord (filled in by the Send to BBG News app)"
        required: false
      credit:
        description: "Credit shown on the Reel"
        required: false
      caption:
        description: "Caption (optional)"
        required: false
      notify:
        description: "Discord reply to update (filled in by the app)"
        required: false

permissions:
  contents: write # state commits, the bbg-media branch and the fallback media release

concurrency:
  group: bbg-news
  queue: max # clip runs wait their turn instead of being replaced by the next scheduled run

jobs:
  post:
    runs-on: ubuntu-24.04 # pinned: ffmpeg settings were tested on 24.04's ffmpeg 6.1
    timeout-minutes: 30
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      # Clip inputs are read by bot.py from the event file, never via env, so they stay out of the public log.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # branch tip, not the run's trigger SHA: a queued run must see the last run's state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "bbg-news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Render previews
        if: ${{ inputs.preview }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python bot.py preview
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.preview }}
        with:
          name: bbg-news-preview
          path: out/preview

      - name: Pick the next post
        id: prepare
        if: ${{ !inputs.preview }}
        run: python bot.py prepare

      - name: Install ffmpeg
        if: steps.prepare.outputs.needs_ffmpeg == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Render Reel
        if: steps.prepare.outputs.needs_ffmpeg == 'true'
        run: python bot.py render-video

      - name: Publish to Instagram
        if: steps.prepare.outputs.has_post == 'true'
        run: python bot.py publish

      - name: Tell the owner a sent clip failed
        if: ${{ (failure() || cancelled()) && github.event_name == 'workflow_dispatch' && !inputs.preview }}
        run: python bot.py clip-failed

      - name: Save state
        if: ${{ always() && !inputs.preview }}
        run: |
          git add state
          git diff --cached --quiet && exit 0
          git commit -m "BBG News: update state"
          git pull --rebase
          git push
